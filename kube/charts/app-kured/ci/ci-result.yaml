---
# Source: app-kured/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kured
  namespace: default
spec:
  egress:
  - toEntities:
    - kube-apiserver
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/name: prometheus
        k8s:io.kubernetes.pod.namespace: prometheus
    toPorts:
    - ports:
      - port: "9090"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kured
---
# Source: app-kured/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kured
  namespace: default
spec:
  chart:
    spec:
      chart: kured
      sourceRef:
        kind: HelmRepository
        name: kured
      version: 6.1.0
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    configuration:
      alertFilterMatchOnly: true
      alertFilterRegexp: ^(KubeNodeNotReady|KubeNodeUnreachable|KubeletDown|KubeAPIDown|KubeControllerManagerDown|KubeSchedulerDown|etcdMembersDown|etcdInsufficientMembers|etcdNoLeader)$
      alertFiringOnly: true
      drainTimeout: 10m
      endTime: "04:00"
      lockReleaseDelay: 10m
      lockTtl: 2h
      period: 10m
      prometheusUrl: http://prometheus-kube-prometheus-prometheus.prometheus.svc:9090
      rebootCommand: /run/current-system/sw/bin/systemctl reboot
      rebootSentinel: /run/kured/reboot-required
      startTime: "03:00"
      timeZone: Europe/Paris
---
# Source: app-kured/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kured
  namespace: default
spec:
  interval: 10m
  url: https://kubereboot.github.io/charts
