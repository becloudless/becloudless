apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  - name: prometheus
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      certManagerCertificates:
        alertmanager-gateway:
          dnsNames:
            alertmanager: alertmanager.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-alertmanager-gateway
        grafana-gateway:
          dnsNames:
            grafana: grafana.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-grafana-gateway
        prometheus-gateway:
          dnsNames:
            prometheus: prometheus.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-prometheus-gateway
        pushprox-gateway:
          dnsNames:
            pushprox: pushprox.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-pushprox-gateway
      httpRoutes:
        alertmanager:
          hostnames:
            alertmanager: alertmanager.test.com
          parentRefs:
            alertmanager:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: prometheus
              sectionName: alertmanager
          rules:
            ui:
              backendRefs:
                alertmanager:
                  name: prometheus-kube-prometheus-alertmanager
                  port: 9093
              filters:
                authelia:
                  externalAuth:
                    backendRef:
                      name: authelia
                      namespace: authelia
                      port: 80
                    http:
                      allowedHeaders:
                        accept: accept
                        cookie: cookie
                        proxy-authorization: proxy-authorization
                        x-forwarded-for: x-forwarded-for
                        x-forwarded-proto: x-forwarded-proto
                      allowedResponseHeaders:
                        remote-email: remote-email
                        remote-groups: remote-groups
                        remote-name: remote-name
                        remote-user: remote-user
                      path: /api/authz/ext-authz/
                    protocol: HTTP
                  type: ExternalAuth
        grafana:
          hostnames:
            grafana: grafana.test.com
          parentRefs:
            grafana:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: prometheus
              sectionName: grafana
          rules:
            ui:
              backendRefs:
                grafana:
                  name: prometheus-grafana
                  port: 80
        prometheus:
          hostnames:
            prometheus: prometheus.test.com
          parentRefs:
            prometheus:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: prometheus
              sectionName: prometheus
          rules:
            ui:
              backendRefs:
                prometheus:
                  name: prometheus-kube-prometheus-prometheus
                  port: 9090
              filters:
                authelia:
                  externalAuth:
                    backendRef:
                      name: authelia
                      namespace: authelia
                      port: 80
                    http:
                      allowedHeaders:
                        accept: accept
                        cookie: cookie
                        proxy-authorization: proxy-authorization
                        x-forwarded-for: x-forwarded-for
                        x-forwarded-proto: x-forwarded-proto
                      allowedResponseHeaders:
                        remote-email: remote-email
                        remote-groups: remote-groups
                        remote-name: remote-name
                        remote-user: remote-user
                      path: /api/authz/ext-authz/
                    protocol: HTTP
                  type: ExternalAuth
        pushprox:
          hostnames:
            pushprox: pushprox.test.com
          parentRefs:
            pushprox:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: prometheus
              sectionName: pushprox
          rules:
            proxy:
              backendRefs:
                pushprox:
                  name: pushprox
                  port: 8080
              filters:
                authelia:
                  externalAuth:
                    backendRef:
                      name: authelia
                      namespace: authelia
                      port: 80
                    http:
                      allowedHeaders:
                        accept: accept
                        cookie: cookie
                        proxy-authorization: proxy-authorization
                        x-forwarded-for: x-forwarded-for
                        x-forwarded-proto: x-forwarded-proto
                      allowedResponseHeaders:
                        remote-email: remote-email
                        remote-groups: remote-groups
                        remote-name: remote-name
                        remote-user: remote-user
                      path: /api/authz/ext-authz/
                    protocol: HTTP
                  type: ExternalAuth
      listenerSets:
        prometheus:
          listeners:
            alertmanager:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: alertmanager.test.com
              name: alertmanager
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-alertmanager-gateway
                mode: Terminate
            grafana:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: grafana.test.com
              name: grafana
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-grafana-gateway
                mode: Terminate
            prometheus:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: prometheus.test.com
              name: prometheus
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-prometheus-gateway
                mode: Terminate
            pushprox:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: pushprox.test.com
              name: pushprox
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-pushprox-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
