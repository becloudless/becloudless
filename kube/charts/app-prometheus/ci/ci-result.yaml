# Source: app-prometheus/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: default
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      version: 92.3.1
  dependsOn:
  - name: app-longhorn
    namespace: longhorn-system
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    alertmanager:
      alertmanagerSpec:
        externalUrl: https://alertmanager.test.com
        podAntiAffinity: hard
        replicas: 1
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
              storageClassName: longhorn
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
        - equal:
          - alertname
          - cluster
          - service
          source_match:
            severity: critical
          target_match:
            severity: warning
        receivers:
        - name: "null"
        route:
          group_by:
          - alertname
          - severity
          - job
          - namespace
          - kubernetes_cluster
          group_interval: 1m
          group_wait: 30s
          receiver: "null"
          repeat_interval: 4h
      ingress:
        enabled: false
    defaultRules:
      rules:
        kubeProxy: false
    grafana:
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
          - disableDeletion: false
            editable: true
            folder: default
            name: default
            options:
              path: /var/lib/grafana/dashboards/default
            orgId: 1
            type: file
          - disableDeletion: false
            editable: true
            folder: network
            name: network
            options:
              path: /var/lib/grafana/dashboards/network
            orgId: 1
            type: file
          - disableDeletion: false
            editable: true
            folder: hardware
            name: hardware
            options:
              path: /var/lib/grafana/dashboards/hardware
            orgId: 1
            type: file
      dashboards:
        default:
          kubernetes:
            datasource: Prometheus
            gnetId: 6417
            revision: 1
          longhorn:
            datasource: Prometheus
            gnetId: 17626
            revision: 1
          prometheus-stats:
            datasource: Prometheus
            gnetId: 2
            revision: 1
        hardware:
          node-exporter:
            datasource: Prometheus
            gnetId: 1860
            revision: 45
          smart:
            datasource: Prometheus
            gnetId: 20204
            revision: 1
        network:
          icmp:
            datasource: Prometheus
            gnetId: 12412
            revision: 1
          mikrotik:
            datasource: Prometheus
            gnetId: 13679
            revision: 1
          pdu:
            datasource: Prometheus
            gnetId: 14309
            revision: 1
          prometheus-blackbox:
            datasource: Prometheus
            gnetId: 12275
            revision: 1
          speedtest:
            datasource: Prometheus
            gnetId: 12004
            revision: 1
          unbound:
            datasource: Prometheus
            gnetId: 18077
            revision: 1
          ups:
            datasource: Prometheus
            gnetId: 12340
            revision: 1
          uptimerobot:
            datasource: Prometheus
            gnetId: 9955
            revision: 1
      grafana.ini:
        server:
          root_url: https://grafana.test.com
      ingress:
        enabled: false
      persistence:
        enabled: false
      plugins:
      - grafana-piechart-panel
      - grafana-clock-panel
      - jdbranham-diagram-panel
      - camptocamp-prometheus-alertmanager-datasource
      - flant-statusmap-panel
      - grafana-polystat-panel
      sidecar:
        dashboards:
          enabled: true
          provider:
            allowUiUpdates: true
            disableDelete: true
            folder: dashboards
            foldersFromFilesStructure: true
          searchNamespace: ALL
    kubeControllerManager:
      service:
        port: 10257
        selector:
          component: kube-controller-manager
        targetPort: 10257
      serviceMonitor:
        https: true
        insecureSkipVerify: true
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      service:
        port: 10259
        selector:
          component: kube-scheduler
        targetPort: 10259
      serviceMonitor:
        https: true
        insecureSkipVerify: true
    nodeExporter:
      enabled: false
    prometheus:
      ingress:
        enabled: false
      prometheusSpec:
        additionalAlertRelabelConfigs:
        - action: labeldrop
          regex: replica
        evaluationInterval: 30s
        externalLabels:
          kubernetes_cluster: test
        externalUrl: https://prometheus.test.com/
        podAntiAffinity: hard
        podMonitorSelectorNilUsesHelmValues: false
        replicaExternalLabelName: replica
        replicas: 1
        retentionSize: 20GB
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        scrapeInterval: 30s
        serviceMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
              storageClassName: longhorn
    prometheusOperator:
      kubeletService:
        enabled: false
