# Source: app-prometheus/templates/loader.yaml
apiVersion: v1
kind: Service
metadata:
  name: pushprox
  namespace: default
spec:
  ports:
  - name: http
    port: 8080
  selector:
    app.kubernetes.io/name: pushprox
---
# Source: app-prometheus/templates/loader.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushprox
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pushprox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pushprox
    spec:
      containers:
      - image: quay.io/prometheuscommunity/pushprox:v0.2.0
        livenessProbe:
          tcpSocket:
            port: 8080
        name: pushprox
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          tcpSocket:
            port: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      enableServiceLinks: false
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
