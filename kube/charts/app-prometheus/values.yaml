# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:
  name:

# Nothing has to be created by hand:
#  - prometheus, alertmanager and pushprox are protected by the Authelia forward auth of the Cilium Gateway
#  - grafana logs in with Authelia (OIDC client `grafana`): the users are created at their first login, their role comes from the groups
#    of lldap (`role_admin` is Admin, `role_editor` is Editor, the others are Viewer). The secret of the client is generated in the
#    authelia namespace and copied by external-secrets (see `prometheus-pre`). The login form is still there as a way back, the
#    password of the `admin` user is generated by the chart:
#      kubectl -n prometheus get secret prometheus-grafana -o jsonpath='{.data.admin-password}' | base64 -d
#      (the login page is `/login?disableAutoLogin=true`)
# Not configured (needs secrets): the alertmanager receivers (pagerduty, healthchecks.io).
# The alertmanager sends everything to the `null` receiver until a receiver is added in `configMap.alertmanager.config`.

resources:

  # https://github.com/prometheus-community/PushProx: scrapes the targets that cannot be reached (behind a nat)
  deployments:
    pushprox:
      replicas: 1 # multiple pushprox pods makes connection lost in proxy
      selector:
        matchLabels:
          app.kubernetes.io/name: pushprox
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pushprox
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            pushprox:
              name: pushprox
              image: quay.io/prometheuscommunity/pushprox:v0.2.0 # renovate: versioning=loose
              ports:
                http:
                  containerPort: 8080
              readinessProbe:
                tcpSocket:
                  port: 8080
              livenessProbe:
                tcpSocket:
                  port: 8080
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    all: ALL

  services:
    pushprox:
      selector:
        app.kubernetes.io/name: pushprox
      ports:
        http:
          port: 8080

  fluxHelmRepositories:
    prometheus-community:
      url: https://prometheus-community.github.io/helm-charts

  # on top of the default deny of app-cilium: one policy for each component. The selectors are in the namespace of the release.
  # What Prometheus scrapes accepts it by the cluster wide policy below.
  ciliumNetworkPolicies:
    prometheus: # scrapes the whole cluster (pods, nodes, control plane)
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: prometheus}
      ingress:
        gateway:
          fromEntities: {ingress: ingress, host: host, remote-node: remote-node}
          toPorts:
            http: {ports: {p9090: {port: "9090", protocol: TCP}}}
        grafana:
          fromEndpoints:
            grafana:
              matchLabels: {app.kubernetes.io/name: grafana}
          toPorts:
            http: {ports: {p9090: {port: "9090", protocol: TCP}}}
      egress:
        targets:
          toEntities: {cluster: cluster, apiserver: kube-apiserver}

    alertmanager:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: alertmanager}
      ingress:
        gateway:
          fromEntities: {ingress: ingress, host: host, remote-node: remote-node}
          toPorts:
            http: {ports: {p9093: {port: "9093", protocol: TCP}}}
        prometheus: # the alerts
          fromEndpoints:
            prometheus:
              matchLabels: {app.kubernetes.io/name: prometheus}
          toPorts:
            http: {ports: {p9093: {port: "9093", protocol: TCP}}}
        grafana:
          fromEndpoints:
            grafana:
              matchLabels: {app.kubernetes.io/name: grafana}
          toPorts:
            http: {ports: {p9093: {port: "9093", protocol: TCP}}}

    grafana:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: grafana}
      ingress:
        gateway:
          fromEntities: {ingress: ingress, host: host, remote-node: remote-node}
          toPorts:
            http: {ports: {p3000: {port: "3000", protocol: TCP}}}
      egress:
        kube-apiserver: # the sidecars watch the ConfigMaps of the dashboards and of the datasources
          toEntities: {apiserver: kube-apiserver}
        prometheus:
          toEndpoints:
            prometheus:
              matchLabels: {app.kubernetes.io/name: prometheus}
          toPorts:
            http: {ports: {p9090: {port: "9090", protocol: TCP}}}
        alertmanager:
          toEndpoints:
            alertmanager:
              matchLabels: {app.kubernetes.io/name: alertmanager}
          toPorts:
            http: {ports: {p9093: {port: "9093", protocol: TCP}}}
        authelia: # the OIDC issuer is the public address of authelia
          toFQDNs:
            authelia: {matchName: "authelia.{{ .Values.global.domain }}"}
          toPorts:
            https: {ports: {p443: {port: "443", protocol: TCP}}}
        gateway: # the public addresses of the cluster are the gateway for the pods
          toEntities: {ingress: ingress}
          toPorts:
            https: {ports: {p443: {port: "443", protocol: TCP}}}
        grafana-com: # the dashboards (init container) and the plugins, whose archives are served by Google Cloud Storage
          toFQDNs:
            grafana: {matchName: grafana.com}
            grafana-subdomains: {matchPattern: "**.grafana.com"}
            plugins: {matchName: storage.googleapis.com}
          toPorts:
            https: {ports: {p443: {port: "443", protocol: TCP}}}

    prometheus-operator:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator}
      ingress:
        kube-apiserver: # the admission webhook: the API server is host networked, it is seen as the host or a remote node
          fromEntities: {apiserver: kube-apiserver, host: host, remote-node: remote-node}
          toPorts:
            webhook: {ports: {p10250: {port: "10250", protocol: TCP}}}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}

    kube-state-metrics:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: kube-state-metrics}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}

    pushprox: # relays the scrapes of the control plane, that is host networked
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: pushprox}
      ingress:
        gateway:
          fromEntities: {ingress: ingress, host: host, remote-node: remote-node}
          toPorts:
            http: {ports: {p8080: {port: "8080", protocol: TCP}}}

  # Prometheus scrapes any port of any pod (the targets are discovered from the ServiceMonitors).
  ciliumClusterwideNetworkPolicies:
    prometheus-scrape-targets:
      endpointSelector:
        matchExpressions:
          any-namespace: {key: "k8s:io.kubernetes.pod.namespace", operator: Exists}
      ingress:
        prometheus:
          fromEndpoints:
            prometheus:
              matchLabels: {"k8s:io.kubernetes.pod.namespace": prometheus, "k8s:app.kubernetes.io/name": prometheus}

  fluxHelmReleases:
    # the secret of the OIDC client of grafana, copied from authelia before it starts
    prometheus-pre:
      dependsOn:
        external-secrets:
          name: app-external-secrets
          namespace: external-secrets
        authelia-pre: # the generated secret of the client and the right to read it
          name: authelia-pre
          namespace: authelia
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          serviceAccounts:
            authelia-reader:
              automountServiceAccountToken: false # only used by external-secrets to get a token

          secretStores:
            authelia:
              provider:
                kubernetes:
                  remoteNamespace: authelia
                  server:
                    caProvider:
                      type: ConfigMap
                      name: kube-root-ca.crt
                      key: ca.crt
                  auth:
                    serviceAccount:
                      name: authelia-reader

          externalSecrets:
            grafana-oidc:
              refreshInterval: 1h
              secretStoreRef:
                kind: SecretStore
                name: authelia
              data:
                client-id:
                  secretKey: client-id
                  remoteRef:
                    key: authelia-oidc-grafana
                    property: client-id
                secret:
                  secretKey: secret
                  remoteRef:
                    key: authelia-oidc-grafana
                    property: secret

    # the release is named `prometheus`, which gives the service names used by the httpRoutes
    prometheus:
      timeout: 10m # the chart is large and the CRDs are big
      dependsOn: # the volumes, the secret of the OIDC client
        longhorn:
          name: app-longhorn
          namespace: longhorn-system
        prometheus-pre:
          name: prometheus-pre
      chart:
        spec:
          chart: kube-prometheus-stack
          version: 92.3.1
          sourceRef:
            kind: HelmRepository
            name: prometheus-community
      values:
        # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
        # exposed by the Cilium Gateway, see the `listenerSets` and `httpRoutes` resources
        kubeProxy:
          enabled: false
        defaultRules:
          rules:
            kubeProxy: false

        alertmanager:
          ingress:
            enabled: false
          alertmanagerSpec:
            podAntiAffinity: hard
            externalUrl: https://alertmanager.{{ .Values.global.domain }}
            replicas: 1
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
          config:
            global:
              resolve_timeout: 5m
            inhibit_rules:
              # remove warning on critical
              - equal: ['alertname', 'cluster', 'service']
                source_match:
                  severity: critical
                target_match:
                  severity: warning
            route:
              group_by:
                - alertname
                - severity
                - job
                - namespace
                - kubernetes_cluster
              group_interval: 1m
              group_wait: 30s
              receiver: "null" # TODO a receiver (pagerduty, healthchecks.io) needs a secret
              repeat_interval: 4h
            receivers:
              - name: "null"

        grafana:
          ingress:
            enabled: false
          persistence:
            enabled: false # the dashboards come from the sidecar and the grafana.com downloads
          grafana.ini:
            server:
              root_url: https://grafana.{{ .Values.global.domain }}
            # SSO with Authelia: the `grafana` OIDC client of authelia, its secret is in the `grafana-oidc` secret (see `prometheus-pre`)
            auth.generic_oauth:
              enabled: true
              name: Authelia
              icon: signin
              scopes: openid profile email groups
              empty_scopes: false
              auth_url: https://authelia.{{ .Values.global.domain }}/api/oidc/authorization
              token_url: https://authelia.{{ .Values.global.domain }}/api/oidc/token
              api_url: https://authelia.{{ .Values.global.domain }}/api/oidc/userinfo
              login_attribute_path: preferred_username
              groups_attribute_path: groups
              name_attribute_path: name
              use_pkce: true
              auto_login: true # `/login?disableAutoLogin=true` shows the login form
              role_attribute_path: contains(groups[*], 'role_admin') && 'Admin' || contains(groups[*], 'role_editor') && 'Editor' || 'Viewer'
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
              secretKeyRef:
                name: grafana-oidc
                key: client-id
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc
                key: secret
          plugins:
            - grafana-piechart-panel
            - grafana-clock-panel
            - jdbranham-diagram-panel
            - camptocamp-prometheus-alertmanager-datasource
            - flant-statusmap-panel
            - grafana-polystat-panel
          dashboards:
            hardware:
              node-exporter:
                gnetId: 1860
                revision: 45
                datasource: Prometheus
              smart:
                gnetId: 20204
                revision: 1
                datasource: Prometheus
            network:
              uptimerobot:
                gnetId: 9955
                revision: 1
                datasource: Prometheus
              speedtest:
                gnetId: 12004
                revision: 1
                datasource: Prometheus
              prometheus-blackbox:
                gnetId: 12275
                revision: 1
                datasource: Prometheus
              icmp:
                gnetId: 12412
                revision: 1
                datasource: Prometheus
              pdu:
                gnetId: 14309
                revision: 1
                datasource: Prometheus
              ups:
                gnetId: 12340
                revision: 1
                datasource: Prometheus
              mikrotik:
                gnetId: 13679
                revision: 1
                datasource: Prometheus
              unbound:
                gnetId: 18077
                revision: 1
                datasource: Prometheus
            default:
              kubernetes:
                gnetId: 6417
                revision: 1
                datasource: Prometheus
              longhorn:
                gnetId: 17626
                revision: 1
                datasource: Prometheus
              prometheus-stats:
                gnetId: 2
                revision: 1
                datasource: Prometheus
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: default
                  orgId: 1
                  folder: default
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/default
                - name: network
                  orgId: 1
                  folder: network
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/network
                - name: hardware
                  orgId: 1
                  folder: hardware
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/hardware
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
              provider:
                allowUiUpdates: true
                disableDelete: true
                folder: dashboards
                foldersFromFilesStructure: true

        kubeEtcd:
          enabled: false # TODO
        kubeControllerManager:
          service:
            port: 10257
            targetPort: 10257
            selector:
              component: kube-controller-manager
          serviceMonitor:
            https: true
            insecureSkipVerify: true
        kubeScheduler:
          service:
            port: 10259
            targetPort: 10259
            selector:
              component: kube-scheduler
          serviceMonitor:
            https: true
            insecureSkipVerify: true

        prometheus:
          ingress:
            enabled: false
          prometheusSpec:
            podAntiAffinity: hard
            replicas: 1
            externalUrl: https://prometheus.{{ .Values.global.domain }}/
            scrapeInterval: 30s
            evaluationInterval: 30s
            retentionSize: "20GB"
            ruleSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false # scrape all namespaces. Single prom install
            podMonitorSelectorNilUsesHelmValues: false
            scrapeConfigSelectorNilUsesHelmValues: false
            replicaExternalLabelName: replica
            # Remove replica label from alert
            additionalAlertRelabelConfigs:
              - action: labeldrop
                regex: replica
            externalLabels:
              kubernetes_cluster: "{{ .Values.global.name }}"
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 10Gi
        nodeExporter:
          enabled: false
        prometheusOperator:
          kubeletService:
            enabled: false

    # the public exposure, applied once prometheus is deployed and not waited for
    prometheus-integration:
      install:
        disableWait: true
      upgrade:
        disableWait: true
      dependsOn:
        prometheus:
          name: prometheus
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        gateway-api:
          name: app-gateway-api
          namespace: gateway-api
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          certManagerCertificates:
            prometheus-gateway:
              secretName: tls-prometheus-gateway
              dnsNames:
                prometheus: prometheus.{{ .Values.global.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer
            alertmanager-gateway:
              secretName: tls-alertmanager-gateway
              dnsNames:
                alertmanager: alertmanager.{{ .Values.global.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer
            grafana-gateway:
              secretName: tls-grafana-gateway
              dnsNames:
                grafana: grafana.{{ .Values.global.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer
            pushprox-gateway:
              secretName: tls-pushprox-gateway
              dnsNames:
                pushprox: pushprox.{{ .Values.global.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

          # Exposed by the Cilium Gateway `shared` (kube-system), TLS terminated by the Gateway, one hostname per listener.
          listenerSets:
            prometheus:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: shared
                namespace: kube-system
              listeners:
                prometheus:
                  name: prometheus
                  hostname: prometheus.{{ .Values.global.domain }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-prometheus-gateway
                  allowedRoutes:
                    namespaces:
                      from: Same
                alertmanager:
                  name: alertmanager
                  hostname: alertmanager.{{ .Values.global.domain }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-alertmanager-gateway
                  allowedRoutes:
                    namespaces:
                      from: Same
                grafana:
                  name: grafana
                  hostname: grafana.{{ .Values.global.domain }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-grafana-gateway
                  allowedRoutes:
                    namespaces:
                      from: Same
                pushprox:
                  name: pushprox
                  hostname: pushprox.{{ .Values.global.domain }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-pushprox-gateway
                  allowedRoutes:
                    namespaces:
                      from: Same

          # Forward auth: the `ExternalAuth` filter calls the authelia service, the ReferenceGrant is in app-authelia.
          # Grafana is not behind it, it has its own login.
          httpRoutes:
            prometheus:
              parentRefs:
                prometheus:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: prometheus
                  sectionName: prometheus
              hostnames:
                prometheus: prometheus.{{ .Values.global.domain }}
              rules:
                ui:
                  filters:
                    authelia:
                      type: ExternalAuth
                      externalAuth:
                        protocol: HTTP
                        backendRef:
                          name: authelia
                          namespace: authelia
                          port: 80
                        http:
                          path: /api/authz/ext-authz/
                          allowedResponseHeaders: # only the identity headers, not the authz content-type/content-length (a GET with a content-length makes upstreams answer 400)
                            remote-user: remote-user
                            remote-groups: remote-groups
                            remote-name: remote-name
                            remote-email: remote-email
                          allowedHeaders:
                            cookie: cookie
                            accept: accept
                            proxy-authorization: proxy-authorization
                            x-forwarded-proto: x-forwarded-proto
                            x-forwarded-for: x-forwarded-for
                  backendRefs:
                    prometheus:
                      name: prometheus-kube-prometheus-prometheus
                      port: 9090

            alertmanager:
              parentRefs:
                alertmanager:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: prometheus
                  sectionName: alertmanager
              hostnames:
                alertmanager: alertmanager.{{ .Values.global.domain }}
              rules:
                ui:
                  filters:
                    authelia:
                      type: ExternalAuth
                      externalAuth:
                        protocol: HTTP
                        backendRef:
                          name: authelia
                          namespace: authelia
                          port: 80
                        http:
                          path: /api/authz/ext-authz/
                          allowedResponseHeaders: # only the identity headers, not the authz content-type/content-length (a GET with a content-length makes upstreams answer 400)
                            remote-user: remote-user
                            remote-groups: remote-groups
                            remote-name: remote-name
                            remote-email: remote-email
                          allowedHeaders:
                            cookie: cookie
                            accept: accept
                            proxy-authorization: proxy-authorization
                            x-forwarded-proto: x-forwarded-proto
                            x-forwarded-for: x-forwarded-for
                  backendRefs:
                    alertmanager:
                      name: prometheus-kube-prometheus-alertmanager
                      port: 9093

            grafana:
              parentRefs:
                grafana:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: prometheus
                  sectionName: grafana
              hostnames:
                grafana: grafana.{{ .Values.global.domain }}
              rules:
                ui:
                  backendRefs:
                    grafana:
                      name: prometheus-grafana
                      port: 80

            pushprox:
              parentRefs:
                pushprox:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: prometheus
                  sectionName: pushprox
              hostnames:
                pushprox: pushprox.{{ .Values.global.domain }}
              rules:
                proxy:
                  filters:
                    authelia:
                      type: ExternalAuth
                      externalAuth:
                        protocol: HTTP
                        backendRef:
                          name: authelia
                          namespace: authelia
                          port: 80
                        http:
                          path: /api/authz/ext-authz/
                          allowedResponseHeaders: # only the identity headers, not the authz content-type/content-length (a GET with a content-length makes upstreams answer 400)
                            remote-user: remote-user
                            remote-groups: remote-groups
                            remote-name: remote-name
                            remote-email: remote-email
                          allowedHeaders:
                            cookie: cookie
                            accept: accept
                            proxy-authorization: proxy-authorization
                            x-forwarded-proto: x-forwarded-proto
                            x-forwarded-for: x-forwarded-for
                  backendRefs:
                    pushprox:
                      name: pushprox
                      port: 8080
