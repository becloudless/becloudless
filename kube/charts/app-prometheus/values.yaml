# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:
  name:

# Nothing has to be created by hand:
#  - prometheus, alertmanager and pushprox are protected by the Authelia forward auth of the Cilium Gateway
#  - grafana has its own login, the password of the `admin` user is generated by the chart:
#      kubectl -n prometheus get secret prometheus-grafana -o jsonpath='{.data.admin-password}' | base64 -d
# Not configured (needs secrets): the alertmanager receivers (pagerduty, healthchecks.io) and the Grafana SSO with Authelia (OIDC).
# The alertmanager sends everything to the `null` receiver until a receiver is added in `configMap.alertmanager.config`.

defaults:
  metadata:
    namespace: prometheus

resources:
  namespaces:
    prometheus:
      fullNameOverride: prometheus

  certManagerCertificates:
    prometheus-gateway:
      fullNameOverride: prometheus-gateway
      secretName: tls-prometheus-gateway
      dnsNames:
        prometheus: prometheus.{{ .Values.global.domain }}
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer
    alertmanager-gateway:
      fullNameOverride: alertmanager-gateway
      secretName: tls-alertmanager-gateway
      dnsNames:
        alertmanager: alertmanager.{{ .Values.global.domain }}
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer
    grafana-gateway:
      fullNameOverride: grafana-gateway
      secretName: tls-grafana-gateway
      dnsNames:
        grafana: grafana.{{ .Values.global.domain }}
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer
    pushprox-gateway:
      fullNameOverride: pushprox-gateway
      secretName: tls-pushprox-gateway
      dnsNames:
        pushprox: pushprox.{{ .Values.global.domain }}
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer

  # Exposed by the Cilium Gateway `shared` (kube-system), TLS terminated by the Gateway, one hostname per listener.
  # Requires the Gateway API CRDs and cert-manager: app-bcl makes this app depend on them.
  listenerSets:
    prometheus:
      fullNameOverride: prometheus
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: shared
        namespace: kube-system
      listeners:
        prometheus:
          name: prometheus
          hostname: prometheus.{{ .Values.global.domain }}
          port: 443
          protocol: HTTPS
          tls:
            mode: Terminate
            certificateRefs:
              tls:
                name: tls-prometheus-gateway
          allowedRoutes:
            namespaces:
              from: Same
        alertmanager:
          name: alertmanager
          hostname: alertmanager.{{ .Values.global.domain }}
          port: 443
          protocol: HTTPS
          tls:
            mode: Terminate
            certificateRefs:
              tls:
                name: tls-alertmanager-gateway
          allowedRoutes:
            namespaces:
              from: Same
        grafana:
          name: grafana
          hostname: grafana.{{ .Values.global.domain }}
          port: 443
          protocol: HTTPS
          tls:
            mode: Terminate
            certificateRefs:
              tls:
                name: tls-grafana-gateway
          allowedRoutes:
            namespaces:
              from: Same
        pushprox:
          name: pushprox
          hostname: pushprox.{{ .Values.global.domain }}
          port: 443
          protocol: HTTPS
          tls:
            mode: Terminate
            certificateRefs:
              tls:
                name: tls-pushprox-gateway
          allowedRoutes:
            namespaces:
              from: Same

  # Forward auth: the `ExternalAuth` filter calls the authelia service, the ReferenceGrant is in app-authelia.
  # Grafana is not behind it, it has its own login.
  httpRoutes:
    prometheus:
      fullNameOverride: prometheus
      parentRefs:
        prometheus:
          group: gateway.networking.k8s.io
          kind: ListenerSet
          name: prometheus
          sectionName: prometheus
      hostnames:
        prometheus: prometheus.{{ .Values.global.domain }}
      rules:
        ui:
          filters:
            authelia:
              type: ExternalAuth
              externalAuth:
                protocol: HTTP
                backendRef:
                  name: authelia
                  namespace: authelia
                  port: 80
                http:
                  path: /api/authz/ext-authz/
                  allowedHeaders:
                    cookie: cookie
                    accept: accept
                    proxy-authorization: proxy-authorization
                    x-forwarded-proto: x-forwarded-proto
                    x-forwarded-for: x-forwarded-for
          backendRefs:
            prometheus:
              name: prometheus-kube-prometheus-prometheus
              port: 9090

    alertmanager:
      fullNameOverride: alertmanager
      parentRefs:
        alertmanager:
          group: gateway.networking.k8s.io
          kind: ListenerSet
          name: prometheus
          sectionName: alertmanager
      hostnames:
        alertmanager: alertmanager.{{ .Values.global.domain }}
      rules:
        ui:
          filters:
            authelia:
              type: ExternalAuth
              externalAuth:
                protocol: HTTP
                backendRef:
                  name: authelia
                  namespace: authelia
                  port: 80
                http:
                  path: /api/authz/ext-authz/
                  allowedHeaders:
                    cookie: cookie
                    accept: accept
                    proxy-authorization: proxy-authorization
                    x-forwarded-proto: x-forwarded-proto
                    x-forwarded-for: x-forwarded-for
          backendRefs:
            alertmanager:
              name: prometheus-kube-prometheus-alertmanager
              port: 9093

    grafana:
      fullNameOverride: grafana
      parentRefs:
        grafana:
          group: gateway.networking.k8s.io
          kind: ListenerSet
          name: prometheus
          sectionName: grafana
      hostnames:
        grafana: grafana.{{ .Values.global.domain }}
      rules:
        ui:
          backendRefs:
            grafana:
              name: prometheus-grafana
              port: 80

    pushprox:
      fullNameOverride: pushprox
      parentRefs:
        pushprox:
          group: gateway.networking.k8s.io
          kind: ListenerSet
          name: prometheus
          sectionName: pushprox
      hostnames:
        pushprox: pushprox.{{ .Values.global.domain }}
      rules:
        proxy:
          filters:
            authelia:
              type: ExternalAuth
              externalAuth:
                protocol: HTTP
                backendRef:
                  name: authelia
                  namespace: authelia
                  port: 80
                http:
                  path: /api/authz/ext-authz/
                  allowedHeaders:
                    cookie: cookie
                    accept: accept
                    proxy-authorization: proxy-authorization
                    x-forwarded-proto: x-forwarded-proto
                    x-forwarded-for: x-forwarded-for
          backendRefs:
            pushprox:
              name: pushprox
              port: 8080

  # https://github.com/prometheus-community/PushProx: scrapes the targets that cannot be reached (behind a nat)
  deployments:
    pushprox:
      fullNameOverride: pushprox
      replicas: 1 # multiple pushprox pods makes connection lost in proxy
      selector:
        matchLabels:
          app.kubernetes.io/name: pushprox
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pushprox
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            pushprox:
              name: pushprox
              image: quay.io/prometheuscommunity/pushprox:v0.2.0 # renovate: versioning=loose
              ports:
                http:
                  containerPort: 8080
              readinessProbe:
                tcpSocket:
                  port: 8080
              livenessProbe:
                tcpSocket:
                  port: 8080
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    all: ALL

  services:
    pushprox:
      fullNameOverride: pushprox
      selector:
        app.kubernetes.io/name: pushprox
      ports:
        http:
          port: 8080

  fluxHelmRepositories:
    prometheus-community:
      fullNameOverride: prometheus-community
      url: https://prometheus-community.github.io/helm-charts

  fluxHelmReleases:
    # the release is named `prometheus`, which gives the service names used by the httpRoutes
    prometheus:
      fullNameOverride: prometheus
      timeout: 10m # the chart is large and the CRDs are big
      chart:
        spec:
          chart: kube-prometheus-stack
          version: 92.3.1
          sourceRef:
            kind: HelmRepository
            name: prometheus-community
      values:
        # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
        # exposed by the Cilium Gateway, see the `listenerSets` and `httpRoutes` resources
        kubeProxy:
          enabled: false
        defaultRules:
          rules:
            kubeProxy: false

        alertmanager:
          ingress:
            enabled: false
          alertmanagerSpec:
            podAntiAffinity: hard
            externalUrl: https://alertmanager.{{ .Values.global.domain }}
            replicas: 1
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
          config:
            global:
              resolve_timeout: 5m
            inhibit_rules:
              # remove warning on critical
              - equal: ['alertname', 'cluster', 'service']
                source_match:
                  severity: critical
                target_match:
                  severity: warning
            route:
              group_by:
                - alertname
                - severity
                - job
                - namespace
                - kubernetes_cluster
              group_interval: 1m
              group_wait: 30s
              receiver: "null" # TODO a receiver (pagerduty, healthchecks.io) needs a secret
              repeat_interval: 4h
            receivers:
              - name: "null"

        grafana:
          ingress:
            enabled: false
          persistence:
            enabled: false # the dashboards come from the sidecar and the grafana.com downloads
          grafana.ini:
            server:
              root_url: https://grafana.{{ .Values.global.domain }}
            # SSO with Authelia, needs the `grafana` OIDC client of authelia and its secret in `envFromSecret`
            # auth:
            #   disable_login_form: true
            # auth.generic_oauth:
            #   enabled: true
            #   name: Authelia
            #   icon: signin
            #   client_id: grafana
            #   scopes: openid profile email groups
            #   empty_scopes: false
            #   auth_url: https://authelia.{{ .Values.global.domain }}/api/oidc/authorization
            #   token_url: https://authelia.{{ .Values.global.domain }}/api/oidc/token
            #   api_url: https://authelia.{{ .Values.global.domain }}/api/oidc/userinfo
            #   login_attribute_path: preferred_username
            #   groups_attribute_path: groups
            #   name_attribute_path: name
            #   use_pkce: true
            #   role_attribute_path: contains(groups[*], 'role_admin') && 'Admin' || contains(groups[*], 'role_editor') && 'Editor' || 'Viewer'
          plugins:
            - grafana-piechart-panel
            - grafana-clock-panel
            - jdbranham-diagram-panel
            - camptocamp-prometheus-alertmanager-datasource
            - flant-statusmap-panel
            - grafana-polystat-panel
          dashboards:
            hardware:
              node-exporter:
                gnetId: 1860
                revision: 45
                datasource: Prometheus
              smart:
                gnetId: 20204
                revision: 1
                datasource: Prometheus
            network:
              uptimerobot:
                gnetId: 9955
                revision: 1
                datasource: Prometheus
              speedtest:
                gnetId: 12004
                revision: 1
                datasource: Prometheus
              prometheus-blackbox:
                gnetId: 12275
                revision: 1
                datasource: Prometheus
              icmp:
                gnetId: 12412
                revision: 1
                datasource: Prometheus
              pdu:
                gnetId: 14309
                revision: 1
                datasource: Prometheus
              ups:
                gnetId: 12340
                revision: 1
                datasource: Prometheus
              mikrotik:
                gnetId: 13679
                revision: 1
                datasource: Prometheus
              unbound:
                gnetId: 18077
                revision: 1
                datasource: Prometheus
            default:
              kubernetes:
                gnetId: 6417
                revision: 1
                datasource: Prometheus
              longhorn:
                gnetId: 17626
                revision: 1
                datasource: Prometheus
              prometheus-stats:
                gnetId: 2
                revision: 1
                datasource: Prometheus
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: default
                  orgId: 1
                  folder: default
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/default
                - name: network
                  orgId: 1
                  folder: network
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/network
                - name: hardware
                  orgId: 1
                  folder: hardware
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/hardware
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
              provider:
                allowUiUpdates: true
                disableDelete: true
                folder: dashboards
                foldersFromFilesStructure: true

        kubeEtcd:
          enabled: false # TODO
        kubeControllerManager:
          service:
            port: 10257
            targetPort: 10257
            selector:
              component: kube-controller-manager
          serviceMonitor:
            https: true
            insecureSkipVerify: true
        kubeScheduler:
          service:
            port: 10259
            targetPort: 10259
            selector:
              component: kube-scheduler
          serviceMonitor:
            https: true
            insecureSkipVerify: true

        prometheus:
          ingress:
            enabled: false
          prometheusSpec:
            podAntiAffinity: hard
            replicas: 1
            externalUrl: https://prometheus.{{ .Values.global.domain }}/
            scrapeInterval: 30s
            evaluationInterval: 30s
            retentionSize: "20GB"
            ruleSelectorNilUsesHelmValues: false
            serviceMonitorSelectorNilUsesHelmValues: false # scrape all namespaces. Single prom install
            podMonitorSelectorNilUsesHelmValues: false
            scrapeConfigSelectorNilUsesHelmValues: false
            replicaExternalLabelName: replica
            # Remove replica label from alert
            additionalAlertRelabelConfigs:
              - action: labeldrop
                regex: replica
            externalLabels:
              kubernetes_cluster: "{{ .Values.global.name }}"
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 50Gi
        nodeExporter:
          enabled: false
        prometheusOperator:
          kubeletService:
            enabled: false
