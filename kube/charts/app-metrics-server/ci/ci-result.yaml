---
# Source: app-metrics-server/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: metrics-server
  namespace: default
spec:
  egress:
  - toEntities:
    - kube-apiserver
  - toEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: metrics-server
  ingress:
  - fromEntities:
    - kube-apiserver
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
---
# Source: app-metrics-server/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: default
spec:
  chart:
    spec:
      chart: metrics-server
      sourceRef:
        kind: HelmRepository
        name: metrics-server
      version: 3.14.0
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    args:
    - --kubelet-insecure-tls
    - --metric-resolution=10s
    - --kubelet-request-timeout=2s
    metrics:
      enabled: true
    serviceMonitor:
      enabled: false
---
# Source: app-metrics-server/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metrics-server
  namespace: default
spec:
  interval: 10m
  url: https://kubernetes-sigs.github.io/metrics-server
