---
# Source: kyverno-config/templates/loader.yaml
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: set-image-pull-policy
  namespace: default
spec:
  rules:
  - match:
      any:
      - resources:
          kinds:
          - Pod
    mutate:
      patchStrategicMerge:
        spec:
          containers:
          - (image): '*'
            imagePullPolicy: IfNotPresent
    name: set-image-pull-policy
