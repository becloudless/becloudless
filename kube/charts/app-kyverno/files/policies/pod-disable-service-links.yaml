# yaml-language-server: $schema=../../../base/schema/resources/kyvernoClusterPolicies.json

# `enableServiceLinks: false`: no env variable for each service of the namespace (`<SERVICE>_PORT` collides with the settings of
# some apps, valkey for one), the DNS names are enough. A value already set on the pod is kept.
# Not applied to:
#  - the static pods (mirror pods), only the kubelet manages them;
#  - the pods with the annotation `policy.bcl/skipPodDisableServiceLinks: "true"`, to opt out an app that needs the variables.
# `Ignore`: a Kyverno outage must not block the creation of pods.
failurePolicy: Ignore
rules:
  - name: pod-disable-service-links
    match:
      any:
        - resources:
            kinds:
              - Pod
            operations:
              - CREATE
    exclude:
      any:
        - resources:
            annotations:
              kubernetes.io/config.mirror: "?*"
        - resources:
            annotations:
              policy.bcl/skipPodDisableServiceLinks: "true"
    mutate:
      patchStrategicMerge:
        spec:
          +(enableServiceLinks): false
