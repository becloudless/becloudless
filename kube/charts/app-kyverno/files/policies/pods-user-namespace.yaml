# yaml-language-server: $schema=../../../base/schema/resources/kyvernoClusterPolicies.json

# Every pod runs in a user namespace (https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/): root of the
# container is an unprivileged user of the host. A `hostUsers` already set on the pod is kept.
# Not applied to:
#  - the pods using the host namespaces (`hostNetwork`, `hostPID`, `hostIPC`), the API server rejects them with `hostUsers: false`
#    (static pods of the control plane, cilium, ...);
#  - the longhorn components that are privileged or use host paths (manager, instance-manager, engine-image, csi plugin and
#    csi sidecars), they need the host users;
#  - the pods using raw block devices (`volumeDevices`), not supported with user namespaces;
#  - the pods with the annotation `bcl/hostUsers: "true"`, to opt out an app that does not work with it.
# `Ignore`: a Kyverno outage must not block the creation of pods.
failurePolicy: Ignore
rules:
  - name: set-host-users
    match:
      any:
        - resources:
            kinds:
              - Pod
            operations:
              - CREATE
    exclude:
      any:
        - resources:
            selector:
              matchLabels:
                longhorn.io/component: engine-image
        - resources:
            selector:
              matchLabels:
                longhorn.io/component: instance-manager
        - resources:
            selector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - longhorn-manager
                    - longhorn-csi-plugin
                    - csi-attacher
                    - csi-provisioner
                    - csi-resizer
                    - csi-snapshotter
        - resources:
            annotations:
              bcl/hostUsers: "true"
    preconditions:
      all:
        - key: "{{ request.object.spec.hostNetwork || `false` }}"
          operator: Equals
          value: false
        - key: "{{ request.object.spec.hostPID || `false` }}"
          operator: Equals
          value: false
        - key: "{{ request.object.spec.hostIPC || `false` }}"
          operator: Equals
          value: false
        - key: "{{ length(request.object.spec.containers[?volumeDevices]) }}"
          operator: Equals
          value: 0
    mutate:
      patchStrategicMerge:
        spec:
          +(hostUsers): false
