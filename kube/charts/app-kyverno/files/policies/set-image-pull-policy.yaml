# yaml-language-server: $schema=../../../base/schema/resources/kyvernoClusterPolicies.json

rules:
  - name: set-image-pull-policy
    match:
      any:
        - resources:
            kinds:
              - Pod
    mutate:
      patchStrategicMerge:
        spec:
          containers:
            - (image): "*"
              imagePullPolicy: IfNotPresent
