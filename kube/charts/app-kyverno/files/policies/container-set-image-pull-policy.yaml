# yaml-language-server: $schema=../../../base/schema/resources/kyvernoClusterPolicies.json

failurePolicy: Ignore
rules:
  - name: container-set-image-pull-policy
    match:
      any:
        - resources:
            kinds:
              - Pod
    mutate:
      patchStrategicMerge:
        spec:
          containers:
            - (image): "*"
              imagePullPolicy: IfNotPresent
