# yaml-language-server: $schema=../../../base/schema/resources/kyvernoClusterPolicies.json

# Only the namespaces below may run pods that reach the host: host namespaces (`hostPID`, `hostIPC`, `hostNetwork`), privileged
# containers and `hostPath` volumes. Takes the place of the Pod Security Admission labels of the namespaces, which nothing enforces here
# (the API server runs with the defaults, every namespace is `privileged`), and which any namespace owner could change.
# The other policies skip the pods with a privileged container, this one is what decides who may have one.
# `Audit` for now: the violations are in the PolicyReports (`kubectl get polr -A`), `Enforce` once they are all accounted for.
# Add a namespace to `exclude` (from the values of the cluster) instead of opting a pod out: the policy is cluster-admin only.
# Not applied to the static pods (mirror pods), only the kubelet manages them.
failurePolicy: Ignore
validationFailureAction: Audit
background: true
rules:
  - name: pod-restrict-host-access
    match:
      any:
        - resources:
            kinds:
              - Pod
            operations:
              - CREATE
    exclude:
      any:
        - resources:
            annotations:
              kubernetes.io/config.mirror: "?*"
        - resources:
            namespaces:
              - kube-system # cilium, multus, kube-proxy, the static pods
              - longhorn-system
              - kured
    validate:
      message: only the namespaces allowed by the policy `pod-restrict-host-access` can use the host namespaces, privileged containers and hostPath volumes
      deny:
        conditions:
          any:
            - key: "{{ request.object.spec.hostPID || `false` }}"
              operator: Equals
              value: true
            - key: "{{ request.object.spec.hostIPC || `false` }}"
              operator: Equals
              value: true
            - key: "{{ request.object.spec.hostNetwork || `false` }}"
              operator: Equals
              value: true
            - key: "{{ request.object.spec.[containers, initContainers][] | [?securityContext.privileged == `true`] | length(@) }}"
              operator: GreaterThan
              value: 0
            - key: "{{ length(request.object.spec.volumes[?hostPath] || `[]`) }}"
              operator: GreaterThan
              value: 0
