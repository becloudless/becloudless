# yaml-language-server: $schema=../../../base/schema/resources/kyvernoClusterPolicies.json

# Seccomp `RuntimeDefault` for the pods: filters the dangerous syscalls. A `seccompProfile` already set on the pod is kept.
# Not applied to:
#  - the pods with a privileged container or the capability `SYS_ADMIN`;
#  - the static pods (mirror pods), only the kubelet manages them;
#  - the pods with the annotation `policy.bcl/skipPodSetSeccompProfile: "true"`, to opt out an app that does not work with it.
# `Ignore`: a Kyverno outage must not block the creation of pods.
failurePolicy: Ignore
rules:
  - name: pod-set-seccomp-profile
    match:
      any:
        - resources:
            kinds:
              - Pod
            operations:
              - CREATE
    exclude:
      any:
        - resources:
            annotations:
              kubernetes.io/config.mirror: "?*"
        - resources:
            annotations:
              policy.bcl/skipPodSetSeccompProfile: "true"
    preconditions:
      all:
        - key: "{{ request.object.spec.[containers, initContainers][] | [?securityContext.privileged == `true`] | length(@) }}"
          operator: Equals
          value: 0
        - key: "{{ request.object.spec.[containers, initContainers][] | [?contains(securityContext.capabilities.add || `[]`, 'SYS_ADMIN')] | length(@) }}"
          operator: Equals
          value: 0
    mutate:
      patchStrategicMerge:
        spec:
          securityContext:
            +(seccompProfile):
              type: RuntimeDefault
