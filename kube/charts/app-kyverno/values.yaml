# yaml-language-server: $schema=../app/schema/values.schema.json

resources:
  fluxHelmRepositories:
    kyverno:
      url: https://kyverno.github.io/kyverno

  ciliumNetworkPolicies:
    kyverno-admission-controller:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: kyverno-admission-controller}
      ingress:
        kube-apiserver: # the webhooks
          fromEntities: [kube-apiserver, host, remote-node]
          toPorts: [9443]
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]

    kyverno-cleanup-controller:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: kyverno-cleanup-controller}
      ingress:
        kube-apiserver:
          fromEntities: [kube-apiserver, host, remote-node]
          toPorts: [9443]
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]

    kyverno-background-controller:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: kyverno-background-controller}
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]

    kyverno-reports-controller:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: kyverno-reports-controller}
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]

    kyverno-migrate-resources: # the job of the upgrades
      endpointSelector:
        matchLabels: {job-name: kyverno-migrate-resources}
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]

  fluxHelmReleases:
    kyverno:
      chart:
        spec:
          chart: kyverno
          version: 3.9.1
          sourceRef:
            kind: HelmRepository
            name: kyverno
      # Kyverno excludes its own namespace from its webhooks, so the `pod-set-host-users` policy can not set `hostUsers` on its
      # pods, and the chart has no value for it.
      postRenderers:
        user-namespace:
          kustomize:
            patches:
              deployments:
                target:
                  kind: Deployment
                patch: |
                  - op: add
                    path: /spec/template/spec/hostUsers
                    value: false
      values:
        admissionController:
          replicas: "{{ .Values.app.scaling.replicas }}"

    # The ClusterPolicies (files/policies, see templates/_policies.tpl) need the Kyverno CRDs, so they are installed once kyverno is ready
    kyverno-post:
      dependsOn:
        - ref:kyverno
