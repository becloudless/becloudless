# yaml-language-server: $schema=../base/schema/values.schema.json

resources:
  fluxHelmRepositories:
    kyverno:
      url: https://kyverno.github.io/kyverno

  # on top of the default deny of app-cilium: one policy for each component. The selectors are in the namespace of the release.
  ciliumNetworkPolicies:
    kyverno-admission-controller:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: kyverno-admission-controller}
      ingress:
        kube-apiserver: # the webhooks: the API server is host networked, it is seen as the host or a remote node
          fromEntities: {apiserver: kube-apiserver, host: host, remote-node: remote-node}
          toPorts:
            webhook: {ports: {p9443: {port: "9443", protocol: TCP}}}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}

    kyverno-cleanup-controller:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: kyverno-cleanup-controller}
      ingress:
        kube-apiserver:
          fromEntities: {apiserver: kube-apiserver, host: host, remote-node: remote-node}
          toPorts:
            webhook: {ports: {p9443: {port: "9443", protocol: TCP}}}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}

    kyverno-background-controller:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: kyverno-background-controller}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}

    kyverno-reports-controller:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: kyverno-reports-controller}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}

    kyverno-migrate-resources: # the job of the upgrades
      endpointSelector:
        matchLabels: {job-name: kyverno-migrate-resources}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}

  fluxHelmReleases:
    kyverno:
      chart:
        spec:
          chart: kyverno
          version: 3.9.1
          sourceRef:
            kind: HelmRepository
            name: kyverno
      values:
        admissionController:
          replicas: 3

    # ClusterPolicies need the Kyverno CRDs, so they are installed once kyverno is ready
    kyverno-post:
      dependsOn:
        kyverno:
          name: kyverno
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          kyvernoClusterPolicies:
            set-image-pull-policy:
              rules:
                set-image-pull-policy:
                  name: set-image-pull-policy
                  match:
                    any:
                      pods:
                        resources:
                          kinds:
                            - Pod
                  mutate:
                    patchStrategicMerge:
                      spec:
                        containers:
                          - (image): "*"
                            imagePullPolicy: IfNotPresent

            # complements the `--default-service-account` flag of the flux controllers with a clear error at apply time.
            # `Ignore`: a Kyverno outage must not block the reconciliation of the apps.
            require-flux-service-account:
              failurePolicy: Ignore
              validationFailureAction: Enforce
              rules:
                require-service-account:
                  name: require-service-account
                  match:
                    any:
                      flux:
                        resources:
                          kinds:
                            - helm.toolkit.fluxcd.io/v2/HelmRelease
                            - kustomize.toolkit.fluxcd.io/v1/Kustomization
                  validate:
                    message: spec.serviceAccountName is required, the resource would run with the permissions of the flux controller
                    pattern:
                      spec:
                        serviceAccountName: "?*"
