# yaml-language-server: $schema=../base/schema/values.schema.json

# resources are named by their id, without the release name prefix
prefixNamesWithRelease: false

defaults:
  metadata:
    namespace: kyverno

resources:
  fluxHelmRepositories:
    kyverno:
      url: https://kyverno.github.io/kyverno

  fluxHelmReleases:
    kyverno:
      chart:
        spec:
          chart: kyverno
          version: 3.9.1
          sourceRef:
            kind: HelmRepository
            name: kyverno
      upgrade:
        remediation:
          retries: 3
      values:
        admissionController:
          replicas: 3

    # ClusterPolicies need the Kyverno CRDs, so they are installed once kyverno is ready
    kyverno-config:
      dependsOn:
        kyverno:
          name: kyverno
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: bcl
      values:
        prefixNamesWithRelease: false
        resources:
          kyvernoClusterPolicies:
            set-image-pull-policy:
              rules:
                set-image-pull-policy:
                  name: set-image-pull-policy
                  match:
                    any:
                      pods:
                        resources:
                          kinds:
                            - Pod
                  mutate:
                    patchStrategicMerge:
                      spec:
                        containers:
                          - (image): "*"
                            imagePullPolicy: IfNotPresent
