# Source: app-kyverno/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: default
spec:
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
      version: 3.9.1
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    admissionController:
      replicas: 3
---
# Source: app-kyverno/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-post
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: kyverno
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      kyvernoClusterPolicies:
        require-flux-service-account:
          failurePolicy: Ignore
          rules:
            require-service-account:
              match:
                any:
                  flux:
                    resources:
                      kinds:
                      - helm.toolkit.fluxcd.io/v2/HelmRelease
                      - kustomize.toolkit.fluxcd.io/v1/Kustomization
              name: require-service-account
              validate:
                message: spec.serviceAccountName is required, the resource would run
                  with the permissions of the flux controller
                pattern:
                  spec:
                    serviceAccountName: ?*
          validationFailureAction: Enforce
        set-image-pull-policy:
          rules:
            set-image-pull-policy:
              match:
                any:
                  pods:
                    resources:
                      kinds:
                      - Pod
              mutate:
                patchStrategicMerge:
                  spec:
                    containers:
                    - (image): '*'
                      imagePullPolicy: IfNotPresent
              name: set-image-pull-policy
---
