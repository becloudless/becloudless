---
# Source: app-kyverno/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
      version: 3.9.1
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    admissionController:
      replicas: 3
---
# Source: app-kyverno/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-config
  namespace: kyverno
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: kyverno
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    resources:
      kyvernoClusterPolicies:
        require-flux-service-account:
          failurePolicy: Ignore
          rules:
            require-service-account:
              match:
                any:
                  flux:
                    resources:
                      kinds:
                      - helm.toolkit.fluxcd.io/v2/HelmRelease
                      - kustomize.toolkit.fluxcd.io/v1/Kustomization
              name: require-service-account
              validate:
                message: spec.serviceAccountName is required, the resource would run
                  with the permissions of the flux controller
                pattern:
                  spec:
                    serviceAccountName: ?*
          validationFailureAction: Enforce
        set-image-pull-policy:
          rules:
            set-image-pull-policy:
              match:
                any:
                  pods:
                    resources:
                      kinds:
                      - Pod
              mutate:
                patchStrategicMerge:
                  spec:
                    containers:
                    - (image): '*'
                      imagePullPolicy: IfNotPresent
              name: set-image-pull-policy
---
# Source: app-kyverno/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 10m
  url: https://kyverno.github.io/kyverno
