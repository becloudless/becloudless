# Source: app-kyverno/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: default
spec:
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
      version: 3.9.1
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  postRenderers:
  - kustomize:
      patches:
      - patch: |-
          - op: add
            path: /spec/template/spec/hostUsers
            value: false
        target:
          kind: Deployment
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    admissionController:
      replicas: 3
---
# Source: app-kyverno/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-post
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: kyverno
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      kyvernoClusterPolicies:
        pods-user-namespace:
          failurePolicy: Ignore
          rules:
          - exclude:
              any:
              - resources:
                  namespaces:
                  - kube-system
                  - longhorn-system
              - resources:
                  annotations:
                    bcl/hostUsers: "true"
            match:
              any:
              - resources:
                  kinds:
                  - Pod
                  operations:
                  - CREATE
            mutate:
              patchStrategicMerge:
                spec:
                  +(hostUsers): false
            name: set-host-users
            preconditions:
              all:
              - key: '{{"{{"}} request.object.spec.hostNetwork || `false` {{"}}"}}'
                operator: Equals
                value: false
              - key: '{{"{{"}} request.object.spec.hostPID || `false` {{"}}"}}'
                operator: Equals
                value: false
              - key: '{{"{{"}} request.object.spec.hostIPC || `false` {{"}}"}}'
                operator: Equals
                value: false
              - key: '{{"{{"}} length(request.object.spec.containers[?volumeDevices])
                  {{"}}"}}'
                operator: Equals
                value: 0
        require-flux-service-account:
          failurePolicy: Ignore
          rules:
          - match:
              any:
              - resources:
                  kinds:
                  - helm.toolkit.fluxcd.io/v2/HelmRelease
                  - kustomize.toolkit.fluxcd.io/v1/Kustomization
            name: require-service-account
            validate:
              message: spec.serviceAccountName is required, the resource would run
                with the permissions of the flux controller
              pattern:
                spec:
                  serviceAccountName: ?*
          validationFailureAction: Enforce
        set-image-pull-policy:
          rules:
          - match:
              any:
              - resources:
                  kinds:
                  - Pod
            mutate:
              patchStrategicMerge:
                spec:
                  containers:
                  - (image): '*'
                    imagePullPolicy: IfNotPresent
            name: set-image-pull-policy
---
