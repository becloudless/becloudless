# Source: app-kyverno/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-post
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: kyverno
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      kyverno-post:
        kyvernoClusterPolicies:
          container-disallow-latest-tag:
            name: container-disallow-latest-tag
            namespace: default
          container-require-read-only-root-filesystem:
            name: container-require-read-only-root-filesystem
            namespace: default
          container-require-run-as-non-root:
            name: container-require-run-as-non-root
            namespace: default
          container-set-image-pull-policy:
            name: container-set-image-pull-policy
            namespace: default
          container-set-no-privilege-escalation:
            name: container-set-no-privilege-escalation
            namespace: default
          hr-ks-require-service-account:
            name: hr-ks-require-service-account
            namespace: default
          pod-disable-service-links:
            name: pod-disable-service-links
            namespace: default
          pod-set-host-users:
            name: pod-set-host-users
            namespace: default
          pod-set-seccomp-profile:
            name: pod-set-seccomp-profile
            namespace: default
    resources:
      kyvernoClusterPolicies:
        container-disallow-latest-tag:
          failurePolicy: Ignore
          rules:
          - match:
              any:
              - resources:
                  kinds:
                  - Pod
                  operations:
                  - CREATE
            name: container-require-image-tag
            validate:
              message: the images must have a tag or a digest
              pattern:
                spec:
                  =(initContainers):
                  - image: '*:*'
                  containers:
                  - image: '*:*'
          - match:
              any:
              - resources:
                  kinds:
                  - Pod
                  operations:
                  - CREATE
            name: container-disallow-latest-tag
            validate:
              message: the images must not use the `latest` tag
              pattern:
                spec:
                  =(initContainers):
                  - image: '!*:latest'
                  containers:
                  - image: '!*:latest'
          validationFailureAction: Enforce
        container-require-read-only-root-filesystem:
          background: true
          failurePolicy: Ignore
          rules:
          - exclude:
              any:
              - resources:
                  annotations:
                    kubernetes.io/config.mirror: ?*
              - resources:
                  annotations:
                    policy.bcl/skipContainerRequireReadOnlyRootFilesystem: "true"
            match:
              any:
              - resources:
                  kinds:
                  - Pod
                  operations:
                  - CREATE
                  - UPDATE
            name: container-require-read-only-root-filesystem
            preconditions:
              all:
              - key: '{{"{{"}} request.object.spec.[containers, initContainers][]
                  | [?securityContext.privileged == `true`] | length(@) {{"}}"}}'
                operator: Equals
                value: 0
            validate:
              message: the containers must set `securityContext.readOnlyRootFilesystem`
                to `true`
              pattern:
                spec:
                  =(initContainers):
                  - securityContext:
                      readOnlyRootFilesystem: true
                  containers:
                  - securityContext:
                      readOnlyRootFilesystem: true
          validationFailureAction: Enforce
        container-require-run-as-non-root:
          background: true
          failurePolicy: Ignore
          rules:
          - exclude:
              any:
              - resources:
                  annotations:
                    kubernetes.io/config.mirror: ?*
              - resources:
                  annotations:
                    policy.bcl/skipContainerRequireRunAsNonRoot: "true"
            match:
              any:
              - resources:
                  kinds:
                  - Pod
                  operations:
                  - CREATE
                  - UPDATE
            name: container-require-run-as-non-root
            preconditions:
              all:
              - key: '{{"{{"}} request.object.spec.[containers, initContainers][]
                  | [?securityContext.privileged == `true`] | length(@) {{"}}"}}'
                operator: Equals
                value: 0
            validate:
              anyPattern:
              - spec:
                  =(initContainers):
                  - =(securityContext):
                      =(runAsNonRoot): true
                  containers:
                  - =(securityContext):
                      =(runAsNonRoot): true
                  securityContext:
                    runAsNonRoot: true
              - spec:
                  =(initContainers):
                  - =(securityContext):
                      =(runAsUser): '>0'
                  containers:
                  - =(securityContext):
                      =(runAsUser): '>0'
                  securityContext:
                    runAsUser: '>0'
              - spec:
                  =(initContainers):
                  - securityContext:
                      runAsNonRoot: true
                  containers:
                  - securityContext:
                      runAsNonRoot: true
              message: the containers must set `runAsNonRoot` to `true`, on the pod
                or on every container
          validationFailureAction: Enforce
        container-set-image-pull-policy:
          rules:
          - match:
              any:
              - resources:
                  kinds:
                  - Pod
            mutate:
              patchStrategicMerge:
                spec:
                  containers:
                  - (image): '*'
                    imagePullPolicy: IfNotPresent
            name: container-set-image-pull-policy
        container-set-no-privilege-escalation:
          failurePolicy: Ignore
          rules:
          - exclude:
              any:
              - resources:
                  annotations:
                    kubernetes.io/config.mirror: ?*
              - resources:
                  annotations:
                    policy.bcl/skipContainerSetNoPrivilegeEscalation: "true"
            match:
              any:
              - resources:
                  kinds:
                  - Pod
                  operations:
                  - CREATE
            mutate:
              patchStrategicMerge:
                spec:
                  containers:
                  - (name): '*'
                    securityContext:
                      +(allowPrivilegeEscalation): false
                  initContainers:
                  - (name): '*'
                    securityContext:
                      +(allowPrivilegeEscalation): false
            name: container-set-no-privilege-escalation
            preconditions:
              all:
              - key: '{{"{{"}} request.object.spec.[containers, initContainers][]
                  | [?securityContext.privileged == `true`] | length(@) {{"}}"}}'
                operator: Equals
                value: 0
              - key: '{{"{{"}} request.object.spec.[containers, initContainers][]
                  | [?contains(securityContext.capabilities.add || `[]`, ''SYS_ADMIN'')]
                  | length(@) {{"}}"}}'
                operator: Equals
                value: 0
        hr-ks-require-service-account:
          failurePolicy: Ignore
          rules:
          - match:
              any:
              - resources:
                  kinds:
                  - helm.toolkit.fluxcd.io/v2/HelmRelease
                  - kustomize.toolkit.fluxcd.io/v1/Kustomization
            name: hr-ks-require-service-account
            validate:
              message: spec.serviceAccountName is required, the resource would run
                with the permissions of the flux controller
              pattern:
                spec:
                  serviceAccountName: ?*
          validationFailureAction: Enforce
        pod-disable-service-links:
          failurePolicy: Ignore
          rules:
          - exclude:
              any:
              - resources:
                  annotations:
                    kubernetes.io/config.mirror: ?*
              - resources:
                  annotations:
                    policy.bcl/skipPodDisableServiceLinks: "true"
            match:
              any:
              - resources:
                  kinds:
                  - Pod
                  operations:
                  - CREATE
            mutate:
              patchStrategicMerge:
                spec:
                  +(enableServiceLinks): false
            name: pod-disable-service-links
        pod-set-host-users:
          failurePolicy: Ignore
          rules:
          - exclude:
              any:
              - resources:
                  annotations:
                    policy.bcl/skipPodSetHostUsers: "true"
            match:
              any:
              - resources:
                  kinds:
                  - Pod
                  operations:
                  - CREATE
            mutate:
              patchStrategicMerge:
                spec:
                  +(hostUsers): false
            name: pod-set-host-users
            preconditions:
              all:
              - key: '{{"{{"}} request.object.spec.hostNetwork || `false` {{"}}"}}'
                operator: Equals
                value: false
              - key: '{{"{{"}} request.object.spec.hostPID || `false` {{"}}"}}'
                operator: Equals
                value: false
              - key: '{{"{{"}} request.object.spec.hostIPC || `false` {{"}}"}}'
                operator: Equals
                value: false
              - key: '{{"{{"}} length(request.object.spec.containers[?volumeDevices])
                  {{"}}"}}'
                operator: Equals
                value: 0
        pod-set-seccomp-profile:
          failurePolicy: Ignore
          rules:
          - exclude:
              any:
              - resources:
                  annotations:
                    kubernetes.io/config.mirror: ?*
              - resources:
                  annotations:
                    policy.bcl/skipPodSetSeccompProfile: "true"
            match:
              any:
              - resources:
                  kinds:
                  - Pod
                  operations:
                  - CREATE
            mutate:
              patchStrategicMerge:
                spec:
                  securityContext:
                    +(seccompProfile):
                      type: RuntimeDefault
            name: pod-set-seccomp-profile
            preconditions:
              all:
              - key: '{{"{{"}} request.object.spec.[containers, initContainers][]
                  | [?securityContext.privileged == `true`] | length(@) {{"}}"}}'
                operator: Equals
                value: 0
              - key: '{{"{{"}} request.object.spec.[containers, initContainers][]
                  | [?contains(securityContext.capabilities.add || `[]`, ''SYS_ADMIN'')]
                  | length(@) {{"}}"}}'
                operator: Equals
                value: 0
