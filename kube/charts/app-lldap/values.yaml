# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:
  ldapdn:

# resources are named by their id, without the release name prefix
prefixNamesWithRelease: false

defaults:
  metadata:
    namespace: lldap

resources:
  stringSecrets:
    lldap-generated:
      fields:
        jwt-secret:
          fieldName: LLDAP_JWT_SECRET
        user-dn:
          fieldName: LLDAP_LDAP_USER_DN
        user-pass:
          fieldName: LLDAP_LDAP_USER_PASS

  configMaps:
    lldap-config:
      data:
        # https://github.com/lldap/lldap/blob/main/lldap_config.docker_template.toml
        lldap_config.toml: |
          # verbose = false
          http_url = "https://lldap.{{ .Values.global.domain }}"
          database_url = "postgres://"
          ldap_base_dn = "{{ .Values.global.ldapdn }}"

          [ldap_options]
          enable_samba = true

          [ldaps_options]
          enabled=true
          key_file="/cert/tls.key"
          cert_file="/cert/tls.crt"

  certManagerCertificates:
    # certificate of the web UI, terminated by the Gateway
    lldap-gateway:
      secretName: tls-lldap-gateway
      dnsNames:
        lldap: lldap.{{ .Values.global.domain }}
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer

    # certificate of ldaps, used by the lldap pod
    tls-lldaps:
      secretName: tls-lldaps
      dnsNames:
        lldaps: lldaps.{{ .Values.global.domain }}
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer

  deployments:
    lldap:
      selector:
        matchLabels:
          app.kubernetes.io/name: lldap
      template:
        metadata:
          labels:
            app.kubernetes.io/name: lldap
        spec:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            lldap:
              name: lldap
              image: lldap/lldap:2026-09-22-debian-rootless # renovate: versioning=loose
              envFrom:
                generated:
                  secretRef:
                    name: lldap-generated
                # lldap:
                #   secretRef:
                #     name: lldap
              env:
                TZ: europe/paris
                PGUSER: app
                PGDATABASE: app
                PGHOST: lldap-postgresql-rw
                PGSSLKEY: /dbcert/tls.key
                PGSSLCERT: /dbcert/tls.crt
                PGSSLROOTCERT: /dbcert/ca.crt
                PGSSLMODE: verify-full
              ports:
                http:
                  containerPort: 17170
                ldaps:
                  containerPort: 6360
              readinessProbe:
                httpGet:
                  path: /
                  port: 17170
              livenessProbe:
                httpGet:
                  path: /
                  port: 17170
              startupProbe:
                httpGet:
                  path: /
                  port: 17170
              volumeMounts:
                cert:
                  name: cert
                  mountPath: /cert
                  readOnly: true
                data:
                  name: data
                  mountPath: /data
                dbcert:
                  name: dbcert
                  mountPath: /dbcert
                  readOnly: true
          volumes:
            cert:
              name: cert
              secret:
                secretName: tls-lldaps
            data:
              name: data
              configMap:
                name: lldap-config
            dbcert:
              name: dbcert
              secret:
                secretName: lldap-postgresql-app-tls

  services:
    lldap:
      selector:
        app.kubernetes.io/name: lldap
      ports:
        http:
          port: 17170
        ldaps:
          port: 6360

  # Exposed by the Cilium Gateway `shared` (kube-system), both on port 443 and routed by SNI:
  #  - lldap.<domain>: web UI, TLS terminated by the Gateway
  #  - lldaps.<domain>: ldaps served by lldap itself (tls-lldaps certificate), the TLS stream is forwarded as is (passthrough)
  # Requires the Gateway API CRDs and cert-manager: app-bcl makes this app depend on them.
  listenerSets:
    lldap:
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: shared
        namespace: kube-system
      listeners:
        https:
          name: https
          hostname: lldap.{{ .Values.global.domain }}
          port: 443
          protocol: HTTPS
          tls:
            mode: Terminate
            certificateRefs:
              tls:
                name: tls-lldap-gateway
          allowedRoutes:
            namespaces:
              from: Same
        ldaps:
          name: ldaps
          hostname: lldaps.{{ .Values.global.domain }}
          port: 443
          protocol: TLS
          tls:
            mode: Passthrough
          allowedRoutes:
            namespaces:
              from: Same

  httpRoutes:
    lldap:
      parentRefs:
        lldap:
          group: gateway.networking.k8s.io
          kind: ListenerSet
          name: lldap
          sectionName: https
      hostnames:
        lldap: lldap.{{ .Values.global.domain }}
      rules:
        root:
          backendRefs:
            lldap:
              name: lldap
              port: 17170

  tlsRoutes:
    lldap-ldaps:
      parentRefs:
        lldap:
          group: gateway.networking.k8s.io
          kind: ListenerSet
          name: lldap
          sectionName: ldaps
      hostnames:
        lldaps: lldaps.{{ .Values.global.domain }}
      rules:
        ldaps:
          backendRefs:
            lldap:
              name: lldap
              port: 6360

  fluxHelmReleases:
    # the database is prepared by the postgresql-cluster chart (certificates, issuer, cluster and backups)
    # the cluster is named after the release, which is the name of this HelmRelease
    lldap-postgresql:
      chart:
        spec:
          chart: ./kube/charts/postgresql-cluster
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: bcl
      values:
        clientCertAuth: true
        postgresql:
          parameters:
            max_slot_wal_keep_size: 500MB
