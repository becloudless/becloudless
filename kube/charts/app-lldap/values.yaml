# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:
  ldapdn:

resources:

  fluxHelmReleases:

    lldap-postgresql:
      chart:
        spec:
          chart: ./kube/charts/postgresql-cluster
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      dependsOn: # the certificates, the cluster and the volume snapshots
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        cnpg:
          name: app-cnpg
          namespace: cnpg-system
        longhorn:
          name: app-longhorn
          namespace: longhorn-system
      values:
        clientCertAuth: true
        postgresql:
          parameters:
            max_slot_wal_keep_size: 500MB

    # the secrets and the certificate of the pod, created before it starts
    lldap-pre:
      dependsOn:
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        secret-generator:
          name: app-secret-generator
          namespace: secret-generator
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          stringSecrets:
            lldap-generated:
              fields:
                jwt-secret:
                  fieldName: LLDAP_JWT_SECRET
                user-dn:
                  fieldName: LLDAP_LDAP_USER_DN
                user-pass:
                  fieldName: LLDAP_LDAP_USER_PASS
            lldap: # TODO to backup
              fields:
                key-seed:
                  fieldName: LLDAP_KEY_SEED

          certManagerCertificates:
            # certificate of ldaps, used by the lldap pod
            tls-lldaps:
              secretName: tls-lldaps
              dnsNames:
                lldaps: lldaps.{{ .Values.global.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

    lldap:
      dependsOn:
        lldap-pre:
          name: lldap-pre
        lldap-postgresql:
          name: lldap-postgresql
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          configMaps:
            lldap-config:
              data:
                # https://github.com/lldap/lldap/blob/main/lldap_config.docker_template.toml
                lldap_config.toml: |
                  # verbose = false
                  http_url = "https://lldap.{{ .Values.global.domain }}"
                  database_url = "postgres://"
                  ldap_base_dn = "{{ .Values.global.ldapdn }}"
                  key_file = ""

                  [ldap_options]
                  enable_samba = true

                  [ldaps_options]
                  enabled=true
                  key_file="/cert/tls.key"
                  cert_file="/cert/tls.crt"

          deployments:
            lldap:
              selector:
                matchLabels:
                  app.kubernetes.io/name: lldap
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: lldap
                spec:
                  securityContext:
                    runAsUser: 1000
                    runAsGroup: 1000
                  containers:
                    lldap:
                      name: lldap
                      image: lldap/lldap:2026-09-22-debian-rootless # renovate: versioning=loose
                      envFrom:
                        generated:
                          secretRef:
                            name: lldap-generated
                        lldap:
                          secretRef:
                            name: lldap
                      env:
                        TZ: europe/paris
                        PGUSER: app
                        PGDATABASE: app
                        PGHOST: lldap-postgresql-rw
                        PGSSLKEY: /dbcert/tls.key
                        PGSSLCERT: /dbcert/tls.crt
                        PGSSLROOTCERT: /dbcert/ca.crt
                        PGSSLMODE: verify-full
                      ports:
                        http:
                          containerPort: 17170
                        ldaps:
                          containerPort: 6360
                      readinessProbe:
                        httpGet:
                          path: /
                          port: 17170
                      livenessProbe:
                        httpGet:
                          path: /
                          port: 17170
                      startupProbe:
                        httpGet:
                          path: /
                          port: 17170
                        periodSeconds: 5
                        failureThreshold: 60 # the first start creates the schema of the database, killing it leaves it half done
                      volumeMounts:
                        cert:
                          name: cert
                          mountPath: /cert
                          readOnly: true
                        data:
                          name: data
                          mountPath: /data
                        dbcert:
                          name: dbcert
                          mountPath: /dbcert
                          readOnly: true
                  volumes:
                    cert:
                      name: cert
                      secret:
                        secretName: tls-lldaps
                    data:
                      name: data
                      configMap:
                        name: lldap-config
                    dbcert:
                      name: dbcert
                      secret:
                        secretName: lldap-postgresql-app-tls

          services:
            lldap:
              selector:
                app.kubernetes.io/name: lldap
              ports:
                http:
                  port: 17170
                ldaps:
                  port: 6360

    # the setup of the apps, applied every 5 minutes by the `bootstrap.sh` of lldap through its API:
    #  - the groups the apps authorize (see the access control of authelia) and the custom attributes of the users: declared here
    #  - the users: declared by the cluster in `global.lldapUsers` (see below), their groups must be declared here
    # The groups and users that are not declared are deleted (`DO_CLEANUP`), the `admin` user is kept.
    #
    # global.lldapUsers: the users of the cluster, the key is the user id (`apps.lldap.values.global.lldapUsers` in the cluster).
    # The attributes are the ones of the bootstrap script, see
    # https://github.com/lldap/lldap/blob/main/example_configs/bootstrap/bootstrap.md, and the custom attributes declared below.
    #   lldapUsers:
    #     n0rad:
    #       displayName: n0rad
    #       email: n0rad@example.com
    #       groups: [ role_admin, role_user ]
    #       immich_role: admin
    #       immich_quota: 45
    # No password is set, a user gets one from the lldap web UI (admin).
    lldap-post:
      dependsOn:
        lldap:
          name: lldap
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          configMaps:
            lldap-bootstrap:
              data:
                groups.json: |
                  {"name": "role_admin"}
                  {"name": "role_user"}
                  {"name": "role_editor"}
                  {"name": "app_forgejo"}
                  {"name": "app_gitea"}
                  {"name": "app_immich"}
                  {"name": "app_immich_one_factor"}
                  {"name": "app_jellyfin"}
                  {"name": "app_pushprox"}
                  {"name": "app_seerr"}
                users.json: | # one JSON object per user, as the script reads the top-level values
                  {{- range $id, $user := (.Values.global.lldapUsers | default dict) }}
                  {{ toJson (merge (dict "id" $id) ($user | default dict)) }}
                  {{- end }}
                users-schema.json: |
                  [
                    {"name": "immich_quota", "attributeType": "INTEGER", "isEditable": false, "isList": false, "isVisible": true},
                    {"name": "immich_role", "attributeType": "STRING", "isEditable": false, "isList": false, "isVisible": true}
                  ]

          cronJobs:
            lldap-bootstrap:
              schedule: "*/5 * * * *"
              concurrencyPolicy: Forbid
              jobTemplate:
                spec:
                  backoffLimit: 0
                  template:
                    spec:
                      restartPolicy: Never
                      securityContext:
                        runAsUser: 1000
                        runAsGroup: 1000
                      containers:
                        bootstrap:
                          name: bootstrap
                          image: lldap/lldap:2026-09-22-debian-rootless # renovate: versioning=loose
                          command: [ /usr/bin/env, bash ]
                          args:
                            - -c
                            - |
                              mkdir /tmp/{groups,users,users-schema}
                              cp /setup/groups.json /tmp/groups
                              cp /setup/users-schema.json /tmp/users-schema
                              cp /setup/users.json /tmp/users
                              export USER_CONFIGS_DIR=/tmp/users
                              export USER_SCHEMAS_DIR=/tmp/users-schema
                              export GROUP_CONFIGS_DIR=/tmp/groups
                              /app/bootstrap.sh
                          env:
                            LLDAP_URL: http://lldap:17170
                            LLDAP_ADMIN_USERNAME:
                              secretKeyRef:
                                name: lldap-generated
                                key: LLDAP_LDAP_USER_DN
                            LLDAP_ADMIN_PASSWORD:
                              secretKeyRef:
                                name: lldap-generated
                                key: LLDAP_LDAP_USER_PASS
                            DO_CLEANUP: "true"
                          volumeMounts:
                            setup:
                              name: setup
                              mountPath: /setup
                              readOnly: true
                      volumes:
                        setup:
                          name: setup
                          configMap:
                            name: lldap-bootstrap

    # the public exposure, applied once lldap is deployed and not waited for
    lldap-integration:
      install:
        disableWait: true
      upgrade:
        disableWait: true
      dependsOn:
        lldap-post:
          name: lldap-post
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        gateway-api:
          name: app-gateway-api
          namespace: gateway-api
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          certManagerCertificates:
            # certificate of the web UI, terminated by the Gateway
            lldap-gateway:
              secretName: tls-lldap-gateway
              dnsNames:
                lldap: lldap.{{ .Values.global.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

          # Exposed by the Cilium Gateway `shared` (kube-system), both on port 443 and routed by SNI:
          #  - lldap.<domain>: web UI, TLS terminated by the Gateway
          #  - lldaps.<domain>: ldaps served by lldap itself (tls-lldaps certificate), the TLS stream is forwarded as is (passthrough)
          listenerSets:
            lldap:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: shared
                namespace: kube-system
              listeners:
                https:
                  name: https
                  hostname: lldap.{{ .Values.global.domain }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-lldap-gateway
                  allowedRoutes:
                    namespaces:
                      from: Same
                ldaps:
                  name: ldaps
                  hostname: lldaps.{{ .Values.global.domain }}
                  port: 443
                  protocol: TLS
                  tls:
                    mode: Passthrough
                  allowedRoutes:
                    namespaces:
                      from: Same

          httpRoutes:
            lldap:
              parentRefs:
                lldap:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: lldap
                  sectionName: https
              hostnames:
                lldap: lldap.{{ .Values.global.domain }}
              rules:
                root:
                  backendRefs:
                    lldap:
                      name: lldap
                      port: 17170

          tlsRoutes:
            lldap-ldaps:
              parentRefs:
                lldap:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: lldap
                  sectionName: ldaps
              hostnames:
                lldaps: lldaps.{{ .Values.global.domain }}
              rules:
                ldaps:
                  backendRefs:
                    lldap:
                      name: lldap
                      port: 6360
