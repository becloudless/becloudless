# yaml-language-server: $schema=./schema/values.schema.json

# setup applied to lldap by `lldap-post`
lldapBootstrap:
  revision: 5 # part of the name of the Job: bump it when the spec of the Job changes (immutable fields), see `lldap-post`
  image: lldap/lldap:2026-09-22-debian-rootless # renovate: versioning=loose
  # the groups the apps authorize (see the access control of authelia and the roles of the apps)
  groups:
    - role_admin
    - role_user
    - role_editor
    - app_forgejo
    - app_immich
    - app_immich_one_factor
    - app_jellyfin
    - app_paperless
    - app_pushprox
    - app_seafile
    - app_seerr
    - app_syncthing
    - app_tuwunel
  # the custom attributes of the users, used by the OIDC claims of authelia
  userSchema:
    - name: immichquota
      attributeType: INTEGER
      isEditable: false
      isList: false
      isVisible: true
    - name: immichrole
      attributeType: STRING
      isEditable: false
      isList: false
      isVisible: true

resources:

  ciliumNetworkPolicies:
    lldap:
      endpointSelector: ref:lldap
      ingress:
        authelia:
          fromEndpoints:
            authelia:
              matchLabels: {"k8s:io.kubernetes.pod.namespace": authelia, "k8s:app.kubernetes.io/name": authelia}
          toPorts: [6360]
        bootstrap:
          fromEndpoints:
            bootstrap:
              matchExpressions:
                job: {key: job-name, operator: Exists}
          toPorts: [17170]
        gateway: # the web ui, and the ldaps tls passthrough
          fromEntities: [ingress, host, remote-node]
          toPorts: [17170, 6360]
      egress:
        postgresql:
          toEndpoints:
            postgresql:
              matchLabels: {cnpg.io/cluster: lldap-postgresql}
          toPorts: [5432]

    lldap-bootstrap: # the job applying the users and the groups, its name changes with them
      endpointSelector:
        matchExpressions:
          job: {key: job-name, operator: Exists}
      egress:
        lldap:
          toEndpoints:
            lldap: ref:lldap
          toPorts: [17170]

  fluxHelmReleases:

    lldap-postgresql:
      chart:
        spec:
          chart: ./kube/charts/postgresql
      dependsOn:
        - name: app-cert-manager
          namespace: cert-manager
        - name: app-cnpg
          namespace: cnpg-system
        - name: app-longhorn
          namespace: longhorn-system
      values:
        instances: "{{ .Values.app.scaling.dbReplicas }}"
        clientCertAuth: true
        clients:
          lldap:
            matchLabels: {app.kubernetes.io/instance: lldap, app.kubernetes.io/component: lldap}
        postgresql:
          parameters:
            max_slot_wal_keep_size: 500MB

    lldap-pre:
      dependsOn:
        - name: app-cert-manager
          namespace: cert-manager
        - name: app-secret-generator
          namespace: secret-generator
      values:
        resources:
          stringSecrets:
            lldap-generated:
              fields:
                jwt-secret:
                  fieldName: LLDAP_JWT_SECRET
                user-dn:
                  fieldName: LLDAP_LDAP_USER_DN
                user-pass:
                  fieldName: LLDAP_LDAP_USER_PASS
            lldap: # TODO to backup
              fields:
                key-seed:
                  fieldName: LLDAP_KEY_SEED

            # password of the `authelia` user (created by `lldap-post`), authelia binds with it to read the users and reset their password
            lldap-authelia:
              fields:
                password: {}

          # the `lldap-reader` service account of authelia reads `lldap-authelia` only: external-secrets reads a secret by its name
          # (`get`), and its check of the store only looks for `get` on `secrets` in the rules (not at the names)
          roles:
            authelia-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ lldap-authelia ]
                  verbs: [ get ]

          roleBindings:
            authelia-secrets-reader:
              roleRef: ref:authelia-secrets-reader
              subjects:
                lldap-reader:
                  kind: ServiceAccount
                  name: lldap-reader
                  namespace: authelia

          certManagerCertificates:
            # certificate of ldaps, used by the lldap pod
            tls-lldaps:
              secretName: tls-lldaps
              dnsNames:
                lldaps: lldaps.{{ .Values.app.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

    lldap:
      dependsOn:
        - ref:lldap-pre
        - ref:lldap-postgresql
      values:
        resources:
          configMaps:
            lldap-config:
              data:
                # https://github.com/lldap/lldap/blob/main/lldap_config.docker_template.toml
                lldap_config.toml: |
                  # verbose = false
                  http_url = "https://lldap.{{ .Values.app.domain }}"
                  database_url = "postgres://"
                  ldap_base_dn = "{{ .Values.app.lldapdn }}"
                  key_file = ""

                  [ldap_options]
                  enable_samba = true

                  [ldaps_options]
                  enabled=true
                  key_file="/cert/tls.key"
                  cert_file="/cert/tls.crt"

          deployments:
            lldap:
              template:
                spec:
                  securityContext:
                    runAsUser: 1000
                    runAsGroup: 1000
                  containers:
                    lldap:
                      name: lldap
                      image: lldap/lldap:2026-09-22-debian-rootless # renovate: versioning=loose
                      envFrom:
                        generated:
                          secretRef:
                            name: lldap-generated
                        lldap:
                          secretRef:
                            name: lldap
                      env:
                        TZ: europe/paris
                        PGUSER: app
                        PGDATABASE: app
                        PGHOST: lldap-postgresql-rw
                        PGSSLKEY: /dbcert/tls.key
                        PGSSLCERT: /dbcert/tls.crt
                        PGSSLROOTCERT: /dbcert/ca.crt
                        PGSSLMODE: verify-full
                      ports:
                        http:
                          containerPort: 17170
                        ldaps:
                          containerPort: 6360
                      probe:
                        httpGet:
                          path: /
                      startupProbe:
                        failureThreshold: 60 # the first start creates the schema of the database, killing it leaves it half done
                      volumeMounts:
                        cert:
                          name: cert
                          mountPath: /cert
                          readOnly: true
                        data:
                          name: data
                          mountPath: /data
                        dbcert:
                          name: dbcert
                          mountPath: /dbcert
                          readOnly: true
                  volumes:
                    cert:
                      name: cert
                      secret:
                        secretName: ref:tls-lldaps
                    data:
                      name: data
                      configMap:
                        name: ref:lldap-config
                    dbcert:
                      name: dbcert
                      secret:
                        secretName: lldap-postgresql-app-tls

          services:
            lldap:
              ports:
                http:
                  port: 17170
                ldaps:
                  port: 6360

    # The setup of the apps is applied through the API of lldap by its `bootstrap.sh`, once for each change of the setup: the Job is
    # named after the hash of the setup (`lldap-bootstrap-<hash>`), so a change creates a new Job and Helm deletes the previous one.
    # A failing script fails `lldap-post`. To run it again, delete the Job.
    #  - the groups the apps authorize and the custom attributes of the users: `lldapBootstrap`, in the values of this chart
    #  - the users: `app.lldapUsers` (`config.lldapUsers` of `apps` in the cluster), their groups must be in `lldapBootstrap.groups`
    #  - the `authelia` user, always declared here (members of `lldap_password_manager` and `lldap_strict_readonly`)
    # The groups and users that are not declared are deleted (`DO_CLEANUP`), the `admin` user is kept.
    #
    # app.lldapUsers: the key is the user id. The attributes are the ones of the bootstrap script, see
    # https://github.com/lldap/lldap/blob/main/example_configs/bootstrap/bootstrap.md, and the custom attributes of `lldapBootstrap.userSchema`.
    #   lldapUsers:
    #     n0rad:
    #       displayName: n0rad
    #       email: n0rad@example.com
    #       groups: [ role_admin, role_user ]
    #       immichrole: admin
    #       immichquota: 45
    # No password is set, a user gets one from the lldap web UI (admin).
    #
    # The hash covers the users, the groups, the schema, the image and `lldapBootstrap.revision`. Changing anything else in the Job
    # (the script, the env...) changes an immutable field: bump `revision`, or delete the Job.
    lldap-post:
      dependsOn:
        - ref:lldap
      values:
        resources:
          configMaps:
            lldap-bootstrap:
              data:
                groups.json: | # one JSON object per group, as the script reads the top-level values
                  {{- range $name := .Values.lldapBootstrap.groups }}
                  {{ toJson (dict "name" $name) }}
                  {{- end }}
                users.json: | # one JSON object per user
                  {{ toJson (dict "id" "authelia" "displayName" "Authelia" "email" (printf "authelia@%s" .Values.app.domain) "password_file" "/secrets/authelia/password" "groups" (list "lldap_password_manager" "lldap_strict_readonly")) }}
                  {{- range $id, $user := (.Values.app.lldapUsers | default dict) }}
                  {{ toJson (merge (dict "id" $id) ($user | default dict)) }}
                  {{- end }}
                users-schema.json: '{{ toJson .Values.lldapBootstrap.userSchema }}'

          jobs:
            lldap-bootstrap:
              fullNameOverride: 'lldap-bootstrap-{{ list .Values.lldapBootstrap (.Values.app.lldapUsers | default dict) | toJson | sha256sum | trunc 10 }}'
              backoffLimit: 0 # no retry: the script waits for lldap itself, and a Job of an old setup retrying would apply it again over the new one
              activeDeadlineSeconds: 600
              template:
                spec:
                  restartPolicy: Never
                  securityContext:
                    runAsUser: 1000
                    runAsGroup: 1000
                  containers:
                    bootstrap:
                      name: bootstrap
                      image: '{{ .Values.lldapBootstrap.image }}'
                      command: [ /usr/bin/env, bash ]
                      args:
                        - -c
                        - |
                          mkdir /tmp/{groups,users,users-schema}
                          cp /setup/groups.json /tmp/groups
                          cp /setup/users-schema.json /tmp/users-schema
                          cp /setup/users.json /tmp/users
                          export USER_CONFIGS_DIR=/tmp/users
                          export USER_SCHEMAS_DIR=/tmp/users-schema
                          export GROUP_CONFIGS_DIR=/tmp/groups
                          /app/bootstrap.sh
                      env:
                        LLDAP_URL: http://lldap:17170
                        LLDAP_ADMIN_USERNAME:
                          secretKeyRef:
                            name: ref:lldap-generated
                            key: LLDAP_LDAP_USER_DN
                        LLDAP_ADMIN_PASSWORD:
                          secretKeyRef:
                            name: ref:lldap-generated
                            key: LLDAP_LDAP_USER_PASS
                        DO_CLEANUP: "true"
                      volumeMounts:
                        setup:
                          name: setup
                          mountPath: /setup
                          readOnly: true
                        authelia:
                          name: authelia
                          mountPath: /secrets/authelia
                          readOnly: true
                  volumes:
                    setup:
                      name: setup
                      configMap:
                        name: ref:lldap-bootstrap
                    authelia:
                      name: authelia
                      secret:
                        secretName: ref:lldap-authelia

    # the public exposure (`expose` below), merged with the generated release: the ldaps part
    lldap-integration:
      values:
        resources:
          # lldap.<domain> (web UI, TLS terminated by the Gateway) and lldaps.<domain> are both on port 443 and routed by SNI.
          # lldaps.<domain>: ldaps served by lldap itself (tls-lldaps certificate), the TLS stream is forwarded as is (passthrough)
          listenerSets:
            lldap:
              listeners:
                ldaps:
                  name: ldaps
                  hostname: lldaps.{{ .Values.app.domain }}
                  port: 443
                  protocol: TLS
                  tls:
                    mode: Passthrough
                  allowedRoutes:
                    namespaces:
                      from: Same

          tlsRoutes:
            lldap-ldaps:
              parentRefs:
                lldap:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: lldap
                  sectionName: ldaps
              hostnames:
                lldaps: lldaps.{{ .Values.app.domain }}
              rules:
                ldaps:
                  backendRefs:
                    lldap:
                      name: lldap
                      port: 6360

expose:
  lldap:
    port: 17170
    dependsOn:
      - ref:lldap-post
