# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:
  ldapdn:

  # users of the cluster, see `lldap-post`
  lldapUsers: {}

  # setup applied to lldap by `lldap-post`
  lldapBootstrap:
    revision: 3 # part of the name of the Job: bump it when the spec of the Job changes (immutable fields), see `lldap-post`
    image: lldap/lldap:2026-09-22-debian-rootless # renovate: versioning=loose
    # the groups the apps authorize (see the access control of authelia and the roles of the apps)
    groups:
      - role_admin
      - role_user
      - role_editor
      - app_forgejo
      - app_gitea
      - app_immich
      - app_immich_one_factor
      - app_jellyfin
      - app_pushprox
      - app_seerr
    # the custom attributes of the users, used by the OIDC claims of authelia
    userSchema:
      - name: immichquota
        attributeType: INTEGER
        isEditable: false
        isList: false
        isVisible: true
      - name: immichrole
        attributeType: STRING
        isEditable: false
        isList: false
        isVisible: true

resources:

  fluxHelmReleases:

    lldap-postgresql:
      chart:
        spec:
          chart: ./kube/charts/postgresql-cluster
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      dependsOn: # the certificates, the cluster and the volume snapshots
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        cnpg:
          name: app-cnpg
          namespace: cnpg-system
        longhorn:
          name: app-longhorn
          namespace: longhorn-system
      values:
        clientCertAuth: true
        postgresql:
          parameters:
            max_slot_wal_keep_size: 500MB

    # the secrets and the certificate of the pod, created before it starts
    lldap-pre:
      dependsOn:
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        secret-generator:
          name: app-secret-generator
          namespace: secret-generator
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          stringSecrets:
            lldap-generated:
              fields:
                jwt-secret:
                  fieldName: LLDAP_JWT_SECRET
                user-dn:
                  fieldName: LLDAP_LDAP_USER_DN
                user-pass:
                  fieldName: LLDAP_LDAP_USER_PASS
            lldap: # TODO to backup
              fields:
                key-seed:
                  fieldName: LLDAP_KEY_SEED

            # password of the `authelia` user of lldap (created by `lldap-post`), authelia binds with it to read the users and to
            # reset their password. Copied to the authelia namespace by external-secrets (see `authelia-pre`).
            lldap-authelia:
              fields:
                password:
                  fieldName: password

          # lets the `lldap-reader` service account of the authelia namespace, used by the SecretStore of authelia, read the
          # `lldap-authelia` secret of this namespace, and only this one. external-secrets reads a secret by its name (`get`), and
          # its check of the store only looks for `get` on `secrets` in the rules of the account (not at the names).
          roles:
            authelia-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ lldap-authelia ]
                  verbs: [ get ]

          roleBindings:
            authelia-secrets-reader:
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: authelia-secrets-reader
              subjects:
                lldap-reader:
                  kind: ServiceAccount
                  name: lldap-reader
                  namespace: authelia

          certManagerCertificates:
            # certificate of ldaps, used by the lldap pod
            tls-lldaps:
              secretName: tls-lldaps
              dnsNames:
                lldaps: lldaps.{{ .Values.global.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

    lldap:
      dependsOn:
        lldap-pre:
          name: lldap-pre
        lldap-postgresql:
          name: lldap-postgresql
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          configMaps:
            lldap-config:
              data:
                # https://github.com/lldap/lldap/blob/main/lldap_config.docker_template.toml
                lldap_config.toml: |
                  # verbose = false
                  http_url = "https://lldap.{{ .Values.global.domain }}"
                  database_url = "postgres://"
                  ldap_base_dn = "{{ .Values.global.ldapdn }}"
                  key_file = ""

                  [ldap_options]
                  enable_samba = true

                  [ldaps_options]
                  enabled=true
                  key_file="/cert/tls.key"
                  cert_file="/cert/tls.crt"

          deployments:
            lldap:
              selector:
                matchLabels:
                  app.kubernetes.io/name: lldap
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: lldap
                spec:
                  securityContext:
                    runAsUser: 1000
                    runAsGroup: 1000
                  containers:
                    lldap:
                      name: lldap
                      image: lldap/lldap:2026-09-22-debian-rootless # renovate: versioning=loose
                      envFrom:
                        generated:
                          secretRef:
                            name: lldap-generated
                        lldap:
                          secretRef:
                            name: lldap
                      env:
                        TZ: europe/paris
                        PGUSER: app
                        PGDATABASE: app
                        PGHOST: lldap-postgresql-rw
                        PGSSLKEY: /dbcert/tls.key
                        PGSSLCERT: /dbcert/tls.crt
                        PGSSLROOTCERT: /dbcert/ca.crt
                        PGSSLMODE: verify-full
                      ports:
                        http:
                          containerPort: 17170
                        ldaps:
                          containerPort: 6360
                      readinessProbe:
                        httpGet:
                          path: /
                          port: 17170
                      livenessProbe:
                        httpGet:
                          path: /
                          port: 17170
                      startupProbe:
                        httpGet:
                          path: /
                          port: 17170
                        periodSeconds: 5
                        failureThreshold: 60 # the first start creates the schema of the database, killing it leaves it half done
                      volumeMounts:
                        cert:
                          name: cert
                          mountPath: /cert
                          readOnly: true
                        data:
                          name: data
                          mountPath: /data
                        dbcert:
                          name: dbcert
                          mountPath: /dbcert
                          readOnly: true
                  volumes:
                    cert:
                      name: cert
                      secret:
                        secretName: tls-lldaps
                    data:
                      name: data
                      configMap:
                        name: lldap-config
                    dbcert:
                      name: dbcert
                      secret:
                        secretName: lldap-postgresql-app-tls

          services:
            lldap:
              selector:
                app.kubernetes.io/name: lldap
              ports:
                http:
                  port: 17170
                ldaps:
                  port: 6360

    # the setup of the apps, applied through the API of lldap by its `bootstrap.sh`, once for each change of the setup:
    # the Job is named after the hash of the setup (`lldap-bootstrap-<hash>`), so a change creates a new Job, which runs the
    # script, and Helm deletes the previous one. The release waits for the Job: a failing script fails `lldap-post` (and
    # blocks `lldap-integration`). To run it again, delete the Job: it is recreated by the next reconciliation.
    #  - the groups the apps authorize (see the access control of authelia) and the custom attributes of the users:
    #    `global.lldapBootstrap`, in the values of this chart
    #  - the users: declared by the cluster in `global.lldapUsers` (`apps.lldap.values.global.lldapUsers` in the cluster),
    #    their groups must be declared in `global.lldapBootstrap.groups`
    #  - the `authelia` user, always declared here: the account authelia binds with (members of `lldap_password_manager` and
    #    `lldap_strict_readonly`), its password is the generated `lldap-authelia` secret
    # The groups and users that are not declared are deleted (`DO_CLEANUP`), the `admin` user is kept.
    #
    # global.lldapUsers: the key is the user id. The attributes are the ones of the bootstrap script, see
    # https://github.com/lldap/lldap/blob/main/example_configs/bootstrap/bootstrap.md, and the custom attributes declared in
    # `global.lldapBootstrap.userSchema`.
    #   lldapUsers:
    #     n0rad:
    #       displayName: n0rad
    #       email: n0rad@example.com
    #       groups: [ role_admin, role_user ]
    #       immichrole: admin
    #       immichquota: 45
    # No password is set, a user gets one from the lldap web UI (admin).
    #
    # The hash covers the users, the groups, the schema, the image and `lldapBootstrap.revision`. Changing anything else in the Job
    # (the script, the env...) is a change of an immutable field of the existing Job: bump `revision`, or delete the Job.
    lldap-post:
      dependsOn:
        lldap:
          name: lldap
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          configMaps:
            lldap-bootstrap:
              data:
                groups.json: | # one JSON object per group, as the script reads the top-level values
                  {{- range $name := .Values.global.lldapBootstrap.groups }}
                  {{ toJson (dict "name" $name) }}
                  {{- end }}
                users.json: | # one JSON object per user
                  {{ toJson (dict "id" "authelia" "displayName" "Authelia" "email" (printf "authelia@%s" .Values.global.domain) "password_file" "/secrets/authelia/password" "groups" (list "lldap_password_manager" "lldap_strict_readonly")) }}
                  {{- range $id, $user := (.Values.global.lldapUsers | default dict) }}
                  {{ toJson (merge (dict "id" $id) ($user | default dict)) }}
                  {{- end }}
                users-schema.json: '{{ toJson .Values.global.lldapBootstrap.userSchema }}'

          jobs:
            lldap-bootstrap:
              fullNameOverride: 'lldap-bootstrap-{{ list .Values.global.lldapBootstrap (.Values.global.lldapUsers | default dict) | toJson | sha256sum | trunc 10 }}'
              backoffLimit: 0 # no retry: the script waits for lldap itself, and a Job of an old setup retrying would apply it again over the new one
              activeDeadlineSeconds: 600
              template:
                spec:
                  restartPolicy: Never
                  securityContext:
                    runAsUser: 1000
                    runAsGroup: 1000
                  containers:
                    bootstrap:
                      name: bootstrap
                      image: '{{ .Values.global.lldapBootstrap.image }}'
                      command: [ /usr/bin/env, bash ]
                      args:
                        - -c
                        - |
                          mkdir /tmp/{groups,users,users-schema}
                          cp /setup/groups.json /tmp/groups
                          cp /setup/users-schema.json /tmp/users-schema
                          cp /setup/users.json /tmp/users
                          export USER_CONFIGS_DIR=/tmp/users
                          export USER_SCHEMAS_DIR=/tmp/users-schema
                          export GROUP_CONFIGS_DIR=/tmp/groups
                          /app/bootstrap.sh
                      env:
                        LLDAP_URL: http://lldap:17170
                        LLDAP_ADMIN_USERNAME:
                          secretKeyRef:
                            name: lldap-generated
                            key: LLDAP_LDAP_USER_DN
                        LLDAP_ADMIN_PASSWORD:
                          secretKeyRef:
                            name: lldap-generated
                            key: LLDAP_LDAP_USER_PASS
                        DO_CLEANUP: "true"
                      volumeMounts:
                        setup:
                          name: setup
                          mountPath: /setup
                          readOnly: true
                        authelia:
                          name: authelia
                          mountPath: /secrets/authelia
                          readOnly: true
                  volumes:
                    setup:
                      name: setup
                      configMap:
                        name: lldap-bootstrap
                    authelia:
                      name: authelia
                      secret:
                        secretName: lldap-authelia

    # the public exposure, applied once lldap is deployed and not waited for
    lldap-integration:
      install:
        disableWait: true
      upgrade:
        disableWait: true
      dependsOn:
        lldap-post:
          name: lldap-post
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        gateway-api:
          name: app-gateway-api
          namespace: gateway-api
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          certManagerCertificates:
            # certificate of the web UI, terminated by the Gateway
            lldap-gateway:
              secretName: tls-lldap-gateway
              dnsNames:
                lldap: lldap.{{ .Values.global.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

          # Exposed by the Cilium Gateway `shared` (kube-system), both on port 443 and routed by SNI:
          #  - lldap.<domain>: web UI, TLS terminated by the Gateway
          #  - lldaps.<domain>: ldaps served by lldap itself (tls-lldaps certificate), the TLS stream is forwarded as is (passthrough)
          listenerSets:
            lldap:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: shared
                namespace: kube-system
              listeners:
                https:
                  name: https
                  hostname: lldap.{{ .Values.global.domain }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-lldap-gateway
                  allowedRoutes:
                    namespaces:
                      from: Same
                ldaps:
                  name: ldaps
                  hostname: lldaps.{{ .Values.global.domain }}
                  port: 443
                  protocol: TLS
                  tls:
                    mode: Passthrough
                  allowedRoutes:
                    namespaces:
                      from: Same

          httpRoutes:
            lldap:
              parentRefs:
                lldap:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: lldap
                  sectionName: https
              hostnames:
                lldap: lldap.{{ .Values.global.domain }}
              rules:
                root:
                  backendRefs:
                    lldap:
                      name: lldap
                      port: 17170

          tlsRoutes:
            lldap-ldaps:
              parentRefs:
                lldap:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: lldap
                  sectionName: ldaps
              hostnames:
                lldaps: lldaps.{{ .Values.global.domain }}
              rules:
                ldaps:
                  backendRefs:
                    lldap:
                      name: lldap
                      port: 6360
