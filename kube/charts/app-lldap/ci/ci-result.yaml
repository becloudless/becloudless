---
# Source: app-lldap/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: lldap-postgresql
  - name: lldap-pre
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    resources:
      configMaps:
        lldap-config:
          data:
            lldap_config.toml: |-
              # verbose = false
              http_url = "https://lldap.test.com"
              database_url = "postgres://"
              ldap_base_dn = "dc=test,dc=com"

              [ldap_options]
              enable_samba = true

              [ldaps_options]
              enabled=true
              key_file="/cert/tls.key"
              cert_file="/cert/tls.crt"
      deployments:
        lldap:
          selector:
            matchLabels:
              app.kubernetes.io/name: lldap
          template:
            metadata:
              labels:
                app.kubernetes.io/name: lldap
            spec:
              containers:
                lldap:
                  env:
                    PGDATABASE: app
                    PGHOST: lldap-postgresql-rw
                    PGSSLCERT: /dbcert/tls.crt
                    PGSSLKEY: /dbcert/tls.key
                    PGSSLMODE: verify-full
                    PGSSLROOTCERT: /dbcert/ca.crt
                    PGUSER: app
                    TZ: europe/paris
                  envFrom:
                    generated:
                      secretRef:
                        name: lldap-generated
                  image: lldap/lldap:2026-09-22-debian-rootless
                  livenessProbe:
                    httpGet:
                      path: /
                      port: 17170
                  name: lldap
                  ports:
                    http:
                      containerPort: 17170
                    ldaps:
                      containerPort: 6360
                  readinessProbe:
                    httpGet:
                      path: /
                      port: 17170
                  startupProbe:
                    failureThreshold: 60
                    httpGet:
                      path: /
                      port: 17170
                    periodSeconds: 5
                  volumeMounts:
                    cert:
                      mountPath: /cert
                      name: cert
                      readOnly: true
                    data:
                      mountPath: /data
                      name: data
                    dbcert:
                      mountPath: /dbcert
                      name: dbcert
                      readOnly: true
              securityContext:
                runAsGroup: 1000
                runAsUser: 1000
              volumes:
                cert:
                  name: cert
                  secret:
                    secretName: tls-lldaps
                data:
                  configMap:
                    name: lldap-config
                  name: data
                dbcert:
                  name: dbcert
                  secret:
                    secretName: lldap-postgresql-app-tls
      services:
        lldap:
          ports:
            http:
              port: 17170
            ldaps:
              port: 6360
          selector:
            app.kubernetes.io/name: lldap
---
# Source: app-lldap/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  - name: lldap
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: -1
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    remediation:
      retries: 3
  values:
    resources:
      certManagerCertificates:
        lldap-gateway:
          dnsNames:
            lldap: lldap.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-lldap-gateway
      httpRoutes:
        lldap:
          hostnames:
            lldap: lldap.test.com
          parentRefs:
            lldap:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: lldap
              sectionName: https
          rules:
            root:
              backendRefs:
                lldap:
                  name: lldap
                  port: 17170
      listenerSets:
        lldap:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: lldap.test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-lldap-gateway
                mode: Terminate
            ldaps:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: lldaps.test.com
              name: ldaps
              port: 443
              protocol: TLS
              tls:
                mode: Passthrough
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
      tlsRoutes:
        lldap-ldaps:
          hostnames:
            lldaps: lldaps.test.com
          parentRefs:
            lldap:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: lldap
              sectionName: ldaps
          rules:
            ldaps:
              backendRefs:
                lldap:
                  name: lldap
                  port: 6360
