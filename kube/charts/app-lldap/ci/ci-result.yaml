apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: bcl
  dependsOn:
  - name: lldap-pre
  - name: lldap-postgresql
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      lldap:
        configMaps:
          lldap-config:
            name: lldap-config
            namespace: default
        deployments:
          lldap:
            labels:
              app.kubernetes.io/component: lldap
              app.kubernetes.io/instance: lldap
            name: lldap
            namespace: default
        services:
          lldap:
            name: lldap
            namespace: default
      lldap-integration:
        certManagerCertificates:
          lldap-gateway:
            name: lldap-gateway
            namespace: default
            secretName: tls-lldap-gateway
        httpRoutes:
          lldap:
            name: lldap
            namespace: default
        listenerSets:
          lldap:
            name: lldap
            namespace: default
        tlsRoutes:
          lldap-ldaps:
            name: lldap-ldaps
            namespace: default
      lldap-post:
        configMaps:
          lldap-bootstrap:
            name: lldap-bootstrap
            namespace: default
        jobs:
          lldap-bootstrap:
            labels:
              app.kubernetes.io/component: lldap-bootstrap
              app.kubernetes.io/instance: lldap-post
            name: ""
            namespace: default
      lldap-pre:
        certManagerCertificates:
          tls-lldaps:
            name: tls-lldaps
            namespace: default
        roleBindings:
          authelia-secrets-reader:
            name: authelia-secrets-reader
            namespace: default
        roles:
          authelia-secrets-reader:
            name: authelia-secrets-reader
            namespace: default
        stringSecrets:
          lldap:
            name: lldap
            namespace: default
          lldap-authelia:
            name: lldap-authelia
            namespace: default
          lldap-generated:
            name: lldap-generated
            namespace: default
      lldap-repair:
        ciliumNetworkPolicies:
          lldap-repair:
            name: lldap-repair
            namespace: default
        configMaps:
          lldap-repair:
            name: lldap-repair
            namespace: default
        cronJobs:
          lldap-repair:
            labels:
              app.kubernetes.io/component: lldap-repair
              app.kubernetes.io/instance: lldap-repair
            name: lldap-repair
            namespace: default
        roleBindings:
          lldap-repair:
            name: lldap-repair
            namespace: default
        roles:
          lldap-repair:
            name: lldap-repair
            namespace: default
        serviceAccounts:
          lldap-repair:
            name: lldap-repair
            namespace: default
    resources:
      configMaps:
        lldap-config:
          data:
            lldap_config.toml: |-
              # verbose = false
              http_url = "https://lldap.test.com"
              database_url = "postgres://"
              ldap_base_dn = "dc=test,dc=com"
              key_file = ""

              [ldap_options]
              enable_samba = true

              [ldaps_options]
              enabled=true
              key_file="/cert/tls.key"
              cert_file="/cert/tls.crt"
      deployments:
        lldap:
          template:
            spec:
              containers:
                lldap:
                  env:
                    PGDATABASE: app
                    PGHOST: lldap-postgresql-rw
                    PGSSLCERT: /dbcert/tls.crt
                    PGSSLKEY: /dbcert/tls.key
                    PGSSLMODE: verify-full
                    PGSSLROOTCERT: /dbcert/ca.crt
                    PGUSER: app
                    TZ: europe/paris
                  envFrom:
                    generated:
                      secretRef:
                        name: lldap-generated
                    lldap:
                      secretRef:
                        name: lldap
                  image: lldap/lldap:2026-09-22-debian-rootless
                  name: lldap
                  ports:
                    http:
                      containerPort: 17170
                    ldaps:
                      containerPort: 6360
                  probe:
                    httpGet:
                      path: /
                  startupProbe:
                    failureThreshold: 60
                  volumeMounts:
                    cert:
                      mountPath: /cert
                      name: cert
                      readOnly: true
                    data:
                      mountPath: /data
                      name: data
                    dbcert:
                      mountPath: /dbcert
                      name: dbcert
                      readOnly: true
              securityContext:
                runAsGroup: 1000
                runAsUser: 1000
              volumes:
                cert:
                  name: cert
                  secret:
                    secretName: ref:tls-lldaps
                data:
                  configMap:
                    name: ref:lldap-config
                  name: data
                dbcert:
                  name: dbcert
                  secret:
                    secretName: lldap-postgresql-app-tls
      services:
        lldap:
          ports:
            http:
              port: 17170
            ldaps:
              port: 6360
