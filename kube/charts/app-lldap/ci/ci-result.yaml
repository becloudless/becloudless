---
# Source: app-lldap/templates/loader.yaml
apiVersion: v1
data:
  lldap_config.toml: |-
    # verbose = false
    http_url = "https://lldap.test.com"
    database_url = "postgres://"
    ldap_base_dn = "dc=test,dc=com"

    [ldap_options]
    enable_samba = true

    [ldaps_options]
    enabled=true
    key_file="/cert/tls.key"
    cert_file="/cert/tls.crt"
kind: ConfigMap
metadata:
  name: lldap-config
  namespace: lldap
---
# Source: app-lldap/templates/loader.yaml
apiVersion: v1
kind: Service
metadata:
  name: lldap
  namespace: lldap
spec:
  ports:
  - name: http
    port: 17170
  - name: ldaps
    port: 6360
  selector:
    app.kubernetes.io/name: lldap
---
# Source: app-lldap/templates/loader.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
  namespace: lldap
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lldap
    spec:
      containers:
      - env:
        - name: PGDATABASE
          value: app
        - name: PGHOST
          value: lldap-postgresql-rw
        - name: PGSSLCERT
          value: /dbcert/tls.crt
        - name: PGSSLKEY
          value: /dbcert/tls.key
        - name: PGSSLMODE
          value: verify-full
        - name: PGSSLROOTCERT
          value: /dbcert/ca.crt
        - name: PGUSER
          value: app
        - name: TZ
          value: europe/paris
        envFrom:
        - secretRef:
            name: lldap-generated
        image: lldap/lldap:2026-09-22-debian-rootless
        livenessProbe:
          httpGet:
            path: /
            port: 17170
        name: lldap
        ports:
        - containerPort: 17170
          name: http
        - containerPort: 6360
          name: ldaps
        readinessProbe:
          httpGet:
            path: /
            port: 17170
        startupProbe:
          httpGet:
            path: /
            port: 17170
        volumeMounts:
        - mountPath: /cert
          name: cert
          readOnly: true
        - mountPath: /data
          name: data
        - mountPath: /dbcert
          name: dbcert
          readOnly: true
      securityContext:
        runAsGroup: 1000
        runAsUser: 1000
      volumes:
      - name: cert
        secret:
          secretName: tls-lldaps
      - configMap:
          name: lldap-config
        name: data
      - name: dbcert
        secret:
          secretName: lldap-postgresql-app-tls
---
# Source: app-lldap/templates/loader.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lldap-gateway
  namespace: lldap
spec:
  dnsNames:
  - lldap.test.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: tls-lldap-gateway
---
# Source: app-lldap/templates/loader.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-lldaps
  namespace: lldap
spec:
  dnsNames:
  - lldaps.test.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: tls-lldaps
---
# Source: app-lldap/templates/loader.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lldap
  namespace: lldap
spec:
  hostnames:
  - lldap.test.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: lldap
    sectionName: https
  rules:
  - backendRefs:
    - name: lldap
      port: 17170
---
# Source: app-lldap/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap-postgresql
  namespace: lldap
spec:
  chart:
    spec:
      chart: ./kube/charts/postgresql-cluster
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: bcl
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    clientCertAuth: true
    postgresql:
      parameters:
        max_slot_wal_keep_size: 500MB
---
# Source: app-lldap/templates/loader.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: lldap
  namespace: lldap
spec:
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    hostname: lldap.test.com
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - name: tls-lldap-gateway
      mode: Terminate
  - allowedRoutes:
      namespaces:
        from: Same
    hostname: lldaps.test.com
    name: ldaps
    port: 443
    protocol: TLS
    tls:
      mode: Passthrough
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shared
    namespace: kube-system
---
# Source: app-lldap/templates/loader.yaml
apiVersion: secretgenerator.mittwald.de/v1alpha1
kind: StringSecret
metadata:
  name: lldap-generated
  namespace: lldap
spec:
  fields:
  - fieldName: LLDAP_JWT_SECRET
  - fieldName: LLDAP_LDAP_USER_DN
  - fieldName: LLDAP_LDAP_USER_PASS
---
# Source: app-lldap/templates/loader.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: lldap-ldaps
  namespace: lldap
spec:
  hostnames:
  - lldaps.test.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: lldap
    sectionName: ldaps
  rules:
  - backendRefs:
    - name: lldap
      port: 6360
