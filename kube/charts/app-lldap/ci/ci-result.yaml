# Source: app-lldap/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap-postgresql
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/postgresql-cluster
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-cnpg
    namespace: cnpg-system
  - name: app-longhorn
    namespace: longhorn-system
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    clientCertAuth: true
    postgresql:
      parameters:
        max_slot_wal_keep_size: 500MB
