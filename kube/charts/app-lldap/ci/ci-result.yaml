apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  - name: lldap-post
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      certManagerCertificates:
        lldap-gateway:
          dnsNames:
            lldap: lldap.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-lldap-gateway
      httpRoutes:
        lldap:
          hostnames:
            lldap: lldap.test.com
          parentRefs:
            lldap:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: lldap
              sectionName: https
          rules:
            root:
              backendRefs:
                lldap:
                  name: lldap
                  port: 17170
      listenerSets:
        lldap:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: lldap.test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-lldap-gateway
                mode: Terminate
            ldaps:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: lldaps.test.com
              name: ldaps
              port: 443
              protocol: TLS
              tls:
                mode: Passthrough
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
      tlsRoutes:
        lldap-ldaps:
          hostnames:
            lldaps: lldaps.test.com
          parentRefs:
            lldap:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: lldap
              sectionName: ldaps
          rules:
            ldaps:
              backendRefs:
                lldap:
                  name: lldap
                  port: 6360
