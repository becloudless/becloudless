# Source: app-lldap/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap-pre
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-secret-generator
    namespace: secret-generator
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    resources:
      certManagerCertificates:
        tls-lldaps:
          dnsNames:
            lldaps: lldaps.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-lldaps
      stringSecrets:
        lldap-generated:
          fields:
            jwt-secret:
              fieldName: LLDAP_JWT_SECRET
            key-seed:
              fieldName: LLDAP_KEY_SEED
            user-dn:
              fieldName: LLDAP_LDAP_USER_DN
            user-pass:
              fieldName: LLDAP_LDAP_USER_PASS
