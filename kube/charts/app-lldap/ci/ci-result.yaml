apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lldap
  namespace: default
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        cnpg.io/cluster: lldap-postgresql
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: lldap
      app.kubernetes.io/instance: lldap
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/name: authelia
        k8s:io.kubernetes.pod.namespace: authelia
    toPorts:
    - ports:
      - port: "6360"
        protocol: TCP
  - fromEndpoints:
    - matchExpressions:
      - key: job-name
        operator: Exists
    toPorts:
    - ports:
      - port: "17170"
        protocol: TCP
  - fromEntities:
    - ingress
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "17170"
        protocol: TCP
      - port: "6360"
        protocol: TCP
