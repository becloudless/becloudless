  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-secret-generator
    namespace: secret-generator
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      certManagerCertificates:
        tls-lldaps:
          dnsNames:
            lldaps: lldaps.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-lldaps
      roleBindings:
        authelia-secrets-reader:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: authelia-secrets-reader
          subjects:
            lldap-reader:
              kind: ServiceAccount
              name: lldap-reader
              namespace: authelia
