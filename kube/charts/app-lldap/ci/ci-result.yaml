apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap-post
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: lldap
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      configMaps:
        lldap-bootstrap:
          data:
            groups.json: |-
              {"name":"role_admin"}
              {"name":"role_user"}
              {"name":"role_editor"}
              {"name":"app_forgejo"}
              {"name":"app_immich"}
              {"name":"app_immich_one_factor"}
              {"name":"app_jellyfin"}
              {"name":"app_paperless"}
              {"name":"app_pushprox"}
              {"name":"app_seafile"}
              {"name":"app_seerr"}
              {"name":"app_syncthing"}
              {"name":"app_tuwunel"}
            users-schema.json: '[{"attributeType":"INTEGER","isEditable":false,"isList":false,"isVisible":true,"name":"immichquota"},{"attributeType":"STRING","isEditable":false,"isList":false,"isVisible":true,"name":"immichrole"}]'
            users.json: |-
              {"displayName":"Authelia","email":"authelia@test.com","groups":["lldap_password_manager","lldap_strict_readonly"],"id":"authelia","password_file":"/secrets/authelia/password"}
              {"email":"guest@test.com","id":"guest"}
              {"displayName":"n0rad","email":"n0rad@test.com","groups":["role_admin","role_user"],"id":"n0rad","immichquota":45,"immichrole":"admin"}
      jobs:
        lldap-bootstrap:
          activeDeadlineSeconds: 600
          backoffLimit: 0
          fullNameOverride: lldap-bootstrap-31917e4614
          template:
            spec:
              containers:
                bootstrap:
                  args:
                  - -c
                  - |-
                    mkdir /tmp/{groups,users,users-schema}
                    cp /setup/groups.json /tmp/groups
                    cp /setup/users-schema.json /tmp/users-schema
                    cp /setup/users.json /tmp/users
                    export USER_CONFIGS_DIR=/tmp/users
                    export USER_SCHEMAS_DIR=/tmp/users-schema
                    export GROUP_CONFIGS_DIR=/tmp/groups
                    /app/bootstrap.sh
                  command:
                  - /usr/bin/env
                  - bash
                  env:
                    DO_CLEANUP: "true"
                    LLDAP_ADMIN_PASSWORD:
                      secretKeyRef:
                        key: LLDAP_LDAP_USER_PASS
                        name: lldap-generated
                    LLDAP_ADMIN_USERNAME:
                      secretKeyRef:
                        key: LLDAP_LDAP_USER_DN
                        name: lldap-generated
                    LLDAP_URL: http://lldap:17170
                  image: lldap/lldap:2026-09-22-debian-rootless
                  name: bootstrap
                  volumeMounts:
                    authelia:
                      mountPath: /secrets/authelia
                      name: authelia
                      readOnly: true
                    setup:
                      mountPath: /setup
                      name: setup
                      readOnly: true
              restartPolicy: Never
              securityContext:
                runAsGroup: 1000
                runAsUser: 1000
              volumes:
                authelia:
                  name: authelia
                  secret:
                    secretName: lldap-authelia
                setup:
                  configMap:
                    name: lldap-bootstrap
                  name: setup
