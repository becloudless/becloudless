              - lldap-authelia
              resources:
              - secrets
              verbs:
              - get
      stringSecrets:
        lldap:
          fields:
            key-seed:
              fieldName: LLDAP_KEY_SEED
        lldap-authelia:
          fields:
            password: {}
        lldap-generated:
          fields:
            jwt-secret:
              fieldName: LLDAP_JWT_SECRET
