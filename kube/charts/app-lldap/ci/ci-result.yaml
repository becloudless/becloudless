# Source: app-lldap/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: lldap-postgresql
  - name: lldap-pre
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      configMaps:
        lldap-config:
          data:
            lldap_config.toml: |-
              # verbose = false
              http_url = "https://lldap.test.com"
              database_url = "postgres://"
              ldap_base_dn = "dc=test,dc=com"
              key_file = ""

              [ldap_options]
              enable_samba = true

              [ldaps_options]
              enabled=true
              key_file="/cert/tls.key"
              cert_file="/cert/tls.crt"
      deployments:
        lldap:
          template:
            spec:
              containers:
                lldap:
                  env:
                    PGDATABASE: app
                    PGHOST: lldap-postgresql-rw
                    PGSSLCERT: /dbcert/tls.crt
                    PGSSLKEY: /dbcert/tls.key
                    PGSSLMODE: verify-full
                    PGSSLROOTCERT: /dbcert/ca.crt
                    PGUSER: app
                    TZ: europe/paris
                  envFrom:
                    generated:
                      secretRef:
                        name: lldap-generated
                    lldap:
                      secretRef:
                        name: lldap
                  image: lldap/lldap:2026-09-22-debian-rootless
                  livenessProbe:
                    httpGet:
                      path: /
                      port: 17170
                  name: lldap
                  ports:
                    http:
                      containerPort: 17170
                    ldaps:
                      containerPort: 6360
                  readinessProbe:
                    httpGet:
                      path: /
                      port: 17170
                  startupProbe:
                    failureThreshold: 60
                    httpGet:
                      path: /
                      port: 17170
                  volumeMounts:
                    cert:
                      mountPath: /cert
                      name: cert
                      readOnly: true
                    data:
                      mountPath: /data
                      name: data
                    dbcert:
                      mountPath: /dbcert
                      name: dbcert
                      readOnly: true
              securityContext:
                runAsGroup: 1000
                runAsUser: 1000
              volumes:
                cert:
                  name: cert
                  secret:
                    secretName: tls-lldaps
                data:
                  configMap:
                    name: lldap-config
                  name: data
                dbcert:
                  name: dbcert
                  secret:
                    secretName: lldap-postgresql-app-tls
      services:
        lldap:
          ports:
            http:
              port: 17170
            ldaps:
              port: 6360
