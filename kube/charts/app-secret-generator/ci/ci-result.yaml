---
# Source: app-secret-generator/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: secret-generator
  namespace: default
spec:
  egress:
  - toEntities:
    - kube-apiserver
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-secret-generator
---
# Source: app-secret-generator/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: secret-generator
  namespace: default
spec:
  chart:
    spec:
      chart: kubernetes-secret-generator
      sourceRef:
        kind: HelmRepository
        name: secret-generator
      version: 3.4.1
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 60m
  timeout: 1m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    args:
    - --secret-encoding=hex
    image:
      registry: ghcr.io
      repository: becloudless/secret-generator
      tag: 1.261018.1316
    podSecurityContext:
      runAsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534
    secretLength: 100
    securityContext:
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
---
# Source: app-secret-generator/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: secret-generator
  namespace: default
spec:
  interval: 10m
  url: https://helm.mittwald.de
