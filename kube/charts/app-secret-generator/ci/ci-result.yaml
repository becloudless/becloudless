---
# Source: app-secret-generator/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: secret-generator
  namespace: default
spec:
  egress:
  - toEntities:
    - kube-apiserver
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-secret-generator
---
# Source: app-secret-generator/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: secret-generator
  namespace: default
spec:
  chart:
    spec:
      chart: kubernetes-secret-generator
      sourceRef:
        kind: HelmRepository
        name: secret-generator
      version: 3.4.1
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 60m
  timeout: 1m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    image:
      registry: ghcr.io
      repository: becloudless/secret-generator
      tag: 1.261018.1316
    secretLength: 100
---
# Source: app-secret-generator/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: secret-generator
  namespace: default
spec:
  interval: 10m
  url: https://helm.mittwald.de
