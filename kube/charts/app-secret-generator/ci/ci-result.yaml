---
# Source: app-secret-generator/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: secret-generator
  namespace: secret-generator
spec:
  chart:
    spec:
      chart: kubernetes-secret-generator
      sourceRef:
        kind: HelmRepository
        name: secret-generator
      version: 3.4.1
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 60m
  rollback:
    cleanupOnFail: true
  timeout: 1m
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      registry: ghcr.io
      repository: becloudless/secret-generator
      tag: 1.261018.1316
    secretLength: 100
