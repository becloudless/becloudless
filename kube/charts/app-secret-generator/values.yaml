# yaml-language-server: $schema=../base/schema/values.schema.json

resources:
  fluxHelmRepositories:
    secret-generator:
      url: https://helm.mittwald.de

  ciliumNetworkPolicies:
    secret-generator:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: kubernetes-secret-generator}
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]

  fluxHelmReleases:
    secret-generator:
      interval: 60m
      timeout: 1m
      chart:
        spec:
          chart: kubernetes-secret-generator
          version: 3.4.1
          sourceRef:
            kind: HelmRepository
            name: secret-generator
      values:
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop: [ALL]
        secretLength: 100
        args:
          - --secret-encoding=hex
        # upstream only publishes amd64, this one is built for amd64 and arm64 from docker/misc/secret-generator
        image: 
          registry: ghcr.io
          repository: becloudless/secret-generator
          tag: 1.261018.1316
