# yaml-language-server: $schema=../base/schema/values.schema.json

defaults:
  metadata:
    namespace: secret-generator

resources:
  namespaces:
    secret-generator:
      fullNameOverride: secret-generator

  fluxHelmRepositories:
    secret-generator:
      fullNameOverride: secret-generator
      url: https://helm.mittwald.de

  fluxHelmReleases:
    secret-generator:
      fullNameOverride: secret-generator
      interval: 60m
      timeout: 1m
      chart:
        spec:
          chart: kubernetes-secret-generator
          version: 3.4.1
          sourceRef:
            kind: HelmRepository
            name: secret-generator
      values:
        secretLength: 100
        image: # upstream only publishes amd64, this one is built for amd64 and arm64 from docker/misc/secret-generator
          registry: ghcr.io
          repository: becloudless/secret-generator
          tag: latest # TODO pin to the generated version once the image is published
