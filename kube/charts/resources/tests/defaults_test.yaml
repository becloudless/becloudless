# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: defaults merging per kind
templates:
  - loader.yaml
release:
  name: test-release
  namespace: default
tests:
  - it: applies defaults.resources.<kind> when the resource does not set the field itself
    set:
      defaults:
        resources:
          configMaps:
            labels:
              app: shared-default
              team: platform
      resources:
        configMaps:
          usesDefaultOnly:
            data:
              key: value1
    asserts:
      - equal:
          path: metadata.labels
          value:
            app: shared-default
            team: platform

  - it: lets the resource's own field override the default for that same key
    set:
      defaults:
        resources:
          configMaps:
            labels:
              app: shared-default
              team: platform
      resources:
        configMaps:
          overridesDefault:
            labels:
              app: custom-app
            data:
              key: value2
    asserts:
      - equal:
          path: metadata.labels
          value:
            app: custom-app
            team: platform
