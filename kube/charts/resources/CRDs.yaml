# contentIsSpec: false -> the resource's values are merged directly at the root
#                         of the manifest (e.g. ConfigMap's data/binaryData).
# contentIsSpec: true  -> the resource's values are wrapped under a `spec:` key
#                         in the manifest (e.g. HorizontalPodAutoscaler, Service).
#                         This is the default when contentIsSpec is omitted,
#                         since most k8s resources use a spec: field.
crds:
  configMaps:
    url: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/configmap.json
    apiVersion: v1
    kind: ConfigMap
    contentIsSpec: false
  secrets:
    url: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/secret.json
    apiVersion: v1
    kind: Secret
    contentIsSpec: false
  horizontalPodAutoscalers:
    url: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/horizontalpodautoscaler-autoscaling-v2.json
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
  services:
    url: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone/service-v1.json
    apiVersion: v1
    kind: Service
