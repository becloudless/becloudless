apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr-pre
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: authelia-pre
    namespace: authelia
  - name: app-external-secrets
    namespace: external-secrets
  - name: jellyfin-pre
    namespace: jellyfin
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      externalSecrets:
        seerr-jellyfin:
          data:
            password:
              remoteRef:
                key: jellyfin-admin
                property: password
              secretKey: password
          refreshInterval: 1h
          secretStoreRef:
            kind: SecretStore
            name: jellyfin
        seerr-oidc:
          data:
            client-id:
              remoteRef:
                key: authelia-oidc-seerr
                property: client-id
              secretKey: client-id
            secret:
              remoteRef:
                key: authelia-oidc-seerr
                property: secret
              secretKey: secret
          refreshInterval: 1h
          secretStoreRef:
            kind: SecretStore
            name: authelia
      secretStores:
        authelia:
          provider:
            kubernetes:
              auth:
                serviceAccount:
                  name: authelia-reader
              remoteNamespace: authelia
              server:
                caProvider:
                  key: ca.crt
                  name: kube-root-ca.crt
                  type: ConfigMap
        jellyfin:
          provider:
            kubernetes:
              auth:
                serviceAccount:
                  name: jellyfin-reader
              remoteNamespace: jellyfin
              server:
                caProvider:
                  key: ca.crt
                  name: kube-root-ca.crt
                  type: ConfigMap
      serviceAccounts:
        authelia-reader:
          automountServiceAccountToken: false
        jellyfin-reader:
          automountServiceAccountToken: false
