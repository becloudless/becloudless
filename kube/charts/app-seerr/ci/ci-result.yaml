# Source: app-seerr/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: seerr-postgresql
  - name: seerr-pre
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      deployments:
        seerr:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: seerr
          strategy:
            type: Recreate
          template:
            metadata:
              labels:
                app.kubernetes.io/name: seerr
            spec:
              containers:
                seerr:
                  env:
                    DB_HOST: seerr-postgresql-rw
                    DB_NAME: app
                    DB_PASS:
                      secretKeyRef:
                        key: password
                        name: seerr-postgresql-app
                    DB_PORT: "5432"
                    DB_SSL_REJECT_UNAUTHORIZED: "false"
                    DB_TYPE: postgres
                    DB_USE_SSL: "true"
                    DB_USER: app
                    TZ: Europe/Paris
                  image: ghcr.io/seerr-team/seerr:preview-new-oidc@sha256:28744b1ced522beb7af8e5c966b73c6e46b1dc2c4c8cb497ad2f12d3139699a3
                  livenessProbe:
                    httpGet:
                      path: /api/v1/settings/public
                      port: 5055
                    periodSeconds: 15
                    timeoutSeconds: 3
                  name: seerr
                  ports:
                    http:
                      containerPort: 5055
                  readinessProbe:
                    httpGet:
                      path: /api/v1/settings/public
                      port: 5055
                    periodSeconds: 15
                    timeoutSeconds: 3
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        all: ALL
                    runAsGroup: 1000
                    runAsNonRoot: true
                    runAsUser: 1000
                    seccompProfile:
                      type: RuntimeDefault
                  startupProbe:
                    failureThreshold: 30
                    httpGet:
                      path: /api/v1/settings/public
                      port: 5055
                    periodSeconds: 10
                  volumeMounts:
                    config:
                      mountPath: /app/config
                      name: config
              initContainers:
                oidc:
                  args:
                  - |-
                    const fs = require('fs');
                    const file = '/app/config/settings.json';
                    if (!fs.existsSync(file)) {
                      console.log('no settings.json yet, restart the deployment once seerr has started');
                      process.exit(0);
                    }
                    const settings = JSON.parse(fs.readFileSync(file, 'utf8'));
                    settings.main = settings.main || {};
                    settings.main.oidcLogin = true;
                    settings.main.applicationUrl = process.env.APP_URL; // the redirect uri of the login
                    settings.network = settings.network || {};
                    settings.network.trustProxy = true; // behind the gateway
                    settings.oidc = {
                      providers: [{
                        slug: 'authelia',
                        name: 'Authelia',
                        issuerUrl: process.env.ISSUER_URL,
                        clientId: 'seerr',
                        clientSecret: process.env.CLIENT_SECRET,
                        scopes: 'openid profile email',
                        newUserLogin: true,
                      }],
                    };
                    fs.writeFileSync(file + '.tmp', JSON.stringify(settings, null, 1));
                    fs.renameSync(file + '.tmp', file);
                  command:
                  - node
                  - -e
                  env:
                    APP_URL: https://seerr.test.com
                    CLIENT_SECRET:
                      secretKeyRef:
                        key: secret
                        name: seerr-oidc
                    ISSUER_URL: https://authelia.test.com
                  image: ghcr.io/seerr-team/seerr:preview-new-oidc@sha256:28744b1ced522beb7af8e5c966b73c6e46b1dc2c4c8cb497ad2f12d3139699a3
                  name: oidc
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        all: ALL
                    readOnlyRootFilesystem: true
                    runAsGroup: 1000
                    runAsNonRoot: true
                    runAsUser: 1000
                    seccompProfile:
                      type: RuntimeDefault
                  volumeMounts:
                    config:
                      mountPath: /app/config
                      name: config
              securityContext:
                fsGroup: 1000
                fsGroupChangePolicy: OnRootMismatch
              volumes:
                config:
                  name: config
                  persistentVolumeClaim:
                    claimName: seerr-config
      persistentVolumeClaims:
        seerr-config:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: longhorn
      services:
        seerr:
          ports:
            http:
              port: 5055
          selector:
            app.kubernetes.io/name: seerr
