---
# Source: app-seerr/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: seerr
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: seerr
  ingress:
  - fromEntities:
    - host
    - ingress
    - remote-node
    toPorts:
    - ports:
      - port: "5055"
        protocol: TCP
---
# Source: app-seerr/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      deployments:
        seerr:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: seerr
          strategy:
            type: Recreate
          template:
            metadata:
              labels:
                app.kubernetes.io/name: seerr
            spec:
              containers:
                seerr:
                  env:
                    TZ: Europe/Paris
                  image: ghcr.io/seerr-team/seerr:v3.5.0
                  livenessProbe:
                    httpGet:
                      path: /api/v1/settings/public
                      port: 5055
                    periodSeconds: 15
                    timeoutSeconds: 3
                  name: seerr
                  ports:
                    http:
                      containerPort: 5055
                  readinessProbe:
                    httpGet:
                      path: /api/v1/settings/public
                      port: 5055
                    periodSeconds: 15
                    timeoutSeconds: 3
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        all: ALL
                    runAsGroup: 1000
                    runAsNonRoot: true
                    runAsUser: 1000
                    seccompProfile:
                      type: RuntimeDefault
                  startupProbe:
                    failureThreshold: 30
                    httpGet:
                      path: /api/v1/settings/public
                      port: 5055
                    periodSeconds: 10
                  volumeMounts:
                    config:
                      mountPath: /app/config
                      name: config
              securityContext:
                fsGroup: 1000
                fsGroupChangePolicy: OnRootMismatch
              volumes:
                config:
                  name: config
                  persistentVolumeClaim:
                    claimName: seerr-config
      persistentVolumeClaims:
        seerr-config:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: longhorn
      services:
        seerr:
          ports:
            http:
              port: 5055
          selector:
            app.kubernetes.io/name: seerr
---
# Source: app-seerr/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  - name: seerr
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      certManagerCertificates:
        seerr-gateway:
          dnsNames:
            seerr: seerr.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-seerr-gateway
      httpRoutes:
        seerr:
          hostnames:
            seerr: seerr.test.com
          parentRefs:
            seerr:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: seerr
          rules:
            root:
              backendRefs:
                seerr:
                  name: seerr
                  port: 5055
              filters:
                authelia:
                  externalAuth:
                    backendRef:
                      name: authelia
                      namespace: authelia
                      port: 80
                    http:
                      allowedHeaders:
                        accept: accept
                        cookie: cookie
                        proxy-authorization: proxy-authorization
                        x-forwarded-for: x-forwarded-for
                        x-forwarded-proto: x-forwarded-proto
                      allowedResponseHeaders:
                        remote-email: remote-email
                        remote-groups: remote-groups
                        remote-name: remote-name
                        remote-user: remote-user
                      path: /api/authz/ext-authz/
                    protocol: HTTP
                  type: ExternalAuth
      listenerSets:
        seerr:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: seerr.test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-seerr-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
