apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: seerr
  namespace: default
spec:
  egress:
  - toFQDNs:
    - matchName: authelia.test.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEntities:
    - ingress
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/component: jellyfin
        k8s:app.kubernetes.io/instance: jellyfin
        k8s:io.kubernetes.pod.namespace: jellyfin
    toPorts:
    - ports:
      - port: "8096"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        cnpg.io/cluster: seerr-postgresql
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  - toFQDNs:
    - matchName: api.themoviedb.org
    - matchName: image.tmdb.org
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toFQDNs:
    - matchName: api4.thetvdb.com
    - matchName: artworks.thetvdb.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: seerr
      app.kubernetes.io/instance: seerr
  ingress:
  - fromEntities:
    - ingress
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "5055"
        protocol: TCP
