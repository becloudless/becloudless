apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  - name: seerr
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      certManagerCertificates:
        seerr-gateway:
          dnsNames:
            seerr: seerr.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-seerr-gateway
      httpRoutes:
        seerr:
          hostnames:
            seerr: seerr.test.com
          parentRefs:
            seerr:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: seerr
          rules:
            root:
              backendRefs:
                seerr:
                  name: seerr
                  port: 5055
      listenerSets:
        seerr:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: seerr.test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-seerr-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
