# yaml-language-server: $schema=../app/schema/values.schema.json

# Nothing has to be done in the web UI: seerr has no way to be configured by environment, so the `configure` init container writes
# `settings.json` (created if missing) at each start, the setup wizard is skipped:
#  - jellyfin (`jellyfin.jellyfin:8096`) is the media server. Its `admin` password is copied in `seerr-jellyfin` by external-secrets,
#    an API key `Seerr` is created, and the libraries are enabled. If jellyfin is not ready at the start, it is left as it was
#    (restart the deployment once it is).
#  - SSO with Authelia: the users are created at their first login from their email, with the default permissions (an existing user
#    with the same email has to link its account in its profile, `Linked Accounts`).
#  - the `admin` container creates the administrator of seerr once, from the jellyfin one (the first user of seerr is its administrator),
#    then turns the password and jellyfin logins off: only the Authelia login is left. The administrator account can not sign in anymore,
#    give the administrator permissions to your Authelia user (created at its first login, `Users`) with the API key of seerr
#    (`main.apiKey` of `/app/config/settings.json`): `PUT /api/v1/user` with `{"ids": [<id>], "permissions": 2}` and the header `X-Api-Key`.
# The OIDC support is not released yet: it is the preview image of the pull request https://github.com/seerr-team/seerr/pull/2715
# (pinned by digest, the tag is moved by its authors). Go back to a release (and to the `oidc` settings of its UI) once it is released.

resources:

  ciliumNetworkPolicies:
    seerr:
      endpointSelector: ref:seerr
      ingress:
        gateway:
          fromEntities: [ingress, host, remote-node]
          toPorts: [5055]
      egress:
        postgresql:
          toEndpoints:
            postgresql:
              matchLabels: {cnpg.io/cluster: seerr-postgresql}
          toPorts: [5432]
        authelia: # the OIDC issuer is the public address of authelia
          toFQDNs:
            authelia: {matchName: "authelia.{{ .Values.app.domain }}"}
          toPorts: [443]
        gateway: # the public addresses of the cluster are the gateway for the pods (jellyfin by its public address)
          toEntities: [ingress]
          toPorts: [443]
        jellyfin: # jellyfin by its service (`jellyfin.jellyfin:8096`)
          toEndpoints:
            jellyfin:
              matchLabels: {"k8s:io.kubernetes.pod.namespace": jellyfin, "k8s:app.kubernetes.io/instance": jellyfin, "k8s:app.kubernetes.io/component": jellyfin}
          toPorts: [8096]
        tmdb: # the metadata (api) and the posters (images, when the image cache is enabled)
          toFQDNs:
            api: {matchName: api.themoviedb.org}
            images: {matchName: image.tmdb.org}
          toPorts: [443]
        tvdb: # the metadata of the series and the animes when the provider is TheTVDB
          toFQDNs:
            api: {matchName: api4.thetvdb.com}
            artworks: {matchName: artworks.thetvdb.com}
          toPorts: [443]

  fluxHelmReleases:
    seerr-postgresql:
      values:
        instances: "{{ .Values.app.scaling.dbReplicas }}"
        clients:
          seerr:
            matchLabels: {app.kubernetes.io/instance: seerr, app.kubernetes.io/component: seerr}
      dependsOn:
        - name: app-cert-manager
          namespace: cert-manager
        - name: app-cnpg
          namespace: cnpg-system
        - name: app-longhorn
          namespace: longhorn-system
      chart:
        spec:
          chart: ./kube/charts/postgresql

    seerr-pre:
      dependsOn:
        - name: app-external-secrets
          namespace: external-secrets
        - name: jellyfin-pre # the generated password of the administrator and the right to read it
          namespace: jellyfin
      values:
        resources:
          serviceAccounts:
            jellyfin-reader:
              automountServiceAccountToken: false

          secretStores:
            jellyfin:
              provider:
                kubernetes:
                  remoteNamespace: jellyfin
                  server:
                    caProvider:
                      type: ConfigMap
                      name: kube-root-ca.crt
                      key: ca.crt
                  auth:
                    serviceAccount:
                      name: ref:jellyfin-reader

          externalSecrets:
            # password of the `admin` user of jellyfin, generated by the jellyfin chart
            seerr-jellyfin:
              refreshInterval: 1h
              secretStoreRef: ref:jellyfin
              data:
                password:
                  secretKey: password
                  remoteRef:
                    key: jellyfin-admin
                    property: password

    seerr:
      dependsOn:
        - ref:seerr-postgresql
        - ref:seerr-pre
      values:
        resources:
          persistentVolumeClaims:
            seerr-config:
              storageClassName: longhorn-files
              resources:
                requests:
                  storage: 5Gi

          configMaps:
            seerr-scripts:
              data:
                # writes the settings of seerr (jellyfin, OIDC, setup done) before it starts, see the header of this file
                configure.js: |
                  const fs = require('fs');
                  const env = process.env;
                  const file = '/app/config/settings.json';
                  const marker = '/app/config/.admin-created';
                  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

                  const header = (token) =>
                    'MediaBrowser Client="Seerr", Device="Seerr", DeviceId="seerr-configure", Version="1.0"' +
                    (token ? ', Token="' + token + '"' : '');

                  async function jellyfin(method, path, body, token) {
                    const res = await fetch(env.JELLYFIN_URL + path, {
                      method: method,
                      headers: { Authorization: header(token), 'Content-Type': 'application/json', Accept: 'application/json' },
                      body: body === undefined ? undefined : JSON.stringify(body),
                      signal: AbortSignal.timeout(15000),
                    });
                    if (!res.ok) throw new Error(method + ' ' + path + ': ' + res.status);
                    const text = await res.text();
                    return text ? JSON.parse(text) : undefined;
                  }

                  async function configureJellyfin(settings) {
                    let info;
                    for (let i = 0; i < 60 && !(info && info.StartupWizardCompleted); i++) { // 5 minutes
                      try {
                        info = await jellyfin('GET', '/System/Info/Public');
                        if (info.StartupWizardCompleted) break;
                        console.log('waiting for the setup wizard of jellyfin');
                      } catch (e) {
                        console.log('waiting for jellyfin: ' + e.message);
                      }
                      await sleep(5000);
                    }
                    if (!info || !info.StartupWizardCompleted) {
                      console.log('jellyfin is not ready, its settings are left as they are');
                      return;
                    }

                    const login = await jellyfin('POST', '/Users/AuthenticateByName', { Username: env.JELLYFIN_USER, Pw: env.JELLYFIN_PASSWORD });
                    const keys = async () => (await jellyfin('GET', '/Auth/Keys', undefined, login.AccessToken)).Items.filter((k) => k.AppName === 'Seerr');
                    let found = await keys();
                    if (found.length === 0) {
                      await jellyfin('POST', '/Auth/Keys?App=Seerr', undefined, login.AccessToken);
                      found = await keys();
                    }
                    const apiKey = found[found.length - 1].AccessToken;

                    const known = new Map((((settings.jellyfin || {}).libraries) || []).map((l) => [l.id, l]));
                    const excluded = ['music', 'books', 'musicvideos', 'homevideos', 'boxsets'];
                    const folders = await jellyfin('GET', '/Library/MediaFolders', undefined, apiKey);
                    const libraries = folders.Items
                      .filter((f) => f.Type === 'CollectionFolder' && !excluded.includes(f.CollectionType))
                      .map((f) => ({
                        id: f.Id,
                        name: f.Name,
                        type: f.CollectionType === 'movies' ? 'movie' : 'show',
                        enabled: known.has(f.Id) ? known.get(f.Id).enabled : true,
                      }));

                    // The first login (`admin.js`) gives the address itself and seerr refuses it when it is already set: it stays empty
                    // until the administrator is created (an existing seerr already has its address).
                    const keepIp = fs.existsSync(marker) || !!(settings.jellyfin && settings.jellyfin.ip);
                    settings.main.mediaServerType = 2; // jellyfin
                    settings.jellyfin = Object.assign({}, settings.jellyfin, {
                      name: info.ServerName,
                      ip: keepIp ? env.JELLYFIN_HOST : '',
                      port: Number(env.JELLYFIN_PORT),
                      useSsl: false,
                      urlBase: '',
                      externalHostname: env.JELLYFIN_EXTERNAL_URL,
                      serverId: info.Id,
                      apiKey: apiKey,
                      libraries: libraries,
                    });
                    settings.public = Object.assign({}, settings.public, { initialized: true }); // no setup wizard
                    console.log('jellyfin configured, ' + libraries.length + ' libraries');
                  }

                  (async () => {
                    const settings = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {};
                    settings.main = settings.main || {};
                    // the values the settings migrations of seerr set when they are missing
                    if (settings.main.discoverRegion === undefined) settings.main.discoverRegion = '';
                    if (settings.main.streamingRegion === undefined) settings.main.streamingRegion = '';

                    try {
                      await configureJellyfin(settings);
                    } catch (e) {
                      console.log('jellyfin is not configured: ' + e.message);
                    }

                    settings.main.oidcLogin = true;
                    // Only the SSO login is left once the administrator exists (`admin.js` needs the jellyfin login to create it, and
                    // turns the others off right after). No password, no jellyfin login, and no new user from jellyfin (quick connect).
                    if (fs.existsSync(marker)) {
                      settings.main.localLogin = false;
                      settings.main.mediaServerLogin = false;
                      settings.main.newPlexLogin = false;
                    }
                    settings.main.applicationUrl = env.APP_URL; // the redirect uri of the login
                    settings.network = settings.network || {};
                    settings.network.trustProxy = true; // behind the gateway
                    settings.oidc = {
                      providers: [{
                        slug: 'authelia',
                        name: 'Authelia',
                        issuerUrl: env.ISSUER_URL,
                        clientId: env.CLIENT_ID,
                        clientSecret: env.CLIENT_SECRET,
                        scopes: 'openid profile email',
                        newUserLogin: true,
                      }],
                    };

                    fs.writeFileSync(file + '.tmp', JSON.stringify(settings, null, 1));
                    fs.renameSync(file + '.tmp', file);
                  })().catch((e) => {
                    console.error(e);
                    process.exit(1);
                  });

                # creates the administrator of seerr, once, from the administrator of jellyfin (the first user is the administrator)
                admin.js: |
                  const fs = require('fs');
                  const env = process.env;
                  const marker = '/app/config/.admin-created';
                  const api = 'http://127.0.0.1:5055/api/v1';
                  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
                  const idle = () => setInterval(() => {}, 1 << 30); // the container has to keep running

                  (async () => {
                    if (fs.existsSync(marker)) return idle();
                    for (let i = 0; i < 120; i++) { // 10 minutes
                      try {
                        const res = await fetch(api + '/settings/public', { signal: AbortSignal.timeout(10000) });
                        if (res.ok) {
                          const pub = await res.json();
                          if (!pub.initialized || pub.mediaServerType !== 2) {
                            console.log('seerr is not configured with jellyfin, no administrator to create');
                            return idle();
                          }
                          const signIn = (extra) => fetch(api + '/auth/jellyfin', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(Object.assign({ username: env.JELLYFIN_USER, password: env.JELLYFIN_PASSWORD, email: env.ADMIN_EMAIL, serverType: 2 }, extra)),
                            signal: AbortSignal.timeout(30000),
                          });
                          // seerr takes the address of jellyfin from the first login, and refuses it when it already has one (existing install)
                          let login = await signIn({ hostname: env.JELLYFIN_HOST, port: 8096, useSsl: false, urlBase: '' });
                          if (!login.ok) login = await signIn({});
                          if (login.ok) {
                            fs.writeFileSync(marker, new Date().toISOString());
                            // turns the other logins off now (`configure.js` does it at each start from now on)
                            const cookie = (login.headers.getSetCookie() || []).map((c) => c.split(';')[0]).join('; ');
                            const off = await fetch(api + '/settings/main', {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/json', Cookie: cookie },
                              body: JSON.stringify({ localLogin: false, mediaServerLogin: false, newPlexLogin: false }),
                              signal: AbortSignal.timeout(30000),
                            });
                            console.log('administrator created, the other logins are turned off: ' + off.status);
                            return idle();
                          }
                          console.log('administrator not created: ' + login.status + ' ' + (await login.text()));
                        }
                      } catch (e) {
                        console.log('waiting for seerr: ' + e.message);
                      }
                      await sleep(5000);
                    }
                    idle();
                  })();

          deployments:
            seerr:
              replicas: 1 # seerr is not HA ready
              strategy:
                type: Recreate
              template:
                spec:
                  securityContext:
                    fsGroup: 1000
                    fsGroupChangePolicy: OnRootMismatch
                  # writes settings.json: jellyfin, OIDC and the setup done (created when missing)
                  initContainers:
                    configure:
                      name: configure
                      image: ghcr.io/seerr-team/seerr:preview-new-oidc@sha256:28744b1ced522beb7af8e5c966b73c6e46b1dc2c4c8cb497ad2f12d3139699a3
                      command: [ node, /scripts/configure.js ]
                      env:
                        APP_URL: https://seerr.{{ .Values.app.domain }}
                        ISSUER_URL: https://authelia.{{ .Values.app.domain }}
                        CLIENT_ID:
                          secretKeyRef:
                            name: ref:seerr-oidc
                            key: client-id
                        CLIENT_SECRET:
                          secretKeyRef:
                            name: ref:seerr-oidc
                            key: secret
                        JELLYFIN_URL: http://jellyfin.jellyfin:8096 # by its service, the one of the policy
                        JELLYFIN_HOST: jellyfin.jellyfin
                        JELLYFIN_PORT: "8096"
                        JELLYFIN_EXTERNAL_URL: https://jellyfin.{{ .Values.app.domain }}
                        JELLYFIN_USER: admin
                        JELLYFIN_PASSWORD:
                          secretKeyRef:
                            name: ref:seerr-jellyfin
                            key: password
                      securityContext:
                        runAsUser: 1000
                        runAsGroup: 1000
                        capabilities:
                          drop:
                            all: ALL
                      volumeMounts:
                        config:
                          name: config
                          mountPath: /app/config
                        scripts:
                          name: scripts
                          mountPath: /scripts
                          readOnly: true
                  containers:
                    seerr:
                      name: seerr
                      image: ghcr.io/seerr-team/seerr:preview-new-oidc@sha256:28744b1ced522beb7af8e5c966b73c6e46b1dc2c4c8cb497ad2f12d3139699a3
                      ports:
                        http:
                          containerPort: 5055
                      env:
                        TZ: Europe/Paris
                        DB_TYPE: postgres
                        DB_HOST: seerr-postgresql-rw
                        DB_PORT: "5432"
                        DB_NAME: app
                        DB_USER: app
                        DB_PASS:
                          secretKeyRef:
                            name: seerr-postgresql-app
                            key: password
                        DB_USE_SSL: "true"
                        DB_SSL_REJECT_UNAUTHORIZED: "false" # encrypted, the certificate is signed by the CA of the cluster (as `SSL_MODE: require` of forgejo)
                      probe:
                        httpGet:
                          path: /api/v1/settings/public
                      securityContext:
                        runAsUser: 1000
                        runAsGroup: 1000
                        capabilities:
                          drop:
                            all: ALL
                      volumeMounts:
                        config:
                          name: config
                          mountPath: /app/config
                    # creates the administrator of seerr once it has started
                    admin:
                      name: admin
                      image: ghcr.io/seerr-team/seerr:preview-new-oidc@sha256:28744b1ced522beb7af8e5c966b73c6e46b1dc2c4c8cb497ad2f12d3139699a3
                      command: [ node, /scripts/admin.js ]
                      env:
                        JELLYFIN_HOST: jellyfin.jellyfin
                        JELLYFIN_USER: admin
                        JELLYFIN_PASSWORD:
                          secretKeyRef:
                            name: ref:seerr-jellyfin
                            key: password
                        ADMIN_EMAIL: admin@{{ .Values.app.domain }}
                      securityContext:
                        runAsUser: 1000
                        runAsGroup: 1000
                        capabilities:
                          drop:
                            all: ALL
                      volumeMounts:
                        config:
                          name: config
                          mountPath: /app/config
                        scripts:
                          name: scripts
                          mountPath: /scripts
                          readOnly: true
                  volumes:
                    config:
                      name: config
                      persistentVolumeClaim:
                        claimName: ref:seerr-config
                    scripts:
                      name: scripts
                      configMap:
                        name: ref:seerr-scripts

          services:
            seerr:
              ports:
                http:
                  port: 5055

expose:
  seerr: # no forward auth: the login is the OIDC one of seerr, and the API has to be reachable by the apps
    port: 5055

oidc:
  seerr: {}
