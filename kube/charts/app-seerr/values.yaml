# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:
  name:

# Nothing has to be created by hand: the setup wizard of the web UI configures the media server (jellyfin) and the users at the first
# visit. The web UI is protected by Authelia forward auth.

resources:

  # on top of the default deny of app-cilium. The selectors are in the namespace of the release.
  ciliumNetworkPolicies:
    seerr:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: seerr}
      ingress:
        gateway:
          fromEntities: {ingress: ingress, host: host, remote-node: remote-node}
          toPorts:
            http: {ports: {p5055: {port: "5055", protocol: TCP}}}

  fluxHelmReleases:
    seerr:
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          # settings and database of seerr
          persistentVolumeClaims:
            seerr-config:
              accessModes:
                - ReadWriteOnce
              storageClassName: longhorn
              resources:
                requests:
                  storage: 5Gi

          deployments:
            seerr:
              replicas: 1 # seerr is not HA ready
              strategy:
                type: Recreate # the volume is ReadWriteOnce
              selector:
                matchLabels:
                  app.kubernetes.io/name: seerr
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: seerr
                spec:
                  securityContext:
                    fsGroup: 1000
                    fsGroupChangePolicy: OnRootMismatch
                  containers:
                    seerr:
                      name: seerr
                      image: ghcr.io/seerr-team/seerr:v3.5.0 # renovate: versioning=loose
                      ports:
                        http:
                          containerPort: 5055
                      env:
                        TZ: Europe/Paris
                      startupProbe:
                        httpGet:
                          path: /api/v1/settings/public
                          port: 5055
                        periodSeconds: 10
                        failureThreshold: 30
                      readinessProbe:
                        httpGet:
                          path: /api/v1/settings/public
                          port: 5055
                        periodSeconds: 15
                        timeoutSeconds: 3
                      livenessProbe:
                        httpGet:
                          path: /api/v1/settings/public
                          port: 5055
                        periodSeconds: 15
                        timeoutSeconds: 3
                      securityContext:
                        allowPrivilegeEscalation: false
                        runAsNonRoot: true
                        runAsUser: 1000
                        runAsGroup: 1000
                        capabilities:
                          drop:
                            all: ALL
                        seccompProfile:
                          type: RuntimeDefault
                      volumeMounts:
                        config:
                          name: config
                          mountPath: /app/config
                  volumes:
                    config:
                      name: config
                      persistentVolumeClaim:
                        claimName: seerr-config

          services:
            seerr:
              selector:
                app.kubernetes.io/name: seerr
              ports:
                http:
                  port: 5055

    # the public exposure, applied once seerr is deployed and not waited for
    seerr-integration:
      install:
        disableWait: true
      upgrade:
        disableWait: true
      dependsOn:
        seerr:
          name: seerr
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        gateway-api:
          name: app-gateway-api
          namespace: gateway-api
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          certManagerCertificates:
            # certificate of the web UI, terminated by the Gateway
            seerr-gateway:
              secretName: tls-seerr-gateway
              dnsNames:
                seerr: seerr.{{ .Values.global.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

          # Exposed by the Cilium Gateway `shared` (kube-system), TLS terminated by the Gateway and protected by Authelia forward auth.
          # The ReferenceGrant to the authelia service is in app-authelia.
          listenerSets:
            seerr:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: shared
                namespace: kube-system
              listeners:
                https:
                  name: https
                  hostname: seerr.{{ .Values.global.domain }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-seerr-gateway
                  allowedRoutes:
                    namespaces:
                      from: Same

          httpRoutes:
            seerr:
              parentRefs:
                seerr:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: seerr
              hostnames:
                seerr: seerr.{{ .Values.global.domain }}
              rules:
                root:
                  filters:
                    authelia:
                      type: ExternalAuth
                      externalAuth:
                        protocol: HTTP
                        backendRef:
                          name: authelia
                          namespace: authelia
                          port: 80
                        http:
                          path: /api/authz/ext-authz/
                          allowedResponseHeaders: # only the identity headers, not the authz content-type/content-length (a GET with a content-length makes upstreams answer 400)
                            remote-user: remote-user
                            remote-groups: remote-groups
                            remote-name: remote-name
                            remote-email: remote-email
                          allowedHeaders: # what authelia needs to find the session and to redirect to the login page
                            cookie: cookie
                            accept: accept
                            proxy-authorization: proxy-authorization
                            x-forwarded-proto: x-forwarded-proto
                            x-forwarded-for: x-forwarded-for
                  backendRefs:
                    seerr:
                      name: seerr
                      port: 5055
