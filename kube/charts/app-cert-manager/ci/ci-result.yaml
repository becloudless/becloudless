---
# Source: app-cert-manager/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager
      version: v1.21.2
  dependsOn:
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    config:
      gatewayAPI:
        enabled: true
    crds:
      enabled: true
    ingressShim:
      defaultIssuerKind: ClusterIssuer
      defaultIssuerName: letsencrypt-prod
    prometheus:
      enabled: true
---
# Source: app-cert-manager/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-config
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: cert-manager
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    resources:
      certManagerClusterIssuers:
        letsencrypt-prod:
          acme:
            email: admin@test.com
            privateKeySecretRef:
              name: letsencrypt-prod
            server: https://acme-v02.api.letsencrypt.org/directory
            solvers:
            - http01:
                gatewayHTTPRoute:
                  parentRefs:
                  - group: gateway.networking.k8s.io
                    kind: Gateway
                    name: shared
                    namespace: kube-system
                    sectionName: http
        letsencrypt-staging:
          acme:
            email: admin@test.com
            privateKeySecretRef:
              name: letsencrypt-staging
            server: https://acme-staging-v02.api.letsencrypt.org/directory
            solvers:
            - http01:
                gatewayHTTPRoute:
                  parentRefs:
                  - group: gateway.networking.k8s.io
                    kind: Gateway
                    name: shared
                    namespace: kube-system
                    sectionName: http
        self-signed:
          selfSigned: {}
---
# Source: app-cert-manager/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m
  url: https://charts.jetstack.io
