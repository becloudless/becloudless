---
# Source: app-cert-manager/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cert-manager-http01-solver
spec:
  endpointSelector:
    matchLabels:
      k8s:acme.cert-manager.io/http01-solver: "true"
  ingress:
  - fromEntities:
    - host
    - ingress
    - remote-node
    toPorts:
    - ports:
      - port: "8089"
        protocol: TCP
---
# Source: app-cert-manager/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-cainjector
  namespace: default
spec:
  egress:
  - toEntities:
    - kube-apiserver
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: cainjector
      app.kubernetes.io/instance: cert-manager
---
# Source: app-cert-manager/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-controller
  namespace: default
spec:
  egress:
  - toFQDNs:
    - matchName: acme-v02.api.letsencrypt.org
    - matchName: acme-staging-v02.api.letsencrypt.org
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEntities:
    - ingress
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      - port: "80"
        protocol: TCP
  - toEntities:
    - kube-apiserver
  - toFQDNs:
    - matchName: test.com
    - matchPattern: '**.test.com'
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      - port: "80"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/instance: cert-manager
---
# Source: app-cert-manager/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-webhook
  namespace: default
spec:
  egress:
  - toEntities:
    - kube-apiserver
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: webhook
      app.kubernetes.io/instance: cert-manager
  ingress:
  - fromEntities:
    - kube-apiserver
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
---
# Source: app-cert-manager/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: default
spec:
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager
      version: v1.21.2
  dependsOn:
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    config:
      gatewayAPI:
        enabled: true
    crds:
      enabled: true
    ingressShim:
      defaultIssuerKind: ClusterIssuer
      defaultIssuerName: letsencrypt-prod
    prometheus:
      enabled: true
---
# Source: app-cert-manager/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-post
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: cert-manager
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      certManagerClusterIssuers:
        letsencrypt-prod:
          acme:
            email: admin@test.com
            privateKeySecretRef:
              name: letsencrypt-prod
            server: https://acme-v02.api.letsencrypt.org/directory
            solvers:
            - http01:
                gatewayHTTPRoute:
                  parentRefs:
                  - group: gateway.networking.k8s.io
                    kind: Gateway
                    name: shared
                    namespace: kube-system
                    sectionName: http
        letsencrypt-staging:
          acme:
            email: admin@test.com
            privateKeySecretRef:
              name: letsencrypt-staging
            server: https://acme-staging-v02.api.letsencrypt.org/directory
            solvers:
            - http01:
                gatewayHTTPRoute:
                  parentRefs:
                  - group: gateway.networking.k8s.io
                    kind: Gateway
                    name: shared
                    namespace: kube-system
                    sectionName: http
        self-signed:
          selfSigned: {}
---
# Source: app-cert-manager/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager
  namespace: default
spec:
  interval: 10m
  url: https://charts.jetstack.io
