# yaml-language-server: $schema=../../base/schema/values.schema.json
global:
  domain:

resources:
  certManagerClusterIssuers:
    letsencrypt-prod:
      fullNameOverride: letsencrypt-prod
      acme:
        email: admin@{{ .Values.global.domain }}
        server: https://acme-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: letsencrypt-prod
        solvers:
          - http01:
              ingress:
                class: traefik

    letsencrypt-staging:
      fullNameOverride: letsencrypt-staging
      acme:
        email: admin@{{ .Values.global.domain }}
        server: https://acme-staging-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: letsencrypt-staging
        solvers:
          - http01:
              ingress:
                class: traefik

    self-signed:
      fullNameOverride: self-signed
      selfSigned: {}
