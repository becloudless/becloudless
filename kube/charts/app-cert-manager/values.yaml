# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:

defaults:
  metadata:
    namespace: cert-manager

resources:
  namespaces:
    cert-manager:
      fullNameOverride: cert-manager
      labels:
        certmanager.k8s.io/disable-validation: "true"

  fluxHelmRepositories:
    cert-manager:
      fullNameOverride: cert-manager
      url: https://charts.jetstack.io

  fluxHelmReleases:
    cert-manager:
      fullNameOverride: cert-manager
      chart:
        spec:
          chart: cert-manager
          version: v1.21.2
          sourceRef:
            kind: HelmRepository
            name: cert-manager
      upgrade:
        remediation:
          retries: 3
      values:
        crds:
          enabled: true
        ingressShim:
          defaultIssuerName: letsencrypt-prod
          defaultIssuerKind: ClusterIssuer
        prometheus:
          enabled: true

    # ClusterIssuers need the cert-manager CRDs, so they are installed once cert-manager is ready
    cert-manager-config:
      fullNameOverride: cert-manager-config
      dependsOn:
        cert-manager:
          name: cert-manager
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: "{{ .Release.Namespace }}"
      values:
        resources:
          certManagerClusterIssuers:
            letsencrypt-prod:
              fullNameOverride: letsencrypt-prod
              acme:
                email: admin@{{ .Values.global.domain }}
                server: https://acme-v02.api.letsencrypt.org/directory
                privateKeySecretRef:
                  name: letsencrypt-prod
                solvers:
                  - http01:
                      ingress:
                        class: cilium

            letsencrypt-staging:
              fullNameOverride: letsencrypt-staging
              acme:
                email: admin@{{ .Values.global.domain }}
                server: https://acme-staging-v02.api.letsencrypt.org/directory
                privateKeySecretRef:
                  name: letsencrypt-staging
                solvers:
                  - http01:
                      ingress:
                        class: cilium

            self-signed:
              fullNameOverride: self-signed
              selfSigned: {}
