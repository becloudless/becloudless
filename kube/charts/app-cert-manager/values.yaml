# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:

# resources are named by their id, without the release name prefix
prefixNamesWithRelease: false

defaults:
  metadata:
    namespace: cert-manager

resources:
  fluxHelmRepositories:
    cert-manager:
      url: https://charts.jetstack.io

  fluxHelmReleases:
    cert-manager:
      chart:
        spec:
          chart: cert-manager
          version: v1.21.2
          sourceRef:
            kind: HelmRepository
            name: cert-manager
      upgrade:
        remediation:
          retries: 3
      values:
        crds:
          enabled: true
        # needed by the `gatewayHTTPRoute` http-01 solver of the issuers. Gateway API CRDs must exist when cert-manager starts: app-bcl makes this app depend on app-gateway-api
        config:
          gatewayAPI:
            enabled: true
        ingressShim:
          defaultIssuerName: letsencrypt-prod
          defaultIssuerKind: ClusterIssuer
        prometheus:
          enabled: true

    # ClusterIssuers need the cert-manager CRDs, so they are installed once cert-manager is ready
    cert-manager-config:
      dependsOn:
        cert-manager:
          name: cert-manager
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: bcl
      values:
        prefixNamesWithRelease: false
        resources:
          certManagerClusterIssuers:
            letsencrypt-prod:
              acme:
                email: admin@{{ .Values.global.domain }}
                server: https://acme-v02.api.letsencrypt.org/directory
                privateKeySecretRef:
                  name: letsencrypt-prod
                solvers:
                  - http01:
                      gatewayHTTPRoute: # the route is created in the namespace of the certificate and attached to the http listener of the shared Gateway
                        parentRefs:
                          - group: gateway.networking.k8s.io
                            kind: Gateway
                            name: shared
                            namespace: kube-system
                            sectionName: http

            letsencrypt-staging:
              acme:
                email: admin@{{ .Values.global.domain }}
                server: https://acme-staging-v02.api.letsencrypt.org/directory
                privateKeySecretRef:
                  name: letsencrypt-staging
                solvers:
                  - http01:
                      gatewayHTTPRoute:
                        parentRefs:
                          - group: gateway.networking.k8s.io
                            kind: Gateway
                            name: shared
                            namespace: kube-system
                            sectionName: http

            self-signed:
              selfSigned: {}
