# yaml-language-server: $schema=../base/schema/values.schema.json

defaults:
  metadata:
    namespace: cert-manager

resources:
  namespaces:
    cert-manager:
      fullNameOverride: cert-manager
      labels:
        certmanager.k8s.io/disable-validation: "true"

  fluxHelmRepositories:
    cert-manager:
      fullNameOverride: cert-manager
      url: https://charts.jetstack.io

  fluxHelmReleases:
    cert-manager:
      fullNameOverride: cert-manager
      chart:
        spec:
          chart: cert-manager
          version: v1.21.2
          sourceRef:
            kind: HelmRepository
            name: cert-manager
      upgrade:
        remediation:
          retries: 3
      values:
        installCRDs: true
        ingressShim:
          defaultIssuerName: letsencrypt-prod
          defaultIssuerKind: ClusterIssuer
        prometheus:
          enabled: true
