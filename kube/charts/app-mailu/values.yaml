# yaml-language-server: $schema=../app/schema/values.schema.json

# Behind the edge nodes (app `edge`, to deploy with it): the mail ports are the ones of the edge nodes, which send the PROXY header (the address of
# the client) through `edge` to the service `mailu-front-ext` of the front, and the outgoing mails go to the relay of the edge nodes (`edge-relay`),
# so they leave from the address of an edge node. In the cluster values of `edge`:
#   tcp:
#     smtp: {port: 25, backend: mailu-front-ext.mailu.svc:25}
#     submissions: {port: 465, backend: mailu-front-ext.mailu.svc:465}
#     imaps: {port: 993, backend: mailu-front-ext.mailu.svc:993}
# The front reads the PROXY header on the ports of this service (`ingress.proxyProtocol`), and the policy `mailu-front` only lets `edge` in on them.
# The domain (`app.domain`) and the first admin account (`admin@<domain>`) are created by the admin at its start (`initialAccount`,
# `flask mailu admin`, mode `ifmissing`: an existing account is never changed, so a password changed in the web UI stays). Its password is
# generated in the secret `mailu-initial-account` (key `password`, backed up with the other generated secrets).
# Web UI login (admin and webmail) by Authelia, so by lldap: the route of `mailu.<domain>` has the forward auth (`expose` below), the users of the
# groups `app_mailu` and `role_admin` sign in to Authelia, which gives the email of the user in the header `Remote-Email`. The admin
# (`proxyAuth`) logs in the account of this email, created at the first login when its domain exists in mailu (`proxyAuth.create`: so the
# email of the user in lldap has to be `<user>@<domain>`, as an account of mailu). Only the proxies of `proxyAuth.whitelist` (the pods of
# the cluster: the front only lets the Gateway, and the nodes, reach its web port, see the policy `mailu-front`) are trusted for the header.
# The account created has a random password: the mail clients (IMAP, SMTP) can not use Authelia, they use the password of the account (to set in
# the web UI) or a token. An administrator of mailu is the account of the email of its lldap user (the first one is `initialAccount`), the
# other accounts are users. To log in with the password of an account instead (the admin of `initialAccount`):
# `https://mailu.<domain>/sso/login?noproxyauth`.
# The contacts and the calendars (`/webdav`) have no forward auth (the clients can not follow the redirect to the login page), they use the
# passwords of mailu.

resources:
  fluxHelmRepositories:
    mailu:
      url: https://mailu.github.io/helm-charts

  # The mail ports reach the front from `edge` only, and the mails go out through its relay (postfix). The ports between the components are the
  # ones of Mailu, to check with `hubble observe --verdict DROPPED` when a component is added or a feature is enabled.
  ciliumNetworkPolicies:
    mailu-front: # the proxy of the mail protocols and of the web interfaces
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: front}
      ingress:
        gateway:
          fromEntities: [ingress, host, remote-node]
          toPorts: [80]
        edge: # the mail ports of the edge nodes, with the PROXY header (the ports of `front.externalService.ports`)
          fromEndpoints:
            edge:
              matchLabels:
                "k8s:io.kubernetes.pod.namespace": edge
                "k8s:app.kubernetes.io/instance": edge
                "k8s:app.kubernetes.io/component": edge
          toPorts: [25, 465, 993, 995, 4190]
        webmail: # roundcube reaches the imap and the smtp of the users through the front
          fromEndpoints:
            webmail:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: webmail}
          toPorts: [10143, 10025]
        postfix: # the delivery of the received mails to the mailboxes, `virtual_transport` of postfix (lmtp through the front)
          fromEndpoints:
            postfix:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: postfix}
          toPorts: [2525]
      egress:
        admin:
          toEndpoints:
            admin:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: admin}
          toPorts: [8080]
        dovecot: # 2525: the lmtp of the mails delivered by postfix
          toEndpoints:
            dovecot:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: dovecot}
          toPorts: [110, 143, 4190, 2525]
        postfix:
          toEndpoints:
            postfix:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: postfix}
          toPorts: [25, 10025] # 10025: the authenticated submission (465 and 587), proxied by the dovecot of the front
        webmail:
          toEndpoints:
            webmail:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: webmail}
          toPorts: [80]
        webdav:
          toEndpoints:
            webdav:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: webdav}
          toPorts: [5232]
        rspamd: # the web interface
          toEndpoints:
            rspamd:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: rspamd}
          toPorts: [11334]

    mailu-admin:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: admin}
      ingress:
        components: # the authentication and the configuration of the other components
          fromEndpoints:
            components:
              matchExpressions:
                component:
                  key: app.kubernetes.io/component
                  operator: In
                  values: {front: front, postfix: postfix, dovecot: dovecot, rspamd: rspamd, webmail: webmail, webdav: webdav}
          toPorts: [8080]
      egress:
        mariadb:
          toEndpoints:
            mariadb:
              matchLabels: {app.kubernetes.io/name: mariadb}
          toPorts: [3306]
        redis:
          toEndpoints:
            redis:
              matchLabels: {app.kubernetes.io/name: redis}
          toPorts: [6379]

    mailu-postfix: # receives and delivers the mails
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: postfix}
      ingress:
        senders:
          fromEndpoints:
            front:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: front}
            dovecot:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: dovecot}
          toPorts: [25]
        authelia: # the notifications of Authelia (`mynetworks` of postfix: the pods of the cluster relay without authentication)
          fromEndpoints:
            authelia:
              matchLabels: {"k8s:io.kubernetes.pod.namespace": authelia, "k8s:app.kubernetes.io/name": authelia}
          toPorts: [25]
        submission: # the authenticated submission (465 and 587), proxied by the dovecot of the front
          fromEndpoints:
            front:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: front}
          toPorts: [10025]
      egress:
        admin:
          toEndpoints:
            admin:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: admin}
          toPorts: [8080]
        front: # the delivery of the received mails to the mailboxes, `virtual_transport` of postfix (lmtp through the front)
          toEndpoints:
            front:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: front}
          toPorts: [2525]
        dovecot: # the delivery to the mailboxes (lmtp)
          toEndpoints:
            dovecot:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: dovecot}
          toPorts: [2525]
        rspamd:
          toEndpoints:
            rspamd:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: rspamd}
          toPorts: [11332]
        relay: # the outgoing mails: the relay of the edge nodes (`edge`), they leave from their address
          toEndpoints:
            edge:
              matchLabels:
                "k8s:io.kubernetes.pod.namespace": edge
                "k8s:app.kubernetes.io/instance": edge
                "k8s:app.kubernetes.io/component": edge
          toPorts: [2525]

    mailu-dovecot: # the mailboxes
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: dovecot}
      ingress:
        front: # 2525: the lmtp of the mails delivered by postfix through the front
          fromEndpoints:
            front:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: front}
          toPorts: [110, 143, 4190, 2525]
        postfix:
          fromEndpoints:
            postfix:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: postfix}
          toPorts: [2525]
      egress:
        admin:
          toEndpoints:
            admin:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: admin}
          toPorts: [8080]
        postfix: # the redirections of the sieve filters
          toEndpoints:
            postfix:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: postfix}
          toPorts: [25]
        rspamd: # the learning of the spam
          toEndpoints:
            rspamd:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: rspamd}
          toPorts: [11332]
        tika: # the extraction of the text of the attachments for the full text search (`fts_tika`)
          toEndpoints:
            tika:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: tika}
          toPorts: [9998]

    mailu-tika: # the extraction of the text of the attachments
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: tika}
      ingress:
        dovecot:
          fromEndpoints:
            dovecot:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: dovecot}
          toPorts: [9998]

    mailu-rspamd: # the antispam
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: rspamd}
      ingress:
        milter:
          fromEndpoints:
            postfix:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: postfix}
            dovecot:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: dovecot}
          toPorts: [11332]
        front:
          fromEndpoints:
            front:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: front}
          toPorts: [11334]
      egress:
        admin:
          toEndpoints:
            admin:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: admin}
          toPorts: [8080]
        redis:
          toEndpoints:
            redis:
              matchLabels: {app.kubernetes.io/name: redis}
          toPorts: [6379]
        clamav:
          toEndpoints:
            clamav:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: clamav}
          toPorts: [3310]
        oletools:
          toEndpoints:
            oletools:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: oletools}
          toPorts: [11343]

    mailu-clamav: # the antivirus
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: clamav}
      ingress:
        rspamd:
          fromEndpoints:
            rspamd:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: rspamd}
          toPorts: [3310]
      egress:
        signatures: # the updates of the virus database
          toFQDNs:
            clamav: {matchName: clamav.net}
            clamav-subdomains: {matchPattern: "**.clamav.net"}
          toPorts: [80, 443]

    mailu-oletools: # the analysis of the office documents
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: oletools}
      ingress:
        rspamd:
          fromEndpoints:
            rspamd:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: rspamd}
          toPorts: [11343]

    mailu-webmail:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: webmail}
      ingress:
        front:
          fromEndpoints:
            front:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: front}
          toPorts: [80]
      egress:
        front:
          toEndpoints:
            front:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: front}
          toPorts: [10143, 10025]
        admin:
          toEndpoints:
            admin:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: admin}
          toPorts: [8080]
        mariadb: # the database of roundcube
          toEndpoints:
            mariadb:
              matchLabels: {app.kubernetes.io/name: mariadb}
          toPorts: [3306]

    mailu-webdav: # the contacts and the calendars
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: webdav}
      ingress:
        front:
          fromEndpoints:
            front:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: front}
          toPorts: [5232]
      egress:
        admin:
          toEndpoints:
            admin:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: admin}
          toPorts: [8080]

    mailu-mariadb:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: mariadb}
      ingress:
        clients:
          fromEndpoints:
            admin:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: admin}
            webmail:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: webmail}
          toPorts: [3306]

    mailu-redis:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: redis}
      ingress:
        clients:
          fromEndpoints:
            admin:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: admin}
            rspamd:
              matchLabels: {app.kubernetes.io/name: mailu, app.kubernetes.io/component: rspamd}
          toPorts: [6379]

  fluxHelmReleases:
    mailu-pre:
      dependsOn:
        - name: app-cert-manager
          namespace: cert-manager
        - name: app-secret-generator
          namespace: secret-generator
      values:
        resources:
          stringSecrets:
            mailu:
              fields:
                secret-key:
                  encoding: hex
                  length: "32"

            mailu-mariadb:
              fields:
                root-password:
                  fieldName: mariadb-root-password
                  encoding: hex
                  length: "32"
                password:
                  fieldName: mariadb-password
                  encoding: hex
                  length: "32"
                replication-password:
                  fieldName: mariadb-replication-password
                  encoding: hex
                  length: "32"

            mailu-roundcube:
              fields:
                password:
                  encoding: hex
                  length: "32"

            mailu-initial-account: # the password of the first admin account (`initialAccount`)
              fields:
                password:
                  encoding: hex
                  length: "32"

          # certificate of the web UI (terminated by the Gateway) and of the mail protocols (served by the front of mailu)
          certManagerCertificates:
            mailu:
              secretName: tls-mailu
              dnsNames:
                mail: mail.{{ .Values.app.domain }}
                imap: imap.{{ .Values.app.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

    mailu:
      timeout: 15m # the first start of the databases and of clamav is slow
      dependsOn:
        - ref:mailu-pre
        - name: app-longhorn
          namespace: longhorn-system
      chart:
        spec:
          chart: mailu
          version: 2.8.0
          sourceRef:
            kind: HelmRepository
            name: mailu
      postRenderers:
        # The images of Mailu (front, admin, postfix, dovecot, rspamd, webmail) start as root: their `start.py` chowns the volumes, writes the
        # generated configuration in `/etc` and `/run`, then drops the privileges itself (`drop_privs_to`, `-u rspamd`, php-fpm...). The pods
        # are rejected by the policies of Kyverno without these annotations. The other components (tika, oletools, webdav, clamav) run as a
        # non root user with a read only filesystem, see their values.
        # `checksum/env`: the components read their settings from the environment (the ConfigMap `mailu-envvars`: the relay, the proxy
        # authentication, the hostnames...), which the chart does not hash in its pods: without it a change of the values does not restart
        # them, and they keep the old settings. The hash is the one of the values of the release, so any change of them restarts the pods.
        skip-policies:
          kustomize:
            patches:
              root-images:
                target:
                  kind: Deployment
                  name: mailu-(front|admin|postfix|dovecot|rspamd|webmail)
                patch:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: any
                  spec:
                    template:
                      metadata:
                        annotations:
                          policy.bcl.tf/skipContainerRequireRunAsNonRoot: "true"
                          policy.bcl.tf/skipContainerRequireReadOnlyRootFilesystem: "true"
                          checksum/env: "{{ list .Values.app.domain .Values.resources.fluxHelmReleases.mailu.values | toJson | sha256sum | trunc 16 }}"
        # The image of ClamAV has a second entrypoint for the non root user (it does not chown the volume, it needs `/tmp`, `/var/log/clamav`
        # and the database directory to be writable).
        clamav-unprivileged:
          kustomize:
            patches:
              clamav:
                target:
                  kind: StatefulSet
                  name: mailu-clamav
                patch:
                  apiVersion: apps/v1
                  kind: StatefulSet
                  metadata:
                    name: mailu-clamav
                  spec:
                    template:
                      spec:
                        containers:
                        - name: clamav
                          command: [ /init-unprivileged ]
        # The full text search index of a mailbox (fts_flatcurve, `/mail/<user>/[.<folder>/]fts-flatcurve/<shard>`) that gets corrupt (a write
        # interrupted by a full volume or a crash) is never repaired by dovecot: its indexer crashes (`Xapian::DatabaseCorruptError`, signal 6)
        # on every delivery to the mailbox, and the search of the mailbox is broken. This sidecar checks every shard and removes the whole
        # index of a mailbox with a corrupt shard (a missing shard would hide its messages from the search), dovecot builds it again
        # (`fts_autoindex`) the next time the mailbox is accessed. The check reads all the indexes, hence the low priority and the long
        # interval. The log of what is removed is in the logs of the container.
        fts-heal:
          kustomize:
            patches:
              dovecot:
                target:
                  kind: Deployment
                  name: mailu-dovecot
                patch:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: mailu-dovecot
                  spec:
                    template:
                      spec:
                        containers:
                        - name: fts-heal
                          image: ghcr.io/mailu/dovecot:2024.06.72 # the one of the dovecot of the chart (xapian-check), to keep in sync with it
                          securityContext:
                            runAsUser: 8 # mail, the owner of the indexes
                            runAsGroup: 12
                            allowPrivilegeEscalation: false
                            readOnlyRootFilesystem: true
                            capabilities:
                              drop: [ALL]
                          resources:
                            requests:
                              cpu: 10m
                              memory: 64Mi
                            limits:
                              cpu: 500m
                              memory: 512Mi
                          command: [ sh, -c ]
                          args:
                          - |
                            interval=3600
                            log() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $*"; }
                            # fails only for a corrupt index: xapian-check exits with 1 and does not report "No errors found"
                            # (any other exit code, killed by the memory limit for instance, is not a verdict)
                            check() {
                              out=$(nice -n 19 xapian-check "$1" 2>&1); rc=$?
                              [ "$rc" -ne 1 ] && return 0
                              echo "$out" | grep -q "No errors found"
                            }
                            log "checking the indexes every $interval seconds"
                            while true; do
                              checked=0; removed=0
                              for d in /mail/*/fts-flatcurve /mail/*/.[!.]*/fts-flatcurve; do
                                [ -d "$d" ] || continue
                                for s in "$d"/*; do
                                  [ -d "$s" ] || continue
                                  checked=$((checked + 1))
                                  check "$s" && continue
                                  # a shard that is written during the check can look corrupt: it has to fail twice
                                  log "$s: check failed ($(echo "$out" | tail -1)), checking again in 60s"
                                  sleep 60
                                  check "$s" && continue
                                  log "$s: corrupt, removing the index $d"
                                  rm -rf "$d"
                                  removed=$((removed + 1))
                                  break
                                done
                              done
                              log "$checked shards checked, $removed indexes removed"
                              sleep $interval
                            done
                          volumeMounts:
                          - mountPath: /mail
                            name: data
                            subPath: dovecotmail
      values:
        domain: "{{ .Values.app.domain }}"
        subnet: 10.42.0.0/16 # the pods of the cluster
        hostnames:
          - mail.{{ .Values.app.domain }}
          - imap.{{ .Values.app.domain }}
        timezone: Europe/Paris
        sessionTimeout: 259201 # 3d
        permanentSessionLifetime: 31536000 # 1y
        existingSecret: mailu

        initialAccount:
          enabled: true
          username: admin
          domain: "{{ .Values.app.domain }}"
          mode: ifmissing
          existingSecret: mailu-initial-account
          existingSecretPasswordKey: password

        # the login by the forward auth of Authelia (`expose` below)
        proxyAuth:
          header: Remote-Email
          create: "true"
          whitelist: 10.42.0.0/16 # the pods of the cluster (the Gateway has an address of it, see the policy `mailu-front`)

        global:
          storageClass: longhorn-db
          database:
            roundcube:
              database: roundcube
              existingSecret: mailu-roundcube
              existingSecretPasswordKey: password

        persistence:
          single_pvc: false

        ingress:
          enabled: false
          existingSecret: tls-mailu # the certificate of the mail protocols
          # the front serves the web UI in plain http, and the mail protocols with the certificate
          tlsFlavorOverride: mail
          realIpFrom: 10.0.0.0/8
          realIpHeader: ""
          proxyProtocol:
            pop3: true
            pop3s: true
            imap: true
            imaps: true
            smtp: true
            smtps: true
            submission: true
            manageSieve: true

        front:
          # on crio, root is needed to have the SYS_CHROOT capability, required by dovecot to run properly
          # https://github.com/Mailu/Mailu/issues/1714
          containerSecurityContext:
            capabilities:
              add:
                - SYS_CHROOT
            enabled: true
            runAsUser: 0

          updateStrategy:
            type: Recreate # the volumes are ReadWriteOnce

          # the service `mailu-front-ext` of the mail ports, for `edge` (the PROXY protocol is enabled on the ports it exposes)
          externalService:
            enabled: true
            type: ClusterIP

        # the outgoing mails go to the relay of the edge nodes (no authentication: only the pods of the cluster reach it)
        externalRelay:
          host: "[edge-relay.edge.svc.cluster.local]:2525" # the full name: postfix resolves with DNSSEC, without the search domains (`edge-relay.edge.svc` is NXDOMAIN)

        mariadb:
          enabled: true
          # TODO replicas from `app.scaling.dbReplicas`: it is a single standalone instance for now (architecture standalone)
          auth:
            existingSecret: mailu-mariadb
          primary:
            # workaround of https://github.com/Mailu/helm-charts/issues/463#issuecomment-3406122198
            extraEnvVars:
              - name: ROUNDCUBE_DB_PW
                valueFrom:
                  secretKeyRef:
                    name: mailu-roundcube
                    key: password
              - name: ROUNDCUBE_DB_NAME
                value: roundcube
              - name: ROUNDCUBE_DB_USER
                value: roundcube
            persistence:
              enabled: true
              storageClass: longhorn-db

        # `global.storageClass` is only used by clamav and the databases: the volumes of the other components need their own class, they are
        # created without one (and stay Pending, there is no default class) otherwise.
        admin:
          persistence:
            storageClass: longhorn-db
          updateStrategy:
            type: Recreate

        postfix:
          persistence:
            storageClass: longhorn-db
          updateStrategy:
            type: Recreate

        dovecot:
          persistence:
            storageClass: longhorn-files
          # on crio, root is needed to have the SYS_CHROOT capability, required by dovecot to run properly
          # https://github.com/Mailu/Mailu/issues/1714
          containerSecurityContext:
            capabilities:
              add:
                - SYS_CHROOT
            enabled: true
            runAsUser: 0

          updateStrategy:
            type: Recreate
          resources:
            requests:
              memory: 500Mi
              cpu: 100m
            limits:
              memory: 1.5Gi
              cpu: 2

        rspamd:
          persistence:
            storageClass: longhorn-db
          updateStrategy:
            type: Recreate
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              memory: 400M
              cpu: 1

        clamav:
          persistence:
            storageClass: longhorn-files
          # non root (the entrypoint `/init-unprivileged`, see the post renderer `clamav-unprivileged`)
          podSecurityContext:
            enabled: true
            fsGroup: 1000
          containerSecurityContext:
            enabled: true
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          extraVolumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: log, mountPath: /var/log/clamav}
          extraVolumes:
            - {name: tmp, emptyDir: {}}
            - {name: log, emptyDir: {}}
          resources:
            requests:
              memory: 1.5Gi
              cpu: 100m
            limits:
              memory: 3Gi
              cpu: 1

        webmail:
          persistence:
            storageClass: longhorn-db
          updateStrategy:
            type: Recreate
          resources:
            requests:
              memory: 100Mi
              cpu: 100m
            limits:
              memory: 200Mi
              cpu: 1

        webdav:
          enabled: true
          persistence:
            storageClass: longhorn-db
          updateStrategy:
            type: Recreate
          podSecurityContext:
            enabled: true
            fsGroup: 1001
          containerSecurityContext:
            enabled: true
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          extraVolumeMounts:
            - {name: tmp, mountPath: /tmp}
          extraVolumes:
            - {name: tmp, emptyDir: {}}

        # these images already have a non root user (`nobody` and 35002)
        oletools:
          containerSecurityContext:
            enabled: true
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

        tika:
          containerSecurityContext:
            enabled: true
            runAsUser: 35002
            runAsGroup: 35002
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          extraVolumeMounts:
            - {name: tmp, mountPath: /tmp}
          extraVolumes:
            - {name: tmp, emptyDir: {}}

    # The public exposure of the web UI by `expose` below, merged with the generated release: the contacts and the calendars have no forward auth.
    # The mail protocols are not exposed by the Gateway, they come through `edge`.
    mailu-integration:
      values:
        resources:
          httpRoutes:
            mailu:
              rules:
                webdav: # the DAV clients can not follow the redirect to the login page: they use the passwords of mailu
                  matches:
                    webdav:
                      path:
                        type: PathPrefix
                        value: /webdav
                  backendRefs:
                    front:
                      name: mailu-front
                      port: 80

expose:
  mailu: # the forward auth of Authelia, whose header is the one of `proxyAuth`
    service: mailu-front
    port: 80
    hostname: mailu # the web UI: `mail.<domain>` is the name of the mail protocols (certificate `tls-mailu`, MX, relay)
    auth: authelia
