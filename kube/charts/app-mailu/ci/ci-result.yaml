# Source: app-mailu/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mailu-admin
  namespace: default
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: mariadb
    toPorts:
    - ports:
      - port: "3306"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: redis
    toPorts:
    - ports:
      - port: "6379"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: admin
      app.kubernetes.io/name: mailu
  ingress:
  - fromEndpoints:
    - matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
        - dovecot
        - front
        - postfix
        - rspamd
        - webdav
        - webmail
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
---
