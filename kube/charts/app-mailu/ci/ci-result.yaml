# Source: app-mailu/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mailu
  namespace: default
spec:
  chart:
    spec:
      chart: mailu
      sourceRef:
        kind: HelmRepository
        name: mailu
      version: 2.8.0
  dependsOn:
  - name: mailu-pre
  - name: app-longhorn
    namespace: longhorn-system
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  postRenderers:
  - kustomize:
      patches:
      - patch: |-
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: mailu-clamav
          spec:
            template:
              spec:
                containers:
                - command:
                  - /init-unprivileged
                  name: clamav
        target:
          kind: StatefulSet
          name: mailu-clamav
  - kustomize:
      patches:
      - patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mailu-dovecot
          spec:
            template:
              spec:
                containers:
                - args:
                  - |
                    interval=3600
                    log() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $*"; }
                    # fails only for a corrupt index: xapian-check exits with 1 and does not report "No errors found"
                    # (any other exit code, killed by the memory limit for instance, is not a verdict)
                    check() {
                      out=$(nice -n 19 xapian-check "$1" 2>&1); rc=$?
                      [ "$rc" -ne 1 ] && return 0
                      echo "$out" | grep -q "No errors found"
                    }
                    log "checking the indexes every $interval seconds"
                    while true; do
                      checked=0; removed=0
                      for d in /mail/*/fts-flatcurve /mail/*/.[!.]*/fts-flatcurve; do
                        [ -d "$d" ] || continue
                        for s in "$d"/*; do
                          [ -d "$s" ] || continue
                          checked=$((checked + 1))
                          check "$s" && continue
                          # a shard that is written during the check can look corrupt: it has to fail twice
                          log "$s: check failed ($(echo "$out" | tail -1)), checking again in 60s"
                          sleep 60
                          check "$s" && continue
                          log "$s: corrupt, removing the index $d"
                          rm -rf "$d"
                          removed=$((removed + 1))
                          break
                        done
                      done
                      log "$checked shards checked, $removed indexes removed"
                      sleep $interval
                    done
                  command:
                  - sh
                  - -c
                  image: ghcr.io/mailu/dovecot:2024.06.72
                  name: fts-heal
                  resources:
                    limits:
                      cpu: 500m
                      memory: 512Mi
                    requests:
                      cpu: 10m
                      memory: 64Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                      - ALL
                    readOnlyRootFilesystem: true
                    runAsGroup: 12
                    runAsUser: 8
                  volumeMounts:
                  - mountPath: /mail
                    name: data
                    subPath: dovecotmail
        target:
          kind: Deployment
          name: mailu-dovecot
  - kustomize:
      patches:
      - patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: any
          spec:
            template:
              metadata:
                annotations:
                  checksum/env: e0196110664b9ba5
                  policy.bcl.tf/skipContainerRequireReadOnlyRootFilesystem: "true"
                  policy.bcl.tf/skipContainerRequireRunAsNonRoot: "true"
        target:
          kind: Deployment
          name: mailu-(front|admin|postfix|dovecot|rspamd|webmail)
  timeout: 15m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    admin:
      persistence:
        storageClass: longhorn-db
      updateStrategy:
        type: Recreate
    api:
      enabled: true
      existingSecret: mailu-api
      existingSecretTokenKey: api-token
      webPath: /api
    clamav:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        enabled: true
        readOnlyRootFilesystem: true
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      extraVolumeMounts:
      - mountPath: /tmp
        name: tmp
      - mountPath: /var/log/clamav
        name: log
      extraVolumes:
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: log
      persistence:
        storageClass: longhorn-files
      podSecurityContext:
        enabled: true
        fsGroup: 1000
      resources:
        limits:
          cpu: 1
          memory: 3Gi
        requests:
          cpu: 100m
          memory: 1.5Gi
    domain: test.com
    dovecot:
      containerSecurityContext:
        capabilities:
          add:
          - SYS_CHROOT
        enabled: true
        runAsUser: 0
      persistence:
        storageClass: longhorn-files
      resources:
        limits:
          cpu: 2
          memory: 1.5Gi
        requests:
          cpu: 100m
          memory: 500Mi
      updateStrategy:
        type: Recreate
    existingSecret: mailu
    front:
      containerSecurityContext:
        capabilities:
          add:
          - SYS_CHROOT
        enabled: true
        runAsUser: 0
      externalService:
        enabled: true
        type: ClusterIP
      updateStrategy:
        type: Recreate
    global:
      database:
        roundcube:
          database: roundcube
          existingSecret: mailu-roundcube
          existingSecretPasswordKey: password
      storageClass: longhorn-db
    hostnames:
    - mail.test.com
    - imap.test.com
    ingress:
      enabled: false
      existingSecret: tls-mailu
      proxyProtocol:
        imap: true
        imaps: true
        manageSieve: true
        pop3: true
        pop3s: true
        smtp: true
        smtps: true
        submission: true
      realIpFrom: 10.0.0.0/8
      realIpHeader: ""
      tlsFlavorOverride: mail
    initialAccount:
      domain: test.com
      enabled: true
      existingSecret: mailu-initial-account
      existingSecretPasswordKey: password
      mode: ifmissing
      username: admin
    mariadb:
      auth:
        existingSecret: mailu-mariadb
      enabled: true
      primary:
        extraEnvVars:
        - name: ROUNDCUBE_DB_PW
          valueFrom:
            secretKeyRef:
              key: password
              name: mailu-roundcube
        - name: ROUNDCUBE_DB_NAME
          value: roundcube
        - name: ROUNDCUBE_DB_USER
          value: roundcube
        persistence:
          enabled: true
          storageClass: longhorn-db
    oletools:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        enabled: true
        readOnlyRootFilesystem: true
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
    permanentSessionLifetime: 31536000
    persistence:
      single_pvc: false
    postfix:
      persistence:
        storageClass: longhorn-db
      updateStrategy:
        type: Recreate
    proxyAuth:
      create: "true"
      header: Remote-Email
      whitelist: 10.42.0.0/16
    rspamd:
      persistence:
        storageClass: longhorn-db
      resources:
        limits:
          cpu: 1
          memory: 400M
        requests:
          cpu: 100m
          memory: 100Mi
      updateStrategy:
        type: Recreate
    sessionTimeout: 259201
    subnet: 10.42.0.0/16
    tika:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        enabled: true
        readOnlyRootFilesystem: true
        runAsGroup: 35002
        runAsNonRoot: true
        runAsUser: 35002
      extraVolumeMounts:
      - mountPath: /tmp
        name: tmp
      extraVolumes:
      - emptyDir: {}
        name: tmp
    timezone: Europe/Paris
    webdav:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        enabled: true
        readOnlyRootFilesystem: true
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      enabled: true
      extraVolumeMounts:
      - mountPath: /tmp
        name: tmp
      extraVolumes:
      - emptyDir: {}
        name: tmp
      persistence:
        storageClass: longhorn-db
      podSecurityContext:
        enabled: true
        fsGroup: 1001
      updateStrategy:
        type: Recreate
    webmail:
      persistence:
        storageClass: longhorn-db
      resources:
        limits:
          cpu: 1
          memory: 200Mi
        requests:
          cpu: 100m
          memory: 100Mi
      updateStrategy:
        type: Recreate
