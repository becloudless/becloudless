      mailu-pre:
        certManagerCertificates:
          mailu:
            name: mailu
            namespace: default
            secretName: tls-mailu
        roleBindings:
          authelia-secrets-reader:
            name: authelia-secrets-reader
            namespace: default
        roles:
          authelia-secrets-reader:
            name: authelia-secrets-reader
            namespace: default
        stringSecrets:
          mailu:
            name: mailu
            namespace: default
          mailu-api:
            name: mailu-api
            namespace: default
          mailu-authelia:
            name: mailu-authelia
            namespace: default
          mailu-initial-account:
            name: mailu-initial-account
            namespace: default
          mailu-mariadb:
            name: mailu-mariadb
            namespace: default
          mailu-roundcube:
            name: mailu-roundcube
            namespace: default
    resources:
      jobs:
        mailu-accounts:
          activeDeadlineSeconds: 1200
          backoffLimit: 0
          fullNameOverride: mailu-accounts-97bd647638
          template:
            spec:
              containers:
                accounts:
                  args:
                  - |-
                    api=http://mailu-admin:8080/api/v1
                    auth="Authorization: Bearer $API_TOKEN"
                    # the domain is created by the admin of mailu at its start (`initialAccount`)
                    until curl -fsS -H "$auth" "$api/domain/$DOMAIN" > /dev/null; do sleep 5; done
                    code=$(curl -sS -o /dev/null -w '%{http_code}' -H "$auth" "$api/user/$AUTHELIA_EMAIL")
                    case "$code" in
                      200) curl -fsS -X PATCH -H "$auth" -H 'Content-Type: application/json' \
                             -d "{\"raw_password\":\"$AUTHELIA_PASSWORD\"}" "$api/user/$AUTHELIA_EMAIL" ;;
                      404) curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
                             -d "{\"email\":\"$AUTHELIA_EMAIL\",\"raw_password\":\"$AUTHELIA_PASSWORD\",\"comment\":\"Authelia notifier\"}" "$api/user" ;;
                      *) echo "unexpected status $code"; exit 1 ;;
                    esac
                  command:
                  - sh
                  - -ec
                  env:
                    API_TOKEN:
                      secretKeyRef:
                        key: api-token
                        name: mailu-api
                    AUTHELIA_EMAIL: authelia@test.com
                    AUTHELIA_PASSWORD:
                      secretKeyRef:
                        key: password
                        name: mailu-authelia
                    DOMAIN: test.com
                  image: curlimages/curl:8.23.0
                  name: accounts
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        all: ALL
                    readOnlyRootFilesystem: true
              restartPolicy: Never
              securityContext:
                runAsGroup: 1000
                runAsUser: 1000
