# Source: app-mailu/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mailu
  namespace: default
spec:
  chart:
    spec:
      chart: mailu
      sourceRef:
        kind: HelmRepository
        name: mailu
      version: 2.8.0
  dependsOn:
  - name: app-longhorn
    namespace: longhorn-system
  - name: mailu-pre
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  postRenderers:
  - kustomize:
      patches:
      - patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mailu-front
          spec:
            template:
              spec:
                containers:
                - name: vpn
                  image: ghcr.io/becloudless/alpine-wireguard:1.260202.1735-H7074dbd
                  securityContext:
                    privileged: true
                  command: [ sh, -x, -e, -c ]
                  args:
                  - |
                    wg-quick down wg0 || true
                    wg-quick up wg0
                    KUBE_GATEWAY=$(/sbin/ip route | awk '/default/ { print $3 }')
                    ip route add 172.16.42.0/24 via $KUBE_GATEWAY || true
                    ip route add 10.42.0.0/16 via $KUBE_GATEWAY || true
                    sleep infinity
                  livenessProbe:
                    exec:
                      command: [ping, -c1, -W2, 10.0.0.1]
                    initialDelaySeconds: 10
                    periodSeconds: 10
                  volumeMounts:
                  - mountPath: /etc/wireguard
                    name: conf
                volumes:
                - name: conf
                  secret:
                    secretName: mailu-front-vpn
                    defaultMode: 0400
        target:
          kind: Deployment
          name: mailu-front
      - patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mailu-postfix
          spec:
            template:
              spec:
                containers:
                - name: vpn
                  image: ghcr.io/becloudless/alpine-wireguard:1.260202.1735-H7074dbd
                  securityContext:
                    privileged: true
                  command: [ sh, -x, -e, -c ]
                  args:
                  - |
                    wg-quick down wg0 || true
                    wg-quick up wg0
                    KUBE_GATEWAY=$(/sbin/ip route | awk '/default/ { print $3 }')
                    ip route add 172.16.42.0/24 via $KUBE_GATEWAY || true
                    ip route add 10.42.0.0/16 via $KUBE_GATEWAY || true
                    sleep infinity
                  livenessProbe:
                    exec:
                      command: [ping, -c1, -W2, 10.0.0.1]
                    initialDelaySeconds: 10
                    periodSeconds: 10
                  volumeMounts:
                  - mountPath: /etc/wireguard
                    name: conf
                volumes:
                - name: conf
                  secret:
                    secretName: mailu-postfix-vpn
                    defaultMode: 0400
        target:
          kind: Deployment
          name: mailu-postfix
  timeout: 15m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    admin:
      updateStrategy:
        type: Recreate
    clamav:
      persistence:
        storageClass: longhorn-files
      resources:
        limits:
          cpu: 1
          memory: 3Gi
        requests:
          cpu: 100m
          memory: 1.5Gi
    domain: test.com
    dovecot:
      containerSecurityContext:
        capabilities:
          add:
          - SYS_CHROOT
        enabled: true
        runAsUser: 0
      persistence:
        storageClass: longhorn-files
      resources:
        limits:
          cpu: 2
          memory: 1.5Gi
        requests:
          cpu: 100m
          memory: 500Mi
      updateStrategy:
        type: Recreate
    existingSecret: mailu
    front:
      containerSecurityContext:
        capabilities:
          add:
          - SYS_CHROOT
        enabled: true
        runAsUser: 0
      externalService:
        enabled: true
        externalTrafficPolicy: Cluster
        type: LoadBalancer
      updateStrategy:
        type: Recreate
    global:
      database:
        roundcube:
          database: roundcube
          existingSecret: mailu-roundcube
          existingSecretPasswordKey: password
      storageClass: longhorn-db
    hostnames:
    - mail.test.com
    - imap.test.com
    ingress:
      enabled: false
      existingSecret: tls-mailu
      proxyProtocol:
        imap: true
        imaps: true
        manageSieve: true
        pop3: true
        pop3s: true
        smtp: true
        smtps: true
        submission: true
      realIpFrom: 10.0.0.0/8
      realIpHeader: ""
      tlsFlavorOverride: mail
    mariadb:
      auth:
        existingSecret: mailu-mariadb
      enabled: true
      primary:
        extraEnvVars:
        - name: ROUNDCUBE_DB_PW
          valueFrom:
            secretKeyRef:
              key: password
              name: mailu-roundcube
        - name: ROUNDCUBE_DB_NAME
          value: roundcube
        - name: ROUNDCUBE_DB_USER
          value: roundcube
        persistence:
          enabled: true
          storageClass: longhorn-db
    permanentSessionLifetime: 31536000
    persistence:
      single_pvc: false
    postfix:
      updateStrategy:
        type: Recreate
    rspamd:
      resources:
        limits:
          cpu: 1
          memory: 400M
        requests:
          cpu: 100m
          memory: 100Mi
      updateStrategy:
        type: Recreate
    sessionTimeout: 259201
    subnet: 10.42.0.0/16
    timezone: Europe/Paris
    webdav:
      enabled: true
      updateStrategy:
        type: Recreate
    webmail:
      resources:
        limits:
          cpu: 1
          memory: 200Mi
        requests:
          cpu: 100m
          memory: 100Mi
      updateStrategy:
        type: Recreate
