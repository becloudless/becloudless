apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mailu-pre
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-secret-generator
    namespace: secret-generator
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      certManagerCertificates:
        mailu:
          dnsNames:
            imap: imap.test.com
            mail: mail.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-mailu
      stringSecrets:
        mailu:
          fields:
            secret-key:
              encoding: hex
              fieldName: secret-key
              length: "32"
        mailu-mariadb:
          fields:
            password:
              encoding: hex
              fieldName: mariadb-password
              length: "32"
            replication-password:
              encoding: hex
              fieldName: mariadb-replication-password
              length: "32"
            root-password:
              encoding: hex
              fieldName: mariadb-root-password
              length: "32"
        mailu-roundcube:
          fields:
            password:
              encoding: hex
              fieldName: password
              length: "32"
