# Source: app-mattermost/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mattermost-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  - name: mattermost
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      certManagerCertificates:
        mattermost-gateway:
          dnsNames:
            mattermost: mattermost.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-mattermost-gateway
      httpRoutes:
        mattermost:
          hostnames:
            mattermost: mattermost.test.com
          parentRefs:
            mattermost:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: mattermost
          rules:
            root:
              backendRefs:
                mattermost:
                  name: mattermost
                  port: 8065
              timeouts:
                request: 0s
      listenerSets:
        mattermost:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: mattermost.test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-mattermost-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
