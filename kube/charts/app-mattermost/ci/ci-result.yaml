# Source: app-mattermost/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mattermost-pre
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: authelia-pre
    namespace: authelia
  - name: app-external-secrets
    namespace: external-secrets
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      externalSecrets:
        mattermost-oidc:
          data:
            client-id:
              remoteRef:
                key: authelia-oidc-mattermost
                property: client-id
              secretKey: client-id
            secret:
              remoteRef:
                key: authelia-oidc-mattermost
                property: secret
              secretKey: secret
          refreshInterval: 1h
          secretStoreRef:
            kind: SecretStore
            name: authelia
      secretStores:
        authelia:
          provider:
            kubernetes:
              auth:
                serviceAccount:
                  name: authelia-reader
              remoteNamespace: authelia
              server:
                caProvider:
                  key: ca.crt
                  name: kube-root-ca.crt
                  type: ConfigMap
      serviceAccounts:
        authelia-reader:
          automountServiceAccountToken: false
