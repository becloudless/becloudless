---
# Source: app-mattermost/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mattermost
  namespace: default
spec:
  egress:
  - toFQDNs:
    - matchName: authelia.test.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEntities:
    - ingress
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        cnpg.io/cluster: mattermost-postgresql
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mattermost
  ingress:
  - fromEntities:
    - host
    - ingress
    - remote-node
    toPorts:
    - ports:
      - port: "8065"
        protocol: TCP
---
# Source: app-mattermost/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mattermost
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: mattermost-postgresql
  - name: mattermost-pre
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 15m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      deployments:
        mattermost:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: mattermost
          strategy:
            type: Recreate
          template:
            metadata:
              labels:
                app.kubernetes.io/name: mattermost
            spec:
              containers:
                mattermost:
                  env:
                    DB_PASSWORD:
                      secretKeyRef:
                        key: password
                        name: mattermost-postgresql-app
                    MM_EMAILSETTINGS_ENABLESIGNINWITHEMAIL: "false"
                    MM_EMAILSETTINGS_ENABLESIGNINWITHUSERNAME: "false"
                    MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL: "false"
                    MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
                    MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS: "false"
                    MM_LOGSETTINGS_CONSOLELEVEL: INFO
                    MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"
                    MM_LOGSETTINGS_ENABLEFILE: "false"
                    MM_OPENIDSETTINGS_BUTTONTEXT: Authelia
                    MM_OPENIDSETTINGS_DISCOVERYENDPOINT: https://authelia.test.com/.well-known/openid-configuration
                    MM_OPENIDSETTINGS_ENABLE: "true"
                    MM_OPENIDSETTINGS_ID:
                      secretKeyRef:
                        key: client-id
                        name: mattermost-oidc
                    MM_OPENIDSETTINGS_SECRET:
                      secretKeyRef:
                        key: secret
                        name: mattermost-oidc
                    MM_OPENIDSETTINGS_USEPREFERREDUSERNAME: "true"
                    MM_PLUGINSETTINGS_ENABLEMARKETPLACE: "false"
                    MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
                    MM_SERVICESETTINGS_ENABLESECURITYFIXALERT: "false"
                    MM_SERVICESETTINGS_SITEURL: https://mattermost.test.com
                    MM_SQLSETTINGS_DATASOURCE: postgres://app:$(DB_PASSWORD)@mattermost-postgresql-rw:5432/app?sslmode=require&connect_timeout=10
                    MM_SQLSETTINGS_DRIVERNAME: postgres
                  image: mattermost/mattermost-enterprise-edition:12.0.1
                  livenessProbe:
                    failureThreshold: 6
                    httpGet:
                      path: /api/v4/system/ping
                      port: 8065
                    periodSeconds: 30
                    timeoutSeconds: 10
                  name: mattermost
                  ports:
                    http:
                      containerPort: 8065
                  readinessProbe:
                    httpGet:
                      path: /api/v4/system/ping
                      port: 8065
                    timeoutSeconds: 5
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        all: ALL
                    runAsGroup: 2000
                    runAsNonRoot: true
                    runAsUser: 2000
                    seccompProfile:
                      type: RuntimeDefault
                  startupProbe:
                    failureThreshold: 120
                    httpGet:
                      path: /api/v4/system/ping
                      port: 8065
                    periodSeconds: 5
                  volumeMounts:
                    client-plugins:
                      mountPath: /mattermost/client/plugins
                      name: data
                      subPath: client-plugins
                    config:
                      mountPath: /mattermost/config
                      name: data
                      subPath: config
                    data:
                      mountPath: /mattermost/data
                      name: data
                      subPath: data
                    plugins:
                      mountPath: /mattermost/plugins
                      name: data
                      subPath: plugins
              enableServiceLinks: false
              securityContext:
                fsGroup: 2000
              volumes:
                data:
                  name: data
                  persistentVolumeClaim:
                    claimName: mattermost-data
      persistentVolumeClaims:
        mattermost-data:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
          storageClassName: longhorn
      services:
        mattermost:
          ports:
            http:
              port: 8065
          selector:
            app.kubernetes.io/name: mattermost
