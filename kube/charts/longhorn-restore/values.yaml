# yaml-language-server: $schema=../base/schema/values.schema.json

# Restores the volumes of an app from the backups of Longhorn, so an app that is enabled again (or on a new cluster) finds its data.
# It is installed by the `apps` chart (`restore: true` of an app), in the namespace `backup-restore` (app-backup-restore, which has the account and the
# rights of the job), before the app.
#
# Nothing is declared: the job looks for the PVCs of the namespace in the backups of Longhorn (it saves the namespace and the name
# of the PVC in each backup, the storage class and the access mode are the ones of the backed up volume). For each PVC that has a
# backup and does not exist yet, it
#  - takes the last completed backup (after a sync of the backup target `default`, which is skipped when every PVC that has a
#    backup already exists: the job is a no-op on a running app, and does not need the backup target);
#  - creates a Longhorn volume restored from this backup (`fromBackup`), and waits for the end of the restore;
#  - creates the PV of this volume with a `claimRef` to the PVC, which is bound to it when the app creates it (with the same name,
#    storage class and access mode, as it was when it was backed up).
# Nothing is done when no backup target is configured, or when there is no backup of the namespace (a new app starts empty). The
# PVCs that an app does not use anymore but are in the backups are restored too (a PV for a claim that never comes, delete it).
#
# The volumes of a CloudNativePG cluster (Longhorn saves the workload of the PVC, of type `Cluster`) are restored as the first
# instance only: the most recent backup of any of its instances, as the PVC `<cluster>-1`, created by the job with the labels and
# annotations of CloudNativePG (a PVC created by the operator would be initialised empty). The operator adopts it when the `Cluster`
# is created, promotes it, and the other instances are cloned from it. The cluster is not restored when any of its PVCs exists.
# The password of the `app` user is the one of the new secret of the cluster: the operator sets it in the database.
#
# The capacity of the PV is the size of the volume at the time of the backup: it is the size of the PVC when it was not resized,
# and a PVC asking for more than this stays pending.
# The data is the one of a crash-consistent snapshot: the databases recover like after a crash. There is no WAL archive: the
# transactions after the last backup are lost.
#
# The secrets generated for the app (the ones owned by a `StringSecret` of secret-generator: a database encryption key, the password of
# an administrator stored in the database... a new one would not match the restored data) are saved by the CronJob `secrets-backup`
# in the bucket of the backup target (`longhorn-backups` of Garage, S3, see app-backup-restore), `secrets/<namespace>/<secret>/<date>.json`
# (Longhorn only uses `backupstore/`), one
# object by change of a secret (the previous values are kept). The job restores the last version of each one that does not exist, before
# the volumes, when the namespace has no `StringSecret` yet (the app never ran): secret-generator does not touch a secret that it does
# not own, so the app finds them as they were. The restored secrets are labelled `restore.becloudless/from-backup`, and owned by their
# `StringSecret` by the CronJob when it exists (a field added later to the `StringSecret` is generated). The `apps` chart gives the
# account of the jobs the right to read and create the secrets of the namespace (see `restore` in the apps chart).
# Nothing is done for the secrets when the secret `s3Secret` (the key of the bucket) does not exist, the volumes do not need it.

restore:
  namespace: "" # the namespace of the app, where the PVCs and the secrets are
  secretsBackupSchedule: "7 * * * *"
  s3Secret: s3-secrets # the key of the bucket (`AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `AWS_ENDPOINTS`), copied by app-backup-restore
  secretsBucket: longhorn-backups
  secretsRegion: garage

resources:
  jobs:
    longhorn-restore:
      fullNameOverride: 'restore-{{ .Values.restore.namespace | trunc 30 | trimSuffix "-" }}-{{ list 6 .Values.restore | toJson | sha256sum | trunc 10 }}' # change the 6 when the spec of the Job changes (immutable fields)
      backoffLimit: 2
      activeDeadlineSeconds: 3000
      template: &template # the pod of the CronJob of the secrets is the same, it runs the same script in another `MODE`
        metadata:
          labels:
            app.kubernetes.io/name: longhorn-restore # selected by the network policy of app-backup-restore and the one of app-garage
        spec: &spec
          restartPolicy: Never
          enableServiceLinks: false
          serviceAccountName: backup-restore # see app-backup-restore
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            restore: &container
              name: restore
              image: docker.io/alpine/k8s:1.36.5 # renovate: versioning=loose
              command: [ bash, -ec ]
              args:
                - |
                  set -o pipefail
                  LH=longhorn-system
                  log() { echo "$(date -u +%H:%M:%S) $*"; }
                  volume_name() { echo "restore-$(printf '%s/%s' "$NAMESPACE" "$1" | sha256sum | cut -c1-16)"; }

                  # The secrets are in the bucket `$BUCKET`: `secrets/<namespace>/<secret>/<date>.json`, one object by version of a secret, the
                  # dates sort. Returns 1 (nothing to do) when the key of the bucket is not there.
                  s3_init() {
                    if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_ENDPOINTS:-}" ]; then
                      log 'no key of the bucket of the secrets, the secrets are not handled'
                      return 1
                    fi
                    bucket=$BUCKET
                    aws configure set default.s3.addressing_style path
                  }
                  s3() { aws --endpoint-url "$AWS_ENDPOINTS" "$@"; }

                  # Saves the secrets generated by secret-generator (and the ones restored, until they are owned by it), when a version
                  # is not the last saved.
                  backup_secrets() {
                    s3_init || return 0
                    # the secrets restored are not owned by their StringSecret (it does not own the secret, and does not touch it): it
                    # is the owner of a restored secret from now on, a field added to it later is generated
                    owners=$(kubectl -n "$NAMESPACE" get stringsecrets.secretgenerator.mittwald.de -o json | jq -c '.items[] | {name: .metadata.name, uid: .metadata.uid}')
                    while read -r o; do
                      [ -n "$o" ] || continue
                      name=$(jq -r .name <<< "$o")
                      if kubectl -n "$NAMESPACE" get secret "$name" -o json --ignore-not-found |
                          jq -e '.metadata.labels["restore.becloudless/from-backup"] == "true" and ((.metadata.ownerReferences // []) | length == 0)' > /dev/null; then
                        kubectl -n "$NAMESPACE" patch secret "$name" --type merge -p "$(jq -c '{metadata: {labels: {"restore.becloudless/from-backup": null}, ownerReferences: [{apiVersion: "secretgenerator.mittwald.de/v1alpha1", kind: "StringSecret", name: .name, uid: .uid, controller: true}]}}' <<< "$o")" > /dev/null
                        log "$name: owned by its StringSecret"
                      fi
                    done <<< "$owners"

                    secrets=$(kubectl -n "$NAMESPACE" get secrets -o json | jq -c '.items[]
                      | select(.metadata.labels["restore.becloudless/from-backup"] == "true" or any(.metadata.ownerReferences[]?; .kind == "StringSecret"))
                      | {name: .metadata.name, type: .type, data: .data}')
                    while read -r s; do
                      [ -n "$s" ] || continue
                      name=$(jq -r .name <<< "$s")
                      last=$(s3 s3api list-objects-v2 --bucket "$bucket" --prefix "secrets/$NAMESPACE/$name/" --query 'Contents[-1].Key' --output text)
                      if [ "$last" != None ] && [ "$(s3 s3 cp --quiet "s3://$bucket/$last" - | jq -cS .)" = "$(jq -cS . <<< "$s")" ]; then
                        continue
                      fi
                      key="secrets/$NAMESPACE/$name/$(date -u +%Y%m%dT%H%M%SZ).json"
                      printf '%s' "$s" | s3 s3 cp --quiet - "s3://$bucket/$key"
                      log "$name: saved in $key"
                    done <<< "$secrets"
                  }

                  # Restores the last version of the secrets that do not exist, when the app never ran (it has no StringSecret).
                  restore_secrets() {
                    if [ -n "$(kubectl -n "$NAMESPACE" get stringsecrets.secretgenerator.mittwald.de -o name 2> /dev/null)" ]; then
                      log 'the app generated its secrets already'
                      return 0
                    fi
                    s3_init || return 0
                    keys=$(s3 s3api list-objects-v2 --bucket "$bucket" --prefix "secrets/$NAMESPACE/" --query 'Contents[].Key' --output json | jq -r '.[]?')
                    last=$(awk -F/ 'NF == 4 { last[$3] = $0 } END { for (n in last) print last[n] }' <<< "$keys")
                    [ -n "$last" ] || { log 'no secret saved, the app generates its own'; return 0; }
                    while read -r key; do
                      name=$(awk -F/ '{ print $3 }' <<< "$key")
                      [ -z "$(kubectl -n "$NAMESPACE" get secret "$name" -o name --ignore-not-found)" ] || continue
                      s3 s3 cp --quiet "s3://$bucket/$key" - |
                        jq --arg ns "$NAMESPACE" '{apiVersion: "v1", kind: "Secret",
                                                   metadata: {name: .name, namespace: $ns, labels: {"restore.becloudless/from-backup": "true"}},
                                                   type: (.type // "Opaque"), data: .data}' |
                        kubectl create -f - > /dev/null
                      log "$name: restored from $key"
                    done <<< "$last"
                  }

                  if [ "$MODE" = backup-secrets ]; then
                    backup_secrets
                    exit 0
                  fi
                  restore_secrets

                  # the last completed backup of each PVC of the namespace, one JSON per line. The instances of a CloudNativePG cluster
                  # (`cluster`) are one PVC, `<cluster>-1`, with the last backup of any of them (not the ones of the WAL volumes)
                  latest() {
                    kubectl -n "$LH" get backups.longhorn.io -o json | jq -c --arg ns "$NAMESPACE" '
                      [.items[]
                        | select(.status.state == "Completed")
                        | (.status.labels.KubernetesStatus // "{}" | try fromjson catch {}) as $k
                        | select($k.namespace == $ns and ($k.pvcName // "") != "")
                        | ([$k.workloadsStatus[]? | select(.workloadType == "Cluster") | .workloadName] | first // "") as $cluster
                        | select($cluster == "" or ($k.pvcName | test("-wal$") | not))
                        | {pvc: (if $cluster == "" then $k.pvcName else $cluster + "-1" end), cluster: $cluster, volume: .status.volumeName, url: .status.url,
                           size: .status.volumeSize, createdAt: .status.backupCreatedAt,
                           mode: (.status.labels["longhorn.io/volume-access-mode"] // "rwo")}]
                      | group_by(.pvc) | map(sort_by(.createdAt) | last) | .[]'
                  }
                  # ... without PVC (any instance for a cluster), and without volume already restored for it
                  missing() {
                    while read -r b; do
                      [ -n "$b" ] || continue
                      pvc=$(echo "$b" | jq -r .pvc)
                      cluster=$(echo "$b" | jq -r .cluster)
                      if [ -n "$cluster" ]; then
                        [ -z "$(kubectl -n "$NAMESPACE" get pvc -l "cnpg.io/cluster=$cluster" -o name)" ] || continue
                      else
                        [ -z "$(kubectl -n "$NAMESPACE" get pvc "$pvc" -o name --ignore-not-found)" ] || continue
                        [ -z "$(kubectl get pv "$(volume_name "$pvc")" -o name --ignore-not-found)" ] || continue
                      fi
                      echo "$b"
                    done <<< "$(latest)"
                  }

                  if [ -z "$(kubectl -n "$LH" get backuptargets.longhorn.io default -o jsonpath='{.spec.backupTargetURL}')" ]; then
                    log 'no backup target, nothing to restore'
                    exit 0
                  fi
                  if [ -n "$(latest)" ] && [ -z "$(missing)" ]; then
                    log 'the PVCs that have a backup exist'
                    exit 0
                  fi

                  # the backups are listed by the sync of the target: ask for one, and wait for the target and its volumes
                  start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  kubectl -n "$LH" patch backuptargets.longhorn.io default --type merge -p "{\"spec\":{\"syncRequestedAt\":\"$start\"}}" > /dev/null
                  n=0
                  until kubectl -n "$LH" get backuptargets.longhorn.io default -o json |
                        jq -e --arg s "$start" '.status.available == true and ((.status.lastSyncedAt // "") >= $s)' > /dev/null &&
                      kubectl -n "$LH" get backupvolumes.longhorn.io -o json |
                        jq -e --arg s "$start" 'all(.items[]; (.status.lastSyncedAt // "") >= $s)' > /dev/null; do
                    n=$((n + 1))
                    [ "$n" -lt 120 ] || { log 'the backup target is not synced'; exit 1; }
                    sleep 5
                  done

                  todo=$(missing)
                  [ -n "$todo" ] || { log 'no backup, the app starts empty'; exit 0; }

                  while read -r b; do
                    pvc=$(echo "$b" | jq -r .pvc)
                    cluster=$(echo "$b" | jq -r .cluster)
                    volume=$(echo "$b" | jq -r .volume)
                    size=$(echo "$b" | jq -r .size)
                    url=$(echo "$b" | jq -r .url)
                    class=$(kubectl -n "$LH" get backupvolumes.longhorn.io -o json | jq -r --arg v "$volume" '[.items[] | select(.spec.volumeName == $v)][0].status.storageClassName // empty')
                    sc=$(kubectl get storageclass "$class" -o json --ignore-not-found)
                    if [ -z "$class" ] || [ -z "$sc" ]; then
                      log "$pvc: the storage class '$class' of the backup does not exist, skipped"
                      continue
                    fi
                    log "$pvc: restoring the backup of $(echo "$b" | jq -r .createdAt) (class $class)"
                    name=$(volume_name "$pvc")

                    # the parameters of the storage class, as the provisioner would use them
                    replicas=$(echo "$sc" | jq -r '.parameters.numberOfReplicas // "3"')
                    stale=$(echo "$sc" | jq -r '.parameters.staleReplicaTimeout // "30"')
                    block=$(echo "$sc" | jq -r '.parameters.backupBlockSize // ""')
                    case "$block" in
                      '') block= ;;
                      *Mi) block=$((${block%Mi} * 1048576)) ;;
                      *Ki) block=$((${block%Ki} * 1024)) ;;
                    esac
                    case "$(echo "$b" | jq -r .mode)" in rwx) mode=ReadWriteMany; lhmode=rwx ;; *) mode=ReadWriteOnce; lhmode=rwo ;; esac

                    if [ -z "$(kubectl -n "$LH" get volumes.longhorn.io "$name" -o name --ignore-not-found)" ]; then
                      jq -n --arg name "$name" --arg url "$url" --arg size "$size" --arg block "$block" \
                        --arg mode "$lhmode" --arg ns "$NAMESPACE" --arg pvc "$pvc" --argjson replicas "$replicas" --argjson stale "$stale" '
                        {apiVersion: "longhorn.io/v1beta2", kind: "Volume",
                         metadata: {name: $name, namespace: "longhorn-system", labels: {"restore.becloudless/namespace": $ns, "restore.becloudless/pvc": $pvc}},
                         spec: ({fromBackup: $url, size: $size, numberOfReplicas: $replicas, staleReplicaTimeout: $stale, frontend: "blockdev", accessMode: $mode}
                                + (if $block == "" then {} else {backupBlockSize: $block} end))}' |
                        kubectl create -f -
                    fi
                    n=0
                    until kubectl -n "$LH" get volumes.longhorn.io "$name" -o json |
                          jq -e '.status.restoreInitiated == true and (.status.restoreRequired // false) == false' > /dev/null; do
                      n=$((n + 1))
                      [ "$n" -lt 300 ] || { log "$pvc: the restore of $name is not done"; exit 1; }
                      sleep 5
                    done

                    # the PV with the claim: the PVC of the app is bound to it as soon as it is created
                    jq -n --arg name "$name" --arg size "$size" --arg class "$class" --arg mode "$mode" --arg ns "$NAMESPACE" --arg pvc "$pvc" \
                      --arg replicas "$replicas" --arg stale "$stale" '
                      {apiVersion: "v1", kind: "PersistentVolume",
                       metadata: {name: $name},
                       spec: {capacity: {storage: $size}, volumeMode: "Filesystem", accessModes: [$mode], persistentVolumeReclaimPolicy: "Delete",
                              storageClassName: $class, claimRef: {namespace: $ns, name: $pvc},
                              csi: {driver: "driver.longhorn.io", fsType: "ext4", volumeHandle: $name,
                                    volumeAttributes: {numberOfReplicas: $replicas, staleReplicaTimeout: $stale}}}}' |
                      kubectl apply -f -

                    # the instance of a CloudNativePG cluster: the operator only adopts a PVC that is ready and has its labels, and
                    # creates an empty one otherwise
                    if [ -n "$cluster" ] && [ -z "$(kubectl -n "$NAMESPACE" get pvc "$pvc" -o name --ignore-not-found)" ]; then
                      jq -n --arg name "$name" --arg size "$size" --arg class "$class" --arg ns "$NAMESPACE" --arg pvc "$pvc" --arg cluster "$cluster" '
                        {apiVersion: "v1", kind: "PersistentVolumeClaim",
                         metadata: {name: $pvc, namespace: $ns,
                                    labels: {"cnpg.io/cluster": $cluster, "cnpg.io/instanceName": $pvc, "cnpg.io/pvcRole": "PG_DATA",
                                             "app.kubernetes.io/component": "database", "app.kubernetes.io/managed-by": "cloudnative-pg",
                                             "app.kubernetes.io/name": "postgresql"},
                                    annotations: {"cnpg.io/nodeSerial": "1", "cnpg.io/pvcStatus": "ready"}},
                         spec: {accessModes: ["ReadWriteOnce"], storageClassName: $class, resources: {requests: {storage: $size}}, volumeName: $name}}' |
                        kubectl create -f -
                    fi
                    log "$pvc: restored in the volume $name"
                  done <<< "$todo"
              env: &env
                NAMESPACE: '{{ .Values.restore.namespace }}'
                HOME: /tmp
                MODE: restore
                BUCKET: '{{ .Values.restore.secretsBucket }}'
                AWS_DEFAULT_REGION: '{{ .Values.restore.secretsRegion }}'
              envFrom:
                s3: # the key of the bucket of the secrets, if there is one
                  secretRef:
                    name: '{{ .Values.restore.s3Secret }}'
                    optional: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                capabilities:
                  drop:
                    all: ALL
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                tmp:
                  name: tmp
                  mountPath: /tmp
          volumes:
            tmp:
              name: tmp
              emptyDir: {}

  # Saves the secrets generated for the app, see the header of this file
  cronJobs:
    secrets-backup:
      fullNameOverride: 'secrets-backup-{{ .Values.restore.namespace | trunc 30 | trimSuffix "-" }}'
      schedule: '{{ .Values.restore.secretsBackupSchedule }}'
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 1
      jobTemplate:
        spec:
          backoffLimit: 1
          activeDeadlineSeconds: 600
          template:
            <<: *template
            spec:
              <<: *spec
              containers:
                restore:
                  <<: *container
                  env:
                    <<: *env
                    MODE: backup-secrets
