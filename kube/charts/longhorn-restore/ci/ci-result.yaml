              value: garage
            - name: BUCKET
              value: longhorn-backups
            - name: HOME
              value: /tmp
            - name: MODE
              value: backup-secrets
            - name: NAMESPACE
              value: test
            envFrom:
            - secretRef:
                name: s3-secrets
                optional: true
            image: docker.io/alpine/k8s:1.36.5
            name: restore
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /scripts
              name: script
              readOnly: true
            - mountPath: /tmp
              name: tmp
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: backup-restore
          volumes:
          - configMap:
