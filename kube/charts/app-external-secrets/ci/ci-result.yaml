---
# Source: app-external-secrets/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  chart:
    spec:
      chart: external-secrets
      sourceRef:
        kind: HelmRepository
        name: external-secrets
      version: 2.12.0
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
---
# Source: app-external-secrets/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 10m
  url: https://charts.external-secrets.io
