---
# Source: base-test/templates/loader.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/name: base-test
  name: test-release
  namespace: default
spec:
  selector:
    matchLabels:
      app: myapp
      app.kubernetes.io/component: main
      app.kubernetes.io/instance: test-release
      app.kubernetes.io/name: base-test
  template:
    metadata:
      labels:
        app: myapp
        app.kubernetes.io/component: main
        app.kubernetes.io/instance: test-release
        app.kubernetes.io/name: base-test
    spec:
      containers:
      - image: myimage:latest
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 0
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: myapp
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 0
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          initialDelaySeconds: 0
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        volumeMounts:
          tmp:
            mountPath: /tmp
            name: tmp
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: tmp
