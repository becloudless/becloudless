---
# Source: base-test/templates/loader.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/name: base-test
  name: test-release
  namespace: default
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          labels:
            app.kubernetes.io/component: main
            app.kubernetes.io/instance: test-release
            app.kubernetes.io/name: base-test
        spec:
          containers:
          - image: myimage:latest
            name: myapp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
            volumeMounts:
              tmp:
                mountPath: /tmp
                name: tmp
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - emptyDir: {}
            name: tmp
  schedule: '*/5 * * * *'
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
