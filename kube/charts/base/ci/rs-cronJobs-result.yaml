---
# Source: base-test/templates/loader.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: test-release
  namespace: default
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - image: myimage:latest
            name: myapp
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
  schedule: '*/5 * * * *'
