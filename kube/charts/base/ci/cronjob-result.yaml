---
# Source: base-test/templates/loader.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: test-release
  labels:
    app: test-release
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: test-release
    helm.sh/chart: base-test-0.0.0
spec:
  concurrencyPolicy: "Forbid"
  startingDeadlineSeconds: 30
  timeZone: "UTC"
  schedule: "32 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          annotations:
            checksum/configMaps: afdf20f511621d5cb358c5e8b0da2d14cdbe2549fb12fa123f6a6e9baabef26e
            cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
          labels:
            app: test-release
            app.kubernetes.io/component: main
            app.kubernetes.io/instance: test-release
            app.kubernetes.io/name: test-release
        spec:
          enableServiceLinks: true
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          containers:
            - image: ghcr.io/mendhak/http-https-echo:31
              imagePullPolicy: IfNotPresent
              name: main
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
