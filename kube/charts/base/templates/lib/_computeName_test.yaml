# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: resource naming (prefixNamesWithRelease, nameOverride, fullNameOverride, "main" id)
templates:
  - loader.yaml
release:
  name: test-release
  namespace: default
tests:
  - it: names the resource "<id>" without the release name by default
    set:
      resources:
        secrets:
          plain:
            stringData:
              a: b
    asserts:
      - equal:
          path: metadata.name
          value: plain

  - it: names the resource "<nameOverride>" without the release name by default
    set:
      resources:
        secrets:
          customId:
            nameOverride: my-custom-id
            stringData:
              a: b
    asserts:
      - equal:
          path: metadata.name
          value: my-custom-id

  - it: names the resource "<release>-<id>" when prefixNamesWithRelease is true
    set:
      prefixNamesWithRelease: true
      resources:
        secrets:
          plain:
            stringData:
              a: b
    asserts:
      - equal:
          path: metadata.name
          value: test-release-plain

  - it: names the resource "<release>-<nameOverride>" when prefixNamesWithRelease is true
    set:
      prefixNamesWithRelease: true
      resources:
        secrets:
          customId:
            nameOverride: my-custom-id
            stringData:
              a: b
    asserts:
      - equal:
          path: metadata.name
          value: test-release-my-custom-id

  - it: collapses the name to the release name alone when nameOverride is "main"
    set:
      resources:
        secrets:
          collapsedToRelease:
            nameOverride: main
            stringData:
              a: b
    asserts:
      - equal:
          path: metadata.name
          value: test-release

  - it: collapses the name to the release name alone when the id itself is "main"
    set:
      resources:
        secrets:
          main:
            stringData:
              a: b
    asserts:
      - equal:
          path: metadata.name
          value: test-release

  - it: keeps naming the "main" id after the release when prefixNamesWithRelease is true
    set:
      prefixNamesWithRelease: true
      resources:
        secrets:
          main:
            stringData:
              a: b
    asserts:
      - equal:
          path: metadata.name
          value: test-release

  - it: uses fullNameOverride verbatim, ignoring the release name entirely
    set:
      prefixNamesWithRelease: true
      resources:
        secrets:
          normal:
            stringData:
              a: b
          fullyOverridden:
            fullNameOverride: totally-custom-name
            stringData:
              a: b
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: totally-custom-name
        documentSelector:
          path: metadata.name
          value: totally-custom-name
      - equal:
          path: metadata.name
          value: test-release-normal
        documentSelector:
          path: metadata.name
          value: test-release-normal

  - it: fails when the computed resource name exceeds the Kubernetes 63 character limit
    set:
      resources:
        secrets:
          this-is-a-very-long-resource-identifier-that-pushes-the-name-over-the-limit:
            stringData:
              a: b
    asserts:
      - failedTemplate:
          errorMessageRegex: "exceeds the Kubernetes maximum of 63 characters"

