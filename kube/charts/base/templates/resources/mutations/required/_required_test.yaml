# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: required field validation (generated from the upstream k8s schema)
templates:
  - loader.yaml
release:
  name: test-release
  namespace: default
tests:
  - it: fails with a clear error when a required field is missing (scaleTargetRef)
    set:
      resources:
        horizontalPodAutoscalers:
          myhpa:
            minReplicas: 1
            maxReplicas: 3
    asserts:
      - failedTemplate:
          errorMessage: 'resources.horizontalPodAutoscalers.myhpa: "scaleTargetRef" is required'

  - it: fails with a clear error when a required field is missing (maxReplicas)
    set:
      resources:
        horizontalPodAutoscalers:
          myhpa:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: myapp
            minReplicas: 1
    asserts:
      - failedTemplate:
          errorMessage: 'resources.horizontalPodAutoscalers.myhpa: "maxReplicas" is required'

  - it: passes when all required fields are present
    set:
      resources:
        horizontalPodAutoscalers:
          myhpa:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: myapp
            minReplicas: 1
            maxReplicas: 3
    asserts:
      - notFailedTemplate: {}

  - it: is satisfied by fields coming only from defaults.resources (merged before validation)
    set:
      defaults:
        resources:
          horizontalPodAutoscalers:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: myapp
      resources:
        horizontalPodAutoscalers:
          myhpa:
            minReplicas: 1
            maxReplicas: 3
    asserts:
      - notFailedTemplate: {}

  - it: fails with a clear error when a required field is missing (selector)
    set:
      resources:
        deployments:
          myapp:
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                containers:
                  - name: myapp
                    image: myimage:latest
    asserts:
      - failedTemplate:
          errorMessage: 'resources.deployments.myapp: "selector" is required'

  - it: fails on the nested field when the parent object is only created by defaults.resources (template.spec.containers)
    set:
      defaults:
        resources:
          deployments:
            template:
              spec:
                enableServiceLinks: false
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
    asserts:
      - failedTemplate:
          errorMessage: 'resources.deployments.myapp.template.spec: "containers" is required'

  - it: passes when all required fields are present (deployments)
    set:
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                containers:
                  - name: myapp
                    image: myimage:latest
    asserts:
      - notFailedTemplate: {}

  - it: kinds without required fields (e.g. configMaps) are unaffected
    set:
      resources:
        configMaps:
          plain:
            data:
              key: value
    asserts:
      - notFailedTemplate: {}

  - it: fails with the path of the object when a nested required field is missing (template.spec.containers)
    set:
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                hostname: myapp
    asserts:
      - failedTemplate:
          errorMessage: 'resources.deployments.myapp.template.spec: "containers" is required'

  - it: fails with the id of the entry when a required field is missing in an entry of a map (containers.<id>.name)
    set:
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                containers:
                  web:
                    image: myimage:latest
    asserts:
      - failedTemplate:
          errorMessage: 'resources.deployments.myapp.template.spec.containers.web: "name" is required'

  - it: fails with the index of the entry when a required field is missing in an entry of a list
    set:
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                containers:
                  - image: myimage:latest
    asserts:
      - failedTemplate:
          errorMessage: 'resources.deployments.myapp.template.spec.containers[0]: "name" is required'

  - it: fails when a field required by the entries of a dependsOn is missing
    set:
      resources:
        fluxHelmReleases:
          myrelease:
            chart:
              spec:
                chart: mychart
                sourceRef:
                  kind: HelmRepository
                  name: myrepository
            dependsOn:
              mydependency:
                namespace: default
    asserts:
      - failedTemplate:
          errorMessage: 'resources.fluxHelmReleases.myrelease.dependsOn.mydependency: "name" is required'

  - it: validates the objects under the values of a map with a scalar or an object value (env)
    set:
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                containers:
                  myapp:
                    name: myapp
                    image: myimage:latest
                    env:
                      TZ: europe/paris
                      PASSWORD:
                        secretKeyRef:
                          name: mysecret
    asserts:
      - failedTemplate:
          errorMessage: 'resources.deployments.myapp.template.spec.containers.myapp.env.PASSWORD.secretKeyRef: "key" is required'

  - it: is satisfied by nested fields coming only from defaults.resources (merged before validation)
    set:
      defaults:
        resources:
          deployments:
            template:
              spec:
                containers:
                  myapp:
                    name: myapp
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                containers:
                  myapp:
                    image: myimage:latest
    asserts:
      - notFailedTemplate: {}

  - it: accepts partial defaults, the nested required fields are only validated on the resources
    set:
      defaults:
        resources:
          deployments:
            template:
              spec:
                enableServiceLinks: false
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                containers:
                  myapp:
                    name: myapp
                    image: myimage:latest
    asserts:
      - notFailedTemplate: {}
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: false

  - it: does not validate the nested required fields of a disabled resource
    set:
      resources:
        deployments:
          myapp:
            enabled: false
            template:
              spec:
                hostname: myapp
    asserts:
      - notFailedTemplate: {}
