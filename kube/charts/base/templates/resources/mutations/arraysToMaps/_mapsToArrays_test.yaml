# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: mapsToArrays mutation (reverses the schema-time ArraysToMaps conversion)
templates:
  - loader.yaml
release:
  name: test-release
  namespace: default
tests:
  - it: converts a top-level id-keyed map field into an array sorted alphabetically by key (Service.spec.ports)
    set:
      resources:
        services:
          mysvc:
            selector:
              app: myapp
            ports:
              https:
                port: 443
                targetPort: 8443
              http:
                port: 80
                targetPort: 8080
    asserts:
      - equal:
          path: spec.ports
          value:
            - name: http
              port: 80
              targetPort: 8080
            - name: https
              port: 443
              targetPort: 8443

  - it: leaves a field at a configured arrayPath untouched when it is already given as a plain list
    set:
      resources:
        services:
          mysvc:
            selector:
              app: myapp
            ports:
              - port: 80
                targetPort: 8080
    asserts:
      - equal:
          path: spec.ports
          value:
            - port: 80
              targetPort: 8080

  - it: omits the field entirely when not set, without erroring
    set:
      resources:
        services:
          mysvc:
            selector:
              app: myapp
    asserts:
      - notExists:
          path: spec.ports

  - it: converts a deeply nested id-keyed map field (Deployment.spec.template.spec.containers)
    set:
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                containers:
                  web:
                    name: web
                    image: nginx:1.27
                    command:
                      - sh
                      - -c
                      - echo hi
                  api:
                    name: api
                    image: myapi:latest
    asserts:
      # only the fields of the test: the containers also get the defaults of the chart (defaults.container)
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
      # sorted by id
      - equal:
          path: spec.template.spec.containers[0].name
          value: api
      - equal:
          path: spec.template.spec.containers[0].image
          value: myapi:latest
      - equal:
          path: spec.template.spec.containers[1].name
          value: web
      - equal:
          path: spec.template.spec.containers[1].image
          value: nginx:1.27
      - equal:
          path: spec.template.spec.containers[1].command
          value:
            - sh
            - -c
            - echo hi

  - it: leaves an ignored array-typed field (container command/args) untouched as a plain list, not reinterpreted as an id-keyed map
    set:
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                containers:
                  main:
                    name: main
                    image: nginx
                    command:
                      - sh
                      - -c
                      - echo hi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - sh
            - -c
            - echo hi

  - it: recursively converts a nested id-keyed map inside an already-converted array item (container volumeMounts)
    set:
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                containers:
                  main:
                    name: main
                    image: nginx
                    volumeMounts:
                      data:
                        name: data
                        mountPath: /data
                      cache:
                        name: cache
                        mountPath: /cache
    asserts:
      # only the mounts of the test: the container also gets the ones of the defaults (defaults.container)
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /cache
            name: cache
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /data
            name: data

  - it: leaves nested maps untouched for kinds with no configured arrayPaths at all (ConfigMap.binaryData)
    set:
      resources:
        configMaps:
          myconfig:
            binaryData:
              nested:
                foo: bar
    asserts:
      - equal:
          path: binaryData.nested
          value:
            foo: bar

  - it: sets the keyFields field (StringSecret fields.fieldName) to the key of the items that do not set it
    set:
      resources:
        stringSecrets:
          main:
            fields:
              password: {}
              admin-token:
                encoding: hex
                length: "64"
              jwt:
                fieldName: LLDAP_JWT_SECRET
    asserts:
      - equal:
          path: spec.fields
          value:
            - encoding: hex
              fieldName: admin-token
              length: "64"
            - fieldName: LLDAP_JWT_SECRET
            - fieldName: password
