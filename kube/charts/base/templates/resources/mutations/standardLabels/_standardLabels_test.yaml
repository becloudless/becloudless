# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: standard labels (name, instance, component) of the workloads and the services
templates:
  - loader.yaml
release:
  name: test-release
  namespace: default
tests:
  - it: labels and selects the deployments with the chart, the release and the id
    set:
      resources:
        deployments:
          web:
            template:
              spec:
                containers:
                  app:
                    name: app
                    image: img
    asserts:
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: base-test
            app.kubernetes.io/instance: test-release
            app.kubernetes.io/component: web
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: base-test
            app.kubernetes.io/instance: test-release
            app.kubernetes.io/component: web
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/name: base-test
            app.kubernetes.io/instance: test-release
            app.kubernetes.io/component: web

  - it: labels the pods of the statefulSets and the daemonSets
    set:
      resources:
        statefulSets:
          db:
            serviceName: db
            template:
              spec:
                containers:
                  app:
                    name: app
                    image: img
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: db
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: test-release

  - it: labels the pods of the jobs and the cronJobs, without a selector for the jobs
    set:
      resources:
        jobs:
          once:
            template:
              spec:
                restartPolicy: Never
                containers:
                  app:
                    name: app
                    image: img
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: once
      - notExists:
          path: spec.selector

  - it: labels the pods of the cronJobs
    set:
      resources:
        cronJobs:
          nightly:
            schedule: "0 4 * * *"
            jobTemplate:
              spec:
                template:
                  spec:
                    restartPolicy: Never
                    containers:
                      app:
                        name: app
                        image: img
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels
          value:
            app.kubernetes.io/name: base-test
            app.kubernetes.io/instance: test-release
            app.kubernetes.io/component: nightly

  - it: keeps the labels and the selector set by the resource
    set:
      resources:
        deployments:
          web:
            labels:
              app.kubernetes.io/component: custom
              team: platform
            selector:
              matchLabels:
                app.kubernetes.io/component: custom
            template:
              metadata:
                labels:
                  app.kubernetes.io/component: custom
              spec:
                containers:
                  app:
                    name: app
                    image: img
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: base-test
            app.kubernetes.io/instance: test-release
            app.kubernetes.io/component: custom
      - equal:
          path: metadata.labels.team
          value: platform
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: custom

  - it: does not leak the global metadata labels in the selector
    set:
      defaults:
        metadata:
          labels:
            global: "yes"
      resources:
        deployments:
          web:
            template:
              spec:
                containers:
                  app:
                    name: app
                    image: img
    asserts:
      - equal:
          path: metadata.labels.global
          value: "yes"
      - notExists:
          path: spec.selector.matchLabels.global
      - notExists:
          path: spec.template.metadata.labels.global

  - it: selects the component of its own id on a service
    set:
      resources:
        services:
          web:
            ports:
              http:
                port: 80
    asserts:
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: base-test
            app.kubernetes.io/instance: test-release
            app.kubernetes.io/component: web
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: base-test
            app.kubernetes.io/instance: test-release
            app.kubernetes.io/component: web

  - it: completes the selector of a service that selects another component of the release
    set:
      resources:
        services:
          db-headless:
            clusterIP: None
            selector:
              app.kubernetes.io/component: db
            ports:
              pg:
                port: 5432
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: base-test
            app.kubernetes.io/instance: test-release
            app.kubernetes.io/component: db
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: db-headless

  - it: keeps the selector of a service that selects the pods of another release
    set:
      resources:
        services:
          pg-rw:
            selector:
              cnpg.io/cluster: pg
              cnpg.io/instanceRole: primary
            ports:
              pg:
                port: 5432
    asserts:
      - equal:
          path: spec.selector
          value:
            cnpg.io/cluster: pg
            cnpg.io/instanceRole: primary

  - it: gives no selector to an ExternalName service
    set:
      resources:
        services:
          external:
            type: ExternalName
            externalName: example.com
    asserts:
      - notExists:
          path: spec.selector
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: external

  - it: does not label the other kinds
    set:
      resources:
        configMaps:
          plain:
            data:
              key: value
    asserts:
      - notExists:
          path: metadata.labels
