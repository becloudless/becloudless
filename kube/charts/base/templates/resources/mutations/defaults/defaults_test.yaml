# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: defaults merging per kind and defaults.metadata across kinds
templates:
  - loader.yaml
release:
  name: test-release
  namespace: default
set:
  prefixNamesWithRelease: true # the assertions use the "<release>-<id>" names
tests:
  - it: applies defaults.resources.<kind> when the resource does not set the field itself
    set:
      defaults:
        resources:
          configMaps:
            labels:
              app: shared-default
              team: platform
      resources:
        configMaps:
          uses-default-only:
            data:
              key: value1
    asserts:
      - equal:
          path: metadata.labels
          value:
            app: shared-default
            team: platform

  - it: lets the resource's own field override the default for that same key
    set:
      defaults:
        resources:
          configMaps:
            labels:
              app: shared-default
              team: platform
      resources:
        configMaps:
          overrides-default:
            labels:
              app: custom-app
            data:
              key: value2
    asserts:
      - equal:
          path: metadata.labels
          value:
            app: custom-app
            team: platform

  - it: applies defaults.metadata across every kind, below defaults.resources.<kind> in precedence
    set:
      defaults:
        metadata:
          labels:
            org: acme
          annotations:
            managed-by: base
        resources:
          configMaps:
            labels:
              app: shared-default
      resources:
        configMaps:
          uses-kind-and-global-defaults:
            data:
              key: value1
        secrets:
          uses-global-default-only:
            stringData:
              key: value2
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.labels
          value:
            app: shared-default
            org: acme
        documentSelector:
          path: metadata.name
          value: test-release-uses-kind-and-global-defaults
      - equal:
          path: metadata.annotations
          value:
            managed-by: base
        documentSelector:
          path: metadata.name
          value: test-release-uses-kind-and-global-defaults
      - equal:
          path: metadata.labels
          value:
            org: acme
        documentSelector:
          path: metadata.name
          value: test-release-uses-global-default-only
      - equal:
          path: metadata.annotations
          value:
            managed-by: base
        documentSelector:
          path: metadata.name
          value: test-release-uses-global-default-only

  - it: lets the resource's own field override defaults.metadata for the same key
    set:
      defaults:
        metadata:
          labels:
            app: global-default
      resources:
        configMaps:
          overrides-global-default:
            labels:
              app: custom-app
            data:
              key: value1
    asserts:
      - equal:
          path: metadata.labels
          value:
            app: custom-app

  - it: applies defaults.metadata.namespace when the resource does not set its own namespace
    set:
      defaults:
        metadata:
          namespace: shared-ns
      resources:
        configMaps:
          uses-global-namespace:
            data:
              key: value1
    asserts:
      - equal:
          path: metadata.namespace
          value: shared-ns

  - it: lets the resource's own namespace override defaults.metadata.namespace
    set:
      defaults:
        metadata:
          namespace: shared-ns
      resources:
        configMaps:
          overrides-global-namespace:
            namespace: custom-ns
            data:
              key: value1
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-ns

  - it: lets a resource field that is false override a default that is true
    set:
      defaults:
        resources:
          deployments:
            template:
              spec:
                securityContext:
                  runAsNonRoot: true
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                securityContext:
                  runAsNonRoot: false
                containers:
                  - name: myapp
                    image: myimage:latest
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: false

  - it: applies defaults.container to the containers and the initContainers, given as a map or as a list
    set:
      defaults:
        container:
          securityContext:
            readOnlyRootFilesystem: true
          imagePullPolicy: IfNotPresent
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                containers:
                  web:
                    name: web
                    image: myimage:latest
                    securityContext:
                      runAsUser: 1000
                initContainers:
                  - name: init
                    image: myimage:latest
        cronJobs:
          mycron:
            schedule: "* * * * *"
            jobTemplate:
              spec:
                template:
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: job
                        image: myimage:latest
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            readOnlyRootFilesystem: true
            runAsUser: 1000
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.readOnlyRootFilesystem
          value: true
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
        documentSelector:
          path: kind
          value: CronJob

  - it: lets a container opt out of defaults.container with a false value
    set:
      defaults:
        container:
          securityContext:
            readOnlyRootFilesystem: true
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                containers:
                  web:
                    name: web
                    image: myimage:latest
                    securityContext:
                      readOnlyRootFilesystem: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false

  - it: applies defaults.pod to the pod spec of every kind with a pod template, below defaults.resources.<kind>
    set:
      defaults:
        pod:
          priorityClassName: from-pod
          securityContext:
            runAsNonRoot: true
        resources:
          statefulSets:
            template:
              spec:
                priorityClassName: from-kind
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                containers:
                  - name: myapp
                    image: myimage:latest
        statefulSets:
          mydb:
            serviceName: mydb
            selector:
              matchLabels:
                app: mydb
            template:
              metadata:
                labels:
                  app: mydb
              spec:
                containers:
                  - name: mydb
                    image: myimage:latest
        cronJobs:
          mycron:
            schedule: "* * * * *"
            jobTemplate:
              spec:
                template:
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: job
                        image: myimage:latest
    asserts:
      - equal:
          path: spec.template.spec.priorityClassName
          value: from-pod
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.priorityClassName
          value: from-kind
        documentSelector:
          path: kind
          value: StatefulSet
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsNonRoot
          value: true
        documentSelector:
          path: kind
          value: CronJob

  - it: lets the pod spec of a resource override defaults.pod with a false value
    set:
      defaults:
        pod:
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
      resources:
        deployments:
          myapp:
            selector:
              matchLabels:
                app: myapp
            template:
              metadata:
                labels:
                  app: myapp
              spec:
                enableServiceLinks: true
                securityContext:
                  runAsNonRoot: false
                containers:
                  - name: myapp
                    image: myimage:latest
    asserts:
      - equal:
          path: spec.template.spec.enableServiceLinks
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: false

  - it: does not apply defaults.pod to the kinds without a pod template
    set:
      defaults:
        pod:
          enableServiceLinks: false
      resources:
        configMaps:
          plain:
            data:
              key: value
    asserts:
      - notExists:
          path: spec
