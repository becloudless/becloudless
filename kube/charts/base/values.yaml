# yaml-language-server: $schema=./schema/values.schema.json

checkRequiredValues: true

defaults:
  metadata:
    namespace: "{{ .Release.Namespace }}"

  resources:
    fluxHelmRepositories:
      interval: 10m

    fluxHelmReleases:
      interval: 10m
      timeout: 2m
      rollback:
        cleanupOnFail: true
      install:
        crds: CreateReplace
