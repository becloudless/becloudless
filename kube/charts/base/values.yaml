# yaml-language-server: $schema=./schema/values.schema.json

checkRequiredValues: true

prefixNamesWithRelease: false

defaults:
  metadata:
    namespace: "{{ .Release.Namespace }}"

  # The pods are compliant by default with the kyverno policies of app-kyverno (container-require-run-as-non-root,
  # container-require-read-only-root-filesystem, pod-disable-service-links, pod-set-seccomp-profile). An app that needs more
  # overrides the field in its own `securityContext` (e.g. `runAsNonRoot: false`, `readOnlyRootFilesystem: false`) or opts out
  # with the annotation `policy.bcl/skip...` of the policy.

  # applied to the pod spec of the deployments, statefulSets, daemonSets, jobs and cronJobs
  pod:
    enableServiceLinks: false
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

  # applied to every container and initContainer of the deployments, statefulSets, daemonSets, jobs and cronJobs
  container:
    securityContext:
      readOnlyRootFilesystem: true
      # the API rejects `false` with `privileged: true` or the capability `SYS_ADMIN`: such a container sets `true`
      allowPrivilegeEscalation: false

  resources:

    fluxOCIRepositories:
      interval: 10m

    fluxGitRepositories:
      interval: 10m

    fluxHelmRepositories:
      interval: 10m

    fluxHelmReleases:
      interval: 10m        
      timeout: 10m
      # failed install/upgrade are retried forever, in place and without rollback/uninstall:
      # - the rollback remediation stalls the release (MissingRollbackTarget) once no good revision is left
      #   in the history, and never retries until a manual `flux reconcile hr --reset`
      # - the uninstall remediation would delete stateful resources (databases, volumes)
      install:
        crds: CreateReplace
        strategy:
          name: RetryOnFailure
          retryInterval: 5m
      upgrade:
        cleanupOnFail: true
        strategy:
          name: RetryOnFailure
          retryInterval: 5m
      driftDetection:
        mode: enabled
      # TODO a degraded CNPG cluster (e.g. a replica being rebuilt) must not fail the release: the primary is enough
      # healthCheckExprs:
      #   cnpg-cluster:
      #     apiVersion: postgresql.cnpg.io/v1
      #     kind: Cluster
      #     current: has(status.readyInstances) && status.readyInstances >= 1

    fluxKustomizations:
      interval: 10m
      prune: true
      wait: true