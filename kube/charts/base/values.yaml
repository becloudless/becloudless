# yaml-language-server: $schema=./schema/values.schema.json

checkRequiredValues: true

defaults:
  metadata:
    namespace: "{{ .Release.Namespace }}"

  resources:
    fluxOCIRepositories:
      interval: 10m

    fluxHelmRepositories:
      interval: 10m

    fluxHelmReleases:
      interval: 10m
      timeout: 2m
      rollback:
        cleanupOnFail: true
      install:
        crds: CreateReplace
        remediation:
          retries: -1
      upgrade:
        remediation:
          retries: 3
