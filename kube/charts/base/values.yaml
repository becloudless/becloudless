# yaml-language-server: $schema=./schema/values.schema.json

checkRequiredValues: true

prefixNamesWithRelease: false

defaults:
  metadata:
    namespace: "{{ .Release.Namespace }}"

  resources:
    fluxOCIRepositories:
      interval: 10m

    fluxGitRepositories:
      interval: 10m

    fluxHelmRepositories:
      interval: 10m

    fluxHelmReleases:
      interval: 10m
      timeout: 2m
      rollback:
        cleanupOnFail: true
      install:
        crds: CreateReplace
        remediation:
          retries: -1 # unlimited, the failed install is uninstalled between each attempt
      upgrade:
        remediation:
          retries: 3
      driftDetection:
        mode: enabled

    fluxKustomizations:
      interval: 10m
      prune: true
      wait: true