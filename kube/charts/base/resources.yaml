resources:
  - name: configMaps
    sourceOpenAPI:
      url: https://raw.githubusercontent.com/kubernetes/kubernetes/master/api/openapi-spec/v3/api__v1_openapi.json
      component: io.k8s.api.core.v1.ConfigMap
    apiVersion: v1
    kind: ConfigMap
    mutations:
      extractContent:
        contentIsOutOfSpec: true
      stringifyFields:
        fields:
          - data
  - name: secrets
    sourceOpenAPI:
      url: https://raw.githubusercontent.com/kubernetes/kubernetes/master/api/openapi-spec/v3/api__v1_openapi.json
      component: io.k8s.api.core.v1.Secret
