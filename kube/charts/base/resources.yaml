    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
  - name: services
    sourceOpenAPI:
      url: https://raw.githubusercontent.com/kubernetes/kubernetes/master/api/openapi-spec/v3/api__v1_openapi.json
