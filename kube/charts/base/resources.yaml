  - name: deployments
    sourceOpenAPI:
      url: https://raw.githubusercontent.com/kubernetes/kubernetes/master/api/openapi-spec/v3/apis__apps__v1_openapi.json
      component: io.k8s.api.apps.v1.Deployment
    apiVersion: apps/v1
    kind: Deployment
    mutations:
      arraysToMaps:
        ignore:
          - template.spec.containers.command
          - template.spec.containers.args
          - template.spec.initContainers.command
          - template.spec.initContainers.args
  - name: statefulSets
    sourceOpenAPI:
