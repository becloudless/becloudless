apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: longhorn-post
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      longhorn-integration:
        certManagerCertificates:
          longhorn-gateway:
            name: longhorn-gateway
            namespace: default
            secretName: tls-longhorn-gateway
        httpRoutes:
          longhorn:
            name: longhorn
            namespace: default
        listenerSets:
          longhorn:
            name: longhorn
            namespace: default
      longhorn-post:
        longhornRecurringJobs:
          daily-backups:
            name: daily-backups
            namespace: default
        longhornSettings:
          allow-collecting-longhorn-usage-metrics:
            name: allow-collecting-longhorn-usage-metrics
            namespace: default
          concurrent-automatic-engine-upgrade-per-node-limit:
            name: concurrent-automatic-engine-upgrade-per-node-limit
            namespace: default
          default-backup-block-size:
            name: default-backup-block-size
            namespace: default
          upgrade-checker:
            name: upgrade-checker
            namespace: default
        storageClasses:
          longhorn-db:
            name: longhorn-db
            namespace: default
          longhorn-files:
            name: longhorn-files
            namespace: default
          longhorn-single-local-replica:
            name: longhorn-single-local-replica
            namespace: default
        volumeSnapshotClasses:
          longhorn-backing-image:
            name: longhorn-backing-image
            namespace: default
          longhorn-backup-full:
            name: longhorn-backup-full
            namespace: default
          longhorn-backup-incremental:
            name: longhorn-backup-incremental
            namespace: default
          longhorn-snapshot:
            name: longhorn-snapshot
            namespace: default
      longhorn-pre:
        configMaps:
          longhorn-nixos-path:
            name: longhorn-nixos-path
            namespace: default
        kyvernoClusterPolicies:
          longhorn-add-nixos-path:
            name: longhorn-add-nixos-path
            namespace: default
          longhorn-host-users:
            name: longhorn-host-users
            namespace: default
          longhorn-skip-security-audit:
            name: longhorn-skip-security-audit
            namespace: default
    resources:
      certManagerCertificates:
        longhorn-gateway:
          dnsNames:
            longhorn: longhorn.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-longhorn-gateway
      httpRoutes:
        longhorn:
          hostnames:
            longhorn: longhorn.test.com
          parentRefs:
            longhorn:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: longhorn
              sectionName: longhorn
          rules:
            root:
              backendRefs:
                backend:
                  name: longhorn-frontend
                  port: 80
              filters:
                authelia:
                  externalAuth:
                    backendRef:
                      name: authelia
                      namespace: authelia
                      port: 80
                    http:
                      allowedHeaders:
                        accept: accept
                        cookie: cookie
                        proxy-authorization: proxy-authorization
                        x-forwarded-for: x-forwarded-for
                        x-forwarded-proto: x-forwarded-proto
                      allowedResponseHeaders:
                        remote-email: remote-email
                        remote-groups: remote-groups
                        remote-name: remote-name
                        remote-user: remote-user
                      path: /api/authz/ext-authz/
                    protocol: HTTP
                  type: ExternalAuth
      listenerSets:
        longhorn:
          listeners:
            longhorn:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: longhorn.test.com
              name: longhorn
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: ref:longhorn-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
