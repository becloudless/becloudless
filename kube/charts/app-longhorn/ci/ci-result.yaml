apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-attachment-repair
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: bcl
  dependsOn:
  - name: longhorn
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      longhorn-attachment-repair:
        ciliumNetworkPolicies:
          attachment-repair:
            name: attachment-repair
            namespace: default
        clusterRoleBindings:
          attachment-repair:
            name: attachment-repair
            namespace: default
        clusterRoles:
          attachment-repair:
            name: attachment-repair
            namespace: default
        configMaps:
          attachment-repair:
            name: attachment-repair
            namespace: default
        cronJobs:
          attachment-repair:
            labels:
              app.kubernetes.io/component: attachment-repair
              app.kubernetes.io/instance: longhorn-attachment-repair
            name: attachment-repair
            namespace: default
        roleBindings:
          attachment-repair:
            name: attachment-repair
            namespace: default
        roles:
          attachment-repair:
            name: attachment-repair
            namespace: default
        serviceAccounts:
          attachment-repair:
            name: attachment-repair
            namespace: default
      longhorn-integration:
        certManagerCertificates:
          longhorn-gateway:
            name: longhorn-gateway
            namespace: default
            secretName: tls-longhorn-gateway
        httpRoutes:
          longhorn:
            name: longhorn
            namespace: default
        listenerSets:
          longhorn:
            name: longhorn
            namespace: default
      longhorn-post:
        longhornRecurringJobs:
          daily-backups:
            name: daily-backups
            namespace: default
        longhornSettings:
          allow-collecting-longhorn-usage-metrics:
            name: allow-collecting-longhorn-usage-metrics
            namespace: default
          concurrent-automatic-engine-upgrade-per-node-limit:
            name: concurrent-automatic-engine-upgrade-per-node-limit
            namespace: default
          default-backup-block-size:
            name: default-backup-block-size
            namespace: default
          replica-replenishment-wait-interval:
            name: replica-replenishment-wait-interval
            namespace: default
          upgrade-checker:
            name: upgrade-checker
            namespace: default
        storageClasses:
          longhorn-db:
            name: longhorn-db
            namespace: default
          longhorn-files:
            name: longhorn-files
            namespace: default
        volumeSnapshotClasses:
          longhorn-backing-image:
            name: longhorn-backing-image
            namespace: default
          longhorn-backup-full:
            name: longhorn-backup-full
            namespace: default
          longhorn-backup-incremental:
            name: longhorn-backup-incremental
            namespace: default
          longhorn-snapshot:
            name: longhorn-snapshot
            namespace: default
      longhorn-pre:
        configMaps:
          longhorn-nixos-path:
            name: longhorn-nixos-path
            namespace: default
        kyvernoClusterPolicies:
          longhorn-add-nixos-path:
            name: longhorn-add-nixos-path
            namespace: default
          longhorn-host-users:
            name: longhorn-host-users
            namespace: default
          longhorn-skip-security-audit:
            name: longhorn-skip-security-audit
            namespace: default
      longhorn-volume-replicas:
        ciliumNetworkPolicies:
          volume-replicas:
            name: volume-replicas
            namespace: default
        clusterRoleBindings:
          volume-replicas:
            name: volume-replicas
            namespace: default
        clusterRoles:
          volume-replicas:
            name: volume-replicas
            namespace: default
        configMaps:
          volume-replicas:
            name: volume-replicas
            namespace: default
        cronJobs:
          volume-replicas:
            labels:
              app.kubernetes.io/component: volume-replicas
              app.kubernetes.io/instance: longhorn-volume-replicas
            name: volume-replicas
            namespace: default
        roleBindings:
          volume-replicas:
            name: volume-replicas
            namespace: default
        roles:
          volume-replicas:
            name: volume-replicas
            namespace: default
        serviceAccounts:
          volume-replicas:
            name: volume-replicas
            namespace: default
    resources:
      ciliumNetworkPolicies:
        attachment-repair:
          egress:
            kube-apiserver:
              toEntities:
              - kube-apiserver
          endpointSelector:
            matchLabels:
              app.kubernetes.io/component: attachment-repair
      clusterRoleBindings:
        attachment-repair:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: attachment-repair
          subjects:
            attachment-repair:
              kind: ServiceAccount
              name: attachment-repair
              namespace: default
      clusterRoles:
        attachment-repair:
          rules:
            volumeattachments:
              apiGroups:
              - storage.k8s.io
              resources:
              - volumeattachments
              verbs:
              - get
              - list
      configMaps:
        attachment-repair:
          data:
            attachment-repair.sh: |-
              #!/usr/bin/env bash
              # See the header of the values of the chart app-longhorn.
              set -uo pipefail

              NAMESPACE=${NAMESPACE:-longhorn-system}
              RECHECK=${RECHECK:-60}        # seconds between the two checks: a ticket or a replica has to be stale in both
              MAX_REPAIRS=${MAX_REPAIRS:-5} # more stale tickets (or replicas) than that is not a leak, something else is wrong: nothing is removed
              DRY_RUN=${DRY_RUN:-false}

              log() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $*"; }

              # One line for each ticket of the CSI attacher that has no VolumeAttachment of Kubernetes: `<volume> <ticket> <node>` (tab separated).
              stale_tickets() {
                local k8s lh
                k8s=$(kubectl get volumeattachments.storage.k8s.io -o json) || return 1
                lh=$(kubectl -n "$NAMESPACE" get volumeattachments.longhorn.io -o json) || return 1
                jq -r --argjson k8s "$k8s" '
                  ($k8s.items | map({key: .metadata.name, value: true}) | from_entries) as $known
                  | .items[]
                  | .metadata.name as $volume
                  | (.spec.attachmentTickets // {}) | to_entries[]
                  | select(.value.type == "csi-attacher" and (.key | startswith("csi-")))
                  | select(.key as $id | $known[$id] | not)
                  | [$volume, .key, .value.nodeID] | @tsv' <<<"$lh"
              }

              # One line for each replica on a disk that its node does not have any more (a disk that was initialized again gets a new
              # UUID, the data of the replica is gone), while the volume has another healthy replica on a disk of its node:
              # `<volume> <replica> <node> <disk>` (tab separated). Such a replica can not start, it blocks the attach of the volume.
              stale_replicas() {
                local nodes replicas
                nodes=$(kubectl -n "$NAMESPACE" get nodes.longhorn.io -o json) || return 1
                replicas=$(kubectl -n "$NAMESPACE" get replicas.longhorn.io -o json) || return 1
                jq -r --argjson nodes "$nodes" '
                  # the UUIDs of the disks of each node, a node without any known disk (not started yet) has no entry
                  ($nodes.items
                    | map({key: .metadata.name, value: [(.status.diskStatus // {}) | .[] | .diskUUID // empty | select(. != "")]})
                    | map(select(.value | length > 0))
                    | from_entries) as $disks
                  | def onDisk: (.spec.diskID // "") as $d | ($disks[.spec.nodeID // ""] // []) | any(. == $d);
                  .items as $all
                  | $all[]
                  | select(.metadata.deletionTimestamp == null)
                  | select((.spec.nodeID // "") != "" and (.spec.diskID // "") != "")
                  | select($disks[.spec.nodeID] != null)
                  | select(onDisk | not)
                  | select((.status.currentState // "") != "running")
                  | select(.spec.volumeName as $volume | .metadata.name as $name
                      | any($all[]; .spec.volumeName == $volume and .metadata.name != $name
                          and (.spec.failedAt // "") == "" and (.spec.healthyAt // "") != "" and onDisk))
                  | [.spec.volumeName, .metadata.name, .spec.nodeID, .spec.diskID] | @tsv' <<<"$replicas"
              }

              # The lines of the first list that are also in the second one.
              both() {
                local line out=""
                while IFS= read -r line; do
                  if [ -n "$line" ] && grep -qxF -- "$line" <<<"$2"; then
                    out+="$line"$'\n'
                  fi
                done <<<"$1"
                printf '%s' "${out%$'\n'}"
              }

              # <volume> <reason> <message>: an event on the Longhorn volume
              event() {
                kubectl create -f - <<EOF || true
              apiVersion: v1
              kind: Event
              metadata:
                generateName: attachment-repair-
                namespace: $NAMESPACE
              type: Warning
              reason: $2
              message: "$3"
              involvedObject: {apiVersion: longhorn.io/v1beta2, kind: Volume, name: $1, namespace: $NAMESPACE}
              source: {component: attachment-repair}
              EOF
              }

              # The stale tickets (`<volume> <ticket> <node>` lines) are removed, returns 1 when something went wrong.
              remove_tickets() {
                [ -n "$1" ] || return 0
                local count volume ticket node ctx status=0
                count=$(wc -l <<<"$1")
                if [ "$count" -gt "$MAX_REPAIRS" ]; then
                  log "$count stale tickets, more than $MAX_REPAIRS: not a leak, nothing is removed"
                  return 1
                fi
                while IFS=$'\t' read -r volume ticket node; do
                  ctx="volume $volume, ticket $ticket (node $node)"
                  if [ "$DRY_RUN" = true ]; then
                    log "$ctx: DRY RUN, would remove the ticket"
                    continue
                  fi
                  log "$ctx: no VolumeAttachment for it, removing the ticket"
                  # `test`: the ticket is only removed if it is still the one that was checked
                  if ! kubectl -n "$NAMESPACE" patch volumeattachments.longhorn.io "$volume" --type=json \
                    -p "[{\"op\":\"test\",\"path\":\"/spec/attachmentTickets/$ticket/nodeID\",\"value\":\"$node\"},{\"op\":\"remove\",\"path\":\"/spec/attachmentTickets/$ticket\"}]"; then
                    log "$ctx: cannot remove the ticket"
                    status=1
                    continue
                  fi
                  event "$volume" StaleAttachmentTicketRemoved "the attachment ticket $ticket of the node $node was removed: it has no VolumeAttachment, it kept the volume attached to this node"
                done <<<"$1"
                return $status
              }

              # The stale replicas (`<volume> <replica> <node> <disk>` lines) are removed, returns 1 when something went wrong.
              remove_replicas() {
                [ -n "$1" ] || return 0
                local count volume replica node disk ctx status=0
                count=$(wc -l <<<"$1")
                if [ "$count" -gt "$MAX_REPAIRS" ]; then
                  log "$count stale replicas, more than $MAX_REPAIRS: not a leak, nothing is removed"
                  return 1
                fi
                while IFS=$'\t' read -r volume replica node disk; do
                  ctx="volume $volume, replica $replica (node $node, disk $disk)"
                  if [ "$DRY_RUN" = true ]; then
                    log "$ctx: DRY RUN, would remove the replica"
                    continue
                  fi
                  log "$ctx: the node has no disk with this UUID and the volume has a healthy replica, removing the replica"
                  if ! kubectl -n "$NAMESPACE" delete replicas.longhorn.io "$replica" --wait=false; then
                    log "$ctx: cannot remove the replica"
                    status=1
                    continue
                  fi
                  event "$volume" StaleReplicaRemoved "the replica $replica was removed: its disk $disk is not a disk of the node $node any more, it kept the volume from being attached, Longhorn rebuilds a replica from the healthy ones"
                done <<<"$1"
                return $status
              }

              tickets=$(stale_tickets) || { log "cannot list the attachments"; exit 1; }
              replicas=$(stale_replicas) || { log "cannot list the replicas"; exit 1; }
              if [ -z "$tickets" ] && [ -z "$replicas" ]; then
                log "no stale attachment ticket, no stale replica"
                exit 0
              fi
              [ -z "$tickets" ] || { log "stale attachment tickets:"; echo "$tickets"; }
              [ -z "$replicas" ] || { log "stale replicas:"; echo "$replicas"; }
              log "checking again in ${RECHECK}s"

              sleep "$RECHECK"
              second=$(stale_tickets) || { log "cannot list the attachments"; exit 1; }
              # only what is stale in both checks: a VolumeAttachment that was being created or removed is not, nor a node that was starting
              tickets=$(both "$tickets" "$second")
              second=$(stale_replicas) || { log "cannot list the replicas"; exit 1; }
              replicas=$(both "$replicas" "$second")

              if [ -z "$tickets" ] && [ -z "$replicas" ]; then
                log "nothing is stale in both checks"
                exit 0
              fi

              status=0
              remove_tickets "$tickets" || status=1
              remove_replicas "$replicas" || status=1
              exit $status
      cronJobs:
        attachment-repair:
          concurrencyPolicy: Forbid
          jobTemplate:
            spec:
              activeDeadlineSeconds: 240
              backoffLimit: 0
              template:
                metadata:
                  labels:
                    app.kubernetes.io/component: attachment-repair
                spec:
                  containers:
                    repair:
                      command:
                      - bash
                      - /scripts/attachment-repair.sh
                      env:
                        HOME: /tmp
                        NAMESPACE: default
                      image: docker.io/alpine/k8s:1.37.2
                      name: repair
                      securityContext:
                        capabilities:
                          drop:
                            all: ALL
                      volumeMounts:
                        script:
                          mountPath: /scripts
                          name: script
                          readOnly: true
                  restartPolicy: Never
                  securityContext:
                    runAsGroup: 65534
                    runAsUser: 65534
                  serviceAccountName: attachment-repair
                  volumes:
                    script:
                      configMap:
                        name: attachment-repair
                      name: script
          schedule: '*/5 * * * *'
      roleBindings:
        attachment-repair:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: attachment-repair
          subjects:
            attachment-repair:
              kind: ServiceAccount
              name: attachment-repair
              namespace: default
      roles:
