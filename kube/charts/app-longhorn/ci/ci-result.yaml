# Source: app-longhorn/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: default
spec:
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        name: longhorn
      version: 1.13.0
  dependsOn:
  - name: longhorn-pre
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 15m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    annotations:
      policy.bcl.tf/skipPodSetHostUsers: "true"
    csi:
      kubeletRootDir: /var/lib/kubelet
    defaultBackupStore:
      pollInterval: 180
    defaultSettings:
      allowCollectingLonghornUsageMetrics: false
      autoDeletePodWhenVolumeDetachedUnexpectedly: true
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      nodeDrainPolicy: always-allow
      storageReservedPercentageForDefaultDisk: 5
      upgradeChecker: false
    enablePSP: false
    ingress:
      enabled: false
    persistence:
      defaultClass: false
