---
# Source: app-longhorn/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: default
spec:
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        name: longhorn
      version: 1.13.0
  dependsOn:
  - name: longhorn-pre
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 15m
  upgrade:
    remediation:
      retries: 3
  values:
    csi:
      kubeletRootDir: /var/lib/kubelet
    defaultBackupStore:
      backupTarget: cifs://backupstore/backupstore
      backupTargetCredentialSecret: backupstore
      pollInterval: 180
    defaultSettings:
      autoDeletePodWhenVolumeDetachedUnexpectedly: true
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      nodeDrainPolicy: always-allow
    enablePSP: false
    ingress:
      enabled: false
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  - name: longhorn-post
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    disableWait: true
    remediation:
      retries: 3
  values:
    resources:
      certManagerCertificates:
        longhorn-ui:
          dnsNames:
            ui: longhorn.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-longhorn
      httpRoutes:
        longhorn:
          hostnames:
            ui: longhorn.test.com
          parentRefs:
            longhorn:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: longhorn
          rules:
            ui:
              backendRefs:
                frontend:
                  name: longhorn-frontend
                  port: 80
              filters:
                authelia:
                  externalAuth:
                    backendRef:
                      name: authelia
                      namespace: authelia
                      port: 80
                    http:
                      allowedHeaders:
                        accept: accept
                        cookie: cookie
                        proxy-authorization: proxy-authorization
                        x-forwarded-for: x-forwarded-for
                        x-forwarded-proto: x-forwarded-proto
                      path: /api/authz/ext-authz/
                    protocol: HTTP
                  type: ExternalAuth
      listenerSets:
        longhorn:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: longhorn.test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-longhorn
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-post
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-external-snapshotter
    namespace: external-snapshotter
  - name: longhorn
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    resources:
      longhornRecurringJobs:
        daily-backups:
          concurrency: 1
          cron: 0 4 * * *
          groups:
          - default
          retain: 2
          task: backup
      longhornSettings:
        concurrent-automatic-engine-upgrade-per-node-limit:
          annotations:
            helm.sh/resource-policy: keep
          value: "1"
        default-backup-block-size:
          annotations:
            helm.sh/resource-policy: keep
          value: "16"
      storageClasses:
        longhorn-single-local-replica:
          allowVolumeExpansion: true
          annotations:
            storageclass.kubernetes.io/is-default-class: "false"
          parameters:
            dataLocality: strict-local
            fsType: ext4
            numberOfReplicas: "2"
            recurringJobSelector: '[{"name":"single-local-replica","isGroup":true}]'
            staleReplicaTimeout: "60"
          provisioner: driver.longhorn.io
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
      volumeSnapshotClasses:
        longhorn-backing-image:
          deletionPolicy: Delete
          driver: driver.longhorn.io
          parameters:
            export-type: qcow2
            type: bi
        longhorn-backup-full:
          deletionPolicy: Delete
          driver: driver.longhorn.io
          parameters:
            backupMode: full
            type: bak
        longhorn-backup-incremental:
          deletionPolicy: Delete
          driver: driver.longhorn.io
          parameters:
            type: bak
        longhorn-snapshot:
          deletionPolicy: Delete
          driver: driver.longhorn.io
          parameters:
            type: snap
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-pre
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-kyverno
    namespace: kyverno
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    resources:
      configMaps:
        longhorn-nixos-path:
          data:
            PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/run/wrappers/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin
      kyvernoClusterPolicies:
        longhorn-add-nixos-path:
          annotations:
            policies.kyverno.io/category: Other
            policies.kyverno.io/description: Longhorn invokes executables on the host
              system, and needs to be aware of the host systems PATH. This modifies
              all deployments such that the PATH is explicitly set to support NixOS
              based systems.
            policies.kyverno.io/subject: Pod
            policies.kyverno.io/title: Add Environment Variables from ConfigMap
          failurePolicy: Fail
          rules:
            add-env-vars:
              match:
                resources:
                  kinds:
                  - Pod
                  namespaces:
                  - longhorn-system
              mutate:
                patchStrategicMerge:
                  spec:
                    containers:
                    - (name): '*'
                      envFrom:
                      - configMapRef:
                          name: longhorn-nixos-path
                    initContainers:
                    - (name): '*'
                      envFrom:
                      - configMapRef:
                          name: longhorn-nixos-path
              name: add-env-vars
