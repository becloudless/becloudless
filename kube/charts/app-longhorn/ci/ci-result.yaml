apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 10m
  url: https://charts.longhorn.io
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    hostname: longhorn.test.com
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - name: tls-longhorn
      mode: Terminate
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shared
    namespace: kube-system
