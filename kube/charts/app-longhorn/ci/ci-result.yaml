apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-post
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: longhorn
  - name: app-external-snapshotter
    namespace: external-snapshotter
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      longhorn-integration:
        certManagerCertificates:
          longhorn-gateway:
            name: longhorn-gateway
            namespace: default
            secretName: tls-longhorn-gateway
        httpRoutes:
          longhorn:
            name: longhorn
            namespace: default
        listenerSets:
          longhorn:
            name: longhorn
            namespace: default
      longhorn-post:
        longhornRecurringJobs:
          daily-backups:
            name: daily-backups
            namespace: default
        longhornSettings:
          allow-collecting-longhorn-usage-metrics:
            name: allow-collecting-longhorn-usage-metrics
            namespace: default
          concurrent-automatic-engine-upgrade-per-node-limit:
            name: concurrent-automatic-engine-upgrade-per-node-limit
            namespace: default
          default-backup-block-size:
            name: default-backup-block-size
            namespace: default
          upgrade-checker:
            name: upgrade-checker
            namespace: default
        storageClasses:
          longhorn-db:
            name: longhorn-db
            namespace: default
          longhorn-files:
            name: longhorn-files
            namespace: default
          longhorn-single-local-replica:
            name: longhorn-single-local-replica
            namespace: default
        volumeSnapshotClasses:
          longhorn-backing-image:
            name: longhorn-backing-image
            namespace: default
          longhorn-backup-full:
            name: longhorn-backup-full
            namespace: default
          longhorn-backup-incremental:
            name: longhorn-backup-incremental
            namespace: default
          longhorn-snapshot:
            name: longhorn-snapshot
            namespace: default
      longhorn-pre:
        configMaps:
          longhorn-nixos-path:
            name: longhorn-nixos-path
            namespace: default
        kyvernoClusterPolicies:
          longhorn-add-nixos-path:
            name: longhorn-add-nixos-path
            namespace: default
          longhorn-host-users:
            name: longhorn-host-users
            namespace: default
          longhorn-skip-security-audit:
            name: longhorn-skip-security-audit
            namespace: default
    resources:
      longhornRecurringJobs:
        daily-backups:
          concurrency: 1
          cron: 0 4 * * *
          groups:
          - default
          retain: 2
          task: backup
      longhornSettings:
        allow-collecting-longhorn-usage-metrics:
          annotations:
            helm.sh/resource-policy: keep
          value: "false"
        concurrent-automatic-engine-upgrade-per-node-limit:
          annotations:
            helm.sh/resource-policy: keep
          value: "1"
        default-backup-block-size:
          annotations:
            helm.sh/resource-policy: keep
          value: "16"
        upgrade-checker:
          annotations:
            helm.sh/resource-policy: keep
          value: "false"
      storageClasses:
        longhorn-db:
          allowVolumeExpansion: true
          annotations:
            storageclass.kubernetes.io/is-default-class: "false"
          parameters:
            backupBlockSize: 2Mi
            fsType: ext4
            numberOfReplicas: "2"
            staleReplicaTimeout: "60"
          provisioner: driver.longhorn.io
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
        longhorn-files:
          allowVolumeExpansion: true
          annotations:
            storageclass.kubernetes.io/is-default-class: "false"
          parameters:
            backupBlockSize: 16Mi
            fsType: ext4
            numberOfReplicas: "2"
            staleReplicaTimeout: "60"
          provisioner: driver.longhorn.io
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
        longhorn-single-local-replica:
          allowVolumeExpansion: true
          annotations:
            storageclass.kubernetes.io/is-default-class: "false"
          parameters:
            dataLocality: strict-local
            fsType: ext4
            numberOfReplicas: "2"
            recurringJobSelector: '[{"name":"single-local-replica","isGroup":true}]'
            staleReplicaTimeout: "60"
          provisioner: driver.longhorn.io
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
      volumeSnapshotClasses:
        longhorn-backing-image:
          deletionPolicy: Delete
          driver: driver.longhorn.io
          parameters:
            export-type: qcow2
            type: bi
        longhorn-backup-full:
          deletionPolicy: Delete
          driver: driver.longhorn.io
          parameters:
            backupMode: full
            type: bak
        longhorn-backup-incremental:
          deletionPolicy: Delete
          driver: driver.longhorn.io
          parameters:
            type: bak
        longhorn-snapshot:
          deletionPolicy: Delete
          driver: driver.longhorn.io
          parameters:
            type: snap
