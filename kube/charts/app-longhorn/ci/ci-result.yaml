---
# Source: app-longhorn/templates/loader.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  namespace: longhorn-system
spec: {}
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: v1
data:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/run/wrappers/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin
kind: ConfigMap
metadata:
  name: longhorn-nixos-path
  namespace: longhorn-system
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Other
    policies.kyverno.io/description: Longhorn invokes executables on the host system,
      and needs to be aware of the host systems PATH. This modifies all deployments
      such that the PATH is explicitly set to support NixOS based systems.
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/title: Add Environment Variables from ConfigMap
  name: longhorn-add-nixos-path
  namespace: longhorn-system
spec:
  failurePolicy: Fail
  rules:
  - match:
      resources:
        kinds:
        - Pod
        namespaces:
        - longhorn-system
    mutate:
      patchStrategicMerge:
        spec:
          containers:
          - (name): '*'
            envFrom:
            - configMapRef:
                name: longhorn-nixos-path
          initContainers:
          - (name): '*'
            envFrom:
            - configMapRef:
                name: longhorn-nixos-path
    name: add-env-vars
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        name: longhorn
      version: 1.13.0
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    csi:
      kubeletRootDir: /var/lib/kubelet
    defaultBackupStore:
      backupTarget: cifs://backupstore/backupstore
      backupTargetCredentialSecret: backupstore
      pollInterval: 180
    defaultSettings:
      autoDeletePodWhenVolumeDetachedUnexpectedly: true
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      nodeDrainPolicy: always-allow
    enablePSP: false
    ingress:
      annotations:
        kubernetes.io/tls-acme: "true"
      enabled: false
      host: longhorn.test.com
      tls: true
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-config
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: ./kube/charts/app-longhorn/config
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: default
  dependsOn:
  - name: app-external-snapshotter
    namespace: default
  - name: longhorn
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 10m
  url: https://charts.longhorn.io
