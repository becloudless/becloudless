---
# Source: app-longhorn/templates/loader.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  namespace: longhorn-system
spec: {}
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: v1
data:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/run/wrappers/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin
kind: ConfigMap
metadata:
  name: longhorn-nixos-path
  namespace: longhorn-system
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  dnsNames:
  - longhorn.test.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: tls-longhorn
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Other
    policies.kyverno.io/description: Longhorn invokes executables on the host system,
      and needs to be aware of the host systems PATH. This modifies all deployments
      such that the PATH is explicitly set to support NixOS based systems.
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/title: Add Environment Variables from ConfigMap
  name: longhorn-add-nixos-path
  namespace: longhorn-system
spec:
  failurePolicy: Fail
  rules:
  - match:
      resources:
        kinds:
        - Pod
        namespaces:
        - longhorn-system
    mutate:
      patchStrategicMerge:
        spec:
          containers:
          - (name): '*'
            envFrom:
            - configMapRef:
                name: longhorn-nixos-path
          initContainers:
          - (name): '*'
            envFrom:
            - configMapRef:
                name: longhorn-nixos-path
    name: add-env-vars
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  hostnames:
  - longhorn.test.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: longhorn
  rules:
  - backendRefs:
    - name: longhorn-frontend
      port: 80
    filters:
    - externalAuth:
        backendRef:
          name: authelia
          namespace: authelia
          port: 80
        http:
          allowedHeaders:
          - accept
          - cookie
          - proxy-authorization
          - x-forwarded-for
          - x-forwarded-proto
          path: /api/authz/ext-authz/
        protocol: HTTP
      type: ExternalAuth
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      sourceRef:
        kind: HelmRepository
        name: longhorn
      version: 1.13.0
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    csi:
      kubeletRootDir: /var/lib/kubelet
    defaultBackupStore:
      backupTarget: cifs://backupstore/backupstore
      backupTargetCredentialSecret: backupstore
      pollInterval: 180
    defaultSettings:
      autoDeletePodWhenVolumeDetachedUnexpectedly: true
      nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      nodeDrainPolicy: always-allow
    enablePSP: false
    ingress:
      enabled: false
---
# Source: app-longhorn/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-config
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: default
  dependsOn:
  - name: app-external-snapshotter
    namespace: default
  - name: longhorn
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    defaults:
      metadata:
        namespace: longhorn-system
    resources:
      longhornRecurringJobs:
        daily-backups:
          concurrency: 1
          cron: 0 4 * * *
          fullNameOverride: daily-backups
          groups:
          - default
          retain: 2
          task: backup
      longhornSettings:
        concurrent-automatic-engine-upgrade-per-node-limit:
          annotations:
            helm.sh/resource-policy: keep
          fullNameOverride: concurrent-automatic-engine-upgrade-per-node-limit
          value: "1"
        default-backup-block-size:
          annotations:
            helm.sh/resource-policy: keep
          fullNameOverride: default-backup-block-size
          value: "16"
      storageClasses:
        longhorn-single-local-replica:
          allowVolumeExpansion: true
          annotations:
            storageclass.kubernetes.io/is-default-class: "false"
          fullNameOverride: longhorn-single-local-replica
          parameters:
            dataLocality: strict-local
            fsType: ext4
            numberOfReplicas: "2"
            recurringJobSelector: '[{"name":"single-local-replica","isGroup":true}]'
            staleReplicaTimeout: "60"
          provisioner: driver.longhorn.io
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
      volumeSnapshotClasses:
        longhorn-backing-image:
          deletionPolicy: Delete
          driver: driver.longhorn.io
          fullNameOverride: longhorn-backing-image
          parameters:
            export-type: qcow2
            type: bi
        longhorn-backup-full:
          deletionPolicy: Delete
          driver: driver.longhorn.io
          fullNameOverride: longhorn-backup-full
          parameters:
            backupMode: full
            type: bak
        longhorn-backup-incremental:
          deletionPolicy: Delete
          driver: driver.longhorn.io
          fullNameOverride: longhorn-backup-incremental
          parameters:
            type: bak
        longhorn-snapshot:
          deletionPolicy: Delete
          driver: driver.longhorn.io
          fullNameOverride: longhorn-snapshot
          parameters:
            type: snap
---
