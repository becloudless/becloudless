                      values:
                      - longhorn-pre-upgrade
                      - longhorn-uninstall
            mutate:
              patchStrategicMerge:
                metadata:
                  annotations:
                    policy.bcl.tf/skipPodSetHostUsers: "true"
                spec:
                  hostUsers: true
            name: pod-set-host-users
        longhorn-skip-security-audit:
          failurePolicy: Ignore
          rules:
          - match:
              any:
              - resources:
                  kinds:
                  - Pod
                  namespaces:
                  - longhorn-system
                  operations:
                  - CREATE
            mutate:
              patchStrategicMerge:
                metadata:
                  annotations:
                    +(policy.bcl.tf/skipContainerRequireReadOnlyRootFilesystem): "true"
                    +(policy.bcl.tf/skipContainerRequireRunAsNonRoot): "true"
                    +(policy.bcl.tf/skipPodRestrictHostAccess): "true"
            name: pod-add-skip-annotations
