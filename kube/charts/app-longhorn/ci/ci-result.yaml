apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-pre
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-kyverno
    namespace: kyverno
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      longhorn-integration:
        certManagerCertificates:
          longhorn-gateway:
            name: longhorn-gateway
            namespace: default
            secretName: tls-longhorn-gateway
        httpRoutes:
          longhorn:
            name: longhorn
            namespace: default
        listenerSets:
          longhorn:
            name: longhorn
            namespace: default
      longhorn-post:
        longhornRecurringJobs:
          daily-backups:
            name: daily-backups
            namespace: default
        longhornSettings:
          allow-collecting-longhorn-usage-metrics:
            name: allow-collecting-longhorn-usage-metrics
            namespace: default
          concurrent-automatic-engine-upgrade-per-node-limit:
            name: concurrent-automatic-engine-upgrade-per-node-limit
            namespace: default
          default-backup-block-size:
            name: default-backup-block-size
            namespace: default
          upgrade-checker:
            name: upgrade-checker
            namespace: default
        storageClasses:
          longhorn-db:
            name: longhorn-db
            namespace: default
          longhorn-files:
            name: longhorn-files
            namespace: default
          longhorn-single-local-replica:
            name: longhorn-single-local-replica
            namespace: default
        volumeSnapshotClasses:
          longhorn-backing-image:
            name: longhorn-backing-image
            namespace: default
          longhorn-backup-full:
            name: longhorn-backup-full
            namespace: default
          longhorn-backup-incremental:
            name: longhorn-backup-incremental
            namespace: default
          longhorn-snapshot:
            name: longhorn-snapshot
            namespace: default
      longhorn-pre:
        configMaps:
          longhorn-nixos-path:
            name: longhorn-nixos-path
            namespace: default
        kyvernoClusterPolicies:
          longhorn-add-nixos-path:
            name: longhorn-add-nixos-path
            namespace: default
          longhorn-host-users:
            name: longhorn-host-users
            namespace: default
          longhorn-skip-security-audit:
            name: longhorn-skip-security-audit
            namespace: default
    resources:
      configMaps:
        longhorn-nixos-path:
          data:
            PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/run/wrappers/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin
      kyvernoClusterPolicies:
        longhorn-add-nixos-path:
          annotations:
            policies.kyverno.io/category: Other
            policies.kyverno.io/description: Longhorn invokes executables on the host
              system, and needs to be aware of the host systems PATH. This modifies
              all deployments such that the PATH is explicitly set to support NixOS
              based systems.
            policies.kyverno.io/subject: Pod
            policies.kyverno.io/title: Add Environment Variables from ConfigMap
          failurePolicy: Fail
          rules:
          - match:
              resources:
                kinds:
                - Pod
                namespaces:
                - longhorn-system
            mutate:
              patchStrategicMerge:
                spec:
                  containers:
                  - (name): '*'
                    envFrom:
                    - configMapRef:
                        name: longhorn-nixos-path
                  initContainers:
                  - (name): '*'
                    envFrom:
                    - configMapRef:
                        name: longhorn-nixos-path
            name: container-add-env-vars
        longhorn-host-users:
          failurePolicy: Ignore
          rules:
          - match:
              any:
              - resources:
                  kinds:
                  - Pod
                  namespaces:
                  - longhorn-system
                  operations:
                  - CREATE
                  selector:
                    matchLabels:
                      longhorn.io/component: instance-manager
              - resources:
                  kinds:
                  - Pod
                  namespaces:
                  - longhorn-system
                  operations:
                  - CREATE
                  selector:
                    matchLabels:
                      longhorn.io/component: engine-image
              - resources:
                  kinds:
                  - Pod
                  namespaces:
                  - longhorn-system
                  operations:
                  - CREATE
                  selector:
                    matchExpressions:
                    - key: app
                      operator: In
                      values:
                      - longhorn-csi-plugin
                      - csi-attacher
                      - csi-provisioner
                      - csi-resizer
                      - csi-snapshotter
              - resources:
                  kinds:
                  - Pod
                  namespaces:
                  - longhorn-system
                  operations:
                  - CREATE
                  selector:
                    matchExpressions:
                    - key: job-name
                      operator: In
                      values:
                      - longhorn-pre-upgrade
                      - longhorn-uninstall
            mutate:
              patchStrategicMerge:
                spec:
                  hostUsers: true
            name: pod-set-host-users
        longhorn-skip-security-audit:
          failurePolicy: Ignore
          rules:
          - match:
              any:
              - resources:
                  kinds:
                  - Pod
                  namespaces:
                  - longhorn-system
                  operations:
                  - CREATE
            mutate:
              patchStrategicMerge:
                metadata:
                  annotations:
                    +(policy.bcl/skipContainerRequireReadOnlyRootFilesystem): "true"
                    +(policy.bcl/skipContainerRequireRunAsNonRoot): "true"
            name: pod-add-skip-annotations
