---
# Source: longhorn-config/templates/loader.yaml
allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
  name: longhorn-single-local-replica
  namespace: longhorn-system
parameters:
  dataLocality: strict-local
  fsType: ext4
  numberOfReplicas: "2"
  recurringJobSelector: '[{"name":"single-local-replica","isGroup":true}]'
  staleReplicaTimeout: "60"
provisioner: driver.longhorn.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
# Source: longhorn-config/templates/loader.yaml
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backups
  namespace: longhorn-system
spec:
  concurrency: 1
  cron: 0 4 * * *
  groups:
  - default
  retain: 2
  task: backup
---
# Source: longhorn-config/templates/loader.yaml
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: concurrent-automatic-engine-upgrade-per-node-limit
  namespace: longhorn-system
value: "1"
---
# Source: longhorn-config/templates/loader.yaml
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: default-backup-block-size
  namespace: longhorn-system
value: "16"
---
# Source: longhorn-config/templates/loader.yaml
apiVersion: snapshot.storage.k8s.io/v1
deletionPolicy: Delete
driver: driver.longhorn.io
kind: VolumeSnapshotClass
metadata:
  name: longhorn-backing-image
  namespace: longhorn-system
parameters:
  export-type: qcow2
  type: bi
---
# Source: longhorn-config/templates/loader.yaml
apiVersion: snapshot.storage.k8s.io/v1
deletionPolicy: Delete
driver: driver.longhorn.io
kind: VolumeSnapshotClass
metadata:
  name: longhorn-backup-full
  namespace: longhorn-system
parameters:
  backupMode: full
  type: bak
---
# Source: longhorn-config/templates/loader.yaml
apiVersion: snapshot.storage.k8s.io/v1
deletionPolicy: Delete
driver: driver.longhorn.io
kind: VolumeSnapshotClass
metadata:
  name: longhorn-backup-incremental
  namespace: longhorn-system
parameters:
  type: bak
---
# Source: longhorn-config/templates/loader.yaml
apiVersion: snapshot.storage.k8s.io/v1
deletionPolicy: Delete
driver: driver.longhorn.io
kind: VolumeSnapshotClass
metadata:
  name: longhorn-snapshot
  namespace: longhorn-system
parameters:
  type: snap
