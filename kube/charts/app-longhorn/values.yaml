# yaml-language-server: $schema=../app/schema/values.schema.json

# Longhorn, and the CronJob `attachment-repair` (sub HelmRelease `longhorn-attachment-repair`) that removes the attachment tickets left
# over by a pod that is gone.
#
# A RWO volume is attached to one node. Longhorn keeps a ticket for each attachment request of the CSI attacher in the `VolumeAttachment`
# of Longhorn (`spec.attachmentTickets`), named like the VolumeAttachment of Kubernetes that asked for it, and removes it when Kubernetes
# detaches the volume. When the ticket is not removed (a detach that fails or is lost while the API server or the managers are slow, a
# VolumeAttachment removed by hand...), the volume stays attached to the old node for ever: the pod that starts on another node stays in
# `ContainerCreating` with `FailedAttachVolume ... failed to attach to node <node>`, retried for ever.
# The CronJob (the script is in the ConfigMap `attachment-repair`) removes the tickets of the CSI attacher that
#  - have no VolumeAttachment in Kubernetes (the ticket would not exist without it: Kubernetes removes the VolumeAttachment after the
#    detach), in two checks `RECHECK` seconds apart (a VolumeAttachment that was being created or removed is not a leftover);
#  - are removed with a `test` of the node of the ticket, so that only the ticket that was checked is removed.
# The other tickets (the share managers, the backups, the snapshots, the UI) are never touched. When more than `MAX_REPAIRS` tickets are
# stale at once nothing is removed, it is not a leak. An event `StaleAttachmentTicketRemoved` is created on the `Volume`.
# Longhorn then detaches the volume from the old node and attaches it to the new one. To only see what it would do, set
# `DRY_RUN: "true"` in the env of the CronJob.

resources:

  fluxHelmRepositories:
    longhorn:
      url: https://charts.longhorn.io

  # The nodes mount the volumes (iscsi of the instance managers, nfs of the share managers), the API server calls the webhooks of the
  # managers, the instance managers replicate the data to each other (ports 10000-30000).
  # The engine images do not use the network.
  ciliumNetworkPolicies:
    longhorn-manager:
      endpointSelector:
        matchLabels: {app: longhorn-manager}
      ingress:
        api: # every component talks to the API of the managers (`longhorn-backend`)
          fromEndpoints:
            components:
              matchExpressions:
                app:
                  key: app
                  operator: In
                  values:
                    longhorn-manager: longhorn-manager
                    longhorn-global-manager: longhorn-global-manager
                    longhorn-ui: longhorn-ui
                    longhorn-csi-plugin: longhorn-csi-plugin
                    longhorn-driver-deployer: longhorn-driver-deployer
                    csi-attacher: csi-attacher
                    csi-provisioner: csi-provisioner
                    csi-resizer: csi-resizer
                    csi-snapshotter: csi-snapshotter
            instance-manager:
              matchLabels: {longhorn.io/component: instance-manager}
            share-manager:
              matchLabels: {longhorn.io/component: share-manager}
            recurring-jobs: # the pods of the RecurringJobs (backups, snapshots...)
              matchExpressions:
                recurring-job:
                  key: recurring-job.longhorn.io
                  operator: Exists
          toPorts: [9500]
        webhooks:
          fromEntities: [kube-apiserver, host, remote-node]
          toPorts: [9502, 9503]
        recovery-backend: # the NFS servers store their client records there, ganesha does not start without it
          fromEndpoints:
            share-manager:
              matchLabels: {longhorn.io/component: share-manager}
          toPorts: [9503]
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts: [9500]
        instance-managers:
          toEndpoints:
            instance-managers:
              matchLabels: {longhorn.io/component: instance-manager}
          toPorts:
            grpc: {ports: {"8500": {endPort: 8510}}}
        share-managers:
          toEndpoints:
            share-managers:
              matchLabels: {longhorn.io/component: share-manager}
          toPorts: [9600]
        backup-target: # the backup target is the S3 gateway of app-backup-restore (`longhorn-backup`, `sftp-gateway`)
          toEndpoints:
            sftp-gateway:
              matchLabels: {"k8s:io.kubernetes.pod.namespace": backup-restore, "k8s:app.kubernetes.io/instance": sftp-gateway, "k8s:app.kubernetes.io/component": sftp-gateway}
          toPorts: [9000]

    longhorn-global-manager:
      endpointSelector:
        matchLabels: {app: longhorn-global-manager}
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts: [9500]
        instance-managers:
          toEndpoints:
            instance-managers:
              matchLabels: {longhorn.io/component: instance-manager}
          toPorts:
            grpc: {ports: {"8500": {endPort: 8510}}}
        share-managers:
          toEndpoints:
            share-managers:
              matchLabels: {longhorn.io/component: share-manager}
          toPorts: [9600]

    longhorn-instance-manager: # the engines and the replicas of the volumes
      endpointSelector:
        matchLabels: {longhorn.io/component: instance-manager}
      ingress:
        managers:
          fromEndpoints:
            managers:
              matchExpressions:
                app:
                  key: app
                  operator: In
                  values: {longhorn-manager: longhorn-manager, longhorn-global-manager: longhorn-global-manager}
          toPorts:
            grpc: {ports: {"8500": {endPort: 8510}}}
        instance-managers: # the replication of the data
          fromEndpoints:
            instance-managers:
              matchLabels: {longhorn.io/component: instance-manager}
          toPorts:
            replicas: {ports: {"10000": {endPort: 30000}}}
        nodes: # the iscsi initiator of the node that attaches the volume
          fromEntities: [host, remote-node]
          toPorts: [3260]
      egress:
        instance-managers:
          toEndpoints:
            instance-managers:
              matchLabels: {longhorn.io/component: instance-manager}
          toPorts:
            replicas: {ports: {"10000": {endPort: 30000}}}
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts: [9500]
        backup-target:
          toEndpoints:
            sftp-gateway:
              matchLabels: {"k8s:io.kubernetes.pod.namespace": backup-restore, "k8s:app.kubernetes.io/instance": sftp-gateway, "k8s:app.kubernetes.io/component": sftp-gateway}
          toPorts: [9000]

    longhorn-share-manager: # the NFS server of the ReadWriteMany volumes
      endpointSelector:
        matchLabels: {longhorn.io/component: share-manager}
      ingress:
        managers:
          fromEndpoints:
            managers:
              matchExpressions:
                app:
                  key: app
                  operator: In
                  values: {longhorn-manager: longhorn-manager, longhorn-global-manager: longhorn-global-manager}
          toPorts: [9600]
        nodes: # the NFS mounts of the kubelets
          fromEntities: [host, remote-node]
          toPorts: [2049]
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts: [9500, 9503] # 9503: the recovery backend of the NFS server

    longhorn-ui:
      endpointSelector:
        matchLabels: {app: longhorn-ui}
      ingress:
        gateway:
          fromEntities: [ingress, host, remote-node]
          toPorts: [8000]
      egress:
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts: [9500]

    longhorn-csi-sidecars: # the attacher, the provisioner, the resizer and the snapshotter
      endpointSelector:
        matchExpressions:
          app:
            key: app
            operator: In
            values: {csi-attacher: csi-attacher, csi-provisioner: csi-provisioner, csi-resizer: csi-resizer, csi-snapshotter: csi-snapshotter}
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts: [9500]

    longhorn-csi-plugin: # on every node, mounts the volumes for the kubelet
      endpointSelector:
        matchLabels: {app: longhorn-csi-plugin}
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts: [9500]

    longhorn-driver-deployer: # deploys the CSI components
      endpointSelector:
        matchLabels: {app: longhorn-driver-deployer}
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts: [9500]

    longhorn-recurring-jobs: # the pods of the RecurringJobs (backups, snapshots...): they call the API of the managers and the API server
      endpointSelector:
        matchExpressions:
          recurring-job:
            key: recurring-job.longhorn.io
            operator: Exists
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts: [9500]

    longhorn-hooks: # the Helm hook jobs of the chart, they only talk to the API server (settings and CRs)
      endpointSelector:
        matchExpressions:
          job-name:
            key: job-name
            operator: In
            values: {longhorn-pre-upgrade: longhorn-pre-upgrade, longhorn-post-upgrade: longhorn-post-upgrade, longhorn-uninstall: longhorn-uninstall}
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]

  fluxHelmReleases:
    # the policy adding the PATH of NixOS to the pods, created before they start
    longhorn-pre:
      dependsOn:
        - name: app-kyverno
          namespace: kyverno
      values:

        resources:
          configMaps:
            longhorn-nixos-path:
              data:
                PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/run/wrappers/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin

          kyvernoClusterPolicies:
            longhorn-add-nixos-path:
              annotations:
                policies.kyverno.io/title: Add Environment Variables from ConfigMap
                policies.kyverno.io/subject: Pod
                policies.kyverno.io/category: Other
                policies.kyverno.io/description: >-
                  Longhorn invokes executables on the host system, and needs
                  to be aware of the host systems PATH. This modifies all
                  deployments such that the PATH is explicitly set to support
                  NixOS based systems.
              failurePolicy: Fail
              rules:
                - name: container-add-env-vars
                  match:
                    resources:
                      kinds:
                        - Pod
                      namespaces:
                        - longhorn-system
                  mutate:
                    patchStrategicMerge:
                      spec:
                        initContainers:
                          - (name): "*"
                            envFrom:
                              - configMapRef:
                                  name: longhorn-nixos-path
                        containers:
                          - (name): "*"
                            envFrom:
                              - configMapRef:
                                  name: longhorn-nixos-path

            # The pods created by Longhorn itself (not by its chart) are privileged or mount host paths, they need the host users.
            # `hostUsers: true` is set explicitly: the order of the mutate policies is not guaranteed, and the policy of app-kyverno
            # keeps a `hostUsers` that is already set but would not undo a `false` added before this policy. The opt-out annotation is
            # required by app-kyverno (pod-host-users-require-annotation) for every pod with `hostUsers: true`.
            # The longhorn-manager pods are opted out by the chart (`annotations`).
            longhorn-host-users:
              failurePolicy: Ignore
              rules:
                - name: pod-set-host-users
                  match:
                    any:
                      # CREATE only: `hostUsers` can not be changed once the pod exists, an update (finalizer removal, status...) would be rejected
                      - resources:
                          kinds:
                            - Pod
                          operations:
                            - CREATE
                          namespaces:
                            - longhorn-system
                          selector:
                            matchLabels:
                              longhorn.io/component: instance-manager
                      - resources:
                          kinds:
                            - Pod
                          operations:
                            - CREATE
                          namespaces:
                            - longhorn-system
                          selector:
                            matchLabels:
                              longhorn.io/component: engine-image
                      - resources: # the NFS servers of the RWX volumes mount the volume and `/dev`, `mount_setattr` fails in a user namespace
                          kinds:
                            - Pod
                          operations:
                            - CREATE
                          namespaces:
                            - longhorn-system
                          selector:
                            matchLabels:
                              longhorn.io/component: share-manager
                      - resources:
                          kinds:
                            - Pod
                          operations:
                            - CREATE
                          namespaces:
                            - longhorn-system
                          selector:
                            matchExpressions:
                              - key: app
                                operator: In
                                values:
                                  - longhorn-csi-plugin
                                  - csi-attacher
                                  - csi-provisioner
                                  - csi-resizer
                                  - csi-snapshotter
                      - resources: # the hook jobs of the chart mount /host/proc
                          kinds:
                            - Pod
                          operations:
                            - CREATE
                          namespaces:
                            - longhorn-system
                          selector:
                            matchExpressions:
                              - key: job-name
                                operator: In
                                values:
                                  - longhorn-pre-upgrade
                                  - longhorn-uninstall
                  mutate:
                    patchStrategicMerge:
                      metadata:
                        annotations:
                          policy.bcl.tf/skipPodSetHostUsers: "true"
                      spec:
                        hostUsers: true

            # The pods of Longhorn run as root with a writable root filesystem (the driver, the CSI sidecars created by the
            # driver-deployer, the UI, the managers...): opted out of the audit policies of app-kyverno. The annotations are
            # added by a policy, as most of these pods are not made from the values of the chart.
            # They also reach the host (privileged containers, hostPath volumes).
            longhorn-skip-security-audit:
              failurePolicy: Ignore
              rules:
                - name: pod-add-skip-annotations
                  match:
                    any:
                      - resources:
                          kinds:
                            - Pod
                          operations:
                            - CREATE
                          namespaces:
                            - longhorn-system
                  mutate:
                    patchStrategicMerge:
                      metadata:
                        annotations:
                          +(policy.bcl.tf/skipContainerRequireRunAsNonRoot): "true"
                          +(policy.bcl.tf/skipContainerRequireReadOnlyRootFilesystem): "true"
                          +(policy.bcl.tf/skipPodRestrictHostAccess): "true"

    longhorn:
      chart:
        spec:
          chart: longhorn
          version: 1.13.0
          sourceRef:
            kind: HelmRepository
            name: longhorn
      # the first install takes more than the default 2m. A timeout makes Flux remediate by uninstalling, which Longhorn refuses
      # (deleting-confirmation-flag is false on purpose) and leaves the Helm release stuck in `uninstalling`
      timeout: 15m
      dependsOn:
        - ref:longhorn-pre
      values:
        enablePSP: false

        # the pods of the managers are privileged and mount host paths, they need the host users (see app-kyverno)
        annotations:
          policy.bcl.tf/skipPodSetHostUsers: "true"

        csi:
          kubeletRootDir: /var/lib/kubelet

        # the `longhorn` StorageClass stays, but it is not the default one: the PVCs have to ask for a class
        persistence:
          defaultClass: false

        defaultSettings:
          autoDeletePodWhenVolumeDetachedUnexpectedly: true
          nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
          nodeDrainPolicy: always-allow
          storageReservedPercentageForDefaultDisk: 5 # only for new disks
          upgradeChecker: false # the pods have no access to the internet (see the policies of app-cilium)
          allowCollectingLonghornUsageMetrics: false

        defaultBackupStore:
          pollInterval: 180

        # the UI has no authentication of its own: it is behind the Authelia forward auth (see `expose`)
        ingress:
          enabled: false

    # settings, recurring jobs, storage and snapshot classes are Longhorn CRs, installed once longhorn is ready
    # the VolumeSnapshotClasses also need the snapshot CRDs from app-external-snapshotter
    longhorn-post:
      dependsOn:
        - ref:longhorn
        - name: app-external-snapshotter
          namespace: external-snapshotter
      values:
        resources:
          longhornRecurringJobs:
            daily-backups:
              cron: 0 4 * * * # Daily at 4am
              task: backup
              groups:
                - default
              retain: 2
              concurrency: 1

            # The state of Longhorn (https://longhorn.io/docs/1.13.0/advanced-resources/system-backup-restore/backup-longhorn-system/):
            # the volumes, PVs, PVCs, settings, recurring jobs, storage classes, engine images... in a bundle uploaded to the backup
            # target `default` (the S3 gateway of app-backup-restore), so that Longhorn can be restored on a new cluster
            # (`SystemRestore`, after the backup target is set there). The Kubernetes workloads are not in it, Flux recreates them.
            # `if-not-present`: the volumes without a backup, or with an outdated one, are backed up first (the `daily-backups` job
            # runs an hour before: the volumes are up to date, the system backup does not back them up twice).
            # daily-system-backup:
            #   cron: 0 5 * * * # Daily at 5am
            #   task: system-backup
            #   retain: 3
            #   concurrency: 1
            #   parameters:
            #     volume-backup-policy: if-not-present
          # Longhorn refuses to delete its settings, which makes a helm uninstall fail, so helm must never delete them
          longhornSettings:
            upgrade-checker: # defaultSettings are only read at the first install
              annotations:
                helm.sh/resource-policy: keep
              value: "false"
            allow-collecting-longhorn-usage-metrics:
              annotations:
                helm.sh/resource-policy: keep
              value: "false"
            concurrent-automatic-engine-upgrade-per-node-limit:
              annotations:
                helm.sh/resource-policy: keep
              value: "1"
            default-backup-block-size:
              annotations:
                helm.sh/resource-policy: keep
              value: "16"

          storageClasses:
            # for the databases: 2 replicas, and small backup blocks (2Mi) so that the incremental backups of the
            # random writes of a database are small
            longhorn-db:
              annotations:
                storageclass.kubernetes.io/is-default-class: "false"
              provisioner: driver.longhorn.io
              allowVolumeExpansion: true
              volumeBindingMode: Immediate
              reclaimPolicy: Delete
              parameters:
                numberOfReplicas: "2"
                staleReplicaTimeout: "60" # 1h
                fsType: ext4
                backupBlockSize: 2Mi

            # for the files: 2 replicas, and big backup blocks (16Mi), the files are written sequentially and rarely modified
            longhorn-files:
              annotations:
                storageclass.kubernetes.io/is-default-class: "false"
              provisioner: driver.longhorn.io
              allowVolumeExpansion: true
              volumeBindingMode: Immediate
              reclaimPolicy: Delete
              parameters:
                numberOfReplicas: "2"
                staleReplicaTimeout: "60" # 1h
                fsType: ext4
                backupBlockSize: 16Mi

            longhorn-single-local-replica: # TODO drop?
              annotations:
                storageclass.kubernetes.io/is-default-class: "false"
              provisioner: driver.longhorn.io
              allowVolumeExpansion: true
              volumeBindingMode: Immediate
              reclaimPolicy: Delete
              parameters:
                numberOfReplicas: "2"
                staleReplicaTimeout: "60" # 1h
                fsType: ext4
                dataLocality: strict-local
                recurringJobSelector: '[{"name":"single-local-replica","isGroup":true}]'

          # needs the snapshot CRDs from external-snapshotter
          volumeSnapshotClasses:
            longhorn-snapshot:
              driver: driver.longhorn.io
              deletionPolicy: Delete
              parameters:
                type: snap
            longhorn-backing-image:
              driver: driver.longhorn.io
              deletionPolicy: Delete
              parameters:
                type: bi
                export-type: qcow2 # default is raw
            longhorn-backup-incremental:
              driver: driver.longhorn.io
              deletionPolicy: Delete
              parameters:
                type: bak
            longhorn-backup-full:
              driver: driver.longhorn.io
              deletionPolicy: Delete
              parameters:
                type: bak
                backupMode: full

    # the repair of the attachment tickets left over by a pod that is gone (see the header), once longhorn is installed
    longhorn-attachment-repair:
      dependsOn:
        - ref:longhorn
      values:
        resources:
          ciliumNetworkPolicies:
            attachment-repair:
              endpointSelector:
                matchLabels: {app.kubernetes.io/component: attachment-repair}
              egress:
                kube-apiserver:
                  toEntities: [kube-apiserver]

          serviceAccounts:
            attachment-repair:
              automountServiceAccountToken: true # the API server

          # the VolumeAttachments of Kubernetes are not namespaced
          clusterRoles:
            attachment-repair:
              rules:
                volumeattachments:
                  apiGroups: [ storage.k8s.io ]
                  resources: [ volumeattachments ]
                  verbs: [ get, list ]

          clusterRoleBindings:
            attachment-repair:
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: attachment-repair
              subjects:
                attachment-repair:
                  kind: ServiceAccount
                  name: attachment-repair
                  namespace: "{{ .Release.Namespace }}"

          roles:
            attachment-repair:
              rules:
                attachments: # the tickets are in `spec.attachmentTickets`
                  apiGroups: [ longhorn.io ]
                  resources: [ volumeattachments ]
                  verbs: [ get, list, patch ]
                events:
                  apiGroups: [ "" ]
                  resources: [ events ]
                  verbs: [ create ]

          roleBindings:
            attachment-repair:
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: attachment-repair
              subjects:
                attachment-repair:
                  kind: ServiceAccount
                  name: attachment-repair
                  namespace: "{{ .Release.Namespace }}"

          configMaps:
            attachment-repair:
              data:
                attachment-repair.sh: |
                  #!/usr/bin/env bash
                  # See the header of the values of the chart app-longhorn.
                  set -uo pipefail

                  NAMESPACE=${NAMESPACE:-longhorn-system}
                  RECHECK=${RECHECK:-60}        # seconds between the two checks: a ticket has to be stale in both
                  MAX_REPAIRS=${MAX_REPAIRS:-5} # more stale tickets than that is not a leak, something else is wrong: nothing is removed
                  DRY_RUN=${DRY_RUN:-false}

                  log() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $*"; }

                  # One line for each ticket of the CSI attacher that has no VolumeAttachment of Kubernetes: `<volume> <ticket> <node>` (tab separated).
                  stale_tickets() {
                    local k8s lh
                    k8s=$(kubectl get volumeattachments.storage.k8s.io -o json) || return 1
                    lh=$(kubectl -n "$NAMESPACE" get volumeattachments.longhorn.io -o json) || return 1
                    jq -r --argjson k8s "$k8s" '
                      ($k8s.items | map({key: .metadata.name, value: true}) | from_entries) as $known
                      | .items[]
                      | .metadata.name as $volume
                      | (.spec.attachmentTickets // {}) | to_entries[]
                      | select(.value.type == "csi-attacher" and (.key | startswith("csi-")))
                      | select(.key as $id | $known[$id] | not)
                      | [$volume, .key, .value.nodeID] | @tsv' <<<"$lh"
                  }

                  first=$(stale_tickets) || { log "cannot list the attachments"; exit 1; }
                  if [ -z "$first" ]; then
                    log "no stale attachment ticket"
                    exit 0
                  fi
                  log "stale attachment tickets, checking again in ${RECHECK}s:"
                  echo "$first"

                  sleep "$RECHECK"
                  second=$(stale_tickets) || { log "cannot list the attachments"; exit 1; }

                  # only the tickets that are stale in both checks: a VolumeAttachment that was being created or removed is not
                  confirmed=""
                  while IFS=$'\t' read -r volume ticket node; do
                    line=$(printf '%s\t%s\t%s' "$volume" "$ticket" "$node")
                    if grep -qxF -- "$line" <<<"$second"; then
                      confirmed+="$line"$'\n'
                    fi
                  done <<<"$first"
                  confirmed=${confirmed%$'\n'}

                  if [ -z "$confirmed" ]; then
                    log "no ticket is stale in both checks"
                    exit 0
                  fi
                  count=$(wc -l <<<"$confirmed")
                  if [ "$count" -gt "$MAX_REPAIRS" ]; then
                    log "$count stale tickets, more than $MAX_REPAIRS: not a leak, nothing is removed"
                    exit 1
                  fi

                  status=0
                  while IFS=$'\t' read -r volume ticket node; do
                    ctx="volume $volume, ticket $ticket (node $node)"
                    if [ "$DRY_RUN" = true ]; then
                      log "$ctx: DRY RUN, would remove the ticket"
                      continue
                    fi
                    log "$ctx: no VolumeAttachment for it, removing the ticket"
                    # `test`: the ticket is only removed if it is still the one that was checked
                    if ! kubectl -n "$NAMESPACE" patch volumeattachments.longhorn.io "$volume" --type=json \
                      -p "[{\"op\":\"test\",\"path\":\"/spec/attachmentTickets/$ticket/nodeID\",\"value\":\"$node\"},{\"op\":\"remove\",\"path\":\"/spec/attachmentTickets/$ticket\"}]"; then
                      log "$ctx: cannot remove the ticket"
                      status=1
                      continue
                    fi
                    kubectl create -f - <<EOF || true
                  apiVersion: v1
                  kind: Event
                  metadata:
                    generateName: attachment-repair-
                    namespace: $NAMESPACE
                  type: Warning
                  reason: StaleAttachmentTicketRemoved
                  message: "the attachment ticket $ticket of the node $node was removed: it has no VolumeAttachment, it kept the volume attached to this node"
                  involvedObject: {apiVersion: longhorn.io/v1beta2, kind: Volume, name: $volume, namespace: $NAMESPACE}
                  source: {component: attachment-repair}
                  EOF
                  done <<<"$confirmed"
                  exit $status

          cronJobs:
            attachment-repair:
              schedule: "*/5 * * * *"
              concurrencyPolicy: Forbid
              jobTemplate:
                spec:
                  backoffLimit: 0
                  activeDeadlineSeconds: 240
                  template:
                    metadata:
                      labels:
                        app.kubernetes.io/component: attachment-repair
                    spec:
                      restartPolicy: Never
                      serviceAccountName: attachment-repair
                      securityContext:
                        runAsUser: 65534
                        runAsGroup: 65534
                      containers:
                        repair:
                          name: repair
                          image: docker.io/alpine/k8s:1.36.5 # renovate: versioning=loose
                          command: [ bash, /scripts/attachment-repair.sh ]
                          env:
                            HOME: /tmp
                            NAMESPACE: "{{ .Release.Namespace }}"
                          securityContext:
                            capabilities:
                              drop:
                                all: ALL
                          volumeMounts:
                            script:
                              name: script
                              mountPath: /scripts
                              readOnly: true
                      volumes:
                        script:
                          name: script
                          configMap:
                            name: attachment-repair

expose:
  longhorn:
    service: longhorn-frontend
    port: 80
    auth: authelia
    dependsOn:
      - ref:longhorn-post
