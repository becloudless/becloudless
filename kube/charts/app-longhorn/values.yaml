# yaml-language-server: $schema=../app/schema/values.schema.json

resources:

  fluxHelmRepositories:
    longhorn:
      url: https://charts.longhorn.io

  # on top of the default deny of app-cilium: one policy for each component. The selectors are in the namespace of the release.
  # The nodes mount the volumes (iscsi of the instance managers, nfs of the share managers), the API server calls the webhooks of the
  # managers, the instance managers replicate the data to each other (ports 10000-30000).
  # The engine images do not use the network.
  ciliumNetworkPolicies:
    longhorn-manager:
      endpointSelector:
        matchLabels: {app: longhorn-manager}
      ingress:
        api: # every component talks to the API of the managers (`longhorn-backend`)
          fromEndpoints:
            components:
              matchExpressions:
                app:
                  key: app
                  operator: In
                  values:
                    longhorn-manager: longhorn-manager
                    longhorn-global-manager: longhorn-global-manager
                    longhorn-ui: longhorn-ui
                    longhorn-csi-plugin: longhorn-csi-plugin
                    longhorn-driver-deployer: longhorn-driver-deployer
                    csi-attacher: csi-attacher
                    csi-provisioner: csi-provisioner
                    csi-resizer: csi-resizer
                    csi-snapshotter: csi-snapshotter
            instance-manager:
              matchLabels: {longhorn.io/component: instance-manager}
            share-manager:
              matchLabels: {longhorn.io/component: share-manager}
          toPorts:
            api: {ports: {p9500: {port: "9500", protocol: TCP}}}
        webhooks: # the API server is host networked, it is seen as the host or a remote node
          fromEntities: {apiserver: kube-apiserver, host: host, remote-node: remote-node}
          toPorts:
            webhooks:
              ports:
                p9502: {port: "9502", protocol: TCP}
                p9503: {port: "9503", protocol: TCP}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts:
            api: {ports: {p9500: {port: "9500", protocol: TCP}}}
        instance-managers:
          toEndpoints:
            instance-managers:
              matchLabels: {longhorn.io/component: instance-manager}
          toPorts:
            grpc: {ports: {p8500: {port: "8500", endPort: 8510, protocol: TCP}}}
        share-managers:
          toEndpoints:
            share-managers:
              matchLabels: {longhorn.io/component: share-manager}
          toPorts:
            grpc: {ports: {p9600: {port: "9600", protocol: TCP}}}
        backup-target: # the backup target (`defaultBackupStore`) is a CIFS share of the LAN, the name is resolved with the search domains
          toFQDNs:
            backupstore: {matchName: backupstore}
            backupstore-svc: {matchName: backupstore.longhorn-system.svc.cluster.local}
            backupstore-domain: {matchName: "backupstore.{{ .Values.app.domain }}"}
          toPorts:
            cifs: {ports: {p445: {port: "445", protocol: TCP}}}

    longhorn-global-manager:
      endpointSelector:
        matchLabels: {app: longhorn-global-manager}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts:
            api: {ports: {p9500: {port: "9500", protocol: TCP}}}
        instance-managers:
          toEndpoints:
            instance-managers:
              matchLabels: {longhorn.io/component: instance-manager}
          toPorts:
            grpc: {ports: {p8500: {port: "8500", endPort: 8510, protocol: TCP}}}
        share-managers:
          toEndpoints:
            share-managers:
              matchLabels: {longhorn.io/component: share-manager}
          toPorts:
            grpc: {ports: {p9600: {port: "9600", protocol: TCP}}}

    longhorn-instance-manager: # the engines and the replicas of the volumes
      endpointSelector:
        matchLabels: {longhorn.io/component: instance-manager}
      ingress:
        managers:
          fromEndpoints:
            managers:
              matchExpressions:
                app:
                  key: app
                  operator: In
                  values: {longhorn-manager: longhorn-manager, longhorn-global-manager: longhorn-global-manager}
          toPorts:
            grpc: {ports: {p8500: {port: "8500", endPort: 8510, protocol: TCP}}}
        instance-managers: # the replication of the data
          fromEndpoints:
            instance-managers:
              matchLabels: {longhorn.io/component: instance-manager}
          toPorts:
            replicas: {ports: {p10000: {port: "10000", endPort: 30000, protocol: TCP}}}
        nodes: # the iscsi initiator of the node that attaches the volume
          fromEntities: {host: host, remote-node: remote-node}
          toPorts:
            iscsi: {ports: {p3260: {port: "3260", protocol: TCP}}}
      egress:
        instance-managers:
          toEndpoints:
            instance-managers:
              matchLabels: {longhorn.io/component: instance-manager}
          toPorts:
            replicas: {ports: {p10000: {port: "10000", endPort: 30000, protocol: TCP}}}
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts:
            api: {ports: {p9500: {port: "9500", protocol: TCP}}}
        backup-target:
          toFQDNs:
            backupstore: {matchName: backupstore}
            backupstore-svc: {matchName: backupstore.longhorn-system.svc.cluster.local}
            backupstore-domain: {matchName: "backupstore.{{ .Values.app.domain }}"}
          toPorts:
            cifs: {ports: {p445: {port: "445", protocol: TCP}}}

    longhorn-share-manager: # the NFS server of the ReadWriteMany volumes
      endpointSelector:
        matchLabels: {longhorn.io/component: share-manager}
      ingress:
        managers:
          fromEndpoints:
            managers:
              matchExpressions:
                app:
                  key: app
                  operator: In
                  values: {longhorn-manager: longhorn-manager, longhorn-global-manager: longhorn-global-manager}
          toPorts:
            grpc: {ports: {p9600: {port: "9600", protocol: TCP}}}
        nodes: # the NFS mounts of the kubelets
          fromEntities: {host: host, remote-node: remote-node}
          toPorts:
            nfs: {ports: {p2049: {port: "2049", protocol: TCP}}}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts:
            api: {ports: {p9500: {port: "9500", protocol: TCP}}}

    longhorn-ui:
      endpointSelector:
        matchLabels: {app: longhorn-ui}
      ingress:
        gateway:
          fromEntities: {ingress: ingress, host: host, remote-node: remote-node}
          toPorts:
            ui: {ports: {p8000: {port: "8000", protocol: TCP}}}
      egress:
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts:
            api: {ports: {p9500: {port: "9500", protocol: TCP}}}

    longhorn-csi-sidecars: # the attacher, the provisioner, the resizer and the snapshotter
      endpointSelector:
        matchExpressions:
          app:
            key: app
            operator: In
            values: {csi-attacher: csi-attacher, csi-provisioner: csi-provisioner, csi-resizer: csi-resizer, csi-snapshotter: csi-snapshotter}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts:
            api: {ports: {p9500: {port: "9500", protocol: TCP}}}

    longhorn-csi-plugin: # on every node, mounts the volumes for the kubelet
      endpointSelector:
        matchLabels: {app: longhorn-csi-plugin}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts:
            api: {ports: {p9500: {port: "9500", protocol: TCP}}}

    longhorn-driver-deployer: # deploys the CSI components
      endpointSelector:
        matchLabels: {app: longhorn-driver-deployer}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}
        managers:
          toEndpoints:
            managers:
              matchLabels: {app: longhorn-manager}
          toPorts:
            api: {ports: {p9500: {port: "9500", protocol: TCP}}}

  fluxHelmReleases:
    # the policy adding the PATH of NixOS to the pods, created before they start
    longhorn-pre:
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      dependsOn:
        kyverno:
          name: app-kyverno
          namespace: kyverno
      values:

        resources:
          configMaps:
            longhorn-nixos-path:
              data:
                PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/run/wrappers/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin

          kyvernoClusterPolicies:
            longhorn-add-nixos-path:
              annotations:
                policies.kyverno.io/title: Add Environment Variables from ConfigMap
                policies.kyverno.io/subject: Pod
                policies.kyverno.io/category: Other
                policies.kyverno.io/description: >-
                  Longhorn invokes executables on the host system, and needs
                  to be aware of the host systems PATH. This modifies all
                  deployments such that the PATH is explicitly set to support
                  NixOS based systems.
              failurePolicy: Fail
              rules:
                add-env-vars:
                  name: add-env-vars
                  match:
                    resources:
                      kinds:
                        - Pod
                      namespaces:
                        - longhorn-system
                  mutate:
                    patchStrategicMerge:
                      spec:
                        initContainers:
                          - (name): "*"
                            envFrom:
                              - configMapRef:
                                  name: longhorn-nixos-path
                        containers:
                          - (name): "*"
                            envFrom:
                              - configMapRef:
                                  name: longhorn-nixos-path

    longhorn:
      chart:
        spec:
          chart: longhorn
          version: 1.13.0
          sourceRef:
            kind: HelmRepository
            name: longhorn
      # the first install takes more than the default 2m. A timeout makes Flux remediate by uninstalling, which Longhorn refuses
      # (deleting-confirmation-flag is false on purpose) and leaves the Helm release stuck in `uninstalling`
      timeout: 15m
      dependsOn:
        longhorn-pre:
          name: longhorn-pre
      values:
        enablePSP: false

        csi:
          kubeletRootDir: /var/lib/kubelet

        defaultSettings:
          autoDeletePodWhenVolumeDetachedUnexpectedly: true
          nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
          nodeDrainPolicy: always-allow
          storageReservedPercentageForDefaultDisk: 5 # only for new disks
          upgradeChecker: false # the pods have no access to the internet (see the policies of app-cilium)
          allowCollectingLonghornUsageMetrics: false

        defaultBackupStore:
          backupTarget: cifs://backupstore/backupstore
          backupTargetCredentialSecret: backupstore
          pollInterval: 180

        # the UI has no authentication of its own: it is served by the Cilium Gateway with Authelia forward auth (see httpRoutes)
        ingress:
          enabled: false

    # settings, recurring jobs, storage and snapshot classes are Longhorn CRs, installed once longhorn is ready
    # the VolumeSnapshotClasses also need the snapshot CRDs from app-external-snapshotter
    longhorn-post:
      dependsOn:
        longhorn:
          name: longhorn
        external-snapshotter:
          name: app-external-snapshotter
          namespace: external-snapshotter
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          longhornRecurringJobs:
            daily-backups:
              cron: 0 4 * * * # Daily at 4am
              task: backup
              groups:
                - default
              retain: 2
              concurrency: 1

          # Longhorn refuses to delete its settings, which makes a helm uninstall fail, so helm must never delete them
          longhornSettings:
            upgrade-checker: # defaultSettings are only read at the first install
              annotations:
                helm.sh/resource-policy: keep
              value: "false"
            allow-collecting-longhorn-usage-metrics:
              annotations:
                helm.sh/resource-policy: keep
              value: "false"
            concurrent-automatic-engine-upgrade-per-node-limit:
              annotations:
                helm.sh/resource-policy: keep
              value: "1"
            default-backup-block-size:
              annotations:
                helm.sh/resource-policy: keep
              value: "16"

          storageClasses:
            longhorn-single-local-replica:
              annotations:
                storageclass.kubernetes.io/is-default-class: "false"
              provisioner: driver.longhorn.io
              allowVolumeExpansion: true
              volumeBindingMode: Immediate
              reclaimPolicy: Delete
              parameters:
                numberOfReplicas: "2"
                staleReplicaTimeout: "60" # 1h
                fsType: ext4
                dataLocality: strict-local
                recurringJobSelector: '[{"name":"single-local-replica","isGroup":true}]'

          # needs the snapshot CRDs from external-snapshotter
          volumeSnapshotClasses:
            longhorn-snapshot:
              driver: driver.longhorn.io
              deletionPolicy: Delete
              parameters:
                type: snap
            longhorn-backing-image:
              driver: driver.longhorn.io
              deletionPolicy: Delete
              parameters:
                type: bi
                export-type: qcow2 # default is raw
            longhorn-backup-incremental:
              driver: driver.longhorn.io
              deletionPolicy: Delete
              parameters:
                type: bak
            longhorn-backup-full:
              driver: driver.longhorn.io
              deletionPolicy: Delete
              parameters:
                type: bak
                backupMode: full

    # the public exposure, applied once longhorn-post is deployed and not waited for
    longhorn-integration:
      install:
        disableWait: true
      upgrade:
        disableWait: true
      dependsOn:
        longhorn-post:
          name: longhorn-post
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        gateway-api:
          name: app-gateway-api
          namespace: gateway-api
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        # UI behind the Cilium Gateway `shared` (kube-system) with Authelia forward auth.
        # The certificate is issued by the http-01 solver of the ClusterIssuer (gatewayHTTPRoute), which only needs the host to be
        # reachable on port 80 through the http listener of the Gateway.
        resources:
          certManagerCertificates:
            longhorn-ui:
              secretName: tls-longhorn
              dnsNames:
                ui: longhorn.{{ .Values.app.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

          listenerSets:
            longhorn:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: shared
                namespace: kube-system
              listeners:
                https:
                  name: https
                  hostname: longhorn.{{ .Values.app.domain }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-longhorn
                  allowedRoutes:
                    namespaces:
                      from: Same

          httpRoutes:
            longhorn:
              parentRefs:
                longhorn:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: longhorn
              hostnames:
                ui: longhorn.{{ .Values.app.domain }}
              rules:
                ui:
                  filters:
                    authelia:
                      type: ExternalAuth
                      externalAuth:
                        protocol: HTTP
                        backendRef:
                          name: authelia
                          namespace: authelia
                          port: 80
                        http:
                          path: /api/authz/ext-authz/
                          allowedResponseHeaders: # only the identity headers, not the authz content-type/content-length (a GET with a content-length makes upstreams answer 400)
                            remote-user: remote-user
                            remote-groups: remote-groups
                            remote-name: remote-name
                            remote-email: remote-email
                          allowedHeaders: # what authelia needs to find the session and to redirect to the login page
                            cookie: cookie
                            accept: accept
                            proxy-authorization: proxy-authorization
                            x-forwarded-proto: x-forwarded-proto
                            x-forwarded-for: x-forwarded-for
                  backendRefs:
                    frontend:
                      name: longhorn-frontend
                      port: 80

