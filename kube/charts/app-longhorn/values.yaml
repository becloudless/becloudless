# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:

defaults:
  metadata:
    namespace: longhorn-system

resources:
  namespaces:
    longhorn-system:
      fullNameOverride: longhorn-system

  configMaps:
    longhorn-nixos-path:
      fullNameOverride: longhorn-nixos-path
      data:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/run/wrappers/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin

  # requires the kyverno CRDs: app-bcl makes this app depend on app-kyverno
  kyvernoClusterPolicies:
    longhorn-add-nixos-path:
      fullNameOverride: longhorn-add-nixos-path
      annotations:
        policies.kyverno.io/title: Add Environment Variables from ConfigMap
        policies.kyverno.io/subject: Pod
        policies.kyverno.io/category: Other
        policies.kyverno.io/description: >-
          Longhorn invokes executables on the host system, and needs
          to be aware of the host systems PATH. This modifies all
          deployments such that the PATH is explicitly set to support
          NixOS based systems.
      failurePolicy: Fail
      rules:
        add-env-vars:
          name: add-env-vars
          match:
            resources:
              kinds:
                - Pod
              namespaces:
                - longhorn-system
          mutate:
            patchStrategicMerge:
              spec:
                initContainers:
                  - (name): "*"
                    envFrom:
                      - configMapRef:
                          name: longhorn-nixos-path
                containers:
                  - (name): "*"
                    envFrom:
                      - configMapRef:
                          name: longhorn-nixos-path

  # UI behind the Cilium Gateway `shared` (kube-system) with Authelia forward auth.
  # Requires the Gateway API CRDs and cert-manager: app-bcl makes this app depend on them.
  # The certificate is issued by the http-01 solver of the ClusterIssuer (ingress), which only needs the host to be
  # reachable on port 80 through the ingress.
  certManagerCertificates:
    longhorn-ui:
      fullNameOverride: longhorn-ui
      secretName: tls-longhorn
      dnsNames:
        ui: longhorn.{{ .Values.global.domain }}
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer

  listenerSets:
    longhorn:
      fullNameOverride: longhorn
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: shared
        namespace: kube-system
      listeners:
        https:
          name: https
          hostname: longhorn.{{ .Values.global.domain }}
          port: 443
          protocol: HTTPS
          tls:
            mode: Terminate
            certificateRefs:
              tls:
                name: tls-longhorn
          allowedRoutes:
            namespaces:
              from: Same

  httpRoutes:
    longhorn:
      fullNameOverride: longhorn
      parentRefs:
        longhorn:
          group: gateway.networking.k8s.io
          kind: ListenerSet
          name: longhorn
      hostnames:
        ui: longhorn.{{ .Values.global.domain }}
      rules:
        ui:
          filters:
            authelia:
              type: ExternalAuth
              externalAuth:
                protocol: HTTP
                backendRef:
                  name: authelia
                  namespace: authelia
                  port: 80
                http:
                  path: /api/authz/ext-authz/
                  allowedHeaders: # what authelia needs to find the session and to redirect to the login page
                    cookie: cookie
                    accept: accept
                    proxy-authorization: proxy-authorization
                    x-forwarded-proto: x-forwarded-proto
                    x-forwarded-for: x-forwarded-for
          backendRefs:
            frontend:
              name: longhorn-frontend
              port: 80

  fluxHelmRepositories:
    longhorn:
      fullNameOverride: longhorn
      url: https://charts.longhorn.io

  fluxHelmReleases:
    longhorn:
      fullNameOverride: longhorn
      chart:
        spec:
          chart: longhorn
          version: 1.13.0
          sourceRef:
            kind: HelmRepository
            name: longhorn
      upgrade:
        remediation:
          retries: 3
      values:
        enablePSP: false

        csi:
          kubeletRootDir: /var/lib/kubelet

        defaultSettings:
          autoDeletePodWhenVolumeDetachedUnexpectedly: true
          nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
          nodeDrainPolicy: always-allow

        defaultBackupStore:
          backupTarget: cifs://backupstore/backupstore
          backupTargetCredentialSecret: backupstore
          pollInterval: 180

        # the UI has no authentication of its own: it is served by the Cilium Gateway with Authelia forward auth (see httpRoutes)
        ingress:
          enabled: false

    # settings, recurring jobs, storage and snapshot classes need the Longhorn CRDs, so they are installed once longhorn is ready
    # the VolumeSnapshotClasses also need the snapshot CRDs from app-external-snapshotter
    longhorn-config:
      fullNameOverride: longhorn-config
      dependsOn:
        longhorn:
          name: longhorn
        external-snapshotter:
          name: app-external-snapshotter
          namespace: "{{ .Release.Namespace }}"
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: "{{ .Release.Namespace }}"
      values:
        defaults:
          metadata:
            namespace: longhorn-system

        resources:
          longhornRecurringJobs:
            daily-backups:
              fullNameOverride: daily-backups
              cron: 0 4 * * * # Daily at 4am
              task: backup
              groups:
                - default
              retain: 2
              concurrency: 1

          # Longhorn refuses to delete its settings, which makes a helm uninstall fail, so helm must never delete them
          longhornSettings:
            concurrent-automatic-engine-upgrade-per-node-limit:
              fullNameOverride: concurrent-automatic-engine-upgrade-per-node-limit
              annotations:
                helm.sh/resource-policy: keep
              value: "1"
            default-backup-block-size:
              fullNameOverride: default-backup-block-size
              annotations:
                helm.sh/resource-policy: keep
              value: "16"

          storageClasses:
            longhorn-single-local-replica:
              fullNameOverride: longhorn-single-local-replica
              annotations:
                storageclass.kubernetes.io/is-default-class: "false"
              provisioner: driver.longhorn.io
              allowVolumeExpansion: true
              volumeBindingMode: Immediate
              reclaimPolicy: Delete
              parameters:
                numberOfReplicas: "2"
                staleReplicaTimeout: "60" # 1h
                fsType: ext4
                dataLocality: strict-local
                recurringJobSelector: '[{"name":"single-local-replica","isGroup":true}]'

          # needs the snapshot CRDs from external-snapshotter
          volumeSnapshotClasses:
            longhorn-snapshot:
              fullNameOverride: longhorn-snapshot
              driver: driver.longhorn.io
              deletionPolicy: Delete
              parameters:
                type: snap
            longhorn-backing-image:
              fullNameOverride: longhorn-backing-image
              driver: driver.longhorn.io
              deletionPolicy: Delete
              parameters:
                type: bi
                export-type: qcow2 # default is raw
            longhorn-backup-incremental:
              fullNameOverride: longhorn-backup-incremental
              driver: driver.longhorn.io
              deletionPolicy: Delete
              parameters:
                type: bak
            longhorn-backup-full:
              fullNameOverride: longhorn-backup-full
              driver: driver.longhorn.io
              deletionPolicy: Delete
              parameters:
                type: bak
                backupMode: full
