# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:
  name:
  ldapdn:

# Everything is generated, nothing has to be created by hand:
#  - users: file backend, the `admin` user (group `role_admin`) is created at each start of the pods by an init container
#    from the generated `authelia-admin` secret:
#      kubectl -n authelia get secret authelia-admin -o jsonpath='{.data.password}' | base64 -d
#  - notifier: written in a file, read the 2FA registration / password reset codes with:
#      kubectl -n authelia exec deploy/authelia -- cat /config/notification.txt
#  - the storage encryption key is generated by the authelia chart in the `authelia` secret
# Disabled until needed: LDAP (lldap), SMTP and OIDC (needs the client secrets in an `authelia-oidc` secret)

defaults:
  metadata:
    namespace: authelia

resources:
  stringSecrets:
    authelia-generated:
      fullNameOverride: authelia-generated
      fields:
        oidc-hmac:
          fieldName: identity_providers.oidc.hmac.key
        reset-password-hmac:
          fieldName: identity_validation.reset_password.jwt.hmac.key
        session-encryption:
          fieldName: session.encryption.key

    # password of the `admin` user of the file backend
    authelia-admin:
      fullNameOverride: authelia-admin
      fields:
        password:
          fieldName: password
          encoding: hex
          length: "32"

    # users of valkey, the key is the name of the user
    authelia-valkey:
      fullNameOverride: authelia-valkey
      fields:
        default:
          fieldName: default
        authelia:
          fieldName: authelia

  # key pair signing the OIDC tokens, mounted from /secrets/authelia-jwks
  certManagerCertificates:
    # certificate of the portal, terminated by the Gateway
    authelia-gateway:
      fullNameOverride: authelia-gateway
      secretName: tls-authelia-gateway
      dnsNames:
        authelia: authelia.{{ .Values.global.domain }}
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer

    authelia-jwks:
      fullNameOverride: authelia-jwks
      secretName: authelia-jwks
      commonName: authelia-jwks
      issuerRef:
        name: self-signed
        kind: ClusterIssuer

  # Forward auth for the apps behind the Cilium Gateway: the `ExternalAuth` filter of their HTTPRoute calls the authelia service.
  # An HTTPRoute can only reference a service of another namespace when it is granted here: add the namespace of each app.
  referenceGrants:
    ext-authz:
      fullNameOverride: ext-authz
      from:
        longhorn:
          group: gateway.networking.k8s.io
          kind: HTTPRoute
          namespace: longhorn-system
        homer:
          group: gateway.networking.k8s.io
          kind: HTTPRoute
          namespace: homer
        prometheus:
          group: gateway.networking.k8s.io
          kind: HTTPRoute
          namespace: prometheus
      to:
        authelia:
          group: ""
          kind: Service
          name: authelia

  # Portal exposed by the Cilium Gateway `shared` (kube-system). It is not protected by forward auth itself.
  # Requires the Gateway API CRDs and cert-manager: app-bcl makes this app depend on them.
  listenerSets:
    authelia:
      fullNameOverride: authelia
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: shared
        namespace: kube-system
      listeners:
        https:
          name: https
          hostname: authelia.{{ .Values.global.domain }}
          port: 443
          protocol: HTTPS
          tls:
            mode: Terminate
            certificateRefs:
              tls:
                name: tls-authelia-gateway
          allowedRoutes:
            namespaces:
              from: Same

  httpRoutes:
    authelia:
      fullNameOverride: authelia
      parentRefs:
        authelia:
          group: gateway.networking.k8s.io
          kind: ListenerSet
          name: authelia
      hostnames:
        authelia: authelia.{{ .Values.global.domain }}
      rules:
        root:
          backendRefs:
            authelia:
              name: authelia
              port: 80

  fluxHelmRepositories:
    authelia:
      fullNameOverride: authelia
      url: https://charts.authelia.com
    authelia-valkey:
      fullNameOverride: authelia-valkey
      url: https://valkey.io/valkey-helm/

  fluxHelmReleases:
    # the database is prepared by the postgresql-cluster chart (certificates, issuer, cluster and backups)
    # the cluster is named after the release, which is the name of this HelmRelease
    authelia-postgresql:
      fullNameOverride: authelia-postgresql
      chart:
        spec:
          chart: ./kube/charts/postgresql-cluster
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: bcl

    authelia-valkey:
      fullNameOverride: authelia-valkey
      chart:
        spec:
          chart: valkey
          version: 0.12.0
          sourceRef:
            kind: HelmRepository
            name: authelia-valkey
      values:
        replicaCount: 1
        dataStorage:
          enabled: true
          requestedSize: 1Gi

        auth:
          enabled: true
          aclUsers:
            default:
              permissions: "~* -@all"
            authelia:
              permissions: "~* &* +@all"
          usersExistingSecret: authelia-valkey

    authelia:
      fullNameOverride: authelia
      timeout: 10m # the pods wait for the database
      dependsOn:
        authelia-postgresql:
          name: authelia-postgresql
        authelia-valkey:
          name: authelia-valkey
      chart:
        spec:
          chart: authelia
          version: 0.11.22
          sourceRef:
            kind: HelmRepository
            name: authelia
      values:
        # https://github.com/authelia/chartrepo/blob/master/charts/authelia/values.yaml
        # exposed by the Cilium Gateway, see the `listenerSets` resources
        ingress:
          enabled: false

        pod:
          kind: Deployment
          replicas: 1 # the users database and the notifications are files of the pod
          env:
            - name: TZ
              value: Europe/Paris
          # the users database is built from the generated admin password, the hash changes at each start but the password does not
          initContainers:
            - name: users-database
              image: ghcr.io/authelia/authelia:4.39.24
              command:
                - sh
                - -ec
                - |
                  hash=$(authelia crypto hash generate argon2 --password "$(cat /secrets/authelia-admin/password)" | sed 's/^Digest: //')
                  printf 'users:\n  admin:\n    displayname: Admin\n    email: admin@%s\n    password: "%s"\n    groups:\n      - role_admin\n' "$DOMAIN" "$hash" > /config/users_database.yml
              env:
                - name: DOMAIN
                  value: "{{ .Values.global.domain }}"
              volumeMounts:
                - name: authelia
                  mountPath: /config
                - name: secret-authelia-admin
                  mountPath: /secrets/authelia-admin
                  readOnly: true
          # setting extra volumes removes the default /config volume of the chart
          extraVolumes:
            - name: authelia
              emptyDir:
                sizeLimit: 100Mi
          extraVolumeMounts:
            - name: authelia
              mountPath: /config

        secret:
          additionalSecrets:
            authelia-admin: {}
            authelia-generated: {}
            authelia-postgresql-app: {}
            authelia-valkey: {}
            # authelia-oidc: {}
            # authelia-jwks: {}

        configMap:
          theme: dark

          server:
            endpoints:
              authz:
                ext-authz: # called by the Envoy of the Cilium Gateway on /api/authz/ext-authz/
                  implementation: ExtAuthz

          telemetry:
            metrics:
              enabled: true
          storage:
            postgres:
              enabled: true
              address: tcp://authelia-postgresql-rw
              database: app
              username: app
              password:
                secret_name: authelia-postgresql-app
                value: password
                path: password
          notifier:
            filesystem:
              enabled: true
            disable_startup_check: false # in case of emergency
            smtp:
              enabled: false
              address: submissions://mail.{{ .Values.global.domain }}:465
              sender: '{{ .Values.global.name }} Authelia <authelia@{{ .Values.global.domain }}>'
              username: authelia@{{ .Values.global.domain }}
              password: {}

          authentication_backend:
            file:
              enabled: true
              path: /config/users_database.yml
            ldap:
              enabled: false # to use lldap again: disable `file`, the init container and set the password of the `authelia` user
              implementation: lldap
              # served by the lldap ldaps listener of the Gateway (tls passthrough) with a publicly trusted certificate
              address: ldaps://lldaps.{{ .Values.global.domain }}:443
              base_dn: "{{ .Values.global.ldapdn }}"
              user: 'UID=authelia,OU=people,{{ .Values.global.ldapdn }}'
              password: {}
              tls:
                skip_verify: false
                minimum_version: TLS1.2
              attributes:
                extra:
                  immichquota: # The attribute name from LDAP
                    name: 'immich_quota'
                    multi_valued: false
                    value_type: 'integer'
                  immichrole:
                    name: 'immich_role'
                    multi_valued: false
                    value_type: 'string'

          session:
            expiration: 16 hours # sessions expires every day
            inactivity: 8 hours # destroy sessions if nothing is done
            remember_me: -1      # always apply the same behavior
            redis:
              enabled: true
              host: authelia-valkey
              username: authelia
              password:
                secret_name: authelia-valkey
                value: authelia
                path: authelia
            cookies:
              - domain: "{{ .Values.global.domain }}"
                subdomain: authelia
            encryption_key:
              secret_name: authelia-generated

          password_policy:
            zxcvbn:
              enabled: true
              min_score: 4

          totp:
            issuer: "{{ .Values.global.name }} Authelia"
          webauthn:
            display_name: "{{ .Values.global.name }} Authelia"

          access_control:
            default_policy: deny
            rules:
              - domain:
                  - gitea.{{ .Values.global.domain }}
                  - homer.{{ .Values.global.domain }}
                  - lldap.{{ .Values.global.domain }}
                  - longhorn.{{ .Values.global.domain }}
                  - mail.{{ .Values.global.domain }}
                  - grafana.{{ .Values.global.domain }}
                  - alertmanager.{{ .Values.global.domain }}
                  - prometheus.{{ .Values.global.domain }}
                  - fluxwebhook.{{ .Values.global.domain }}
                  - rutorrent.{{ .Values.global.domain }}
                subject:
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain:
                  - homer.{{ .Values.global.domain }}
                subject:
                  - [ 'group:role_user' ]
                  - [ 'group:role_admin' ]
                policy: one_factor
              - domain:
                  - seerr.{{ .Values.global.domain }}
                subject:
                  - [ 'group:app_seerr' ]
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain:
                  - jellyfin.{{ .Values.global.domain }}
                subject:
                  - [ 'group:app_jellyfin' ]
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain:
                  - gitea.{{ .Values.global.domain }}
                subject:
                  - [ 'group:app_gitea' ]
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain:
                  - pushprox.{{ .Values.global.domain }}
                subject:
                  - [ 'group:app_pushprox' ]
                  - [ 'group:role_admin' ]
                policy: one_factor
              - domain:
                  - immich.{{ .Values.global.domain }}
                subject:
                  - [ 'group:app_immich' ]
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain:
                  - immich.{{ .Values.global.domain }}
                subject:
                  - [ 'group:app_immich_one_factor' ]
                policy: one_factor
              - domain:
                  - whoami.{{ .Values.global.domain }}
                policy: one_factor

          identity_validation:
            reset_password:
              secret:
                secret_name: authelia-generated

          identity_providers:
            oidc:
              enabled: false # needs the `authelia-oidc` and `authelia-jwks` secrets mounted, see `secret.additionalSecrets`
              hmac_secret:
                secret_name: authelia-generated
              jwks:
                - key_id: ''
                  algorithm: 'RS256'
                  use: 'sig'
                  key:
                    path: '/secrets/authelia-jwks/tls.key'
                  certificate_chain:
                    path: '/secrets/authelia-jwks/tls.crt'
              authorization_policies:
                immich_authz:
                  default_policy: deny
                  rules:
                    - policy: two_factor
                      subject:
                        - 'group:role_admin'
                        - 'group:app_immich'
                    - policy: one_factor
                      subject:
                        - 'group:app_immich_one_factor'

              claims_policies:
                grafana:
                  id_token: [ 'email', 'name', 'groups', 'preferred_username' ]
                immich_policy:
                  custom_claims:
                    immich_quota:
                      attribute: 'immich_quota'
                    immich_role:
                      attribute: 'immich_role'
              scopes:
                immich_scope:
                  claims:
                    - 'immich_quota'
                    - 'immich_role'
              ## See: https://www.authelia.com/c/oidc
              # generate a client_id
              # docker run --rm authelia/authelia:latest authelia crypto rand --length 72 --charset rfc3986
              # generate a client_secret
              # docker run --rm authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
              clients:
                  # gitea admin auth add-oauth --provider=openidConnect --name=authelia --key=gitea --secret=insecure_secret --auto-discover-url=https://authelia.{{ .Values.global.domain }}/.well-known/openid-configuration --scopes='openid email profile'
                - client_id: 'gitea'
                  client_name: 'Gitea'
                  client_secret:
                    path: '/secrets/authelia-oidc/oidc.client.gitea.value'
                  public: false
                  authorization_policy: 'two_factor'
                  require_pkce: false
                  pkce_challenge_method: ''
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://gitea.{{ .Values.global.domain }}/user/oauth2/authelia/callback'
                  scopes:
                    - 'openid'
                    - 'email'
                    - 'profile'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_basic'

                - client_id: 'grafana'
                  client_name: 'Grafana'
                  client_secret:
                    path: '/secrets/authelia-oidc/oidc.client.grafana.value'
                  claims_policy: 'grafana'
                  public: false
                  authorization_policy: 'two_factor'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://grafana.{{ .Values.global.domain }}/login/generic_oauth'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'groups'
                    - 'email'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_basic'

                - client_id: 'jellyfin'
                  client_name: 'Jellyfin'
                  client_secret:
                    path: '/secrets/authelia-oidc/oidc.client.jellyfin.value'
                  public: false
                  authorization_policy: 'two_factor'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://jellyfin.{{ .Values.global.domain }}/sso/OID/redirect/authelia'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'groups'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_post'

                - client_id: 'immich'
                  client_name: 'immich'
                  client_secret:
                    path: '/secrets/authelia-oidc/oidc.client.immich.value'
                  public: false
                  authorization_policy: 'immich_authz'
                  require_pkce: false
                  pkce_challenge_method: ''
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://immich.{{ .Values.global.domain }}/auth/login'
                    - 'https://immich.{{ .Values.global.domain }}/user-settings'
                    - 'app.immich:///oauth-callback'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'email'
                    - 'immich_scope'
                  claims_policy: 'immich_policy'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'RS256'
                  userinfo_signed_response_alg: 'RS256'
                  token_endpoint_auth_method: 'client_secret_post'
