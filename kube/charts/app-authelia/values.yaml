# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:
  name:
  ldapdn:


resources:

  fluxHelmRepositories:
    authelia:
      url: https://charts.authelia.com
    authelia-valkey:
      url: https://valkey.io/valkey-helm/

  # on top of the default deny of app-cilium: one policy for each component. The selectors are in the namespace of the release.
  # The database has its own policy, from the postgresql-cluster chart.
  ciliumNetworkPolicies:
    authelia:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: authelia}
      ingress:
        gateway: # the portal and the forward auth of every protected route
          fromEntities: {ingress: ingress, host: host, remote-node: remote-node}
          toPorts:
            http: {ports: {p9091: {port: "9091", protocol: TCP}}}
      egress:
        lldap:
          toEndpoints:
            lldap:
              matchLabels: {"k8s:io.kubernetes.pod.namespace": lldap, "k8s:app.kubernetes.io/name": lldap}
          toPorts:
            ldaps: {ports: {p6360: {port: "6360", protocol: TCP}}}
        valkey:
          toEndpoints:
            valkey:
              matchLabels: {app.kubernetes.io/name: valkey}
          toPorts:
            valkey: {ports: {p6379: {port: "6379", protocol: TCP}}}
        postgresql:
          toEndpoints:
            postgresql:
              matchLabels: {cnpg.io/cluster: authelia-postgresql}
          toPorts:
            postgresql: {ports: {p5432: {port: "5432", protocol: TCP}}}
        ntp: # the startup check of the clock (`ntp` of the configuration)
          toFQDNs:
            cloudflare: {matchName: time.cloudflare.com} # TODO check why
          toPorts:
            ntp: {ports: {p123: {port: "123", protocol: UDP}}}

    authelia-valkey: # the sessions
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: valkey}
      ingress:
        authelia:
          fromEndpoints:
            authelia:
              matchLabels: {app.kubernetes.io/name: authelia}
          toPorts:
            valkey: {ports: {p6379: {port: "6379", protocol: TCP}}}

  fluxHelmReleases:
    # the database is prepared by the postgresql-cluster chart (certificates, issuer, cluster and backups)
    # the cluster is named after the release, which is the name of this HelmRelease
    authelia-postgresql:
      values:
        clients:
          authelia:
            matchLabels: {app.kubernetes.io/name: authelia}
      chart:
        spec:
          chart: ./kube/charts/postgresql-cluster
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      dependsOn: # the certificates, the cluster and the volume snapshots
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        cnpg:
          name: app-cnpg
          namespace: cnpg-system
        longhorn:
          name: app-longhorn
          namespace: longhorn-system

    # the secrets of the services, created before they start
    authelia-pre:
      dependsOn:
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        external-secrets:
          name: app-external-secrets
          namespace: external-secrets
        secret-generator:
          name: app-secret-generator
          namespace: secret-generator
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          stringSecrets:
            authelia-generated:
              fields:
                oidc-hmac:
                  fieldName: identity_providers.oidc.hmac.key
                reset-password-hmac:
                  fieldName: identity_validation.reset_password.jwt.hmac.key
                session-encryption:
                  fieldName: session.encryption.key

            # secrets of the OIDC clients, one secret for each client so that an app can be given access to its own secret only
            # (the key is `secret`, the name is `authelia-oidc-<client_id>`)
            authelia-oidc-forgejo:
              fields:
                secret:
                  fieldName: secret
            authelia-oidc-grafana:
              fields:
                secret:
                  fieldName: secret
            authelia-oidc-jellyfin:
              fields:
                secret:
                  fieldName: secret
            authelia-oidc-immich:
              fields:
                secret:
                  fieldName: secret
            authelia-oidc-seerr:
              fields:
                secret:
                  fieldName: secret

            # users of valkey, the key is the name of the user
            authelia-valkey:
              fields:
                default:
                  fieldName: default
                authelia:
                  fieldName: authelia

          # key pair signing the OIDC tokens, mounted from /secrets/authelia-jwks
          certManagerCertificates:
            authelia-jwks:
              secretName: authelia-jwks
              commonName: authelia-jwks
              issuerRef:
                name: self-signed
                kind: ClusterIssuer

          # The password authelia binds to lldap with is generated in the lldap namespace (`lldap-authelia` secret, the account is
          # created by `lldap-post`). The `lldap` SecretStore reads it there as the `lldap-reader` service account, which the Role of
          # `lldap-pre` allows, and the ExternalSecret copies it to the `authelia-ldap` secret.
          serviceAccounts:
            lldap-reader:
              automountServiceAccountToken: false # only used by external-secrets to get a token

          secretStores:
            lldap:
              provider:
                kubernetes:
                  remoteNamespace: lldap
                  server:
                    caProvider:
                      type: ConfigMap
                      name: kube-root-ca.crt
                      key: ca.crt
                  auth:
                    serviceAccount:
                      name: lldap-reader

          # lets the `authelia-reader` service account of the forgejo namespace, used by the SecretStore of forgejo, read the
          # `authelia-oidc-forgejo` secret of this namespace (the secret of its OIDC client), and only this one.
          roles:
            immich-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ authelia-oidc-immich ]
                  verbs: [ get ]
            forgejo-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ authelia-oidc-forgejo ]
                  verbs: [ get ]
            grafana-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ authelia-oidc-grafana ]
                  verbs: [ get ]
            seerr-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ authelia-oidc-seerr ]
                  verbs: [ get ]
            jellyfin-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ authelia-oidc-jellyfin ]
                  verbs: [ get ]

          roleBindings:
            immich-secrets-reader:
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: immich-secrets-reader
              subjects:
                authelia-reader:
                  kind: ServiceAccount
                  name: authelia-reader
                  namespace: immich
            forgejo-secrets-reader:
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: forgejo-secrets-reader
              subjects:
                authelia-reader:
                  kind: ServiceAccount
                  name: authelia-reader
                  namespace: forgejo
            grafana-secrets-reader:
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: grafana-secrets-reader
              subjects:
                authelia-reader:
                  kind: ServiceAccount
                  name: authelia-reader
                  namespace: prometheus
            seerr-secrets-reader:
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: seerr-secrets-reader
              subjects:
                authelia-reader:
                  kind: ServiceAccount
                  name: authelia-reader
                  namespace: seerr
            jellyfin-secrets-reader:
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: Role
                name: jellyfin-secrets-reader
              subjects:
                authelia-reader:
                  kind: ServiceAccount
                  name: authelia-reader
                  namespace: jellyfin

          externalSecrets:
            authelia-ldap:
              refreshInterval: 1h
              secretStoreRef:
                kind: SecretStore
                name: lldap
              data:
                password:
                  secretKey: password
                  remoteRef:
                    key: lldap-authelia
                    property: password

    authelia-valkey:
      dependsOn: # the generated secrets
        authelia-pre:
          name: authelia-pre
      chart:
        spec:
          chart: valkey
          version: 0.12.0
          sourceRef:
            kind: HelmRepository
            name: authelia-valkey
      values:
        replicaCount: 1
        dataStorage:
          enabled: true
          requestedSize: 1Gi

        auth:
          enabled: true
          aclUsers:
            default:
              permissions: "~* -@all"
            authelia:
              permissions: "~* &* +@all"
          usersExistingSecret: authelia-valkey

    authelia:
      timeout: 10m # the pods wait for the database
      dependsOn:
        authelia-pre: # the generated secrets
          name: authelia-pre
        authelia-postgresql:
          name: authelia-postgresql
        authelia-valkey:
          name: authelia-valkey
        lldap: # the ldap backend
          name: app-lldap
          namespace: lldap
      chart:
        spec:
          chart: authelia
          version: 0.11.22
          sourceRef:
            kind: HelmRepository
            name: authelia
      values:
        ingress:
          enabled: false # Gateway instead

        pod:
          kind: Deployment
          replicas: 1 # TODO the notifications are files of the pod
          env:
            - name: TZ
              value: Europe/Paris
          # the hashes of the OIDC client secrets are built from the generated secrets, the hashes change at each start but the secrets do not
          initContainers:
            - name: oidc-hashes
              image: ghcr.io/authelia/authelia:4.39.24
              command:
                - sh
                - -ec
                - |
                  for client in forgejo grafana jellyfin immich seerr; do
                    hash=$(authelia crypto hash generate pbkdf2 --variant sha512 --password "$(cat /secrets/authelia-oidc-$client/secret)" | sed 's/^Digest: //')
                    printf '%s' "$hash" > /config/oidc-$client.hash
                  done
              volumeMounts:
                - name: authelia
                  mountPath: /config
                - name: secret-authelia-oidc-forgejo
                  mountPath: /secrets/authelia-oidc-forgejo
                  readOnly: true
                - name: secret-authelia-oidc-grafana
                  mountPath: /secrets/authelia-oidc-grafana
                  readOnly: true
                - name: secret-authelia-oidc-jellyfin
                  mountPath: /secrets/authelia-oidc-jellyfin
                  readOnly: true
                - name: secret-authelia-oidc-immich
                  mountPath: /secrets/authelia-oidc-immich
                  readOnly: true
                - name: secret-authelia-oidc-seerr
                  mountPath: /secrets/authelia-oidc-seerr
                  readOnly: true
          # setting extra volumes removes the default /config volume of the chart
          extraVolumes:
            - name: authelia
              emptyDir:
                sizeLimit: 100Mi
          extraVolumeMounts:
            - name: authelia
              mountPath: /config

        secret:
          additionalSecrets:
            authelia-generated: {}
            authelia-ldap: {}
            authelia-postgresql-app: {}
            authelia-valkey: {}
            authelia-oidc-forgejo: {}
            authelia-oidc-grafana: {}
            authelia-oidc-jellyfin: {}
            authelia-oidc-immich: {}
            authelia-oidc-seerr: {}
            authelia-jwks: {}

        configMap:
          theme: dark

          server:
            endpoints:
              authz:
                ext-authz: # called by the Envoy of the Cilium Gateway on /api/authz/ext-authz/
                  implementation: ExtAuthz

          telemetry:
            metrics:
              enabled: true
          storage:
            postgres:
              enabled: true
              address: tcp://authelia-postgresql-rw
              database: app
              username: app
              password:
                secret_name: authelia-postgresql-app
                value: password
                path: password
          notifier:
            filesystem:
              enabled: true
            disable_startup_check: false # in case of emergency
            smtp:
              enabled: false
              address: submissions://mail.{{ .Values.global.domain }}:465
              sender: '{{ .Values.global.name }} Authelia <authelia@{{ .Values.global.domain }}>'
              username: authelia@{{ .Values.global.domain }}
              password: {}

          authentication_backend:
            file:
              enabled: false
            ldap:
              enabled: true
              implementation: lldap
              # the service of lldap, with the name of the publicly trusted certificate of its ldaps listener (`tls-lldaps`)
              address: ldaps://lldap.lldap.svc.cluster.local:6360
              base_dn: "{{ .Values.global.ldapdn }}"
              # created by `lldap-post`, its password is copied from the lldap namespace by the ExternalSecret `authelia-ldap`
              user: 'UID=authelia,OU=people,{{ .Values.global.ldapdn }}'
              password:
                secret_name: authelia-ldap
                value: password
                path: password
              tls:
                server_name: lldaps.{{ .Values.global.domain }}
                skip_verify: false
                minimum_version: TLS1.2
              attributes:
                extra:
                  immichquota: # The attribute name from LDAP
                    name: 'immichquota'
                    multi_valued: false
                    value_type: 'integer'
                  immichrole:
                    name: 'immichrole'
                    multi_valued: false
                    value_type: 'string'

          session:
            expiration: 16 hours # sessions expires every day
            inactivity: 8 hours # destroy sessions if nothing is done
            remember_me: -1      # always apply the same behavior
            redis:
              enabled: true
              host: authelia-valkey
              username: authelia
              password:
                secret_name: authelia-valkey
                value: authelia
                path: authelia
            cookies:
              - domain: "{{ .Values.global.domain }}"
                subdomain: authelia
            encryption_key:
              secret_name: authelia-generated

          password_policy:
            zxcvbn:
              enabled: true
              min_score: 4

          totp:
            issuer: "{{ .Values.global.name }} Authelia"
          webauthn:
            display_name: "{{ .Values.global.name }} Authelia"

          access_control:
            default_policy: deny
            rules:
              - domain:
                  - forgejo.{{ .Values.global.domain }}
                  - homer.{{ .Values.global.domain }}
                  - lldap.{{ .Values.global.domain }}
                  - longhorn.{{ .Values.global.domain }}
                  - mail.{{ .Values.global.domain }}
                  - grafana.{{ .Values.global.domain }}
                  - alertmanager.{{ .Values.global.domain }}
                  - prometheus.{{ .Values.global.domain }}
                  - fluxwebhook.{{ .Values.global.domain }}
                  - rutorrent.{{ .Values.global.domain }}
                subject:
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain:
                  - homer.{{ .Values.global.domain }}
                subject:
                  - [ 'group:role_user' ]
                  - [ 'group:role_admin' ]
                policy: one_factor
              - domain:
                  - seerr.{{ .Values.global.domain }}
                subject:
                  - [ 'group:app_seerr' ]
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain:
                  - jellyfin.{{ .Values.global.domain }}
                subject:
                  - [ 'group:app_jellyfin' ]
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain:
                  - forgejo.{{ .Values.global.domain }}
                subject:
                  - [ 'group:app_forgejo' ]
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain:
                  - pushprox.{{ .Values.global.domain }}
                subject:
                  - [ 'group:app_pushprox' ]
                  - [ 'group:role_admin' ]
                policy: one_factor
              - domain:
                  - immich.{{ .Values.global.domain }}
                subject:
                  - [ 'group:app_immich' ]
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain:
                  - immich.{{ .Values.global.domain }}
                subject:
                  - [ 'group:app_immich_one_factor' ]
                policy: one_factor
              - domain:
                  - whoami.{{ .Values.global.domain }}
                policy: one_factor

          identity_validation:
            reset_password:
              secret:
                secret_name: authelia-generated

          identity_providers:
            oidc:
              enabled: true
              hmac_secret:
                secret_name: authelia-generated
              jwks:
                - key_id: ''
                  algorithm: 'RS256'
                  use: 'sig'
                  key:
                    path: '/secrets/authelia-jwks/tls.key'
                  certificate_chain:
                    path: '/secrets/authelia-jwks/tls.crt'
              authorization_policies:
                forgejo_authz:
                  default_policy: deny
                  rules:
                    - policy: two_factor
                      subject:
                        - 'group:role_admin'
                        - 'group:app_forgejo'
                immich_authz:
                  default_policy: deny
                  rules:
                    - policy: two_factor
                      subject:
                        - 'group:role_admin'
                        - 'group:app_immich'
                    - policy: one_factor
                      subject:
                        - 'group:app_immich_one_factor'
                seerr_authz:
                  default_policy: deny
                  rules:
                    - policy: two_factor
                      subject:
                        - 'group:role_admin'
                        - 'group:app_seerr'
                jellyfin_authz:
                  default_policy: deny
                  rules:
                    - policy: two_factor
                      subject:
                        - 'group:role_admin'
                        - 'group:app_jellyfin'

              claims_policies:
                grafana:
                  id_token: [ 'email', 'name', 'groups', 'preferred_username' ]
                immich_policy:
                  custom_claims:
                    immich_quota:
                      attribute: 'immichquota'
                    immich_role:
                      attribute: 'immichrole'
              scopes:
                immich_scope:
                  claims:
                    - 'immich_quota'
                    - 'immich_role'
              ## See: https://www.authelia.com/c/oidc
              # generate a client_id
              # docker run --rm authelia/authelia:latest authelia crypto rand --length 72 --charset rfc3986
              # generate a client_secret
              # docker run --rm authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
              clients:
                  # forgejo admin auth add-oauth --provider=openidConnect --name=authelia --key=forgejo --secret=insecure_secret --auto-discover-url=https://authelia.{{ .Values.global.domain }}/.well-known/openid-configuration --scopes='openid email profile'
                - client_id: forgejo
                  client_name: Forgejo
                  client_secret:
                    path: '/config/oidc-forgejo.hash'
                  public: false
                  authorization_policy: 'forgejo_authz'
                  require_pkce: false
                  pkce_challenge_method: ''
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://forgejo.{{ .Values.global.domain }}/user/oauth2/authelia/callback'
                  scopes:
                    - 'openid'
                    - 'email'
                    - 'profile'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_basic'

                - client_id: 'grafana'
                  client_name: 'Grafana'
                  client_secret:
                    path: '/config/oidc-grafana.hash'
                  claims_policy: 'grafana'
                  public: false
                  authorization_policy: 'two_factor'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://grafana.{{ .Values.global.domain }}/login/generic_oauth'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'groups'
                    - 'email'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_basic'

                - client_id: 'jellyfin'
                  client_name: 'Jellyfin'
                  client_secret:
                    path: '/config/oidc-jellyfin.hash'
                  public: false
                  authorization_policy: 'jellyfin_authz'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://jellyfin.{{ .Values.global.domain }}/sso/OID/redirect/authelia'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'groups'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_post'

                - client_id: 'immich'
                  client_name: 'immich'
                  client_secret:
                    path: '/config/oidc-immich.hash'
                  public: false
                  authorization_policy: 'immich_authz'
                  require_pkce: false
                  pkce_challenge_method: ''
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://immich.{{ .Values.global.domain }}/auth/login'
                    - 'https://immich.{{ .Values.global.domain }}/user-settings'
                    - 'app.immich:///oauth-callback'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'email'
                    - 'immich_scope'
                  claims_policy: 'immich_policy'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'RS256'
                  userinfo_signed_response_alg: 'RS256'
                  token_endpoint_auth_method: 'client_secret_post'

                # seerr (the preview image of the pending OIDC support, https://github.com/seerr-team/seerr/pull/2715): the id token
                # and the userinfo give the email (the user is created from it) and the preferred_username
                - client_id: 'seerr'
                  client_name: 'Seerr'
                  client_secret:
                    path: '/config/oidc-seerr.hash'
                  public: false
                  authorization_policy: 'seerr_authz'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://seerr.{{ .Values.global.domain }}/login'
                    - 'https://seerr.{{ .Values.global.domain }}/profile/settings/linked-accounts'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'email'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_post'

    # the public exposure, applied once authelia is deployed and not waited for
    authelia-integration:
      install:
        disableWait: true
      upgrade:
        disableWait: true
      dependsOn:
        authelia:
          name: authelia
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        gateway-api:
          name: app-gateway-api
          namespace: gateway-api
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          certManagerCertificates:
            # certificate of the portal, terminated by the Gateway
            authelia-gateway:
              secretName: tls-authelia-gateway
              dnsNames:
                authelia: authelia.{{ .Values.global.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

          # Forward auth for the apps behind the Cilium Gateway: the `ExternalAuth` filter of their HTTPRoute calls the authelia service.
          # An HTTPRoute can only reference a service of another namespace when it is granted here: add the namespace of each app.
          referenceGrants:
            ext-authz:
              from:
                longhorn:
                  group: gateway.networking.k8s.io
                  kind: HTTPRoute
                  namespace: longhorn-system
                homer:
                  group: gateway.networking.k8s.io
                  kind: HTTPRoute
                  namespace: homer
                prometheus:
                  group: gateway.networking.k8s.io
                  kind: HTTPRoute
                  namespace: prometheus
                seerr:
                  group: gateway.networking.k8s.io
                  kind: HTTPRoute
                  namespace: seerr
                whoami:
                  group: gateway.networking.k8s.io
                  kind: HTTPRoute
                  namespace: whoami
              to:
                authelia:
                  group: ""
                  kind: Service
                  name: authelia

          # Portal exposed by the Cilium Gateway `shared` (kube-system). It is not protected by forward auth itself.
          listenerSets:
            authelia:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: shared
                namespace: kube-system
              listeners:
                https:
                  name: https
                  hostname: authelia.{{ .Values.global.domain }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-authelia-gateway
                  allowedRoutes:
                    namespaces:
                      from: Same

          httpRoutes:
            authelia:
              parentRefs:
                authelia:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: authelia
              hostnames:
                authelia: authelia.{{ .Values.global.domain }}
              rules:
                root:
                  backendRefs:
                    authelia:
                      name: authelia
                      port: 80
