# yaml-language-server: $schema=../app/schema/values.schema.json

resources:

  fluxHelmRepositories:
    authelia:
      url: https://charts.authelia.com

  # on top of the default deny of app-cilium: one policy for each component. The selectors are in the namespace of the release.
  # The database and valkey have their own policy, from the postgresql and valkey charts.
  ciliumNetworkPolicies:
    authelia:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: authelia}
      ingress:
        gateway: # the portal and the forward auth of every protected route
          fromEntities: [ingress, host, remote-node]
          toPorts: [9091]
      egress:
        lldap:
          toEndpoints:
            lldap:
              matchLabels: {"k8s:io.kubernetes.pod.namespace": lldap, "k8s:app.kubernetes.io/instance": lldap, "k8s:app.kubernetes.io/component": lldap}
          toPorts: [6360]
        valkey:
          toEndpoints:
            valkey:
              matchLabels: {app.kubernetes.io/name: valkey}
          toPorts: [6379]
        postgresql:
          toEndpoints:
            postgresql:
              matchLabels: {cnpg.io/cluster: authelia-postgresql}
          toPorts: [5432]
        ntp: # the startup check of the clock (`ntp` of the configuration)
          toFQDNs:
            cloudflare: {matchName: time.cloudflare.com} # TODO check why
          toPorts:
            ntp: {ports: {p123: {port: "123", protocol: UDP}}}

  fluxHelmReleases:
    # the database is prepared by the postgresql chart (certificates, issuer, cluster and backups)
    # the cluster is named after the release, which is the name of this HelmRelease
    authelia-postgresql:
      values:
        instances: "{{ .Values.app.scaling.dbReplicas }}"
        clients:
          authelia:
            matchLabels: {app.kubernetes.io/name: authelia}
      chart:
        spec:
          chart: ./kube/charts/postgresql
      dependsOn: # the certificates, the cluster and the volume snapshots
        - name: app-cert-manager
          namespace: cert-manager
        - name: app-cnpg
          namespace: cnpg-system
        - name: app-longhorn
          namespace: longhorn-system

    # the secrets of the services, created before they start
    authelia-pre:
      dependsOn:
        - name: app-cert-manager
          namespace: cert-manager
        - name: app-external-secrets
          namespace: external-secrets
        - name: app-secret-generator
          namespace: secret-generator
      values:
        resources:
          stringSecrets:
            authelia-generated:
              fields:
                oidc-hmac:
                  fieldName: identity_providers.oidc.hmac.key
                reset-password-hmac:
                  fieldName: identity_validation.reset_password.jwt.hmac.key
                session-encryption:
                  fieldName: session.encryption.key

            # secrets of the OIDC clients, one secret for each client so that an app can be given access to its own secret only
            # (the keys are `client-id` and `secret`, the name is `authelia-oidc-<app>`). The client ids are generated too, authelia reads
            # them from the files of the secrets with its template filter (`X_AUTHELIA_CONFIG_FILTERS`).
            authelia-oidc-forgejo:
              fields:
                client-id: {}
                secret: {}
            authelia-oidc-grafana:
              fields:
                client-id: {}
                secret: {}
            authelia-oidc-jellyfin:
              fields:
                client-id: {}
                secret: {}
            authelia-oidc-immich:
              fields:
                client-id: {}
                secret: {}
            authelia-oidc-seerr:
              fields:
                client-id: {}
                secret: {}
            authelia-oidc-seafile:
              fields:
                client-id: {}
                secret: {}
            authelia-oidc-paperless:
              fields:
                client-id: {}
                secret: {}
            authelia-oidc-tuwunel:
              fields:
                client-id: {}
                secret: {}

          # key pair signing the OIDC tokens, mounted from /secrets/authelia-jwks
          certManagerCertificates:
            authelia-jwks:
              secretName: authelia-jwks
              commonName: authelia-jwks
              issuerRef:
                name: self-signed
                kind: ClusterIssuer

          # The password authelia binds to lldap with is generated in the lldap namespace (`lldap-authelia` secret, the account is
          # created by `lldap-post`). The `lldap` SecretStore reads it there as the `lldap-reader` service account, which the Role of
          # `lldap-pre` allows, and the ExternalSecret copies it to the `authelia-ldap` secret.
          serviceAccounts:
            lldap-reader:
              automountServiceAccountToken: false # only used by external-secrets to get a token

          secretStores:
            lldap:
              provider:
                kubernetes:
                  remoteNamespace: lldap
                  server:
                    caProvider:
                      type: ConfigMap
                      name: kube-root-ca.crt
                      key: ca.crt
                  auth:
                    serviceAccount:
                      name: ref:lldap-reader

          # lets the `authelia-reader` service account of the forgejo namespace, used by the SecretStore of forgejo, read the
          # `authelia-oidc-forgejo` secret of this namespace (the secret of its OIDC client), and only this one.
          roles:
            immich-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ authelia-oidc-immich ]
                  verbs: [ get ]
            forgejo-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ authelia-oidc-forgejo ]
                  verbs: [ get ]
            grafana-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ authelia-oidc-grafana ]
                  verbs: [ get ]
            seerr-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ authelia-oidc-seerr ]
                  verbs: [ get ]
            jellyfin-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ authelia-oidc-jellyfin ]
                  verbs: [ get ]
            seafile-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ authelia-oidc-seafile ]
                  verbs: [ get ]
            paperless-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ authelia-oidc-paperless ]
                  verbs: [ get ]
            tuwunel-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ authelia-oidc-tuwunel ]
                  verbs: [ get ]

          roleBindings:
            immich-secrets-reader:
              roleRef: ref:immich-secrets-reader
              subjects:
                authelia-reader:
                  kind: ServiceAccount
                  name: authelia-reader
                  namespace: immich
            forgejo-secrets-reader:
              roleRef: ref:forgejo-secrets-reader
              subjects:
                authelia-reader:
                  kind: ServiceAccount
                  name: authelia-reader
                  namespace: forgejo
            grafana-secrets-reader:
              roleRef: ref:grafana-secrets-reader
              subjects:
                authelia-reader:
                  kind: ServiceAccount
                  name: authelia-reader
                  namespace: prometheus
            seerr-secrets-reader:
              roleRef: ref:seerr-secrets-reader
              subjects:
                authelia-reader:
                  kind: ServiceAccount
                  name: authelia-reader
                  namespace: seerr
            jellyfin-secrets-reader:
              roleRef: ref:jellyfin-secrets-reader
              subjects:
                authelia-reader:
                  kind: ServiceAccount
                  name: authelia-reader
                  namespace: jellyfin
            seafile-secrets-reader:
              roleRef: ref:seafile-secrets-reader
              subjects:
                authelia-reader:
                  kind: ServiceAccount
                  name: authelia-reader
                  namespace: seafile
            paperless-secrets-reader:
              roleRef: ref:paperless-secrets-reader
              subjects:
                authelia-reader:
                  kind: ServiceAccount
                  name: authelia-reader
                  namespace: paperless
            tuwunel-secrets-reader:
              roleRef: ref:tuwunel-secrets-reader
              subjects:
                authelia-reader:
                  kind: ServiceAccount
                  name: authelia-reader
                  namespace: tuwunel

          externalSecrets:
            authelia-ldap:
              refreshInterval: 1h
              secretStoreRef: ref:lldap
              data:
                password:
                  secretKey: password
                  remoteRef:
                    key: lldap-authelia
                    property: password

    # the sessions, the passwords of the users are generated by the valkey chart
    authelia-valkey:
      dependsOn: # the generation of the passwords
        - name: app-secret-generator
          namespace: secret-generator
      chart:
        spec:
          chart: ./kube/charts/valkey
      values:
        clients:
          authelia:
            matchLabels: {app.kubernetes.io/name: authelia}
        valkey:
          auth:
            aclUsers:
              default:
                permissions: "~* -@all"
              authelia:
                permissions: "~* &* +@all"

    authelia:
      dependsOn:
        - ref:authelia-pre # the generated secrets
        - ref:authelia-postgresql
        - ref:authelia-valkey
        - name: app-lldap # the ldap backend
          namespace: lldap
      chart:
        spec:
          chart: authelia
          version: 0.11.22
          sourceRef:
            kind: HelmRepository
            name: authelia
      values:
        ingress:
          enabled: false # Gateway instead

        pod:
          kind: Deployment
          replicas: 1 # TODO the notifications are files of the pod
          env:
            - name: TZ
              value: Europe/Paris
          # compliant with the policies of app-kyverno (container-require-run-as-non-root, container-require-read-only-root-filesystem).
          # The only writable path is /config, an emptyDir (see extraVolumes)
          securityContext:
            pod:
              runAsNonRoot: true
              runAsUser: 2000
              runAsGroup: 2000
              seccompProfile:
                type: RuntimeDefault
            container:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ ALL ]
          # the hashes of the OIDC client secrets are built from the generated secrets, the hashes change at each start but the secrets do not
          initContainers:
            - name: oidc-hashes
              image: ghcr.io/authelia/authelia:4.39.27
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ ALL ]
              command:
                - sh
                - -ec
                - |
                  for client in forgejo grafana jellyfin immich seerr seafile paperless tuwunel; do
                    hash=$(authelia crypto hash generate pbkdf2 --variant sha512 --password "$(cat /secrets/authelia-oidc-$client/secret)" | sed 's/^Digest: //')
                    printf '%s' "$hash" > /config/oidc-$client.hash
                  done
              volumeMounts:
                - name: authelia
                  mountPath: /config
                - name: secret-authelia-oidc-forgejo
                  mountPath: /secrets/authelia-oidc-forgejo
                  readOnly: true
                - name: secret-authelia-oidc-grafana
                  mountPath: /secrets/authelia-oidc-grafana
                  readOnly: true
                - name: secret-authelia-oidc-jellyfin
                  mountPath: /secrets/authelia-oidc-jellyfin
                  readOnly: true
                - name: secret-authelia-oidc-immich
                  mountPath: /secrets/authelia-oidc-immich
                  readOnly: true
                - name: secret-authelia-oidc-seerr
                  mountPath: /secrets/authelia-oidc-seerr
                  readOnly: true
                - name: secret-authelia-oidc-seafile
                  mountPath: /secrets/authelia-oidc-seafile
                  readOnly: true
                - name: secret-authelia-oidc-paperless
                  mountPath: /secrets/authelia-oidc-paperless
                  readOnly: true
                - name: secret-authelia-oidc-tuwunel
                  mountPath: /secrets/authelia-oidc-tuwunel
                  readOnly: true
          # setting extra volumes removes the default /config volume of the chart
          extraVolumes:
            - name: authelia
              emptyDir:
                sizeLimit: 100Mi
          extraVolumeMounts:
            - name: authelia
              mountPath: /config

        secret:
          additionalSecrets:
            authelia-generated: {}
            authelia-ldap: {}
            authelia-postgresql-app: {}
            authelia-valkey: {}
            authelia-oidc-forgejo: {}
            authelia-oidc-grafana: {}
            authelia-oidc-jellyfin: {}
            authelia-oidc-immich: {}
            authelia-oidc-seerr: {}
            authelia-oidc-seafile: {}
            authelia-oidc-paperless: {}
            authelia-oidc-tuwunel: {}
            authelia-jwks: {}

        configMap:
          theme: dark

          server:
            endpoints:
              authz:
                ext-authz: # called by the Envoy of the Cilium Gateway on /api/authz/ext-authz/
                  implementation: ExtAuthz

          telemetry:
            metrics:
              enabled: true
          storage:
            postgres:
              enabled: true
              address: tcp://authelia-postgresql-rw
              database: app
              username: app
              password:
                secret_name: authelia-postgresql-app
                value: password
                path: password
          notifier:
            filesystem:
              enabled: true
            disable_startup_check: false # in case of emergency
            smtp:
              enabled: false
              address: submissions://mail.{{ .Values.app.domain }}:465
              sender: '{{ .Values.app.name }} Authelia <authelia@{{ .Values.app.domain }}>'
              username: authelia@{{ .Values.app.domain }}
              password: {}

          authentication_backend:
            file:
              enabled: false
            ldap:
              enabled: true
              implementation: lldap
              # the service of lldap, with the name of the publicly trusted certificate of its ldaps listener (`tls-lldaps`)
              address: ldaps://lldap.lldap.svc.cluster.local:6360
              base_dn: "{{ .Values.app.lldapdn }}"
              # created by `lldap-post`, its password is copied from the lldap namespace by the ExternalSecret `authelia-ldap`
              user: 'UID=authelia,OU=people,{{ .Values.app.lldapdn }}'
              password:
                secret_name: authelia-ldap
                value: password
                path: password
              tls:
                server_name: lldaps.{{ .Values.app.domain }}
                skip_verify: false
                minimum_version: TLS1.2
              attributes:
                extra:
                  immichquota: # The attribute name from LDAP
                    name: 'immichquota'
                    multi_valued: false
                    value_type: 'integer'
                  immichrole:
                    name: 'immichrole'
                    multi_valued: false
                    value_type: 'string'

          session:
            expiration: 16 hours # sessions expires every day
            inactivity: 8 hours # destroy sessions if nothing is done
            remember_me: -1      # always apply the same behavior
            redis:
              enabled: true
              host: authelia-valkey
              username: authelia
              password:
                secret_name: authelia-valkey
                value: authelia
                path: authelia
            cookies:
              - domain: "{{ .Values.app.domain }}"
                subdomain: authelia
            encryption_key:
              secret_name: authelia-generated

          password_policy:
            zxcvbn:
              enabled: true
              min_score: 4

          totp:
            issuer: "{{ .Values.app.name }} Authelia"
          webauthn:
            display_name: "{{ .Values.app.name }} Authelia"

          access_control:
            default_policy: deny
            rules:
              - domain:
                  - forgejo.{{ .Values.app.domain }}
                  - homer.{{ .Values.app.domain }}
                  - lldap.{{ .Values.app.domain }}
                  - longhorn.{{ .Values.app.domain }}
                  - mail.{{ .Values.app.domain }}
                  - grafana.{{ .Values.app.domain }}
                  - alertmanager.{{ .Values.app.domain }}
                  - prometheus.{{ .Values.app.domain }}
                  - fluxwebhook.{{ .Values.app.domain }}
                  - rutorrent.{{ .Values.app.domain }}
                subject:
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain_regex: # the Syncthing instance of a user (app-syncthing): the `User` named group has to be the username (no subject needed)
                  - '^(?P<User>[a-z0-9-]+)\.syncthing\.{{ regexQuoteMeta .Values.app.domain }}$'
                policy: two_factor
              - domain:
                  - homer.{{ .Values.app.domain }}
                subject:
                  - [ 'group:role_user' ]
                  - [ 'group:role_admin' ]
                policy: one_factor
              - domain:
                  - seerr.{{ .Values.app.domain }}
                subject:
                  - [ 'group:app_seerr' ]
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain:
                  - jellyfin.{{ .Values.app.domain }}
                subject:
                  - [ 'group:app_jellyfin' ]
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain:
                  - forgejo.{{ .Values.app.domain }}
                subject:
                  - [ 'group:app_forgejo' ]
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain:
                  - pushprox.{{ .Values.app.domain }}
                subject:
                  - [ 'group:app_pushprox' ]
                  - [ 'group:role_admin' ]
                policy: one_factor
              - domain:
                  - immich.{{ .Values.app.domain }}
                subject:
                  - [ 'group:app_immich' ]
                  - [ 'group:role_admin' ]
                policy: two_factor
              - domain:
                  - immich.{{ .Values.app.domain }}
                subject:
                  - [ 'group:app_immich_one_factor' ]
                policy: one_factor
              - domain:
                  - whoami.{{ .Values.app.domain }}
                policy: one_factor

          identity_validation:
            reset_password:
              secret:
                secret_name: authelia-generated

          identity_providers:
            oidc:
              enabled: true
              hmac_secret:
                secret_name: authelia-generated
              jwks:
                - key_id: ''
                  algorithm: 'RS256'
                  use: 'sig'
                  key:
                    path: '/secrets/authelia-jwks/tls.key'
                  certificate_chain:
                    path: '/secrets/authelia-jwks/tls.crt'
              authorization_policies:
                forgejo_authz:
                  default_policy: deny
                  rules:
                    - policy: two_factor
                      subject:
                        - 'group:role_admin'
                        - 'group:app_forgejo'
                immich_authz:
                  default_policy: deny
                  rules:
                    - policy: two_factor
                      subject:
                        - 'group:role_admin'
                        - 'group:app_immich'
                    - policy: one_factor
                      subject:
                        - 'group:app_immich_one_factor'
                seerr_authz:
                  default_policy: deny
                  rules:
                    - policy: two_factor
                      subject:
                        - 'group:role_admin'
                        - 'group:app_seerr'
                jellyfin_authz:
                  default_policy: deny
                  rules:
                    - policy: two_factor
                      subject:
                        - 'group:role_admin'
                        - 'group:app_jellyfin'
                seafile_authz:
                  default_policy: deny
                  rules:
                    - policy: two_factor
                      subject:
                        - 'group:role_admin'
                        - 'group:app_seafile'
                paperless_authz:
                  default_policy: deny
                  rules:
                    - policy: two_factor
                      subject:
                        - 'group:role_admin'
                        - 'group:app_paperless'
                tuwunel_authz:
                  default_policy: deny
                  rules:
                    - policy: two_factor
                      subject:
                        - 'group:role_admin'
                        - 'group:app_tuwunel'

              claims_policies:
                grafana:
                  id_token: [ 'email', 'name', 'groups', 'preferred_username' ]
                tuwunel:
                  id_token: [ 'email', 'name', 'groups', 'preferred_username' ]
                immich_policy:
                  custom_claims:
                    immich_quota:
                      attribute: 'immichquota'
                    immich_role:
                      attribute: 'immichrole'
              scopes:
                immich_scope:
                  claims:
                    - 'immich_quota'
                    - 'immich_role'
              ## See: https://www.authelia.com/c/oidc
              # The client ids are generated (key `client-id` of the `authelia-oidc-<app>` secrets, mounted in /secrets): the template filter
              # reads them. The `{{` and `}}` of the filter are escaped for the rendering of this chart.
              # generate a client_secret
              # docker run --rm authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
              clients:
                  # forgejo admin auth add-oauth --provider=openidConnect --name=authelia --key=<client id> --secret=<client secret> --auto-discover-url=https://authelia.{{ .Values.app.domain }}/.well-known/openid-configuration --scopes='openid email profile'
                - client_id: '{{ `{{ secret "/secrets/authelia-oidc-forgejo/client-id" }}` }}'
                  client_name: Forgejo
                  client_secret:
                    path: '/config/oidc-forgejo.hash'
                  public: false
                  authorization_policy: 'forgejo_authz'
                  require_pkce: false
                  pkce_challenge_method: ''
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://forgejo.{{ .Values.app.domain }}/user/oauth2/authelia/callback'
                  scopes:
                    - 'openid'
                    - 'email'
                    - 'profile'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_basic'

                - client_id: '{{ `{{ secret "/secrets/authelia-oidc-grafana/client-id" }}` }}'
                  client_name: 'Grafana'
                  client_secret:
                    path: '/config/oidc-grafana.hash'
                  claims_policy: 'grafana'
                  public: false
                  authorization_policy: 'two_factor'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://grafana.{{ .Values.app.domain }}/login/generic_oauth'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'groups'
                    - 'email'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_basic'

                - client_id: '{{ `{{ secret "/secrets/authelia-oidc-jellyfin/client-id" }}` }}'
                  client_name: 'Jellyfin'
                  client_secret:
                    path: '/config/oidc-jellyfin.hash'
                  public: false
                  authorization_policy: 'jellyfin_authz'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://jellyfin.{{ .Values.app.domain }}/sso/OID/redirect/authelia'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'groups'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_post'

                - client_id: '{{ `{{ secret "/secrets/authelia-oidc-immich/client-id" }}` }}'
                  client_name: 'immich'
                  client_secret:
                    path: '/config/oidc-immich.hash'
                  public: false
                  authorization_policy: 'immich_authz'
                  require_pkce: false
                  pkce_challenge_method: ''
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://immich.{{ .Values.app.domain }}/auth/login'
                    - 'https://immich.{{ .Values.app.domain }}/user-settings'
                    - 'app.immich:///oauth-callback'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'email'
                    - 'immich_scope'
                  claims_policy: 'immich_policy'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'RS256'
                  userinfo_signed_response_alg: 'RS256'
                  token_endpoint_auth_method: 'client_secret_post'

                # seerr (the preview image of the pending OIDC support, https://github.com/seerr-team/seerr/pull/2715): the id token
                # and the userinfo give the email (the user is created from it) and the preferred_username
                - client_id: '{{ `{{ secret "/secrets/authelia-oidc-seerr/client-id" }}` }}'
                  client_name: 'Seerr'
                  client_secret:
                    path: '/config/oidc-seerr.hash'
                  public: false
                  authorization_policy: 'seerr_authz'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://seerr.{{ .Values.app.domain }}/login'
                    - 'https://seerr.{{ .Values.app.domain }}/profile/settings/linked-accounts'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'email'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_post'

                # seafile: its OAuth library authenticates with the HTTP basic scheme and has no PKCE. The access token is not signed,
                # the userinfo gives the preferred_username (the unique id of the user) and the email
                - client_id: '{{ `{{ secret "/secrets/authelia-oidc-seafile/client-id" }}` }}'
                  client_name: 'Seafile'
                  client_secret:
                    path: '/config/oidc-seafile.hash'
                  public: false
                  authorization_policy: 'seafile_authz'
                  require_pkce: false
                  pkce_challenge_method: ''
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://seafile.{{ .Values.app.domain }}/oauth/callback/'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'email'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_basic'

                # paperless (django-allauth): the user is created from the preferred_username and the email, the groups of the userinfo
                # give the superusers (`role_admin`) and the groups of paperless
                - client_id: '{{ `{{ secret "/secrets/authelia-oidc-paperless/client-id" }}` }}'
                  client_name: 'Paperless'
                  client_secret:
                    path: '/config/oidc-paperless.hash'
                  public: false
                  authorization_policy: 'paperless_authz'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://paperless.{{ .Values.app.domain }}/accounts/oidc/authelia/login/callback/'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'email'
                    - 'groups'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_basic'

                # tuwunel (Matrix homeserver): the user is created from the preferred_username, the claims are read in the id token. The
                # callback of tuwunel ends with the client id, and the answer can be a form post.
                - client_id: '{{ `{{ secret "/secrets/authelia-oidc-tuwunel/client-id" }}` }}'
                  client_name: 'Matrix'
                  client_secret:
                    path: '/config/oidc-tuwunel.hash'
                  public: false
                  claims_policy: 'tuwunel'
                  authorization_policy: 'tuwunel_authz'
                  require_pkce: false
                  pkce_challenge_method: ''
                  pre_configured_consent_duration: 1 year
                  redirect_uris:
                    - 'https://matrix.{{ .Values.app.domain }}/_matrix/client/unstable/login/sso/callback/{{ `{{ secret "/secrets/authelia-oidc-tuwunel/client-id" }}` }}'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'email'
                    - 'groups'
                  response_types:
                    - 'code'
                  response_modes:
                    - 'form_post'
                    - 'query'
                  grant_types:
                    - 'authorization_code'
                    - 'refresh_token'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_post'

    # the ReferenceGrants of the public exposure (`expose` below), merged with the generated release
    authelia-integration:
      values:
        resources:
          # Forward auth for the apps behind the Cilium Gateway: the `ExternalAuth` filter of their HTTPRoute calls the authelia service.
          # An HTTPRoute can only reference a service of another namespace when it is granted here: add the namespace of each app.
          referenceGrants:
            ext-authz:
              from:
                longhorn:
                  group: gateway.networking.k8s.io
                  kind: HTTPRoute
                  namespace: longhorn-system
                homer:
                  group: gateway.networking.k8s.io
                  kind: HTTPRoute
                  namespace: homer
                prometheus:
                  group: gateway.networking.k8s.io
                  kind: HTTPRoute
                  namespace: prometheus
                seerr:
                  group: gateway.networking.k8s.io
                  kind: HTTPRoute
                  namespace: seerr
                whoami:
                  group: gateway.networking.k8s.io
                  kind: HTTPRoute
                  namespace: whoami
                syncthing:
                  group: gateway.networking.k8s.io
                  kind: HTTPRoute
                  namespace: syncthing
              to:
                authelia:
                  group: ""
                  kind: Service
                  name: authelia

# the portal exposed by the Cilium Gateway `shared` (kube-system). It is not protected by forward auth itself.
expose:
  authelia:
    service: authelia
    port: 80
