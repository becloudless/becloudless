# Source: app-authelia/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia-valkey
  namespace: default
spec:
  chart:
    spec:
      chart: valkey
      sourceRef:
        kind: HelmRepository
        name: authelia-valkey
      version: 0.12.0
  dependsOn:
  - name: authelia-pre
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    auth:
      aclUsers:
        authelia:
          permissions: ~* &* +@all
        default:
          permissions: ~* -@all
      enabled: true
      usersExistingSecret: authelia-valkey
    dataStorage:
      enabled: true
      requestedSize: 1Gi
    replicaCount: 1
