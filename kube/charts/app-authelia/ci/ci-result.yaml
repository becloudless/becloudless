# Source: app-authelia/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia-pre
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-secret-generator
    namespace: secret-generator
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    resources:
      certManagerCertificates:
        authelia-jwks:
          commonName: authelia-jwks
          issuerRef:
            kind: ClusterIssuer
            name: self-signed
          secretName: authelia-jwks
      stringSecrets:
        authelia-admin:
          fields:
            password:
              encoding: hex
              fieldName: password
              length: "32"
        authelia-generated:
          fields:
            oidc-hmac:
              fieldName: identity_providers.oidc.hmac.key
            reset-password-hmac:
              fieldName: identity_validation.reset_password.jwt.hmac.key
            session-encryption:
              fieldName: session.encryption.key
        authelia-oidc:
          fields:
            gitea:
              fieldName: gitea
            grafana:
              fieldName: grafana
            immich:
              fieldName: immich
            jellyfin:
              fieldName: jellyfin
        authelia-valkey:
          fields:
            authelia:
              fieldName: authelia
            default:
              fieldName: default
