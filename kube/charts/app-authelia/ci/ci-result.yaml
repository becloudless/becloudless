              verbs:
              - get
        immich-secrets-reader:
          rules:
            secrets:
              apiGroups:
              - ""
              resourceNames:
              - authelia-oidc-immich
              resources:
              - secrets
              verbs:
              - get
        jellyfin-secrets-reader:
          rules:
            secrets:
              apiGroups:
              - ""
              resourceNames:
              - authelia-oidc-jellyfin
              resources:
              - secrets
              verbs:
              - get
        paperless-secrets-reader:
          rules:
            secrets:
              apiGroups:
              - ""
              resourceNames:
              - authelia-oidc-paperless
              resources:
              - secrets
              verbs:
              - get
        seafile-secrets-reader:
          rules:
