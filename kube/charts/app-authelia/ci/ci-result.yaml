# Source: app-authelia/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: authelia
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      certManagerCertificates:
        authelia-gateway:
          dnsNames:
            authelia: authelia.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-authelia-gateway
      httpRoutes:
        authelia:
          hostnames:
            authelia: authelia.test.com
          parentRefs:
            authelia:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: authelia
          rules:
            root:
              backendRefs:
                authelia:
                  name: authelia
                  port: 80
      listenerSets:
        authelia:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: authelia.test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-authelia-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
      referenceGrants:
        ext-authz:
          from:
            homer:
              group: gateway.networking.k8s.io
              kind: HTTPRoute
              namespace: homer
            longhorn:
              group: gateway.networking.k8s.io
              kind: HTTPRoute
              namespace: longhorn-system
            prometheus:
              group: gateway.networking.k8s.io
              kind: HTTPRoute
              namespace: prometheus
            seerr:
              group: gateway.networking.k8s.io
              kind: HTTPRoute
              namespace: seerr
            syncthing:
              group: gateway.networking.k8s.io
              kind: HTTPRoute
              namespace: syncthing
            whoami:
              group: gateway.networking.k8s.io
              kind: HTTPRoute
              namespace: whoami
          to:
            authelia:
              group: ""
              kind: Service
              name: authelia
