apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authelia
  namespace: default
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/name: lldap
        k8s:io.kubernetes.pod.namespace: lldap
    toPorts:
    - ports:
      - port: "6360"
        protocol: TCP
  - toFQDNs:
    - matchName: time.cloudflare.com
    toPorts:
    - ports:
      - port: "123"
        protocol: UDP
  - toEndpoints:
    - matchLabels:
        cnpg.io/cluster: authelia-postgresql
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/name: valkey
    toPorts:
    - ports:
      - port: "6379"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authelia
  ingress:
  - fromEntities:
    - host
    - ingress
    - remote-node
    toPorts:
    - ports:
      - port: "9091"
        protocol: TCP
