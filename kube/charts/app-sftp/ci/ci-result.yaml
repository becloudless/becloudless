          ssh-gateway:
            name: ssh-gateway
            namespace: default
            secretName: tls-sftp-gateway
        ciliumNetworkPolicies:
          ssh-tls:
            name: ssh-tls
            namespace: default
        configMaps:
          ssh-tls:
            name: ssh-tls
            namespace: default
        deployments:
          ssh-tls:
            labels:
              app.kubernetes.io/component: ssh-tls
              app.kubernetes.io/instance: sftp-integration
            name: ssh-tls
            namespace: default
        listenerSets:
          sftp:
            name: sftp
            namespace: default
        services:
          ssh-tls:
            name: ssh-tls
            namespace: default
        tlsRoutes:
          ssh:
            name: ssh
            namespace: default
      sftp-pre:
        certManagerCertificates:
          sftp-host-key:
            name: sftp-host-key
            namespace: default
        externalSecrets:
          sftp-oidc:
            name: sftp-oidc
            namespace: default
        secretStores:
          authelia:
            name: authelia
            namespace: default
        serviceAccounts:
          authelia-reader:
            name: authelia-reader
            namespace: default
    resources:
      certManagerCertificates:
        sftp-host-key:
          commonName: sftp
          duration: 876000h
          issuerRef:
