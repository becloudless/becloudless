---
# Source: app-sftp/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sftp
  namespace: default
spec:
  egress:
  - toFQDNs:
    - matchName: authelia.test.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEntities:
    - ingress
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: sftp
      app.kubernetes.io/instance: sftp
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/component: ssh-tls
        k8s:app.kubernetes.io/instance: sftp-integration
        k8s:io.kubernetes.pod.namespace: sftp
    toPorts:
    - ports:
      - port: "22"
        protocol: TCP
