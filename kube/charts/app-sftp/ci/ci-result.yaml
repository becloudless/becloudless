apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sftp-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: sftp
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      sftp:
        configMaps:
          sftp-users:
            name: sftp-users
            namespace: default
        deployments:
          sftp:
            labels:
              app.kubernetes.io/component: sftp
              app.kubernetes.io/instance: sftp
            name: sftp
            namespace: default
        persistentVolumeClaims:
          data:
            name: data
            namespace: default
        services:
          sftp:
            name: sftp
            namespace: default
      sftp-integration:
        certManagerCertificates:
          ssh-gateway:
            name: ssh-gateway
            namespace: default
            secretName: tls-sftp-gateway
        ciliumNetworkPolicies:
          ssh-tls:
            name: ssh-tls
            namespace: default
        configMaps:
          ssh-tls:
            name: ssh-tls
            namespace: default
        deployments:
          ssh-tls:
            labels:
              app.kubernetes.io/component: ssh-tls
              app.kubernetes.io/instance: sftp-integration
            name: ssh-tls
            namespace: default
        listenerSets:
          sftp:
            name: sftp
            namespace: default
        services:
          ssh-tls:
            name: ssh-tls
            namespace: default
        tlsRoutes:
          ssh:
            name: ssh
            namespace: default
      sftp-pre:
        certManagerCertificates:
          sftp-host-key:
            name: sftp-host-key
            namespace: default
        externalSecrets:
          sftp-oidc:
            name: sftp-oidc
            namespace: default
        secretStores:
          authelia:
            name: authelia
            namespace: default
        serviceAccounts:
          authelia-reader:
            name: authelia-reader
            namespace: default
    resources:
      certManagerCertificates:
        ssh-gateway:
          dnsNames:
            ssh: ssh-sftp.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-sftp-gateway
      ciliumNetworkPolicies:
        ssh-tls:
          egress:
            sftp:
              toEndpoints:
                sftp:
                  matchLabels:
                    k8s:app.kubernetes.io/component: sftp
                    k8s:app.kubernetes.io/instance: sftp
                    k8s:io.kubernetes.pod.namespace: sftp
              toPorts:
              - 22
          endpointSelector: ref:ssh-tls
          ingress:
            gateway:
              fromEntities:
              - ingress
              - host
              - remote-node
              toPorts:
              - 8443
      configMaps:
        ssh-tls:
          data:
            nginx.conf: |-
              worker_processes 1;
              pid /tmp/nginx.pid;
              error_log /dev/stderr warn;
              events {
                worker_connections 1024;
              }
              stream {
                server {
                  listen 8443 ssl;
                  ssl_certificate /tls/tls.crt;
                  ssl_certificate_key /tls/tls.key;
                  ssl_protocols TLSv1.2 TLSv1.3;
                  proxy_connect_timeout 10s;
                  proxy_timeout 1h; # idle
                  proxy_pass sftp:22;
                }
              }
      deployments:
        ssh-tls:
          replicas: 1
          template:
            spec:
              containers:
                nginx:
                  args:
                  - |-
                    (while true; do sleep 12h; nginx -s reload; done) &
                    exec nginx -g 'daemon off;'
                  command:
                  - /bin/sh
                  - -c
                  image: nginxinc/nginx-unprivileged:1.29.3-alpine
                  name: nginx
                  ports:
                    ssh:
                      containerPort: 8443
                  probe:
                    tcpSocket: {}
                  securityContext:
                    capabilities:
                      drop:
                        all: ALL
                  volumeMounts:
                    config:
                      mountPath: /etc/nginx/nginx.conf
                      name: config
                      readOnly: true
                      subPath: nginx.conf
                    tls:
                      mountPath: /tls
                      name: tls
                      readOnly: true
              securityContext:
                runAsGroup: 101
                runAsUser: 101
              volumes:
                config:
                  configMap:
                    name: ref:ssh-tls
                  name: config
                tls:
                  name: tls
                  secret:
                    secretName: tls-sftp-gateway
      listenerSets:
        sftp:
          listeners:
            ssh:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: ssh-sftp.test.com
              name: ssh
              port: 443
              protocol: TLS
              tls:
                mode: Passthrough
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: cilium
      services:
        ssh-tls:
          ports:
            ssh:
              port: 443
              targetPort: 8443
      tlsRoutes:
        ssh:
          hostnames:
            ssh: ssh-sftp.test.com
          parentRefs:
            sftp:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: sftp
              sectionName: ssh
          rules:
            ssh:
              backendRefs:
                ssh-tls:
                  name: ssh-tls
                  port: 443
