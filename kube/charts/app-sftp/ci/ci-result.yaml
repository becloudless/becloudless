      sftp:
        configMaps:
          sftp-users:
            name: sftp-users
            namespace: default
        deployments:
          sftp:
            labels:
              app.kubernetes.io/component: sftp
              app.kubernetes.io/instance: sftp
            name: sftp
            namespace: default
        persistentVolumeClaims:
          data:
            name: data
            namespace: default
        services:
          sftp:
