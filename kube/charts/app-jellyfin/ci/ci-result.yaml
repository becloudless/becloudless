  - toFQDNs:
    - matchName: authelia.test.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/component: ffmpeg-over-ip
        app.kubernetes.io/instance: jellyfin
    toPorts:
    - ports:
      - port: "5050"
        protocol: TCP
  - toEntities:
    - ingress
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toFQDNs:
    - matchName: github.com
    - matchName: objects.githubusercontent.com
    - matchName: release-assets.githubusercontent.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: jellyfin
      app.kubernetes.io/instance: jellyfin
  ingress:
  - fromEntities:
