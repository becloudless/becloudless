apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  - name: jellyfin
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      certManagerCertificates:
        jellyfin-gateway:
          dnsNames:
            jellyfin: jellyfin.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-jellyfin-gateway
      httpRoutes:
        jellyfin:
          hostnames:
            jellyfin: jellyfin.test.com
          parentRefs:
            jellyfin:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: jellyfin
          rules:
            root:
              backendRefs:
                jellyfin:
                  name: jellyfin
                  port: 8096
              timeouts:
                request: 0s
      listenerSets:
        jellyfin:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: jellyfin.test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-jellyfin-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
---
# Source: app-jellyfin/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-pre
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: authelia-pre
    namespace: authelia
  - name: app-external-secrets
    namespace: external-secrets
  - name: app-secret-generator
    namespace: secret-generator
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      externalSecrets:
        jellyfin-oidc:
          data:
            secret:
              remoteRef:
                key: authelia-oidc-jellyfin
                property: secret
              secretKey: secret
          refreshInterval: 1h
          secretStoreRef:
            kind: SecretStore
            name: authelia
      roleBindings:
        seerr-secrets-reader:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: seerr-secrets-reader
          subjects:
            jellyfin-reader:
              kind: ServiceAccount
              name: jellyfin-reader
              namespace: seerr
      roles:
        seerr-secrets-reader:
          rules:
            secrets:
              apiGroups:
              - ""
              resourceNames:
              - jellyfin-admin
              resources:
              - secrets
              verbs:
              - get
      secretStores:
        authelia:
          provider:
            kubernetes:
              auth:
                serviceAccount:
                  name: authelia-reader
              remoteNamespace: authelia
              server:
                caProvider:
                  key: ca.crt
                  name: kube-root-ca.crt
                  type: ConfigMap
      serviceAccounts:
        authelia-reader:
          automountServiceAccountToken: false
      stringSecrets:
        jellyfin-admin:
          fields:
            password:
              fieldName: password
