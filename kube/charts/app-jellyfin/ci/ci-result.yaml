---
# Source: app-jellyfin/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    resources:
      configMaps:
        jellyfin-config:
          data:
            network.xml: |-
              <?xml version="1.0" encoding="utf-8"?>
              <NetworkConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
                <BaseUrl />
                <EnableHttps>false</EnableHttps>
                <RequireHttps>false</RequireHttps>
                <InternalHttpPort>8096</InternalHttpPort>
                <InternalHttpsPort>8920</InternalHttpsPort>
                <PublicHttpPort>8096</PublicHttpPort>
                <PublicHttpsPort>8920</PublicHttpsPort>
                <AutoDiscovery>true</AutoDiscovery>
                <EnableIPv4>true</EnableIPv4>
                <EnableIPv6>false</EnableIPv6>
                <EnableRemoteAccess>true</EnableRemoteAccess>
                <LocalNetworkSubnets />
                <LocalNetworkAddresses />
                <KnownProxies>
                  <string>10.42.0.0/16</string>
                </KnownProxies>
                <IgnoreVirtualInterfaces>true</IgnoreVirtualInterfaces>
                <VirtualInterfaceNames>
                  <string>veth</string>
                </VirtualInterfaceNames>
                <EnablePublishedServerUriByRequest>false</EnablePublishedServerUriByRequest>
                <PublishedServerUriBySubnet />
                <RemoteIPFilter />
                <IsRemoteIPFilterBlacklist>false</IsRemoteIPFilterBlacklist>
              </NetworkConfiguration>
      deployments:
        jellyfin:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: jellyfin
          strategy:
            type: Recreate
          template:
            metadata:
              labels:
                app.kubernetes.io/name: jellyfin
            spec:
              containers:
                jellyfin:
                  env:
                    JELLYFIN_PublishedServerUrl: https://jellyfin.test.com
                    TZ: Europe/Paris
                  image: ghcr.io/jellyfin/jellyfin:10.11.11
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8096
                  name: jellyfin
                  ports:
                    http:
                      containerPort: 8096
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 8096
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        all: ALL
                  startupProbe:
                    failureThreshold: 60
                    httpGet:
                      path: /health
                      port: 8096
                    periodSeconds: 10
                  volumeMounts:
                    config:
                      mountPath: /config
                      name: config
                    media:
                      mountPath: /media
                      name: media
                      readOnly: true
                    network:
                      mountPath: /config/config/network.xml
                      name: network
                      readOnly: true
                      subPath: network.xml
              volumes:
                config:
                  name: config
                  persistentVolumeClaim:
                    claimName: jellyfin-config
                media:
                  emptyDir: {}
                  name: media
                network:
                  configMap:
                    name: jellyfin-config
                  name: network
      persistentVolumeClaims:
        jellyfin-config:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
          storageClassName: longhorn
      services:
        jellyfin:
          ports:
            http:
              port: 8096
          selector:
            app.kubernetes.io/name: jellyfin
---
# Source: app-jellyfin/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  - name: jellyfin
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: -1
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    remediation:
      retries: 3
  values:
    resources:
      certManagerCertificates:
        jellyfin-gateway:
          dnsNames:
            jellyfin: jellyfin.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-jellyfin-gateway
      httpRoutes:
        jellyfin:
          hostnames:
            jellyfin: jellyfin.test.com
          parentRefs:
            jellyfin:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: jellyfin
          rules:
            root:
              backendRefs:
                jellyfin:
                  name: jellyfin
                  port: 8096
              timeouts:
                request: 0s
      listenerSets:
        jellyfin:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: jellyfin.test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-jellyfin-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
