apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyfin
  namespace: default
spec:
  egress:
  - toFQDNs:
    - matchName: authelia.test.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEntities:
    - ingress
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toFQDNs:
    - matchName: github.com
    - matchName: objects.githubusercontent.com
    - matchName: release-assets.githubusercontent.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  ingress:
  - fromEntities:
    - host
    - ingress
    - remote-node
    toPorts:
    - ports:
      - port: "8096"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/name: seerr
        k8s:io.kubernetes.pod.namespace: seerr
    toPorts:
    - ports:
      - port: "8096"
        protocol: TCP
