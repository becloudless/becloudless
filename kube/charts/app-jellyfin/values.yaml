# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:
  name:

# Nothing has to be created by hand: the admin user is created in the setup wizard of the web UI at the first visit.
# The media library is the `/data/Media` directory of the node running the pod (read only), add it as a library in the UI (`/media`).
# Not configured: SSO (needs the SSO plugin and the authelia OIDC client, which is disabled) and the remote transcoding with ffmpeg-over-ip.

defaults:
  metadata:
    namespace: jellyfin

resources:
  namespaces:
    jellyfin:
      fullNameOverride: jellyfin

  configMaps:
    jellyfin-config:
      fullNameOverride: jellyfin-config
      data:
        # https://jellyfin.org/docs/general/networking/
        network.xml: |
          <?xml version="1.0" encoding="utf-8"?>
          <NetworkConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
            <BaseUrl />
            <EnableHttps>false</EnableHttps>
            <RequireHttps>false</RequireHttps>
            <InternalHttpPort>8096</InternalHttpPort>
            <InternalHttpsPort>8920</InternalHttpsPort>
            <PublicHttpPort>8096</PublicHttpPort>
            <PublicHttpsPort>8920</PublicHttpsPort>
            <AutoDiscovery>true</AutoDiscovery>
            <EnableIPv4>true</EnableIPv4>
            <EnableIPv6>false</EnableIPv6>
            <EnableRemoteAccess>true</EnableRemoteAccess>
            <LocalNetworkSubnets />
            <LocalNetworkAddresses />
            <KnownProxies>
              <string>10.42.0.0/16</string>
            </KnownProxies>
            <IgnoreVirtualInterfaces>true</IgnoreVirtualInterfaces>
            <VirtualInterfaceNames>
              <string>veth</string>
            </VirtualInterfaceNames>
            <EnablePublishedServerUriByRequest>false</EnablePublishedServerUriByRequest>
            <PublishedServerUriBySubnet />
            <RemoteIPFilter />
            <IsRemoteIPFilterBlacklist>false</IsRemoteIPFilterBlacklist>
          </NetworkConfiguration>

  # database, metadata and cache of jellyfin
  persistentVolumeClaims:
    jellyfin-config:
      fullNameOverride: jellyfin-config
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      resources:
        requests:
          storage: 10Gi

  deployments:
    jellyfin:
      fullNameOverride: jellyfin
      replicas: 1 # jellyfin is not HA ready
      strategy:
        type: Recreate # the volume is ReadWriteOnce
      selector:
        matchLabels:
          app.kubernetes.io/name: jellyfin
      template:
        metadata:
          labels:
            app.kubernetes.io/name: jellyfin
        spec:
          containers:
            jellyfin:
              name: jellyfin
              image: ghcr.io/jellyfin/jellyfin:10.11.11 # renovate: versioning=loose
              ports:
                http:
                  containerPort: 8096
              env:
                tz:
                  name: TZ
                  value: Europe/Paris
                published-server-url:
                  name: JELLYFIN_PublishedServerUrl
                  value: https://jellyfin.{{ .Values.global.domain }}
              startupProbe:
                httpGet:
                  path: /health
                  port: 8096
                periodSeconds: 10
                failureThreshold: 60 # 10min, a huge library on low hardware can be slow to start
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8096
              livenessProbe:
                httpGet:
                  path: /health
                  port: 8096
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    all: ALL
              volumeMounts:
                config:
                  name: config
                  mountPath: /config
                network:
                  name: network
                  mountPath: /config/config/network.xml
                  subPath: network.xml
                  readOnly: true
                media:
                  name: media
                  mountPath: /media
                  readOnly: true
          volumes:
            config:
              name: config
              persistentVolumeClaim:
                claimName: jellyfin-config
            network:
              name: network
              configMap:
                name: jellyfin-config
            media:
              name: media
              hostPath:
                path: /data/Media
                type: Directory

  services:
    jellyfin:
      fullNameOverride: jellyfin
      selector:
        app.kubernetes.io/name: jellyfin
      ports:
        http:
          port: 8096

  certManagerCertificates:
    # certificate of the web UI, terminated by the Gateway
    jellyfin-gateway:
      fullNameOverride: jellyfin-gateway
      secretName: tls-jellyfin-gateway
      dnsNames:
        jellyfin: jellyfin.{{ .Values.global.domain }}
      issuerRef:
        name: letsencrypt-prod
        kind: ClusterIssuer

  # Exposed by the Cilium Gateway `shared` (kube-system), TLS terminated by the Gateway.
  # It is not protected by forward auth: the TV and mobile apps cannot follow the login redirect of authelia, jellyfin has its own login.
  # Requires the Gateway API CRDs and cert-manager: app-bcl makes this app depend on them.
  listenerSets:
    jellyfin:
      fullNameOverride: jellyfin
      parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        name: shared
        namespace: kube-system
      listeners:
        https:
          name: https
          hostname: jellyfin.{{ .Values.global.domain }}
          port: 443
          protocol: HTTPS
          tls:
            mode: Terminate
            certificateRefs:
              tls:
                name: tls-jellyfin-gateway
          allowedRoutes:
            namespaces:
              from: Same

  httpRoutes:
    jellyfin:
      fullNameOverride: jellyfin
      parentRefs:
        jellyfin:
          group: gateway.networking.k8s.io
          kind: ListenerSet
          name: jellyfin
      hostnames:
        jellyfin: jellyfin.{{ .Values.global.domain }}
      rules:
        root:
          backendRefs:
            jellyfin:
              name: jellyfin
              port: 8096
          timeouts:
            request: 0s # streams can be long
