# yaml-language-server: $schema=../app/schema/values.schema.json

# The pod configures jellyfin (see `configure.js`):
#  - the setup wizard is completed: the `admin` user, its password is generated in `jellyfin-admin` (seerr uses it too), and the name of
#    the server is `app.name`;
#  - SSO with Authelia with the SSO plugin https://github.com/9p4/jellyfin-plugin-sso (archived, the last release is pinned and checked
#    by its checksum), installed by the `sso-plugin` init container. The `Sign in with Authelia` button is added on the login page of
#    the web UI. The users of the groups `app_jellyfin` are created at their first login, those of `role_admin` are administrators.
#    SSO works in the web UI (and Quick Connect for the other clients), the TV and mobile apps use the local users (a user created by
#    SSO has a random password, set one in its profile). An SSO user with the name of an existing user (`admin`) takes its permissions.
# The media library is the `/data` directory of an SFTP user of the NAS (`bcl.role.nas`), mounted read only by app-csi-rclone: the
# administrator gives the secret `jellyfin-media` (see the header of app-csi-rclone). Add it as a library in the UI (`/media`).
# The ffmpeg-over-ip server (https://github.com/steelbrain/ffmpeg-over-ip) runs on the nodes that are not control planes (the ones
# carrying the `bcl.tf/no-persistent-storage` taint: they run the host GPU, `/dev/dri`) and does the hardware transcoding.
# Jellyfin uses it: the `ffmpeg-over-ip-client` init container puts the client over the `ffmpeg` and `ffprobe` of jellyfin-ffmpeg, pointed to
# `ffmpeg-over-ip:5050` with the secret `ffmpeg-over-ip-server` (the hardware acceleration is set in the web UI, `qsv` or `vaapi`).

resources:

  ciliumNetworkPolicies:
    jellyfin:
      endpointSelector: ref:jellyfin
      ingress:
        gateway:
          fromEntities: [ingress, host, remote-node]
          toPorts: [8096]
        seerr:
          fromEndpoints:
            seerr:
              matchLabels: {"k8s:io.kubernetes.pod.namespace": seerr, "k8s:app.kubernetes.io/instance": seerr, "k8s:app.kubernetes.io/component": seerr}
          toPorts: [8096]
      egress:
        authelia: # the OIDC issuer is the public address of authelia
          toFQDNs:
            authelia: {matchName: "authelia.{{ .Values.app.domain }}"}
          toPorts: [443]
        gateway: # the public addresses of the cluster are the gateway for the pods
          toEntities: [ingress]
          toPorts: [443]
        github: # the download of the SSO plugin (release asset), by the init container
          toFQDNs:
            github: {matchName: github.com}
            release-assets: {matchName: release-assets.githubusercontent.com}
            objects: {matchName: objects.githubusercontent.com}
          toPorts: [443]
        ffmpeg-over-ip:
          toEndpoints:
            ffmpeg-over-ip:
              matchLabels: {app.kubernetes.io/instance: jellyfin, app.kubernetes.io/component: ffmpeg-over-ip}
          toPorts: [5050]

    ffmpeg-over-ip:
      endpointSelector: ref:ffmpeg-over-ip
      ingress:
        jellyfin:
          fromEndpoints:
            jellyfin:
              matchLabels: {app.kubernetes.io/instance: jellyfin, app.kubernetes.io/component: jellyfin}
          toPorts: [5050]
      egress:
        github: # the download of the server (release asset), by the init container
          toFQDNs:
            github: {matchName: github.com}
            release-assets: {matchName: release-assets.githubusercontent.com}
            objects: {matchName: objects.githubusercontent.com}
          toPorts: [443]
        ubuntu: # the packages of the GPU drivers
          toFQDNs:
            archive: {matchName: archive.ubuntu.com}
            security: {matchName: security.ubuntu.com}
          toPorts: [80]
        intel:
          toFQDNs:
            intel: {matchName: repositories.intel.com}
          toPorts: [443]

  fluxHelmReleases:
    jellyfin-pre:
      dependsOn:
        - name: app-external-secrets
          namespace: external-secrets
        - name: app-secret-generator
          namespace: secret-generator
      values:
        resources:
          # password of the `admin` user, created by the setup wizard that the `configure` container completes
          stringSecrets:
            jellyfin-admin:
              fields:
                password: {}

            # shared by the server of ffmpeg-over-ip and its client (jellyfin)
            ffmpeg-over-ip-server:
              fields:
                FFMPEG_OVER_IP_SERVER_AUTH_SECRET: {}

          # lets seerr (its SecretStore) read the password of the administrator, and only this secret
          roles:
            seerr-secrets-reader:
              rules:
                secrets:
                  apiGroups: [ "" ]
                  resources: [ secrets ]
                  resourceNames: [ jellyfin-admin ]
                  verbs: [ get ]

          roleBindings:
            seerr-secrets-reader:
              roleRef: ref:seerr-secrets-reader
              subjects:
                jellyfin-reader:
                  kind: ServiceAccount
                  name: jellyfin-reader
                  namespace: seerr

    jellyfin:
      dependsOn:
        - ref:jellyfin-pre
        - name: app-csi-rclone # the StorageClass of the media
          namespace: csi-rclone
      values:
        resources:
          configMaps:
            jellyfin-config:
              data:
                # https://jellyfin.org/docs/general/networking/
                network.xml: |
                  <?xml version="1.0" encoding="utf-8"?>
                  <NetworkConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
                    <BaseUrl />
                    <EnableHttps>false</EnableHttps>
                    <RequireHttps>false</RequireHttps>
                    <InternalHttpPort>8096</InternalHttpPort>
                    <InternalHttpsPort>8920</InternalHttpsPort>
                    <PublicHttpPort>8096</PublicHttpPort>
                    <PublicHttpsPort>8920</PublicHttpsPort>
                    <AutoDiscovery>true</AutoDiscovery>
                    <EnableIPv4>true</EnableIPv4>
                    <EnableIPv6>false</EnableIPv6>
                    <EnableRemoteAccess>true</EnableRemoteAccess>
                    <LocalNetworkSubnets />
                    <LocalNetworkAddresses />
                    <KnownProxies>
                      <string>10.42.0.0/16</string>
                    </KnownProxies>
                    <IgnoreVirtualInterfaces>true</IgnoreVirtualInterfaces>
                    <VirtualInterfaceNames>
                      <string>veth</string>
                    </VirtualInterfaceNames>
                    <EnablePublishedServerUriByRequest>false</EnablePublishedServerUriByRequest>
                    <PublishedServerUriBySubnet />
                    <RemoteIPFilter />
                    <IsRemoteIPFilterBlacklist>false</IsRemoteIPFilterBlacklist>
                  </NetworkConfiguration>

            jellyfin-scripts:
              data:
                # completes the setup wizard, then (every hour, the secret can change) sets the SSO provider and the login button
                configure.js: |
                  const env = process.env;
                  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

                  const header = (token) =>
                    'MediaBrowser Client="Configure", Device="Configure", DeviceId="jellyfin-configure", Version="1.0"' +
                    (token ? ', Token="' + token + '"' : '');

                  async function jellyfin(method, path, body, token) {
                    const res = await fetch(env.JELLYFIN_URL + path, {
                      method: method,
                      headers: { Authorization: header(token), 'Content-Type': 'application/json', Accept: 'application/json' },
                      body: body === undefined ? undefined : JSON.stringify(body),
                      signal: AbortSignal.timeout(15000),
                    });
                    if (!res.ok) throw new Error(method + ' ' + path + ': ' + res.status);
                    const text = await res.text();
                    return text ? JSON.parse(text) : undefined;
                  }

                  async function configure() {
                    let info;
                    for (let i = 0; i < 120 && !info; i++) { // 10 minutes, a huge library can be slow to start
                      try {
                        info = await jellyfin('GET', '/System/Info/Public');
                      } catch (e) {
                        console.log('waiting for jellyfin: ' + e.message);
                        await sleep(5000);
                      }
                    }
                    if (!info) throw new Error('jellyfin is not reachable');

                    if (!info.StartupWizardCompleted) {
                      console.log('completing the setup wizard');
                      await jellyfin('POST', '/Startup/Configuration', { UICulture: 'en-US', MetadataCountryCode: 'FR', PreferredMetadataLanguage: 'en' });
                      await jellyfin('GET', '/Startup/User'); // creates the default user the next call renames
                      await jellyfin('POST', '/Startup/User', { Name: env.JELLYFIN_USER, Password: env.JELLYFIN_PASSWORD });
                      // no `/Startup/RemoteAccess`: it saves `network.xml`, which is the read only ConfigMap (remote access is enabled in it)
                      await jellyfin('POST', '/Startup/Complete');
                    }

                    const login = await jellyfin('POST', '/Users/AuthenticateByName', { Username: env.JELLYFIN_USER, Pw: env.JELLYFIN_PASSWORD });
                    const token = login.AccessToken;

                    // the name of the server (the pod name by default) is the name of the cluster
                    const system = await jellyfin('GET', '/System/Configuration', undefined, token);
                    if (system.ServerName !== env.SERVER_NAME) {
                      await jellyfin('POST', '/System/Configuration', Object.assign({}, system, { ServerName: env.SERVER_NAME }), token);
                      console.log('server name set to ' + env.SERVER_NAME);
                    }

                    // https://github.com/9p4/jellyfin-plugin-sso/blob/main/providers.md#authelia (the plugin answers 404 until it is loaded)
                    // `Add` replaces the provider: the links of the SSO users to the users of jellyfin are kept (else a user whose
                    // name differs from the one of the SSO is created again)
                    const known = await jellyfin('GET', '/sso/OID/Get', undefined, token).catch(() => ({}));
                    const previous = (known.authelia || known.Authelia || {});
                    const canonicalLinks = previous.canonicalLinks || previous.CanonicalLinks;
                    await jellyfin('POST', '/sso/OID/Add/authelia', Object.assign({
                      oidEndpoint: env.ISSUER_URL,
                      oidClientId: env.CLIENT_ID,
                      oidSecret: env.CLIENT_SECRET,
                      enabled: true,
                      enableAuthorization: true, // the administrators and the access come from the groups, at each login
                      enableAllFolders: true,
                      enabledFolders: [],
                      roles: ['app_jellyfin', 'role_admin'],
                      adminRoles: ['role_admin'],
                      roleClaim: 'groups',
                      oidScopes: ['groups'],
                      disablePushedAuthorization: true, // authelia does not require it
                      schemeOverride: 'https', // the redirect uri, jellyfin sees the http of the gateway to the pod
                    }, canonicalLinks ? { canonicalLinks: canonicalLinks } : {}), token);

                    // the button of the login page
                    const branding = await jellyfin('GET', '/System/Configuration/branding', undefined, token);
                    await jellyfin('POST', '/System/Configuration/branding', Object.assign({}, branding, {
                      LoginDisclaimer:
                        '<form action="' + env.PUBLIC_URL + '/sso/OID/start/authelia">' +
                        '<button class="raised block emby-button button-submit">Sign in with Authelia</button></form>',
                      CustomCss: 'a.raised.emby-button { padding: 0.9em 1em; color: inherit !important; } .disclaimerContainer { display: block; }',
                    }), token);
                  }

                  // one pass, the container repeats it (the script is read again each time: a change of it applies without a restart)
                  configure().then(() => console.log('jellyfin configured')).catch((e) => {
                    console.log('jellyfin is not configured: ' + e.message);
                    process.exit(1);
                  });

          # database, metadata and cache of jellyfin
          persistentVolumeClaims:
            jellyfin-config:
              storageClassName: longhorn-files
              resources:
                requests:
                  storage: 10Gi

            # the media, on the NAS: the size is not used
            jellyfin-media:
              storageClassName: rclone-sftp
              accessModes: [ReadOnlyMany]
              resources:
                requests:
                  storage: 1Gi

          deployments:
            jellyfin:
              replicas: 1 # jellyfin is not HA ready
              strategy:
                type: Recreate
              template:
                metadata:
                  annotations:
                    policy.bcl.tf/skipPodSetHostUsers: "true" # the FUSE mount of the media can not be id-mapped into a user namespace
                spec:
                  # the images of alpine and jellyfin run as root: every container runs as 1000, which owns the volume (`fsGroup`)
                  securityContext:
                    runAsUser: 1000
                    runAsGroup: 1000
                    fsGroup: 1000
                    fsGroupChangePolicy: OnRootMismatch # a library is a lot of files: only the first start of a volume owned by root walks it
                  # installs the SSO plugin in the volume (jellyfin loads the plugins at its start), pinned and checked by the checksum of
                  # https://raw.githubusercontent.com/9p4/jellyfin-plugin-sso/manifest-release/manifest.json
                  initContainers:
                    sso-plugin:
                      name: sso-plugin
                      image: docker.io/library/alpine:3.24.3 # renovate: versioning=loose
                      command:
                        - sh
                        - -ec
                        - |
                          version=4.0.0.4
                          md5=1e7908585ebee256203a0869dcdfbaf8
                          dir=/config/plugins/sso-authentication_$version
                          # the mount of `network.xml` in the jellyfin container is in this directory: when it does not exist, the
                          # container runtime creates it as root, and jellyfin can not write its own files in it
                          mkdir -p /config/config
                          if [ ! -f $dir/.installed ]; then
                            wget -q -O /tmp/plugin.zip https://github.com/9p4/jellyfin-plugin-sso/releases/download/v$version/sso-authentication_$version.zip
                            echo "$md5  /tmp/plugin.zip" | md5sum -c -
                            rm -rf /config/plugins/sso-authentication_* "/config/plugins/SSO Authentication_"* # the name of the directories of the UI
                            mkdir -p $dir
                            unzip -q /tmp/plugin.zip -d $dir
                            touch $dir/.installed
                          fi
                      securityContext:
                        capabilities:
                          drop:
                            all: ALL
                      volumeMounts:
                        config:
                          name: config
                          mountPath: /config
                    # the client of the ffmpeg-over-ip server (hardware transcoding on the nodes of the GPU), it runs as `ffmpeg` and `ffprobe`
                    ffmpeg-over-ip-client:
                      name: ffmpeg-over-ip-client
                      image: docker.io/library/alpine:3.24.3 # renovate: versioning=loose
                      command:
                        - sh
                        - -ec
                        - |
                          wget -q -O /tmp/client.zip https://github.com/steelbrain/ffmpeg-over-ip/releases/download/v5.2.1/linux-amd64-ffmpeg-over-ip-client.zip
                          unzip -o /tmp/client.zip -d /tmp/client
                          cp /tmp/client/ffmpeg-over-ip-client /ffmpeg-client/ffmpeg
                          cp /tmp/client/ffmpeg-over-ip-client /ffmpeg-client/ffprobe
                          chmod +x /ffmpeg-client/ffmpeg /ffmpeg-client/ffprobe
                      securityContext:
                        capabilities:
                          drop:
                            all: ALL
                      volumeMounts:
                        ffmpeg-client:
                          name: ffmpeg-client
                          mountPath: /ffmpeg-client
                  containers:
                    # completes the setup wizard and configures the SSO (see the header of this file), once jellyfin has started
                    configure:
                      name: configure
                      image: docker.io/library/node:22.23.4 # renovate: versioning=loose
                      command:
                        - sh
                        - -c
                        - while true; do if node /scripts/configure.js; then sleep 3600; else sleep 30; fi; done # the secret can change
                      env:
                        JELLYFIN_URL: http://127.0.0.1:8096
                        JELLYFIN_USER: admin
                        JELLYFIN_PASSWORD:
                          secretKeyRef:
                            name: ref:jellyfin-admin
                            key: password
                        PUBLIC_URL: https://jellyfin.{{ .Values.app.domain }}
                        SERVER_NAME: "{{ .Values.app.name }}"
                        ISSUER_URL: https://authelia.{{ .Values.app.domain }}
                        CLIENT_ID:
                          secretKeyRef:
                            name: ref:jellyfin-oidc
                            key: client-id
                        CLIENT_SECRET:
                          secretKeyRef:
                            name: ref:jellyfin-oidc
                            key: secret
                      securityContext:
                        runAsUser: 1000
                        runAsGroup: 1000
                        capabilities:
                          drop:
                            all: ALL
                      volumeMounts:
                        scripts:
                          name: scripts
                          mountPath: /scripts
                          readOnly: true
                    jellyfin:
                      name: jellyfin
                      image: ghcr.io/jellyfin/jellyfin:10.11.11 # renovate: versioning=loose
                      ports:
                        http:
                          containerPort: 8096
                      env:
                        TZ: Europe/Paris
                        JELLYFIN_CACHE_DIR: /tmp/jellyfin # the root filesystem is read only (`/cache` of the image)
                        JELLYFIN_PublishedServerUrl: https://jellyfin.{{ .Values.app.domain }}
                        FFMPEG_OVER_IP_CLIENT_ADDRESS: ffmpeg-over-ip:5050 # headless: the servers of the nodes of the GPU
                        FFMPEG_OVER_IP_CLIENT_AUTH_SECRET:
                          secretKeyRef:
                            name: ref:ffmpeg-over-ip-server
                            key: FFMPEG_OVER_IP_SERVER_AUTH_SECRET
                      probe:
                        httpGet:
                          path: /health
                      startupProbe:
                        periodSeconds: 10
                        failureThreshold: 60 # 10min, a huge library on low hardware can be slow to start
                      securityContext:
                        capabilities:
                          drop:
                            all: ALL
                      volumeMounts:
                        config:
                          name: config
                          mountPath: /config
                        network:
                          name: network
                          mountPath: /config/config/network.xml
                          subPath: network.xml
                          readOnly: true
                        media:
                          name: media
                          mountPath: /media
                          readOnly: true
                        ffmpeg:
                          name: ffmpeg-client
                          mountPath: /usr/lib/jellyfin-ffmpeg/ffmpeg
                          subPath: ffmpeg
                        ffprobe:
                          name: ffmpeg-client
                          mountPath: /usr/lib/jellyfin-ffmpeg/ffprobe
                          subPath: ffprobe
                  volumes:
                    config:
                      name: config
                      persistentVolumeClaim:
                        claimName: ref:jellyfin-config
                    network:
                      name: network
                      configMap:
                        name: ref:jellyfin-config
                    scripts:
                      name: scripts
                      configMap:
                        name: ref:jellyfin-scripts
                    media:
                      name: media
                      persistentVolumeClaim:
                        claimName: ref:jellyfin-media
                        readOnly: true
                    ffmpeg-client:
                      name: ffmpeg-client
                      emptyDir: {}

          # The server runs on the nodes of the containerized kubelets (see the header), one per node. Everything runs as root: the packages of
          # the GPU drivers are installed at the start, and the privileged container reaches the render node `/dev/dri`.
          daemonSets:
            ffmpeg-over-ip:
              template:
                metadata:
                  annotations:
                    policy.bcl.tf/skipPodRestrictHostAccess: "true" # privileged, hostPath
                    policy.bcl.tf/skipPodSetHostUsers: "true"
                    policy.bcl.tf/skipContainerRequireRunAsNonRoot: "true"
                    policy.bcl.tf/skipContainerRequireReadOnlyRootFilesystem: "true"
                spec:
                  securityContext:
                    runAsNonRoot: false
                    runAsUser: 0
                  affinity:
                    nodeAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        nodeSelectorTerms:
                          - matchExpressions:
                              - key: node-role.kubernetes.io/control-plane
                                operator: DoesNotExist
                  tolerations:
                    - key: bcl.tf/no-persistent-storage
                      operator: Equal
                      value: "true"
                      effect: NoSchedule
                  initContainers:
                    fetch-ffmpeg-over-ip:
                      name: fetch-ffmpeg-over-ip
                      image: docker.io/library/alpine:3.24.3 # renovate: versioning=loose
                      command:
                        - sh
                        - -ec
                        - |
                          wget -q -O /tmp/server.zip https://github.com/steelbrain/ffmpeg-over-ip/releases/download/v5.2.1/linux-amd64-ffmpeg-over-ip-server.zip
                          unzip -o /tmp/server.zip -d /opt/ffmpeg-over-ip
                          chmod +x /opt/ffmpeg-over-ip/*
                      volumeMounts:
                        binaries:
                          name: binaries
                          mountPath: /opt/ffmpeg-over-ip
                  containers:
                    ffmpeg-over-ip-server:
                      name: ffmpeg-over-ip-server
                      image: docker.io/library/ubuntu:24.04 # renovate: versioning=loose
                      command:
                        - bash
                        - -ec
                        - |
                          apt-get update
                          apt-get install -y --no-install-recommends gpg ca-certificates wget
                          # The drivers of Debian and Ubuntu (2023) do not know the recent GPUs (Intel Arrow Lake-H, 8086:7dd1:
                          # the VAAPI initialization fails), the repository of Intel follows the new hardware.
                          wget -qO- https://repositories.intel.com/gpu/intel-graphics.key | gpg --dearmor --output /usr/share/keyrings/intel-graphics.gpg
                          echo "deb [signed-by=/usr/share/keyrings/intel-graphics.gpg arch=amd64] https://repositories.intel.com/gpu/ubuntu noble client" > /etc/apt/sources.list.d/intel-gpu-noble.list
                          apt-get update
                          # intel-media-va-driver-non-free: VAAPI (iHD), hwaccel=vaapi
                          # libmfxgen1, libvpl2: oneVPL runtime and dispatcher, hwaccel=qsv ("Error creating a MFX session: -9" without)
                          # intel-opencl-icd, ocl-icd-libopencl1: OpenCL, hwaccel=opencl (HDR tone mapping, CL_PLATFORM_NOT_FOUND_KHR without)
                          apt-get install -y --no-install-recommends intel-media-va-driver-non-free libmfxgen1 libvpl2 intel-opencl-icd ocl-icd-libopencl1 vainfo clinfo
                          exec /opt/ffmpeg-over-ip/ffmpeg-over-ip-server
                      ports:
                        ffoip:
                          containerPort: 5050
                      env:
                        FFMPEG_OVER_IP_SERVER_ADDRESS: 0.0.0.0:5050
                        FFMPEG_OVER_IP_SERVER_AUTH_SECRET:
                          secretKeyRef:
                            name: ref:ffmpeg-over-ip-server
                            key: FFMPEG_OVER_IP_SERVER_AUTH_SECRET
                      securityContext:
                        privileged: true # the render node
                        allowPrivilegeEscalation: true
                        readOnlyRootFilesystem: false # the packages are installed at the start
                      resources:
                        requests:
                          cpu: 100m
                          memory: 256Mi
                        limits:
                          memory: 8Gi # the transcodes of 4K HDR remuxes with the tone mapping were OOM killed at 2Gi
                      volumeMounts:
                        binaries:
                          name: binaries
                          mountPath: /opt/ffmpeg-over-ip
                        dev-dri:
                          name: dev-dri
                          mountPath: /dev/dri
                  volumes:
                    binaries:
                      name: binaries
                      emptyDir: {}
                    dev-dri:
                      name: dev-dri
                      hostPath:
                        path: /dev/dri
                        type: Directory

          services:
            jellyfin:
              ports:
                http:
                  port: 8096
            ffmpeg-over-ip:
              clusterIP: None # headless: one address per node
              ports:
                ffoip:
                  port: 5050

expose:
  jellyfin: # no forward auth: the TV and mobile apps can not follow the login redirect, jellyfin has its own login
    port: 8096
    timeouts:
      request: 0s # streams can be long

oidc:
  jellyfin: {}
