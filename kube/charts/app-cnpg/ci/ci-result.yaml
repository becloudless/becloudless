---
# Source: app-cnpg/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cnpg-cluster-instances
spec:
  egress:
  - toEntities:
    - kube-apiserver
  endpointSelector:
    matchExpressions:
    - key: k8s:cnpg.io/cluster
      operator: Exists
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: cnpg-system
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
      - port: "8000"
        protocol: TCP
---
# Source: app-cnpg/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cnpg-operator
spec:
  egress:
  - toEndpoints:
    - matchExpressions:
      - key: k8s:cnpg.io/cluster
        operator: Exists
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
      - port: "8000"
        protocol: TCP
  - toEntities:
    - kube-apiserver
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: cloudnative-pg
      k8s:io.kubernetes.pod.namespace: cnpg-system
  ingress:
  - fromEntities:
    - kube-apiserver
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "9443"
        protocol: TCP
---
# Source: app-cnpg/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: default
spec:
  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: cnpg
      version: 0.29.1
  dependsOn:
  - name: app-external-snapshotter
    namespace: external-snapshotter
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
---
# Source: app-cnpg/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cnpg
  namespace: default
spec:
  interval: 10m
  url: https://cloudnative-pg.github.io/charts
