apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cnpg-operator
spec:
  egress:
  - toEndpoints:
    - matchExpressions:
      - key: k8s:cnpg.io/cluster
        operator: Exists
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
      - port: "8000"
        protocol: TCP
  - toEntities:
    - kube-apiserver
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: cloudnative-pg
      k8s:io.kubernetes.pod.namespace: cnpg-system
  ingress:
  - fromEntities:
    - kube-apiserver
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "9443"
        protocol: TCP
