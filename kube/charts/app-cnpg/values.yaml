# yaml-language-server: $schema=../base/schema/values.schema.json

# resources are named by their id, without the release name prefix
prefixNamesWithRelease: false

defaults:
  metadata:
    namespace: cnpg-system

resources:
  fluxHelmRepositories:
    cnpg:
      url: https://cloudnative-pg.github.io/charts

  fluxHelmReleases:
    cnpg:
      chart:
        spec:
          chart: cloudnative-pg
          version: 0.29.1
          sourceRef:
            kind: HelmRepository
            name: cnpg
