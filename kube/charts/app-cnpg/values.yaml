# yaml-language-server: $schema=../base/schema/values.schema.json

defaults:
  metadata:
    namespace: cnpg-system

resources:
  namespaces:
    cnpg-system:
      fullNameOverride: cnpg-system

  fluxHelmRepositories:
    cnpg:
      fullNameOverride: cnpg
      url: https://cloudnative-pg.github.io/charts

  fluxHelmReleases:
    cnpg:
      fullNameOverride: cnpg
      chart:
        spec:
          chart: cloudnative-pg
          version: 0.29.1
          sourceRef:
            kind: HelmRepository
            name: cnpg
