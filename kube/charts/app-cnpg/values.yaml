# yaml-language-server: $schema=../base/schema/values.schema.json

# The CloudNativePG operator, and the CronJob `replica-repair` that clones again the replicas that can not start anymore.
#
# A replica can not start anymore when
#  - it is down for a while (a node that is stopped, a restore, a slow disk) and asks the primary for WAL segments that the primary
#    has already recycled (`wal_keep_size`), when there is no WAL archive and no replication slot: postgres of the replica loops on
#    `requested WAL segment ... has already been removed`;
#  - it was the primary and wrote past the point where the new primary forked off (a failover while the API server is unreachable, the old
#    primary comes back): `pg_rewind` of the instance manager fails on `could not find common ancestor of the source and target cluster's
#    timelines`, the data of the replica is not a prefix of the history of the primary, a WAL archive does not help.
# The pod is `Running` but never ready, for ever. The only way out is to clone the replica again from the primary: delete the PVCs and
# the pod of the instance, the operator creates a new instance (a new volume, `pg_basebackup` from the primary).
# The CronJob does it (the script is `files/replica-repair.sh`, in the ConfigMap `replica-repair`) for the instances that
#  - are replicas, and not ready for `MIN_AGE` seconds (the pod is at least that old, and has been unready for that long);
#  - have one of the two errors in the log of the instance (the error of a replica that only lags is not a reason to clone it again);
#  - are in a cluster whose primary is ready (the data is never deleted without a healthy copy), and that does not have the annotation
#    `cnpg.bcl.tf/replica-repair: "false"`. For the lost WAL, the cluster must also have no WAL archive (an instance that logs this
#    error recovers from the archive).
# At most one instance by cluster is cloned again by run, an event `ReplicaRecloned` is created on the `Cluster`.
# To only see what it would do, set `DRY_RUN: "true"` in the env of the CronJob.

resources:
  fluxHelmRepositories:
    cnpg:
      url: https://cloudnative-pg.github.io/charts

  # Cluster wide because the instances are in the namespace of each app.
  ciliumClusterwideNetworkPolicies:
    cnpg-operator:
      endpointSelector:
        matchLabels: {"k8s:io.kubernetes.pod.namespace": cnpg-system, "k8s:app.kubernetes.io/name": cloudnative-pg}
      ingress:
        webhook: # the admission webhook
          fromEntities: [kube-apiserver, host, remote-node]
          toPorts: [9443]
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]
        instances: # status API of the instances
          toEndpoints:
            instances:
              matchExpressions:
                cnpg-cluster: {key: "k8s:cnpg.io/cluster", operator: Exists}
          toPorts: [8000, 5432]

    cnpg-cluster-instances:
      endpointSelector:
        matchExpressions:
          cnpg-cluster: {key: "k8s:cnpg.io/cluster", operator: Exists}
      ingress:
        operator:
          fromEndpoints:
            operator:
              matchLabels: {"k8s:io.kubernetes.pod.namespace": cnpg-system}
          toPorts: [8000, 5432]
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]

  fluxHelmReleases:
    cnpg:
      chart:
        spec:
          chart: cloudnative-pg
          version: 0.29.1
          sourceRef:
            kind: HelmRepository
            name: cnpg
      dependsOn:
        - name: app-external-snapshotter # cnpg snapshot support needs the CRDs before starting, or will require manual restart
          namespace: external-snapshotter

  ciliumNetworkPolicies:
    replica-repair:
      endpointSelector:
        matchLabels: {app.kubernetes.io/component: replica-repair}
      egress:
        kube-apiserver:
          toEntities: [kube-apiserver]

  serviceAccounts:
    replica-repair:
      automountServiceAccountToken: true # the API server

  clusterRoles:
    replica-repair:
      rules:
        clusters:
          apiGroups: [ postgresql.cnpg.io ]
          resources: [ clusters ]
          verbs: [ get, list ]
        pods:
          apiGroups: [ "" ]
          resources: [ pods ]
          verbs: [ get, list, delete ]
        logs: # the error of the lost WAL is in the log of postgres
          apiGroups: [ "" ]
          resources: [ pods/log ]
          verbs: [ get ]
        pvcs:
          apiGroups: [ "" ]
          resources: [ persistentvolumeclaims ]
          verbs: [ list, delete ]
        events:
          apiGroups: [ "" ]
          resources: [ events ]
          verbs: [ create ]

  clusterRoleBindings:
    replica-repair:
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: replica-repair
      subjects:
        replica-repair:
          kind: ServiceAccount
          name: replica-repair
          namespace: "{{ .Release.Namespace }}"

  cronJobs:
    replica-repair:
      schedule: "*/10 * * * *"
      jobTemplate:
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 300
          template:
            metadata:
              labels:
                app.kubernetes.io/component: replica-repair
            spec:
              restartPolicy: Never
              serviceAccountName: replica-repair
              securityContext:
                runAsUser: 65534
                runAsGroup: 65534
              containers:
                repair:
                  name: repair
                  image: docker.io/alpine/k8s:1.37.1 # renovate: versioning=loose
                  command: [ bash, /scripts/replica-repair.sh ]
                  env:
                    HOME: /tmp
                  securityContext:
                    capabilities:
                      drop:
                        all: ALL
                  volumeMounts:
                    script:
                      name: script
                      mountPath: /scripts
                      readOnly: true
              volumes:
                script:
                  name: script
                  configMap:
                    name: replica-repair
