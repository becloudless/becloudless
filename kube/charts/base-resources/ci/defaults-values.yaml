# yaml-language-server: $schema=../schema/values.schema.json

defaults:
  metadata:
    labels:
      org: acme
    annotations:
      managed-by: base-resources
    namespace: shared-ns
  resources:
    configMaps:
      labels:
        app: shared-default
        team: platform

resources:
  configMaps:
    usesDefaultOnly:
      data:
        key: value1
    overridesDefault:
      labels:
        app: custom-app
      data:
        key: value2
    overridesGlobalNamespace:
      namespace: custom-ns
      data:
        key: value4
  secrets:
    usesGlobalMetadataOnly:
      stringData:
        key: value3
