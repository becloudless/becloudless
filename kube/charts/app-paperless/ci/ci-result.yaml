apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: paperless
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      paperless:
        deployments:
          paperless:
            labels:
              app.kubernetes.io/component: paperless
              app.kubernetes.io/instance: paperless
            name: paperless
            namespace: default
        persistentVolumeClaims:
          paperless-data:
            name: paperless-data
            namespace: default
        services:
          paperless:
            name: paperless
            namespace: default
      paperless-integration:
        certManagerCertificates:
          paperless-gateway:
            name: paperless-gateway
            namespace: default
            secretName: tls-paperless-gateway
        httpRoutes:
          paperless:
            name: paperless
            namespace: default
        listenerSets:
          paperless:
            name: paperless
            namespace: default
      paperless-pre:
        externalSecrets:
          paperless-oidc:
            name: paperless-oidc
            namespace: default
        secretStores:
          authelia:
            name: authelia
            namespace: default
        serviceAccounts:
          authelia-reader:
            name: authelia-reader
            namespace: default
        stringSecrets:
          paperless-generated:
            name: paperless-generated
            namespace: default
    resources:
      certManagerCertificates:
        paperless-gateway:
          dnsNames:
            paperless: paperless.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-paperless-gateway
      httpRoutes:
        paperless:
          hostnames:
            paperless: paperless.test.com
          parentRefs:
            paperless: ref:paperless
          rules:
            root:
              backendRefs:
                paperless:
                  name: ref:paperless
                  port: 8000
              timeouts:
                request: 0s
      listenerSets:
        paperless:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: paperless.test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: ref:paperless-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
