      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      paperless:
        deployments:
          paperless:
            labels:
              app.kubernetes.io/component: paperless
              app.kubernetes.io/instance: paperless
            name: paperless
            namespace: default
        persistentVolumeClaims:
          paperless-data:
            name: paperless-data
            namespace: default
        services:
          paperless:
            name: paperless
            namespace: default
      paperless-integration:
        certManagerCertificates:
          paperless-gateway:
            name: paperless-gateway
            namespace: default
            secretName: tls-paperless-gateway
        httpRoutes:
          paperless:
            name: paperless
            namespace: default
        listenerSets:
          paperless:
            name: paperless
            namespace: default
      paperless-pre:
        externalSecrets:
          paperless-oidc:
            name: paperless-oidc
            namespace: default
        secretStores:
          authelia:
            name: authelia
            namespace: default
        serviceAccounts:
          authelia-reader:
            name: authelia-reader
            namespace: default
        stringSecrets:
          paperless-generated:
            name: paperless-generated
            namespace: default
    resources:
      externalSecrets:
        paperless-oidc:
          data:
            client-id:
              remoteRef:
                key: authelia-oidc-paperless
                property: client-id
              secretKey: client-id
            secret:
              remoteRef:
                key: authelia-oidc-paperless
                property: secret
              secretKey: secret
          refreshInterval: 1h
          secretStoreRef: ref:authelia
      secretStores:
        authelia:
          provider:
            kubernetes:
              auth:
                serviceAccount:
                  name: ref:authelia-reader
              remoteNamespace: authelia
              server:
                caProvider:
                  key: ca.crt
                  name: kube-root-ca.crt
                  type: ConfigMap
      serviceAccounts:
        authelia-reader:
          automountServiceAccountToken: false
      stringSecrets:
        paperless-generated:
          fields:
            admin-password: {}
            secret-key: {}
