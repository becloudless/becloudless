# Source: app-bcl/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: bcl
  namespace: default
spec:
  interval: 10m
  ref:
    branch: n0/kube-proxy
  url: https://github.com/becloudless/becloudless.git
---
# Source: app-bcl/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app-backup-restore
  namespace: backup-restore
spec:
  chart:
    spec:
      chart: ./kube/charts/app-backup-restore
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: default
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    timeout: 20m
  interval: 10m
  rollback:
    cleanupOnFail: true
  serviceAccountName: flux-backup-restore
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    defaults:
      resources:
        fluxHelmReleases:
          serviceAccountName: flux-backup-restore
        fluxKustomizations:
          serviceAccountName: flux-backup-restore
  valuesFrom:
  - kind: ConfigMap
    name: global-values
---
