---
# Source: app-bcl/templates/loader.yaml
apiVersion: v1
data:
  values.yaml: |-
    global:
      domain: awired.net
      ldapdn: dc=awired,dc=net
      name: awired
kind: ConfigMap
metadata:
  name: test-release-global-values
  namespace: default
---
# Source: app-bcl/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app-authelia
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/app-authelia
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
  dependsOn:
  - name: app-cert-manager
  - name: app-cnpg
  - name: app-gateway-api
  - name: app-lldap
  - name: app-longhorn
  - name: app-secret-generator
  install:
    crds: CreateReplace
    remediation:
      retries: 0
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 10m
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
  - kind: ConfigMap
    name: test-release-global-values
---
