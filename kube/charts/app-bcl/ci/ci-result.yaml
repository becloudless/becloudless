apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: restore-something
  namespace: backup-restore
spec:
  chart:
    spec:
      chart: ./kube/charts/restore-app
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: default
  dependsOn:
  - name: app-backup-restore
    namespace: backup-restore
  - name: backup-restore-pre
    namespace: backup-restore
  - name: longhorn-backup
    namespace: backup-restore
  - name: app-longhorn
    namespace: longhorn-system
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    timeout: 1h
  interval: 1h
  rollback:
    cleanupOnFail: true
  serviceAccountName: flux-backup-restore
  timeout: 1h
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
    timeout: 1h
  values:
    restore:
      namespace: something
