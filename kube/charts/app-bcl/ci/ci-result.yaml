  rollback:
    cleanupOnFail: true
  serviceAccountName: flux-something
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    defaults:
      resources:
        fluxHelmReleases:
          serviceAccountName: flux-something
        fluxKustomizations:
          serviceAccountName: flux-something
    refs:
      app-something:
        fluxHelmReleases:
          something-config:
            name: something-config
            namespace: something
    resources:
      fluxHelmReleases:
        something-config:
          enabled: true
  valuesFrom:
  - kind: ConfigMap
    name: global-values
