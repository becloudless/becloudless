
# yaml-language-server: $schema=./schema/values.schema.json

config:
  domain:
  # name: # deduced from domain by default
  # ldapdn: # deduced from domain by default (dc=example,dc=com)


# Groups of apps to install. An app is installed when one of its `groups` is enabled here,
# unless `apps.<name>.enabled` is explicitly set to true/false.
appsGroups:
  minimal:
    enabled: true
  server:
    enabled: false
  pop:
    enabled: false

apps:
  kube: # the RBAC the API server needs to reach the kubelets (logs, exec, top)
    groups: [all, minimal, server, pop]
  flux:
    groups: [all, minimal, server, pop]
  gateway-api:
    groups: [all, minimal, server, pop]
  cilium:
    groups: [all, minimal, server, pop]
    dependsOn:
      gateway-api:
        name: app-gateway-api # cilium gatewayAPI need the CRDs before starting, or will require manual restart
  coredns:
    groups: [all, minimal, server, pop]

  cert-manager:
    groups: [all, server, pop]
    dependsOn: # the Gateway API CRDs must exist when cert-manager starts, for the gatewayHTTPRoute http-01 solver
      gateway-api:
        name: app-gateway-api
  kyverno:
    groups: [all, server, pop]
  metrics-server:
    groups: [all, server, pop]
  cnpg:
    groups: [all, server, pop]
    dependsOn:
      app-external-snapshotter:
        name: app-external-snapshotter # cnpg snapshot support needs the CRDs before starting, or will require manual restart
  secret-generator:
    groups: [all, server, pop]
  descheduler:
    groups: [all, server]
  external-snapshotter:
    groups: [all, server, pop]
  longhorn:
    groups: [all, server]
    dependsOn: # the ClusterPolicy needs the kyverno CRDs, the UI needs the certificate and the Gateway
      kyverno:
        name: app-kyverno
      cert-manager:
        name: app-cert-manager
      gateway-api:
        name: app-gateway-api
  lldap:
    groups: [all, server]
    dependsOn: # certificates and issuers, the postgresql cluster, its volume snapshots, generated secrets, the Gateway API CRDs
      cert-manager:
        name: app-cert-manager
      cnpg:
        name: app-cnpg
      gateway-api:
        name: app-gateway-api
      longhorn:
        name: app-longhorn
      secret-generator:
        name: app-secret-generator
  authelia:
    groups: [all, server]
    dependsOn: # certificates and issuers, the postgresql cluster, its volume snapshots, generated secrets, the ldap backend, the Gateway API CRDs
      cert-manager:
        name: app-cert-manager
      cnpg:
        name: app-cnpg
      gateway-api:
        name: app-gateway-api
      # lldap:
      #   name: app-lldap
      longhorn:
        name: app-longhorn
      secret-generator:
        name: app-secret-generator
  landing:
    groups: [all, server]
    dependsOn: # the certificate and the Gateway
      cert-manager:
        name: app-cert-manager
      gateway-api:
        name: app-gateway-api
  homer:
    groups: [all, server]
    dependsOn: # the certificate, the Gateway and the ReferenceGrant to authelia
      authelia:
        name: app-authelia
      cert-manager:
        name: app-cert-manager
      gateway-api:
        name: app-gateway-api


resources:
  namespaces:
    bcl: {}
