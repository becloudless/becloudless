
# yaml-language-server: $schema=./schema/values.schema.json

config:
  domain:
  # name: # deduced from domain by default
  # ldapdn: # deduced from domain by default (dc=example,dc=com)


# Groups of apps to install. An app is installed when one of its `groups` is enabled here,
# unless `apps.<name>.enabled` is explicitly set to true/false.
appsGroups:
  minimal:
    enabled: true
  server:
    enabled: false
  pop:
    enabled: false

apps:
  flux:
    groups: [all, minimal, server, pop]
  cilium:
    groups: [all, minimal, server, pop]
  coredns:
    groups: [all, minimal, server, pop]
  cert-manager:
    groups: [all, server, pop]
  kyverno:
    groups: [all, server, pop]
  metrics-server:
    groups: [all, server, pop]
  cnpg:
    groups: [all, server, pop]
  secret-generator:
    groups: [all, server, pop]
  descheduler:
    groups: [all, server]
  external-snapshotter:
    groups: [all, server, pop]
  longhorn:
    groups: [all, server]
    dependsOn: # the ClusterPolicy needs the kyverno CRDs
      kyverno:
        name: app-kyverno
  lldap:
    groups: [all, server]
    dependsOn: # certificates and issuers, the postgresql cluster, its volume snapshots, generated secrets
      cert-manager:
        name: app-cert-manager
      cnpg:
        name: app-cnpg
      longhorn:
        name: app-longhorn
      secret-generator:
        name: app-secret-generator
  authelia:
    groups: [all, server]
    dependsOn: # certificates and issuers, the postgresql cluster, its volume snapshots, generated secrets, the ldap backend
      cert-manager:
        name: app-cert-manager
      cnpg:
        name: app-cnpg
      lldap:
        name: app-lldap
      longhorn:
        name: app-longhorn
      secret-generator:
        name: app-secret-generator


resources:
  namespaces:
    bcl: {}
