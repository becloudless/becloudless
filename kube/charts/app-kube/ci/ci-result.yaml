apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: node-repair
  namespace: default
spec:
  egress:
  - toEntities:
    - kube-apiserver
  - toEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: node-repair
