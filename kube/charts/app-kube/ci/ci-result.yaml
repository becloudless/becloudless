# Source: app-kube/templates/loader.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: node-repair
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/name: app-kube
  name: node-repair
  namespace: default
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/component: node-repair
            app.kubernetes.io/instance: test-release
            app.kubernetes.io/name: app-kube
        spec:
          containers:
          - command:
            - bash
            - /scripts/node-repair.sh
            env:
            - name: HOME
              value: /tmp
            image: docker.io/alpine/k8s:1.37.2
            name: repair
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /scripts
              name: script
              readOnly: true
            - mountPath: /tmp
              name: tmp
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: node-repair
          volumes:
          - configMap:
              name: node-repair
            name: script
          - emptyDir: {}
            name: tmp
  schedule: '*/5 * * * *'
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
