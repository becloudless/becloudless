apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-integration
  namespace: kube-system
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: bcl
  dependsOn:
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  releaseName: kube-apiserver
  targetNamespace: default
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      kube-integration:
        listenerSets:
          kube:
            name: kube
            namespace: default
        tlsRoutes:
          kube:
            name: kube
            namespace: default
    resources:
      listenerSets:
        kube:
          listeners:
            apiserver:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: kube.test.com
              name: apiserver
              port: 443
              protocol: TLS
              tls:
                mode: Passthrough
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: cilium
      tlsRoutes:
        kube:
          hostnames:
            kube: kube.test.com
          parentRefs:
            kube:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: kube
              sectionName: apiserver
          rules:
            apiserver:
              backendRefs:
                kubernetes:
                  name: kubernetes
                  port: 443
