# yaml-language-server: $schema=../app/schema/values.schema.json

# Kubernetes own objects that the cluster needs and that nothing else installs.

# The public name of the API server on the Gateway `shared`, `kube.<domain>` when empty. It has to be one of the certificate SANs of the API server.
# A node reachable from the internet (`bcl.role.kube.pop`) has the name `bcl.role.kube.pop.apiServerName` (`kube.pop.<domain>`).
hostname: ""

resources:
  # Standard kubeadm-bootstrapped RBAC objects that authorize the API server (identified by its apiserver-kubelet-client
  # cert, CN=kube-apiserver-kubelet-client) to call kubelet endpoints. Required for `kubectl logs`, `exec`, `port-forward`,
  # `attach` and `top node`/`top pod`.
  #
  # They are normally created once by `kubeadm init` and are NOT part of the apiserver's auto-reconciled default bootstrap
  # policy, so if they are ever missing they won't come back on their own.
  clusterRoles:
    kube-apiserver-to-kubelet:
      labels:
        kubernetes.io/bootstrapping: rbac-defaults
      rules:
        nodes:
          apiGroups:
            core: ""
          resources:
            proxy: nodes/proxy
            stats: nodes/stats
            log: nodes/log
            spec: nodes/spec
            metrics: nodes/metrics
          verbs:
            all: "*"

  clusterRoleBindings:
    # the users of authelia (OIDC authentication of the apiserver, `bcl.role.kube.oidc` of the nixos module) of the group
    # `role_admin` of lldap: the groups of the id token are prefixed by `oidc:`
    oidc-admin:
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        role-admin:
          apiGroup: rbac.authorization.k8s.io
          kind: Group
          name: "oidc:role_admin"

    kube-apiserver-kubelet-client:
      labels:
        kubernetes.io/bootstrapping: rbac-defaults
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: kube-apiserver-to-kubelet
      subjects:
        apiserver-kubelet-client:
          apiGroup: rbac.authorization.k8s.io
          kind: User
          name: kube-apiserver-kubelet-client

  fluxHelmReleases:
    # Public access to the API server on <hostname>:443 (kube.<domain> by default), through the Cilium Gateway `shared` (cilium).
    # The TLS stream is forwarded as is (passthrough): the API server terminates TLS itself and authenticates the client,
    # <hostname> is one of its certificate SANs. The route lives in the namespace of the `kubernetes` service it targets,
    # so no ReferenceGrant is needed. Port 443 is shared with the https listeners of the apps, routed by SNI.
    # It is a separate release because this app is installed before the Gateway API CRDs exist.
    # The release object is in the namespace of the app, where its service account is allowed to create it, and installs in `default`.
    kube-integration:
      namespace: kube-system
      targetNamespace: default
      releaseName: kube-apiserver
      install:
        disableWait: true
      upgrade:
        disableWait: true
      dependsOn:
        - name: app-gateway-api
          namespace: gateway-api
      values:
        resources:
          listenerSets:
            kube:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: shared
                namespace: cilium
              listeners:
                apiserver:
                  name: apiserver
                  hostname: '{{ .Values.hostname | default (printf "kube.%s" .Values.app.domain) }}'
                  port: 443
                  protocol: TLS
                  tls:
                    mode: Passthrough
                  allowedRoutes:
                    namespaces:
                      from: Same

          tlsRoutes:
            kube:
              parentRefs:
                kube:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: kube
                  sectionName: apiserver
              hostnames:
                kube: '{{ .Values.hostname | default (printf "kube.%s" .Values.app.domain) }}'
              rules:
                apiserver:
                  backendRefs:
                    kubernetes:
                      name: kubernetes
                      port: 443
