---
# Source: app-intel-gpu-plugin/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-plugin
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: bcl
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      intel-gpu-plugin:
        daemonSets:
          intel-gpu-plugin:
            labels:
              app.kubernetes.io/component: intel-gpu-plugin
              app.kubernetes.io/instance: intel-gpu-plugin
            name: intel-gpu-plugin
            namespace: default
    resources:
      daemonSets:
        intel-gpu-plugin:
          template:
            metadata:
              annotations:
                policy.bcl.tf/skipContainerRequireRunAsNonRoot: "true"
                policy.bcl.tf/skipPodRestrictHostAccess: "true"
                policy.bcl.tf/skipPodSetHostUsers: "true"
            spec:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
              automountServiceAccountToken: false
              containers:
                intel-gpu-plugin:
                  args:
                  - -shared-dev-num=1
                  image: docker.io/intel/intel-gpu-plugin:0.37.1
                  name: intel-gpu-plugin
                  resources:
                    limits:
                      memory: 115Mi
                    requests:
                      cpu: 40m
                      memory: 45Mi
                  securityContext:
                    capabilities:
                      drop:
                        all: ALL
                  volumeMounts:
                    cdipath:
                      mountPath: /var/run/cdi
                      name: cdipath
                    devfs:
                      mountPath: /dev/dri
                      name: devfs
                      readOnly: true
                    kubeletsockets:
                      mountPath: /var/lib/kubelet/device-plugins
                      name: kubeletsockets
                    sysfsdrm:
                      mountPath: /sys/class/drm
                      name: sysfsdrm
                      readOnly: true
              nodeSelector:
                kubernetes.io/arch: amd64
              securityContext:
                runAsNonRoot: false
                runAsUser: 0
              tolerations:
              - effect: NoSchedule
                key: bcl.tf/no-persistent-storage
                operator: Equal
                value: "true"
              volumes:
                cdipath:
                  hostPath:
                    path: /var/run/cdi
                    type: DirectoryOrCreate
                  name: cdipath
                devfs:
                  hostPath:
                    path: /dev/dri
                    type: Directory
                  name: devfs
                kubeletsockets:
                  hostPath:
                    path: /var/lib/kubelet/device-plugins
                    type: Directory
                  name: kubeletsockets
                sysfsdrm:
                  hostPath:
                    path: /sys/class/drm
                    type: Directory
                  name: sysfsdrm
          updateStrategy:
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
            type: RollingUpdate
