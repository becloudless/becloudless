# Source: app-tuwunel/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuwunel-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  - name: tuwunel
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      certManagerCertificates:
        tuwunel-gateway:
          dnsNames:
            matrix: matrix.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-tuwunel-gateway
      httpRoutes:
        tuwunel:
          hostnames:
            matrix: matrix.test.com
          parentRefs:
            tuwunel:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: tuwunel
          rules:
            root:
              backendRefs:
                tuwunel:
                  name: tuwunel
                  port: 8008
              timeouts:
                request: 0s
      listenerSets:
        tuwunel:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: matrix.test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-tuwunel-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
---
# Source: app-tuwunel/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuwunel-pre
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: authelia-pre
    namespace: authelia
  - name: app-external-secrets
    namespace: external-secrets
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      externalSecrets:
        tuwunel-oidc:
          data:
            client-id:
              remoteRef:
                key: authelia-oidc-tuwunel
                property: client-id
              secretKey: client-id
            secret:
              remoteRef:
                key: authelia-oidc-tuwunel
                property: secret
              secretKey: secret
          refreshInterval: 1h
          secretStoreRef:
            kind: SecretStore
            name: authelia
      secretStores:
        authelia:
          provider:
            kubernetes:
              auth:
                serviceAccount:
                  name: authelia-reader
              remoteNamespace: authelia
              server:
                caProvider:
                  key: ca.crt
                  name: kube-root-ca.crt
                  type: ConfigMap
      serviceAccounts:
        authelia-reader:
          automountServiceAccountToken: false
