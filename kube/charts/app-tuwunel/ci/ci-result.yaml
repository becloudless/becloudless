---
# Source: app-tuwunel/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tuwunel
  namespace: default
spec:
  egress:
  - toFQDNs:
    - matchName: authelia.test.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEntities:
    - ingress
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: tuwunel
      app.kubernetes.io/instance: tuwunel
  ingress:
  - fromEntities:
    - host
    - ingress
    - remote-node
    toPorts:
    - ports:
      - port: "8008"
        protocol: TCP
---
# Source: app-tuwunel/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuwunel
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-longhorn
    namespace: longhorn-system
  - name: tuwunel-pre
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      deployments:
        tuwunel:
          replicas: 1
          strategy:
            type: Recreate
          template:
            spec:
              containers:
                tuwunel:
                  env:
                    OIDC_CLIENT_ID:
                      secretKeyRef:
                        key: client-id
                        name: tuwunel-oidc
                    TUWUNEL_ADDRESS: 0.0.0.0
                    TUWUNEL_ALLOW_FEDERATION: "false"
                    TUWUNEL_DATABASE_PATH: /var/lib/tuwunel/data
                    TUWUNEL_IDENTITY_PROVIDER__0__BRAND: Authelia
                    TUWUNEL_IDENTITY_PROVIDER__0__CALLBACK_URL: https://matrix.test.com/_matrix/client/unstable/login/sso/callback/$(OIDC_CLIENT_ID)
                    TUWUNEL_IDENTITY_PROVIDER__0__CLIENT_ID: $(OIDC_CLIENT_ID)
                    TUWUNEL_IDENTITY_PROVIDER__0__CLIENT_SECRET:
                      secretKeyRef:
                        key: secret
                        name: tuwunel-oidc
                    TUWUNEL_IDENTITY_PROVIDER__0__ISSUER_URL: https://authelia.test.com
                    TUWUNEL_IDENTITY_PROVIDER__0__NAME: Authelia
                    TUWUNEL_IDENTITY_PROVIDER__0__UNIQUE_ID_FALLBACKS: "false"
                    TUWUNEL_LOGIN_WITH_PASSWORD: "false"
                    TUWUNEL_NEW_USER_DISPLAYNAME_SUFFIX: ""
                    TUWUNEL_OIDC_REGISTRATION_ALLOWED_REDIRECT_HOSTS: '["element.test.com",
                      "io.element.android"]'
                    TUWUNEL_SERVER_NAME: matrix.test.com
                    TUWUNEL_WELL_KNOWN__CLIENT: https://matrix.test.com
                  image: ghcr.io/matrix-construct/tuwunel:v1.9.4
                  livenessProbe:
                    failureThreshold: 6
                    httpGet:
                      path: /_matrix/client/versions
                      port: 8008
                    periodSeconds: 30
                    timeoutSeconds: 10
                  name: tuwunel
                  ports:
                    http:
                      containerPort: 8008
                  readinessProbe:
                    httpGet:
                      path: /_matrix/client/versions
                      port: 8008
                    timeoutSeconds: 5
                  securityContext:
                    capabilities:
                      drop:
                        all: ALL
                    runAsGroup: 1000
                    runAsUser: 1000
                  startupProbe:
                    failureThreshold: 60
                    httpGet:
                      path: /_matrix/client/versions
                      port: 8008
                  volumeMounts:
                    data:
                      mountPath: /var/lib/tuwunel
                      name: data
              securityContext:
                fsGroup: 1000
              volumes:
                data:
                  name: data
                  persistentVolumeClaim:
                    claimName: tuwunel-data
      persistentVolumeClaims:
        tuwunel-data:
          resources:
            requests:
              storage: 10Gi
          storageClassName: longhorn-db
      services:
        tuwunel:
          ports:
            http:
              port: 8008
