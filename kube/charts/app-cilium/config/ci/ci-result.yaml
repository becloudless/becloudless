---
# Source: cilium-config/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  labels:
    advertise: bgp
  name: bgp-advertisement
  namespace: default
spec:
  advertisements:
  - advertisementType: Service
    selector:
      matchExpressions:
      - key: somekey
        operator: NotIn
        values:
        - never-used-value
    service:
      addresses:
      - LoadBalancerIP
---
# Source: cilium-config/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: bgp-cluster-config
  namespace: default
spec:
  bgpInstances:
  - localASN: 65001
    name: cilium
    peers:
    - name: router
      peerASN: 65000
      peerAddress: 192.168.70.254
      peerConfigRef:
        name: bgp-peer-config
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: ""
---
# Source: cilium-config/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: bgp-peer-config
  namespace: default
spec:
  families:
  - advertisements:
      matchLabels:
        advertise: bgp
    afi: ipv4
    safi: unicast
---
# Source: cilium-config/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: services
  namespace: default
spec:
  blocks:
  - cidr: 192.168.71.0/24
