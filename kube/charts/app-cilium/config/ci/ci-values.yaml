global:
  domain: test.com

resources:
  ciliumLoadBalancerIPPools:
    services:
      fullNameOverride: services
      blocks:
        main:
          cidr: 192.168.71.0/24

  ciliumBGPClusterConfigs:
    bgp-cluster-config:
      fullNameOverride: bgp-cluster-config
      nodeSelector:
        matchLabels:
          node-role.kubernetes.io/control-plane: ""
      bgpInstances:
        cilium:
          name: cilium
          localASN: 65001
          peers:
            router:
              name: router
              peerASN: 65000
              peerAddress: 192.168.70.254
              peerConfigRef:
                name: bgp-peer-config
