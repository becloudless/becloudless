apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium-post
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: cilium
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      ciliumBGPAdvertisements:
        bgp-advertisement:
          advertisements:
            service:
              advertisementType: Service
              selector:
                matchExpressions:
                  never:
                    key: somekey
                    operator: NotIn
                    values:
                      never-used-value: never-used-value
              service:
                addresses:
                  loadBalancerIP: LoadBalancerIP
          labels:
            advertise: bgp
      ciliumBGPPeerConfigs:
        bgp-peer-config:
          families:
            ipv4-unicast:
              advertisements:
                matchLabels:
                  advertise: bgp
              afi: ipv4
              safi: unicast
      gateways:
        shared:
          allowedListeners:
            namespaces:
              from: All
          gatewayClassName: cilium
          listeners:
            http:
              allowedRoutes:
                namespaces:
                  from: All
              name: http
              port: 80
              protocol: HTTP
