---
# Source: app-cilium/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: default
spec:
  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: cilium
      version: 1.20.2
  dependsOn:
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  uninstall:
    deletionPropagation: orphan
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    bgpControlPlane:
      enabled: true
    cni:
      exclusive: false
    devices: br0
    envoy:
      streamIdleTimeoutDurationSeconds: 600
    extraEnv:
    - name: PATH
      value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/run/wrappers/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin
    gatewayAPI:
      enabled: true
    ingressController:
      enabled: false
    ipam:
      mode: kubernetes
    k8sServiceHost: kube.test.com
    k8sServicePort: 8443
    kubeProxyReplacement: true
    nodePort:
      directRoutingDevice: br0
    operator:
      replicas: 1
