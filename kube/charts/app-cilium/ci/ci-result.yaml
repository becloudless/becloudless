apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium-post
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: cilium
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      cilium-policies:
        ciliumClusterwideNetworkPolicies:
          allow-dns:
            name: allow-dns
            namespace: default
          default-deny:
            name: default-deny
            namespace: default
      cilium-post:
        ciliumBGPAdvertisements:
          bgp-advertisement:
            name: bgp-advertisement
            namespace: default
        ciliumBGPPeerConfigs:
          bgp-peer-config:
            name: bgp-peer-config
            namespace: default
        gateways:
          shared:
            name: shared
            namespace: default
        httpRoutes:
          https-redirect:
            name: https-redirect
            namespace: default
    resources:
      ciliumBGPAdvertisements:
        bgp-advertisement:
          advertisements:
            service:
              advertisementType: Service
              selector:
                matchExpressions:
                  never:
                    key: somekey
                    operator: NotIn
                    values:
                      never-used-value: never-used-value
              service:
                addresses:
                  loadBalancerIP: LoadBalancerIP
          labels:
            advertise: bgp
      ciliumBGPPeerConfigs:
        bgp-peer-config:
          families:
            ipv4-unicast:
              advertisements:
                matchLabels:
                  advertise: bgp
              afi: ipv4
              safi: unicast
      gateways:
        shared:
          allowedListeners:
            namespaces:
              from: All
          gatewayClassName: cilium
          listeners:
            http:
              allowedRoutes:
                namespaces:
                  from: All
              name: http
              port: 80
              protocol: HTTP
      httpRoutes:
        https-redirect:
          parentRefs:
            shared:
              group: gateway.networking.k8s.io
              kind: Gateway
              name: shared
              sectionName: http
          rules:
            redirect:
              filters:
                redirect:
                  requestRedirect:
                    scheme: https
                    statusCode: 301
                  type: RequestRedirect
