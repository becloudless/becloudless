---
# Source: app-cilium/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: default
spec:
  chart:
    spec:
      chart: cilium
      sourceRef:
        kind: HelmRepository
        name: cilium
      version: 1.20.2
  dependsOn:
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  uninstall:
    deletionPropagation: orphan
  upgrade:
    remediation:
      retries: 3
  values:
    bgpControlPlane:
      enabled: true
    cni:
      exclusive: false
    devices: br0
    envoy:
      streamIdleTimeoutDurationSeconds: 600
    extraEnv:
    - name: PATH
      value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/run/wrappers/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin
    gatewayAPI:
      enabled: true
    ingressController:
      enabled: false
    ipam:
      mode: kubernetes
    k8sServiceHost: kube.test.com
    k8sServicePort: 8443
    kubeProxyReplacement: true
    nodePort:
      directRoutingDevice: br0
    operator:
      replicas: 1
---
# Source: app-cilium/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium-post
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: cilium
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    resources:
      ciliumBGPAdvertisements:
        bgp-advertisement:
          advertisements:
            service:
              advertisementType: Service
              selector:
                matchExpressions:
                  never:
                    key: somekey
                    operator: NotIn
                    values:
                      never-used-value: never-used-value
              service:
                addresses:
                  loadBalancerIP: LoadBalancerIP
          labels:
            advertise: bgp
      ciliumBGPPeerConfigs:
        bgp-peer-config:
          families:
            ipv4-unicast:
              advertisements:
                matchLabels:
                  advertise: bgp
              afi: ipv4
              safi: unicast
      gateways:
        shared:
          allowedListeners:
            namespaces:
              from: All
          gatewayClassName: cilium
          listeners:
            http:
              allowedRoutes:
                namespaces:
                  from: All
              name: http
              port: 80
              protocol: HTTP
---
# Source: app-cilium/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: default
spec:
  interval: 10m
  url: https://helm.cilium.io
