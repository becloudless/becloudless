# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:

defaults:
  metadata:
    namespace: kube-system

resources:
  fluxHelmRepositories:
    cilium:
      fullNameOverride: cilium
      url: https://helm.cilium.io

  fluxHelmReleases:
    cilium:
      fullNameOverride: cilium     
      uninstall:
        deletionPropagation: orphan

      chart:
        spec:
          chart: cilium
          version: 1.20.2
          sourceRef:
            kind: HelmRepository
            name: cilium
      values:
        extraEnv:
        - name: PATH
          value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/run/wrappers/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin # TODO why it's working?

        k8sServiceHost: kube.{{.Values.global.domain}}
        k8sServicePort: 8443

        devices: br0
        nodePort:
          directRoutingDevice: br0

        kubeProxyReplacement: true

        operator:
          replicas: 1

        ipam:
          mode: kubernetes

        bgpControlPlane:
          enabled: true
        cni:
          exclusive: false # let multus install

        ingressController:
          enabled: true
          default: true
          loadbalancerMode: shared
          enforceHttps: false # TODO true redirects the whole host to https, including the cert-manager http-01 challenge path, so certificates can never be issued or renewed
        # Gateway API is used when forward auth (authelia) is needed: the ingress controller cannot do it.
        # Needs the CRDs of app-gateway-api at operator start, restart the cilium-operator once after they are first installed.
        gatewayAPI:
          enabled: true
        envoy:
          streamIdleTimeoutDurationSeconds: 600 # required by immich for big files upload

    # LoadBalancer pool and BGP need the Cilium CRDs, so they are installed once cilium is ready.
    # The cluster sets its pool and BGP cluster config through `resources.fluxHelmReleases.cilium-config.values.resources`.
    cilium-config:
      fullNameOverride: cilium-config
      dependsOn:
        cilium:
          name: cilium
        gateway-api: # the Gateway needs its CRDs
          name: app-gateway-api
          namespace: "{{ .Release.Namespace }}"
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: "{{ .Release.Namespace }}"
      values:
        resources:
          # Advertise the LoadBalancer IPs of every service over BGP
          ciliumBGPAdvertisements:
            bgp-advertisement:
              fullNameOverride: bgp-advertisement
              labels:
                advertise: bgp
              advertisements:
                service:
                  advertisementType: Service
                  service:
                    addresses:
                      loadBalancerIP: LoadBalancerIP
                  selector: # an always true selector, an empty one matches nothing
                    matchExpressions:
                      never:
                        key: somekey
                        operator: NotIn
                        values:
                          never-used-value: never-used-value

          ciliumBGPPeerConfigs:
            bgp-peer-config:
              fullNameOverride: bgp-peer-config
              families:
                ipv4-unicast:
                  afi: ipv4
                  safi: unicast
                  advertisements:
                    matchLabels:
                      advertise: bgp

          # Entry point of the apps protected by forward auth. It has its own LoadBalancer IP, different from the ingress one:
          # the cluster pins it with `addresses` and routes the hosts of these apps to it.
          # Each app attaches its https listener and certificate with a ListenerSet in its own namespace.
          gateways:
            shared:
              fullNameOverride: shared
              gatewayClassName: cilium
              allowedListeners:
                namespaces:
                  from: All
              listeners: # a Gateway needs at least one valid listener of its own
                http:
                  name: http
                  protocol: HTTP
                  port: 80
                  allowedRoutes:
                    namespaces:
                      from: Same
