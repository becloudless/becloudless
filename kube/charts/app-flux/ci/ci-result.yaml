---
# Source: app-flux/templates/loader.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-release-allow-cert-manager-http-solver
  namespace: default
spec:
  ingress:
  - {}
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
  - {}
---
# Source: app-flux/templates/loader.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/tls-acme: "true"
  name: test-release-flux-webhook
  namespace: default
spec:
  rules:
  - host: flux-webhook.
    http:
      paths:
      - backend:
          service:
            name: webhook-receiver
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - {}
    secretName: tls-flux-webhook
---
# Source: app-flux/templates/loader.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: test-release-flux
  namespace: default
spec:
  interval: 10m
  patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --helm-index-max-size=102428800
    target:
      kind: Deployment
      name: source-controller
      namespace: flux-system
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --concurrent=10
    target:
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: anything
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  limits:
                    memory: 3Gi
    target:
      kind: Deployment
      name: source-controller
      namespace: flux-system
  path: ./
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-manifests
  wait: true
---
# Source: app-flux/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: test-release-flux-manifests
  namespace: default
spec:
  ref:
    tag: v2.9.5
  url: oci://ghcr.io/fluxcd/flux-manifests
