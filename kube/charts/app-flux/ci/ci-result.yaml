# Source: app-flux/templates/loader.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux
  namespace: default
spec:
  interval: 10m
  patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --feature-gates=CancelHealthCheckOnNewRevision=true
    target:
      kind: Deployment
      name: helm-controller
      namespace: flux-system
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --concurrent=20
    target:
      kind: Deployment
      name: helm-controller
      namespace: flux-system
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --default-service-account=default
    target:
      kind: Deployment
      name: helm-controller
      namespace: flux-system
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --helm-index-max-size=102428800
    target:
      kind: Deployment
      name: source-controller
      namespace: flux-system
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --concurrent=10
    target:
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --default-service-account=default
    target:
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-egress
    target:
      kind: NetworkPolicy
      name: allow-egress
      namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-scraping
    target:
      kind: NetworkPolicy
      name: allow-scraping
      namespace: flux-system
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-webhooks
    target:
      kind: NetworkPolicy
      name: allow-webhooks
      namespace: flux-system
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: (helm-controller|kustomize-controller|notification-controller)
      namespace: flux-system
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: anything
      spec:
        template:
          spec:
            containers:
              - name: manager
                resources:
                  limits:
                    memory: 3Gi
    target:
      kind: Deployment
      name: source-controller
      namespace: flux-system
  path: ./
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: OCIRepository
    name: flux-manifests
  wait: true
---
# Source: app-flux/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-manifests
  namespace: default
spec:
  interval: 10m
  ref:
    tag: v2.9.6
  url: oci://ghcr.io/fluxcd/flux-manifests
