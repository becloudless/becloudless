# yaml-language-server: $schema=../base/schema/values.schema.json

global:
  domain:

defaults:
  metadata:
    namespace: flux-system

resources:
  namespaces:
    flux-system: {}

  fluxOCIRepositories:
    flux-manifests:
      fullNameOverride: flux-manifests
      url: oci://ghcr.io/fluxcd/flux-manifests
      ref:
        tag: v2.9.6

  networkPolicies:
    allow-cert-manager-http-solver:
      fullNameOverride: allow-cert-manager-http-solver
      policyTypes:
        XXX: Ingress
      podSelector:
        matchLabels:
          acme.cert-manager.io/http01-solver: "true"
      ingress:
       something: {}

  ingresses:
    flux-webhook:
      fullNameOverride: flux-webhook
      annotations:
        kubernetes.io/tls-acme: "true"
      rules:
        main:
          host: flux-webhook.{{ .Values.global.domain }}
          http:
            paths:
              main:
                path: /
                pathType: Prefix
                backend:
                  service:
                    name: webhook-receiver
                    port:
                      number: 80
      tls:
        main:
          hosts:
            flux-webhook: flux-webhook.{{ .Values.global.domain }}
          secretName: tls-flux-webhook

  fluxKustomizations:
    flux:
      fullNameOverride: flux
      interval: 10m # TODO default
      path: ./ # TODO default
      prune: true # TODO default
      wait: true # TODO default
      sourceRef:
        kind: OCIRepository
        name: flux-manifests
      patches:
        resources:
          target:
            kind: Deployment
            name: source-controller
            namespace: flux-system
          patch: |-
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: anything
            spec:
              template:
                spec:
                  containers:
                    - name: manager
                      resources:
                        limits:
                          memory: 3Gi

        # truecharts repo is huge
        helmIndexSize:
          target:
            kind: Deployment
            name: source-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --helm-index-max-size=102428800

        kustomizeControllerConcurrent:
          target:
            kind: Deployment
            name: kustomize-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --concurrent=10

        # a HR waiting for its health check holds a worker, so keep enough free for the downstream HR
        helmControllerConcurrent:
          target:
            kind: Deployment
            name: helm-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --concurrent=10

        # cancel the running health check when a new revision is available
        helmControllerCancelHealthCheck:
          target:
            kind: Deployment
            name: helm-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --feature-gates=CancelHealthCheckOnNewRevision=true

