# yaml-language-server: $schema=../base/schema/values.schema.json

global:
  domain:

# resources are named by their id, without the release name prefix
prefixNamesWithRelease: false

defaults:
  metadata:
    namespace: flux-system

resources:
  fluxOCIRepositories:
    flux-manifests:
      url: oci://ghcr.io/fluxcd/flux-manifests
      ref:
        tag: v2.9.6

  networkPolicies:
    allow-cert-manager-http-solver:
      policyTypes:
        XXX: Ingress
      podSelector:
        matchLabels:
          acme.cert-manager.io/http01-solver: "true"
      ingress:
       something: {}

  fluxHelmReleases:
    # Webhook receiver exposed by the Cilium Gateway `shared` (kube-system). Disabled by default: it needs the Gateway API CRDs
    # and cert-manager, which a cluster only gets with the apps of the server groups. A cluster enables it with
    # `apps.flux.values.resources.fluxHelmReleases.flux-webhook.enabled: true`.
    # It is a separate release so it can wait for them: the apps flux belongs to are installed before.
    flux-webhook:
      enabled: false
      dependsOn:
        cert-manager:
          name: app-cert-manager
          namespace: bcl
        gateway-api:
          name: app-gateway-api
          namespace: bcl
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: bcl
      values:
        prefixNamesWithRelease: false
        resources:
          certManagerCertificates:
            flux-webhook-gateway:
              secretName: tls-flux-webhook-gateway
              dnsNames:
                webhook: flux-webhook.{{ .Values.global.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

          listenerSets:
            flux-webhook:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: shared
                namespace: kube-system
              listeners:
                https:
                  name: https
                  hostname: flux-webhook.{{ .Values.global.domain }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-flux-webhook-gateway
                  allowedRoutes:
                    namespaces:
                      from: Same

          httpRoutes:
            flux-webhook:
              parentRefs:
                flux-webhook:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: flux-webhook
              hostnames:
                webhook: flux-webhook.{{ .Values.global.domain }}
              rules:
                root:
                  backendRefs:
                    webhook-receiver:
                      name: webhook-receiver
                      port: 80

  fluxKustomizations:
    flux:
      path: ./ # TODO default
      sourceRef:
        kind: OCIRepository
        name: flux-manifests
      patches:
        resources:
          target:
            kind: Deployment
            name: source-controller
            namespace: flux-system
          patch: |-
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: anything
            spec:
              template:
                spec:
                  containers:
                    - name: manager
                      resources:
                        limits:
                          memory: 3Gi

        # truecharts repo is huge
        helmIndexSize:
          target:
            kind: Deployment
            name: source-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --helm-index-max-size=102428800

        kustomizeControllerConcurrent:
          target:
            kind: Deployment
            name: kustomize-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --concurrent=10

        # a HR waiting for its health check holds a worker, so keep enough free for the downstream HR
        helmControllerConcurrent:
          target:
            kind: Deployment
            name: helm-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --concurrent=10

        # a resource without serviceAccountName would be reconciled as the controller itself (cluster-admin): it runs as the
        # unprivileged `default` service account of its namespace instead, so an app cannot escape its service account by omitting it
        helmControllerDefaultServiceAccount:
          target:
            kind: Deployment
            name: helm-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --default-service-account=default

        kustomizeControllerDefaultServiceAccount:
          target:
            kind: Deployment
            name: kustomize-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --default-service-account=default

        # cancel the running health check when a new revision is available
        helmControllerCancelHealthCheck:
          target:
            kind: Deployment
            name: helm-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --feature-gates=CancelHealthCheckOnNewRevision=true

