# yaml-language-server: $schema=../app/schema/values.schema.json

resources:
  fluxOCIRepositories:
    flux-manifests:
      url: oci://ghcr.io/fluxcd/flux-manifests
      ref:
        tag: v2.9.6

  networkPolicies:
    allow-cert-manager-http-solver:
      policyTypes:
        XXX: Ingress
      podSelector:
        matchLabels:
          acme.cert-manager.io/http01-solver: "true"
      ingress:
       something: {}

  # on top of the default deny of app-cilium, which waits for this release: without these rules Flux could not reconcile anything anymore.
  # One policy for each controller (the `app` label), the selectors are in the namespace of the release. The NetworkPolicies bundled
  # in the flux manifests allow everything (`allow-egress`) or whole namespaces: they are removed by the patches of the `flux` Kustomization.
  # Port 9090 is the artifacts of the sources (source-controller, source-watcher) and the events (notification-controller).
  ciliumNetworkPolicies:
    source-controller: # fetches the git repositories, the helm repositories and the OCI artifacts
      endpointSelector:
        matchLabels: {app: source-controller}
      ingress:
        artifacts:
          fromEndpoints:
            consumers:
              matchExpressions:
                app:
                  key: app
                  operator: In
                  values: {helm-controller: helm-controller, kustomize-controller: kustomize-controller, image-automation-controller: image-automation-controller, source-watcher: source-watcher}
          toPorts:
            artifacts: {ports: {p9090: {port: "9090", protocol: TCP}}}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}
        notification-controller:
          toEndpoints:
            notification-controller:
              matchLabels: {app: notification-controller}
          toPorts:
            events: {ports: {p9090: {port: "9090", protocol: TCP}}}
        gateway: # the public addresses of the sources hosted in the cluster are the gateway
          toEntities: {ingress: ingress}
          toPorts:
            sources:
              ports:
                p22: {port: "22", protocol: TCP}
                p80: {port: "80", protocol: TCP}
                p443: {port: "443", protocol: TCP}
        internet: # the git repositories, the helm repositories and the OCI registries: any name, the sources are set by the clusters
          toFQDNs:
            any: {matchPattern: "*"}
          toPorts:
            sources:
              ports:
                p22: {port: "22", protocol: TCP}
                p80: {port: "80", protocol: TCP}
                p443: {port: "443", protocol: TCP}

    source-watcher:
      endpointSelector:
        matchLabels: {app: source-watcher}
      ingress:
        artifacts:
          fromEndpoints:
            consumers:
              matchExpressions:
                app:
                  key: app
                  operator: In
                  values: {helm-controller: helm-controller, kustomize-controller: kustomize-controller}
          toPorts:
            artifacts: {ports: {p9090: {port: "9090", protocol: TCP}}}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}
        source-controller:
          toEndpoints:
            source-controller:
              matchLabels: {app: source-controller}
          toPorts:
            artifacts: {ports: {p9090: {port: "9090", protocol: TCP}}}
        notification-controller:
          toEndpoints:
            notification-controller:
              matchLabels: {app: notification-controller}
          toPorts:
            events: {ports: {p9090: {port: "9090", protocol: TCP}}}

    helm-controller:
      endpointSelector:
        matchLabels: {app: helm-controller}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}
        source-controller:
          toEndpoints:
            source-controller:
              matchLabels: {app: source-controller}
          toPorts:
            artifacts: {ports: {p9090: {port: "9090", protocol: TCP}}}
        source-watcher:
          toEndpoints:
            source-watcher:
              matchLabels: {app: source-watcher}
          toPorts:
            artifacts: {ports: {p9090: {port: "9090", protocol: TCP}}}
        notification-controller:
          toEndpoints:
            notification-controller:
              matchLabels: {app: notification-controller}
          toPorts:
            events: {ports: {p9090: {port: "9090", protocol: TCP}}}
        # TODO
        chart-schemas: # the values schema of the authelia chart references `definitions.json`, loaded by helm at each install/upgrade
          toFQDNs:
            authelia: {matchName: charts.authelia.com}
          toPorts:
            https: {ports: {p443: {port: "443", protocol: TCP}}}

    kustomize-controller:
      endpointSelector:
        matchLabels: {app: kustomize-controller}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}
        source-controller:
          toEndpoints:
            source-controller:
              matchLabels: {app: source-controller}
          toPorts:
            artifacts: {ports: {p9090: {port: "9090", protocol: TCP}}}
        source-watcher:
          toEndpoints:
            source-watcher:
              matchLabels: {app: source-watcher}
          toPorts:
            artifacts: {ports: {p9090: {port: "9090", protocol: TCP}}}
        notification-controller:
          toEndpoints:
            notification-controller:
              matchLabels: {app: notification-controller}
          toPorts:
            events: {ports: {p9090: {port: "9090", protocol: TCP}}}

    notification-controller: # the events of the controllers, and the webhook receiver exposed by the gateway
      endpointSelector:
        matchLabels: {app: notification-controller}
      ingress:
        events:
          fromEndpoints:
            controllers:
              matchExpressions:
                app:
                  key: app
                  operator: In
                  values: {helm-controller: helm-controller, kustomize-controller: kustomize-controller, source-controller: source-controller, source-watcher: source-watcher, image-automation-controller: image-automation-controller, image-reflector-controller: image-reflector-controller}
          toPorts:
            events: {ports: {p9090: {port: "9090", protocol: TCP}}}
        webhook-receiver:
          fromEntities: {ingress: ingress, host: host, remote-node: remote-node}
          toPorts:
            receiver: {ports: {p9292: {port: "9292", protocol: TCP}}}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}
        gateway: # the public addresses of the providers hosted in the cluster are the gateway
          toEntities: {ingress: ingress}
          toPorts:
            https:
              ports:
                p80: {port: "80", protocol: TCP}
                p443: {port: "443", protocol: TCP}
        providers: # the notification providers: any name, the providers are set by the clusters
          toFQDNs:
            any: {matchPattern: "*"}
          toPorts:
            https:
              ports:
                p80: {port: "80", protocol: TCP}
                p443: {port: "443", protocol: TCP}

    image-automation-controller:
      endpointSelector:
        matchLabels: {app: image-automation-controller}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}
        source-controller:
          toEndpoints:
            source-controller:
              matchLabels: {app: source-controller}
          toPorts:
            artifacts: {ports: {p9090: {port: "9090", protocol: TCP}}}
        notification-controller:
          toEndpoints:
            notification-controller:
              matchLabels: {app: notification-controller}
          toPorts:
            events: {ports: {p9090: {port: "9090", protocol: TCP}}}
        gateway: # the public addresses of the repositories hosted in the cluster are the gateway
          toEntities: {ingress: ingress}
          toPorts:
            git:
              ports:
                p22: {port: "22", protocol: TCP}
                p443: {port: "443", protocol: TCP}
        git: # the push of the updates: any name, the repositories are set by the clusters
          toFQDNs:
            any: {matchPattern: "*"}
          toPorts:
            git:
              ports:
                p22: {port: "22", protocol: TCP}
                p443: {port: "443", protocol: TCP}

    image-reflector-controller: # scans the registries
      endpointSelector:
        matchLabels: {app: image-reflector-controller}
      egress:
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}
        notification-controller:
          toEndpoints:
            notification-controller:
              matchLabels: {app: notification-controller}
          toPorts:
            events: {ports: {p9090: {port: "9090", protocol: TCP}}}
        gateway: # the public addresses of the registries hosted in the cluster are the gateway
          toEntities: {ingress: ingress}
          toPorts:
            https: {ports: {p443: {port: "443", protocol: TCP}}}
        registries: # any name, the registries are set by the clusters
          toFQDNs:
            any: {matchPattern: "*"}
          toPorts:
            https: {ports: {p443: {port: "443", protocol: TCP}}}

  fluxHelmReleases:
    # Webhook receiver exposed by the Cilium Gateway `shared` (kube-system). Disabled by default: it needs the Gateway API CRDs
    # and cert-manager, which a cluster only gets with the apps of the server groups. A cluster enables it with
    # `apps.flux.values.resources.fluxHelmReleases.flux-integration.enabled: true`.
    # It is a separate release so it can wait for them: the apps flux belongs to are installed before.
    flux-integration:
      enabled: false
      install:
        disableWait: true
      upgrade:
        disableWait: true
      dependsOn:
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        gateway-api:
          name: app-gateway-api
          namespace: gateway-api
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          certManagerCertificates:
            flux-webhook-gateway:
              secretName: tls-flux-webhook-gateway
              dnsNames:
                webhook: flux-webhook.{{ .Values.app.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

          listenerSets:
            flux-webhook:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: shared
                namespace: kube-system
              listeners:
                https:
                  name: https
                  hostname: flux-webhook.{{ .Values.app.domain }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-flux-webhook-gateway
                  allowedRoutes:
                    namespaces:
                      from: Same

          httpRoutes:
            flux-webhook:
              parentRefs:
                flux-webhook:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: flux-webhook
              hostnames:
                webhook: flux-webhook.{{ .Values.app.domain }}
              rules:
                root:
                  backendRefs:
                    webhook-receiver:
                      name: webhook-receiver
                      port: 80

  fluxKustomizations:
    flux:
      path: ./ # TODO default
      sourceRef:
        kind: OCIRepository
        name: flux-manifests
      patches:
        resources:
          target:
            kind: Deployment
            name: source-controller
            namespace: flux-system
          patch: |-
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: anything
            spec:
              template:
                spec:
                  containers:
                    - name: manager
                      resources:
                        limits:
                          memory: 3Gi

        # truecharts repo is huge
        helmIndexSize:
          target:
            kind: Deployment
            name: source-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --helm-index-max-size=102428800

        kustomizeControllerConcurrent:
          target:
            kind: Deployment
            name: kustomize-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --concurrent=10

        # a HR waiting for its health check holds a worker, so keep enough free for the downstream HR
        helmControllerConcurrent:
          target:
            kind: Deployment
            name: helm-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --concurrent=20

        # a resource without serviceAccountName would be reconciled as the controller itself (cluster-admin): it runs as the
        # unprivileged `default` service account of its namespace instead, so an app cannot escape its service account by omitting it
        helmControllerDefaultServiceAccount:
          target:
            kind: Deployment
            name: helm-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --default-service-account=default

        kustomizeControllerDefaultServiceAccount:
          target:
            kind: Deployment
            name: kustomize-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --default-service-account=default

        # the NetworkPolicies of the manifests allow everything (`allow-egress`) or whole namespaces (`allow-scraping`, `allow-webhooks`):
        # the rules of each controller are the CiliumNetworkPolicies above
        noAllowEgress:
          target:
            kind: NetworkPolicy
            name: allow-egress
            namespace: flux-system
          patch: |
            $patch: delete
            apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-egress
        noAllowScraping:
          target:
            kind: NetworkPolicy
            name: allow-scraping
            namespace: flux-system
          patch: |
            $patch: delete
            apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-scraping
        noAllowWebhooks:
          target:
            kind: NetworkPolicy
            name: allow-webhooks
            namespace: flux-system
          patch: |
            $patch: delete
            apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: allow-webhooks

        # cancel the running health check when a new revision is available
        helmControllerCancelHealthCheck:
          target:
            kind: Deployment
            name: helm-controller
            namespace: flux-system
          patch: |
            - op: add
              path: /spec/template/spec/containers/0/args/-
              value: --feature-gates=CancelHealthCheckOnNewRevision=true

