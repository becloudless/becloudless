      roles:
        garage-nodes:
          rules:
            garagenodes:
              apiGroups:
              - deuxfleurs.fr
              resources:
              - garagenodes
              verbs:
              - get
              - list
              - watch
              - create
              - update
              - patch
              - delete
      serviceAccounts:
        garage:
          automountServiceAccountToken: true
      services:
        garage:
          ports:
            s3:
              port: 3900
        garage-headless:
          clusterIP: None
          ports:
            admin:
              port: 3903
            rpc:
              port: 3901
            s3:
              port: 3900
          selector:
            app.kubernetes.io/component: garage
      statefulSets:
        garage:
          replicas: 2
          serviceName: garage-headless
          template:
            spec:
              containers:
                garage:
                  env:
                    GARAGE_ADMIN_TOKEN:
                      secretKeyRef:
                        key: admin-token
                        name: ref:garage
                    GARAGE_RPC_SECRET:
                      secretKeyRef:
                        key: rpc-secret
                        name: ref:garage
                  image: docker.io/dxflrs/garage:v2.5.0
                  name: garage
                  ports:
                    admin:
                      containerPort: 3903
                    rpc:
                      containerPort: 3901
                    s3:
                      containerPort: 3900
                  probe:
                    tcpSocket:
                      port: admin
                  securityContext:
                    capabilities:
                      drop:
                        all: ALL
                    runAsGroup: 1000
                    runAsUser: 1000
                  volumeMounts:
                    config:
                      mountPath: /etc/garage.toml
                      name: config
                      readOnly: true
                      subPath: garage.toml
                    data:
                      mountPath: /var/lib/garage/data
                      name: garage-data
                    meta:
                      mountPath: /var/lib/garage/meta
                      name: garage-meta
              securityContext:
                fsGroup: 1000
                fsGroupChangePolicy: OnRootMismatch
                runAsGroup: 1000
                runAsUser: 1000
              serviceAccountName: ref:garage
              topologySpreadConstraints:
                host:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/component: garage
                      app.kubernetes.io/instance: garage
                  maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: ScheduleAnyway
              volumes:
                config:
                  configMap:
                    name: ref:garage-config
                  name: config
          volumeClaimTemplates:
            garage-data:
              metadata:
                name: garage-data
              spec:
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 10Gi
                storageClassName: longhorn-files
            garage-meta:
              metadata:
                name: garage-meta
              spec:
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
                storageClassName: longhorn-db
