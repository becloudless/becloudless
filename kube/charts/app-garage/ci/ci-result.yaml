    namespace: longhorn-system
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      garage:
        clusterRoleBindings:
          garage-crds:
            name: garage-crds
            namespace: default
        clusterRoles:
          garage-crds:
            name: garage-crds
            namespace: default
        configMaps:
          garage-config:
            name: garage-config
            namespace: default
        roleBindings:
          garage-nodes:
            name: garage-nodes
            namespace: default
        roles:
          garage-nodes:
            name: garage-nodes
            namespace: default
        serviceAccounts:
          garage:
            name: garage
            namespace: default
        services:
          garage:
            name: garage
            namespace: default
          garage-headless:
            name: garage-headless
            namespace: default
        statefulSets:
          garage:
            labels:
              app.kubernetes.io/component: garage
              app.kubernetes.io/instance: garage
            name: garage
            namespace: default
      garage-integration:
        certManagerCertificates:
          garage-gateway:
            name: garage-gateway
            namespace: default
            secretName: tls-garage-gateway
        httpRoutes:
          garage:
            name: garage
            namespace: default
        listenerSets:
          garage:
            name: garage
            namespace: default
      garage-post:
        jobs:
          garage-layout:
            labels:
              app.kubernetes.io/component: garage-layout
              app.kubernetes.io/instance: garage-post
            name: ""
            namespace: default
      garage-pre:
        roleBindings:
          longhorn-secrets-reader:
            name: longhorn-secrets-reader
            namespace: default
        roles:
          longhorn-secrets-reader:
            name: longhorn-secrets-reader
            namespace: default
        stringSecrets:
          garage:
            name: garage
            namespace: default
          garage-longhorn:
            name: garage-longhorn
            namespace: default
      longhorn-backup:
        externalSecrets:
          garage-backup:
            name: garage-backup
            namespace: longhorn-system
        longhornBackupTargets:
          default:
            name: default
            namespace: longhorn-system
        secretStores:
          garage:
            name: garage
            namespace: longhorn-system
        serviceAccounts:
          garage-reader:
            name: garage-reader
            namespace: longhorn-system
    resources:
      clusterRoleBindings:
        garage-crds:
          roleRef: ref:garage-crds
          subjects:
            garage:
              kind: ServiceAccount
              name: garage
              namespace: garage
      clusterRoles:
        garage-crds:
          rules:
            crds:
              apiGroups:
              - apiextensions.k8s.io
              resources:
              - customresourcedefinitions
              verbs:
              - get
              - list
              - watch
              - create
              - patch
      configMaps:
        garage-config:
          data:
            garage.toml: |-
              replication_factor = 2
              consistency_mode = "consistent"

              metadata_dir = "/var/lib/garage/meta"
              data_dir = "/var/lib/garage/data"
              # LMDB can be corrupted by an unclean shutdown: the snapshots are in the metadata volume, and the metadata
              # can also be rebuilt from the other nodes
              db_engine = "lmdb"
              metadata_auto_snapshot_interval = "6h"

              rpc_bind_addr = "0.0.0.0:3901"

              [kubernetes_discovery]
              namespace = "garage"
              service_name = "garage"

              [s3_api]
              api_bind_addr = "0.0.0.0:3900"
              s3_region = "garage"

              [admin]
              api_bind_addr = "0.0.0.0:3903"
      roleBindings:
        garage-nodes:
          roleRef: ref:garage-nodes
          subjects:
            garage:
              kind: ServiceAccount
              name: garage
