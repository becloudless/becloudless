        namespace: apps
  dependsOn:
  - name: garage
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      garage:
        clusterRoleBindings:
          garage-crds:
            name: garage-crds
            namespace: default
        clusterRoles:
          garage-crds:
            name: garage-crds
            namespace: default
        configMaps:
          garage-config:
            name: garage-config
            namespace: default
        roleBindings:
          garage-nodes:
            name: garage-nodes
            namespace: default
        roles:
          garage-nodes:
            name: garage-nodes
            namespace: default
        serviceAccounts:
          garage:
            name: garage
            namespace: default
        services:
          garage:
            name: garage
            namespace: default
          garage-headless:
            name: garage-headless
            namespace: default
        statefulSets:
          garage:
            labels:
              app.kubernetes.io/component: garage
              app.kubernetes.io/instance: garage
            name: garage
            namespace: default
      garage-integration:
        certManagerCertificates:
          garage-gateway:
            name: garage-gateway
            namespace: default
            secretName: tls-garage-gateway
        httpRoutes:
          garage:
            name: garage
            namespace: default
        listenerSets:
          garage:
            name: garage
            namespace: default
      garage-post:
        jobs:
          garage-layout:
            labels:
              app.kubernetes.io/component: garage-layout
              app.kubernetes.io/instance: garage-post
            name: ""
            namespace: default
      garage-pre:
        roleBindings:
          longhorn-secrets-reader:
            name: longhorn-secrets-reader
            namespace: default
        roles:
          longhorn-secrets-reader:
            name: longhorn-secrets-reader
            namespace: default
        stringSecrets:
          garage:
            name: garage
            namespace: default
          garage-longhorn:
            name: garage-longhorn
            namespace: default
      longhorn-backup:
        externalSecrets:
          garage-backup:
            name: garage-backup
            namespace: longhorn-system
        longhornBackupTargets:
          default:
            name: default
            namespace: longhorn-system
        secretStores:
          garage:
            name: garage
            namespace: longhorn-system
        serviceAccounts:
          garage-reader:
            name: garage-reader
            namespace: longhorn-system
    resources:
      jobs:
        garage-layout:
          activeDeadlineSeconds: 900
          backoffLimit: 0
          fullNameOverride: garage-layout-91e427ff8c
          template:
            spec:
              containers:
                layout:
                  args:
                  - |-
                    replicas=$(sed -n 's/^replication_factor = //p' /etc/garage/garage.toml)
                    api=http://garage-0.garage-headless:3903/v2
                    get() { wget -qO- --header "Authorization: Bearer $ADMIN_TOKEN" "$api/$1"; }
                    post() { wget -qO- --header "Authorization: Bearer $ADMIN_TOKEN" --header 'Content-Type: application/json' --post-data "$2" "$api/$1"; }
                    retry() { n=0; until "$@" > /dev/null; do n=$((n + 1)); [ "$n" -lt 30 ] || exit 1; sleep 2; done; }
                    until status=$(get GetClusterStatus) && [ "$(echo "$status" | grep -o '"isUp": *true' | wc -l)" -ge "$replicas" ]; do
                      echo 'waiting for the nodes'; sleep 5
                    done
                    have=$(get GetClusterLayout | grep -o '"id": *"[0-9a-f]*"' | cut -d'"' -f4 | tr '\n' ' ')
                    zone=$(echo $have | wc -w)
                    roles=
                    for id in $(echo "$status" | grep -o '"id": *"[0-9a-f]*"' | cut -d'"' -f4); do
                      case " $have " in *" $id "*) continue;; esac
                      zone=$((zone + 1))
                      roles="$roles${roles:+,}{\"id\":\"$id\",\"zone\":\"z$zone\",\"capacity\":$CAPACITY,\"tags\":[]}"
                    done
                    if [ -n "$roles" ]; then
                      post UpdateClusterLayout "{\"roles\":[$roles]}"
                      version=$(echo "$status" | grep -o '"layoutVersion": *[0-9]*' | cut -d: -f2)
                      post ApplyClusterLayout "{\"version\":$((version + 1))}"
                      echo 'the layout is applied'
                    fi
                    # bucket, access key id, secret access key, name of the key
                    bucket_and_key() {
                      get "GetBucketInfo?globalAlias=$1" > /dev/null 2>&1 || retry post CreateBucket "{\"globalAlias\":\"$1\"}"
                      bucket_id=$(get "GetBucketInfo?globalAlias=$1" | grep -o '"id": *"[0-9a-f]*"' | head -n 1 | cut -d'"' -f4)
                      get "GetKeyInfo?id=$2" > /dev/null 2>&1 || retry post ImportKey "{\"accessKeyId\":\"$2\",\"secretAccessKey\":\"$3\",\"name\":\"$4\"}"
                      post AllowBucketKey "{\"bucketId\":\"$bucket_id\",\"accessKeyId\":\"$2\",\"permissions\":{\"read\":true,\"write\":true,\"owner\":false}}" > /dev/null
                      echo "the bucket $1 and the key $4 are ready"
                    }
                    bucket_and_key longhorn-backups "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" longhorn
                  command:
                  - sh
                  - -ec
                  env:
                    ADMIN_TOKEN:
                      secretKeyRef:
                        key: admin-token
                        name: ref:garage
                    AWS_ACCESS_KEY_ID:
                      secretKeyRef:
                        key: AWS_ACCESS_KEY_ID
                        name: ref:garage-longhorn
                    AWS_SECRET_ACCESS_KEY:
                      secretKeyRef:
                        key: AWS_SECRET_ACCESS_KEY
                        name: ref:garage-longhorn
                    CAPACITY: "10737418240"
                  image: docker.io/library/alpine:3.24.3
                  name: layout
                  securityContext:
                    capabilities:
                      drop:
                        all: ALL
                    runAsGroup: 65534
                    runAsUser: 65534
                  volumeMounts:
                    config:
                      mountPath: /etc/garage
                      name: config
                      readOnly: true
              restartPolicy: Never
              securityContext:
                runAsGroup: 65534
                runAsUser: 65534
              volumes:
                config:
                  configMap:
                    name: ref:garage-config
                  name: config
