# yaml-language-server: $schema=./schema/values.schema.json

# resources are named by their id, without the release name prefix
prefixNamesWithRelease: false

resources:
  fluxGitRepositories:
    bcl:
      url: https://github.com/becloudless/becloudless.git
      ref:
        branch: main

config:
  domain:
  # name: # deduced from domain by default
  # ldapdn: # deduced from domain by default (dc=example,dc=com)

appsGroups:
  minimal:
    enabled: true

apps:
  # minimal
  gateway-api:
    groups:
      minimal: true
    appChart:
      name: app-gateway-api

  cilium:
    groups:
      minimal: true
    namespace: kube-system
    appChart:
      name: app-cilium

  flux:
    groups:
      minimal: true
    namespace: flux-system
    appChart:
      name: app-flux

  kube:
    groups:
      minimal: true
    namespace: kube-system
    appChart:
      name: app-kube

  coredns:
    groups:
      minimal: true
    namespace: kube-system
    appChart:
      name: app-coredns

  # server
  cert-manager:
    groups:
      cluster: true
    appChart:
      name: app-cert-manager

  longhorn:
    groups:
      cluster: true
    clusterAdmin: true
    namespace: longhorn-system
    appChart:
      name: app-longhorn

  kyverno:
    groups:
      cluster: true
    appChart:
      name: app-kyverno

  cnpg:
    groups:
      cluster: true
    namespace: cnpg-system
    appChart:
      name: app-cnpg

  secret-generator:
    groups:
      cluster: true
    appChart:
      name: app-secret-generator

  descheduler:
    groups:
      cluster: true
    namespace: kube-system
    appChart:
      name: app-descheduler

  external-snapshotter:
    groups:
      cluster: true
    appChart:
      name: app-external-snapshotter
  
  lldap:
    groups:
      cluster: true
    appChart:
      name: app-lldap
  
  authelia:
    groups:
      cluster: true
    appChart:
      name: app-authelia
  
  landing:
    groups:
      cluster: true
    appChart:
      name: app-landing

  homer:
    groups:
      cluster: true
    appChart:
      name: app-homer
  
  prometheus:
    groups:
      cluster: true
    appChart:
      name: app-prometheus
  
  # extra
  forgejo:
    groups:
      extra: true
    appChart:
      name: app-forgejo

  jellyfin:
    groups:
      extra: true
    appChart:
      name: app-jellyfin

  immich:
    groups:
      extra: true
    appChart:
      name: app-immich