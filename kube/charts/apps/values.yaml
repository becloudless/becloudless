# yaml-language-server: $schema=./schema/values.schema.json

resources:
  fluxGitRepositories:
    bcl:
      url: https://github.com/becloudless/becloudless.git
      ref:
        branch: main

config:
  domain:
  # name: # deduced from domain by default
  # ldapdn: # deduced from domain by default (dc=example,dc=com)

appsGroups:
  minimal:
    enabled: true

# The `flux-<app>` service account of an app is cluster-admin on the namespace of the app only. Apps installing cluster-scoped resources
# (CRDs, ClusterRoles, webhooks, ClusterIssuers, StorageClasses...) set `clusterAdmin: true`.
apps:

  # self
  apps:
    clusterAdmin: true

  # minimal
  gateway-api:
    groups:
      minimal: true
    clusterAdmin: true # CRDs
    appChart:
      name: app-gateway-api

  cilium:
    groups:
      minimal: true
    clusterAdmin: true
    namespace: kube-system
    appChart:
      name: app-cilium

  flux:
    groups:
      minimal: true
    clusterAdmin: true
    namespace: flux-system
    appChart:
      name: app-flux

  kube:
    groups:
      minimal: true
    clusterAdmin: true # creates a ClusterRole and a ClusterRoleBinding
    namespace: kube-system
    appChart:
      name: app-kube

  coredns:
    groups:
      minimal: true
    clusterAdmin: true # creates a ClusterRole and a ClusterRoleBinding
    namespace: kube-system
    appChart:
      name: app-coredns

  # server
  cert-manager:
    groups:
      cluster: true
    clusterAdmin: true
    appChart:
      name: app-cert-manager

  longhorn:
    groups:
      cluster: true
    clusterAdmin: true
    namespace: longhorn-system
    appChart:
      name: app-longhorn

  kyverno:
    groups:
      cluster: true
    clusterAdmin: true
    appChart:
      name: app-kyverno

  cnpg:
    groups:
      cluster: true
    clusterAdmin: true
    namespace: cnpg-system
    appChart:
      name: app-cnpg

  secret-generator:
    groups:
      cluster: true
    clusterAdmin: true
    appChart:
      name: app-secret-generator

  external-secrets:
    groups:
      cluster: true
    clusterAdmin: true # CRDs and cluster roles
    appChart:
      name: app-external-secrets

  descheduler:
    groups:
      cluster: true
    clusterAdmin: true
    namespace: kube-system
    appChart:
      name: app-descheduler

  external-snapshotter:
    groups:
      cluster: true
    clusterAdmin: true # CRDs
    appChart:
      name: app-external-snapshotter
  
  lldap:
    groups:
      cluster: true
    appChart:
      name: app-lldap
  
  authelia:
    groups:
      cluster: true
    appChart:
      name: app-authelia
  
  landing:
    groups:
      cluster: true
    appChart:
      name: app-landing

  homer:
    groups:
      cluster: true
    appChart:
      name: app-homer

  # extra
  prometheus:
    groups:
      extra: true
    clusterAdmin: true # CRDs
    appChart:
      name: app-prometheus

  forgejo:
    groups:
      extra: true
    appChart:
      name: app-forgejo

  jellyfin:
    groups:
      extra: true
    appChart:
      name: app-jellyfin

  seerr:
    groups:
      extra: true
    appChart:
      name: app-seerr

  mailu:
    groups:
      extra: true
    appChart:
      name: app-mailu

  immich:
    groups:
      extra: true
    appChart:
      name: app-immich
