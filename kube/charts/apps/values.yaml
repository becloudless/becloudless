# yaml-language-server: $schema=./schema/values.schema.json

resources:
  fluxGitRepositories:
    bcl:
      url: https://github.com/becloudless/becloudless.git
      ref:
        branch: main

defaults:
  resources:
    fluxHelmReleases:
      install:
        timeout: 20m # install all resources for an app takes time. A new DB with 2 nodes can take 10min alone

config:
  domain:
  # name: # deduced from domain by default
  # ldapdn: # deduced from domain by default (dc=example,dc=com)
  # lldapUsers: # TODO probably not a good idea to be in global config. the users of the cluster, created in lldap and given an instance by some apps (syncthing), keyed by user id
  #   n0rad: {displayName: n0rad, email: n0rad@example.com, groups: [role_admin, role_user]}
  # scaling: # the scale of the apps (see `app.scaling` of the `app` chart): replicas of the stateless parts (1 by default), instances of the databases (2 by default)
  #   replicas: 2
  #   dbReplicas: 3

appsGroups:
  minimal:
    enabled: true

# The `flux-<app>` service account of an app is cluster-admin on the namespace of the app only. Apps installing cluster-scoped resources
# (CRDs, ClusterRoles, webhooks, ClusterIssuers, StorageClasses...) set `clusterAdmin: true`.
apps:

  # self
  apps:
    clusterAdmin: true

  # minimal
  gateway-api:
    groups:
      minimal: true
    clusterAdmin: true # CRDs
    appChart:
      name: app-gateway-api

  cilium:
    groups:
      minimal: true
    clusterAdmin: true
    namespace: kube-system
    appChart:
      name: app-cilium

  flux:
    groups:
      minimal: true
    clusterAdmin: true
    namespace: flux-system
    appChart:
      name: app-flux

  kube:
    groups:
      minimal: true
    clusterAdmin: true # creates a ClusterRole and a ClusterRoleBinding
    namespace: kube-system
    appChart:
      name: app-kube

  coredns:
    groups:
      minimal: true
    clusterAdmin: true # creates a ClusterRole and a ClusterRoleBinding
    namespace: kube-system
    appChart:
      name: app-coredns

  # server
  cert-manager:
    groups:
      cluster: true
    clusterAdmin: true
    appChart:
      name: app-cert-manager

  longhorn:
    groups:
      cluster: true
    clusterAdmin: true
    namespace: longhorn-system
    appChart:
      name: app-longhorn

  kyverno:
    groups:
      cluster: true
    clusterAdmin: true
    appChart:
      name: app-kyverno

  cnpg:
    groups:
      cluster: true
    clusterAdmin: true
    namespace: cnpg-system
    appChart:
      name: app-cnpg

  secret-generator:
    groups:
      cluster: true
    clusterAdmin: true
    appChart:
      name: app-secret-generator

  external-secrets:
    groups:
      cluster: true
    clusterAdmin: true # CRDs and cluster roles
    appChart:
      name: app-external-secrets

  descheduler:
    groups:
      cluster: true
    clusterAdmin: true
    namespace: kube-system
    appChart:
      name: app-descheduler

  metrics-server:
    groups:
      cluster: true
    clusterAdmin: true # creates ClusterRoles and an APIService
    namespace: kube-system
    appChart:
      name: app-metrics-server

  external-snapshotter:
    groups:
      cluster: true
    clusterAdmin: true # CRDs
    appChart:
      name: app-external-snapshotter
  
  lldap:
    groups:
      cluster: true
    appChart:
      name: app-lldap
  
  authelia:
    groups:
      cluster: true
    appChart:
      name: app-authelia
  
  landing:
    groups:
      cluster: true
    appChart:
      name: app-landing

  homer:
    groups:
      cluster: true
    appChart:
      name: app-homer

  whoami:
    groups:
      cluster: true
    appChart:
      name: app-whoami

  # extra
  prometheus:
    groups:
      extra: true
    clusterAdmin: true # CRDs
    appChart:
      name: app-prometheus

  forgejo:
    groups:
      extra: true
    appChart:
      name: app-forgejo

  jellyfin:
    groups:
      extra: true
    appChart:
      name: app-jellyfin

  seerr:
    groups:
      extra: true
    appChart:
      name: app-seerr

  seafile:
    groups:
      extra: true
    appChart:
      name: app-seafile

  paperless:
    groups:
      extra: true
    appChart:
      name: app-paperless

  tuwunel:
    groups:
      extra: true
    appChart:
      name: app-tuwunel

  element:
    groups:
      extra: true
    appChart:
      name: app-element

  syncthing:
    groups:
      extra: true
    appChart:
      name: app-syncthing

  firefox-sync:
    groups:
      extra: true
    appChart:
      name: app-firefox-sync

  mailu:
    groups:
      extra: true
    appChart:
      name: app-mailu

  immich:
    groups:
      extra: true
    appChart:
      name: app-immich

  garage:
    groups:
      extra: true
    clusterAdmin: true # the CRD and the ClusterRole of the discovery of the nodes
    appChart:
      name: app-garage
