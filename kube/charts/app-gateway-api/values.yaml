# yaml-language-server: $schema=../base/schema/values.schema.json

# Gateway API CRDs, required by the Cilium Gateway API controller.
# Cilium detects the CRDs when the operator starts: restart the cilium-operator once after the CRDs are first installed.
resources:
  fluxGitRepositories:
    gateway-api:
      url: https://github.com/kubernetes-sigs/gateway-api
      interval: 24h
      ref:
        tag: v1.6.1 # TODO renovate, keep in sync with the CRDs urls of the base chart

  fluxKustomizations:
    # the experimental channel is required for the HTTPRoute ExternalAuth filter (forward auth)
    gateway-api-crds:
      interval: 24h
      timeout: 1m
      path: ./config/crd/experimental
      prune: false
      wait: true
      sourceRef:
        kind: GitRepository
        name: gateway-api
