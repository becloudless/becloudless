      stalwart:
        configMaps:
          stalwart-config:
            name: stalwart-config
            namespace: default
        deployments:
          stalwart:
            labels:
              app.kubernetes.io/component: stalwart
              app.kubernetes.io/instance: stalwart
            name: stalwart
            namespace: default
        listenerSets:
          stalwart-mail:
            name: stalwart-mail
            namespace: default
        persistentVolumeClaims:
          stalwart-data:
            name: stalwart-data
            namespace: default
        services:
          stalwart:
            name: stalwart
            namespace: default
        tcpRoutes:
          stalwart-imaps:
            name: stalwart-imaps
            namespace: default
          stalwart-smtp:
            name: stalwart-smtp
            namespace: default
          stalwart-submissions:
            name: stalwart-submissions
            namespace: default
      stalwart-integration:
        certManagerCertificates:
          stalwart-gateway:
            name: stalwart-gateway
            namespace: default
            secretName: tls-stalwart-gateway
        httpRoutes:
          stalwart:
            name: stalwart
            namespace: default
        listenerSets:
          stalwart:
            name: stalwart
            namespace: default
      stalwart-pre:
        stringSecrets:
          stalwart-admin:
            name: stalwart-admin
            namespace: default
    resources:
      certManagerCertificates:
        stalwart-gateway:
          dnsNames:
            stalwart: mail.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-stalwart-gateway
      httpRoutes:
        stalwart:
          hostnames:
            stalwart: mail.test.com
          parentRefs:
            stalwart:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: stalwart
              sectionName: stalwart
          rules:
            root:
              backendRefs:
                backend:
                  name: ref:stalwart
                  port: 8080
      listenerSets:
        stalwart:
          listeners:
            stalwart:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: mail.test.com
              name: stalwart
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: ref:stalwart-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: cilium
