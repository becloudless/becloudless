# Source: app-stalwart/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stalwart
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: bcl
  dependsOn:
  - name: stalwart-pre
  - name: app-longhorn
    namespace: longhorn-system
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      stalwart:
        configMaps:
          stalwart-config:
            name: stalwart-config
            namespace: default
        deployments:
          stalwart:
            labels:
              app.kubernetes.io/component: stalwart
              app.kubernetes.io/instance: stalwart
            name: stalwart
            namespace: default
        persistentVolumeClaims:
          stalwart-data:
            name: stalwart-data
            namespace: default
        services:
          stalwart:
            name: stalwart
            namespace: default
      stalwart-integration:
        certManagerCertificates:
          stalwart-gateway:
            name: stalwart-gateway
            namespace: default
            secretName: tls-stalwart-gateway
        httpRoutes:
          stalwart:
            name: stalwart
            namespace: default
        listenerSets:
          stalwart:
            name: stalwart
            namespace: default
      stalwart-pre:
        stringSecrets:
          stalwart-admin:
            name: stalwart-admin
            namespace: default
      stalwart-setup:
        ciliumNetworkPolicies:
          stalwart-setup:
            name: stalwart-setup
            namespace: default
        configMaps:
          stalwart-setup:
            name: stalwart-setup
            namespace: default
        cronJobs:
          stalwart-setup:
            labels:
              app.kubernetes.io/component: stalwart-setup
              app.kubernetes.io/instance: stalwart-setup
            name: stalwart-setup
            namespace: default
        roleBindings:
          stalwart-setup:
            name: stalwart-setup
            namespace: default
        roles:
          stalwart-setup:
            name: stalwart-setup
            namespace: default
        serviceAccounts:
          stalwart-setup:
            name: stalwart-setup
            namespace: default
    resources:
      configMaps:
        stalwart-config:
          data:
            config.json: |-
              {
                "@type": "RocksDb",
                "path": "/var/lib/stalwart/data/"
              }
      deployments:
        stalwart:
          replicas: 1
          strategy:
            type: Recreate
          template:
            spec:
              containers:
                stalwart:
                  env:
                    ADMIN_PASSWORD:
                      secretKeyRef:
                        key: password
                        name: ref:stalwart-admin
                    STALWART_PUBLIC_URL: https://mail.test.com
                    STALWART_RECOVERY_ADMIN: admin:$(ADMIN_PASSWORD)
                  image: docker.io/stalwartlabs/stalwart:v1.1.1
                  name: stalwart
                  ports:
                    http:
                      containerPort: 8080
                    imaps:
                      containerPort: 993
                    smtp:
                      containerPort: 25
                    submissions:
                      containerPort: 465
                  probe:
                    httpGet:
                      path: /healthz/live
                  securityContext:
                    capabilities:
                      add:
                        bind: NET_BIND_SERVICE
                      drop:
                        all: ALL
                    runAsGroup: 2000
                    runAsUser: 2000
                  startupProbe:
                    failureThreshold: 60
                  volumeMounts:
                    assets:
                      mountPath: /assets
                      name: assets
                      readOnly: true
                    config:
                      mountPath: /etc/stalwart/config.json
                      name: config
                      readOnly: true
                      subPath: config.json
                    data:
                      mountPath: /var/lib/stalwart
                      name: data
                    tmp:
                      mountPath: /tmp
                      name: tmp
              initContainers:
                assets:
                  command:
                  - cp
                  - -r
                  - /assets/.
                  - /target
                  image: ghcr.io/becloudless/stalwart-assets:latest
                  name: assets
                  securityContext:
                    capabilities:
                      drop:
                        all: ALL
                    runAsGroup: 2000
                    runAsUser: 2000
                  volumeMounts:
                    assets:
                      mountPath: /target
                      name: assets
              securityContext:
                fsGroup: 2000
              volumes:
                assets:
                  emptyDir: {}
                  name: assets
                config:
                  configMap:
                    name: ref:stalwart-config
                  name: config
                data:
                  name: data
                  persistentVolumeClaim:
                    claimName: ref:stalwart-data
                tmp:
                  emptyDir: {}
                  name: tmp
      listenerSets: {}
      persistentVolumeClaims:
        stalwart-data:
          resources:
            requests:
              storage: 20Gi
          storageClassName: longhorn-db
      services:
        stalwart:
          ports:
            http:
              port: 8080
            imaps:
              port: 993
            smtp:
              port: 25
            submissions:
              port: 465
      tcpRoutes: {}
