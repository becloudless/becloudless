# Source: app-stalwart/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stalwart
  namespace: default
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/component: edge
        k8s:app.kubernetes.io/instance: edge
        k8s:io.kubernetes.pod.namespace: edge
    toPorts:
    - ports:
      - port: "2525"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: stalwart
      app.kubernetes.io/instance: stalwart
  ingress:
  - fromEndpoints:
    - matchLabels:
        k8s:app.kubernetes.io/component: edge
        k8s:app.kubernetes.io/instance: edge
        k8s:io.kubernetes.pod.namespace: edge
    toPorts:
    - ports:
      - port: "25"
        protocol: TCP
      - port: "465"
        protocol: TCP
      - port: "993"
        protocol: TCP
  - fromEntities:
    - ingress
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/component: stalwart-setup
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
