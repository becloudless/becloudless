---
# Source: postgresql/templates/loader.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-release-app
  namespace: default
spec:
  commonName: app
  issuerRef:
    kind: Issuer
    name: test-release
  secretName: test-release-app-tls
  secretTemplate:
    labels:
      cnpg.io/reload: ""
  usages:
  - client auth
---
# Source: postgresql/templates/loader.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-release-ca
  namespace: default
spec:
  commonName: test-release-ca
  isCA: true
  issuerRef:
    kind: ClusterIssuer
    name: my-issuer
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Never
    size: 256
  secretName: test-release-ca
---
# Source: postgresql/templates/loader.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-release
  namespace: default
spec:
  dnsNames:
  - test-release-rw
  - test-release-rw.default
  - test-release-rw.default.svc
  - test-release-rw.default.svc.cluster.local
  - test-release-r
  - test-release-r.default
  - test-release-r.default.svc
  - test-release-r.default.svc.cluster.local
  - test-release-ro
  - test-release-ro.default
  - test-release-ro.default.svc
  - test-release-ro.default.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: test-release
  secretName: test-release-tls
  secretTemplate:
    labels:
      cnpg.io/reload: ""
---
# Source: postgresql/templates/loader.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-release-replication
  namespace: default
spec:
  commonName: streaming_replica
  issuerRef:
    kind: Issuer
    name: test-release
  secretName: test-release-replication-tls
  secretTemplate:
    labels:
      cnpg.io/reload: ""
  usages:
  - client auth
---
# Source: postgresql/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: test-release
  namespace: default
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        cnpg.io/cluster: test-release
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
      - port: "8000"
        protocol: TCP
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: test-release
  ingress:
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/name: app
    - matchLabels:
        app.kubernetes.io/name: other
        k8s:io.kubernetes.pod.namespace: other
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        cnpg.io/cluster: test-release
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
      - port: "8000"
        protocol: TCP
---
# Source: postgresql/templates/loader.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: test-release
  namespace: default
spec:
  backup:
    volumeSnapshot:
      className: my-snapshot-class
      snapshotOwnerReference: backup
  certificates:
    clientCASecret: test-release-ca
    replicationTLSSecret: test-release-replication-tls
    serverCASecret: test-release-tls
    serverTLSSecret: test-release-tls
  instances: 1
  postgresql:
    parameters:
      max_slot_wal_keep_size: 500MB
    pg_hba:
    - hostssl app all all cert
  storage:
    size: 5Gi
    storageClass: longhorn-db
---
# Source: postgresql/templates/loader.yaml
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: test-release
  namespace: default
spec:
  ca:
    secretName: test-release-ca
---
# Source: postgresql/templates/loader.yaml
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: test-release
  namespace: default
spec:
  backupOwnerReference: self
  cluster:
    name: test-release
  immediate: true
  method: volumeSnapshot
  schedule: 0 0 2 * * *
