# The cluster is named after the release and lives in the release namespace (or `defaults.metadata.namespace`).

prefixNamesWithRelease: true

instances: 2
storageSize: 1Gi

storageClass: longhorn-db

# ClusterIssuer signing the CA of the cluster
issuer: self-signed

# require client certificates for the `app` user
clientCertAuth: false

# `spec.postgresql` of the cluster, ex: parameters
postgresql: {}

# The pods allowed to connect to the database (the default deny of Cilium blocks everyone else), one `matchLabels` selector
# each. They are in the namespace of the cluster, or in another one with the `k8s:io.kubernetes.pod.namespace` label.
# ex: `clients: {seerr: {matchLabels: {app.kubernetes.io/instance: seerr, app.kubernetes.io/component: seerr}}}`
clients: {}

backup:
  enabled: true
  schedule: "0 0 4 * * *" # cron with seconds
  snapshotClass: longhorn-backup-incremental
