# Source: app-csi-rclone/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-rclone
  namespace: default
spec:
  chart:
    spec:
      chart: csi-driver-rclone
      sourceRef:
        kind: HelmRepository
        name: csi-rclone
      version: 0.5.0
  dependsOn:
  - name: csi-rclone-pre
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    feature:
      enableFSGroupPolicy: true
    node:
      extraVolumeMounts:
      - mountPath: /etc/rclone/ssh
        name: known-hosts
        readOnly: true
      extraVolumes:
      - configMap:
          name: rclone-known-hosts
        name: known-hosts
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
---
# Source: app-csi-rclone/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-rclone-pre
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-kyverno
    namespace: kyverno
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      csi-rclone-pre:
        configMaps:
          rclone-known-hosts:
            name: rclone-known-hosts
            namespace: default
        kyvernoClusterPolicies:
          csi-rclone-restrict-host-access:
            name: csi-rclone-restrict-host-access
            namespace: default
        storageClasses:
          rclone-sftp:
            name: rclone-sftp
            namespace: default
    resources:
      configMaps:
        rclone-known-hosts:
          data:
            known_hosts: |-
              nas.test.com ssh-ed25519 AAAAtest
              nas.test.com ssh-rsa AAAAtest2
      kyvernoClusterPolicies:
        csi-rclone-restrict-host-access:
          annotations:
            policies.kyverno.io/category: Other
            policies.kyverno.io/description: The pods of the driver use the host network,
              host paths, and a privileged container (FUSE mounts shared with the
              kubelet), and the chart has no value to annotate them.
            policies.kyverno.io/subject: Pod
            policies.kyverno.io/title: Annotate the pods of the driver using the host
          failurePolicy: Ignore
          rules:
          - match:
              any:
              - resources:
                  kinds:
                  - Pod
                  namespaces:
                  - csi-rclone
                  operations:
                  - CREATE
            mutate:
              patchStrategicMerge:
                metadata:
                  annotations:
                    +(policy.bcl.tf/skipPodRestrictHostAccess): "true"
            name: pod-annotate-restrict-host-access
      storageClasses:
        rclone-sftp:
          annotations:
            storageclass.kubernetes.io/is-default-class: "false"
          mountOptions:
            dir-cache-time: dir-cache-time=10m
          parameters:
            csi.storage.k8s.io/node-publish-secret-name: ${pvc.name}
            csi.storage.k8s.io/node-publish-secret-namespace: ${pvc.namespace}
            remote: nas
            remotePath: /data
          provisioner: rclone.csi.veloxpack.io
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
---
# Source: app-csi-rclone/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-rclone
  namespace: default
spec:
  interval: 10m
  type: oci
  url: oci://ghcr.io/veloxpack/charts
