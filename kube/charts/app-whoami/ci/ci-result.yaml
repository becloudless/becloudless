---
# Source: app-whoami/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: whoami
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: whoami
      app.kubernetes.io/instance: whoami
  ingress:
  - fromEntities:
    - ingress
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
---
# Source: app-whoami/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whoami
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      whoami:
        deployments:
          whoami:
            labels:
              app.kubernetes.io/component: whoami
              app.kubernetes.io/instance: whoami
            name: whoami
            namespace: default
        services:
          whoami:
            name: whoami
            namespace: default
      whoami-integration:
        certManagerCertificates:
          whoami-gateway:
            name: whoami-gateway
            namespace: default
            secretName: tls-whoami-gateway
        httpRoutes:
          whoami:
            name: whoami
            namespace: default
        listenerSets:
          whoami:
            name: whoami
            namespace: default
    resources:
      deployments:
        whoami:
          replicas: 2
          template:
            spec:
              containers:
                whoami:
                  args:
                  - --port=8080
                  - --verbose
                  image: traefik/whoami:v1.12.0
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8080
                    periodSeconds: 15
                    timeoutSeconds: 3
                  name: whoami
                  ports:
                    http:
                      containerPort: 8080
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 8080
                    periodSeconds: 15
                    timeoutSeconds: 3
                  resources:
                    limits:
                      memory: 64Mi
                    requests:
                      cpu: 10m
                      memory: 16Mi
                  securityContext:
                    capabilities:
                      drop:
                        all: ALL
                    runAsGroup: 1000
                    runAsUser: 1000
                  startupProbe:
                    failureThreshold: 12
                    httpGet:
                      path: /health
                      port: 8080
      services:
        whoami:
          ports:
            http:
              port: 8080
---
# Source: app-whoami/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whoami-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: whoami
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      whoami:
        deployments:
          whoami:
            labels:
              app.kubernetes.io/component: whoami
              app.kubernetes.io/instance: whoami
            name: whoami
            namespace: default
        services:
          whoami:
            name: whoami
            namespace: default
      whoami-integration:
        certManagerCertificates:
          whoami-gateway:
            name: whoami-gateway
            namespace: default
            secretName: tls-whoami-gateway
        httpRoutes:
          whoami:
            name: whoami
            namespace: default
        listenerSets:
          whoami:
            name: whoami
            namespace: default
    resources:
      certManagerCertificates:
        whoami-gateway:
          dnsNames:
            whoami: whoami.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-whoami-gateway
      httpRoutes:
        whoami:
          hostnames:
            whoami: whoami.test.com
          parentRefs:
            whoami: ref:whoami
          rules:
            root:
              backendRefs:
                whoami:
                  name: ref:whoami
                  port: 8080
              filters:
                authelia:
                  externalAuth:
                    backendRef:
                      name: authelia
                      namespace: authelia
                      port: 80
                    http:
                      allowedHeaders:
                        accept: accept
                        cookie: cookie
                        proxy-authorization: proxy-authorization
                        x-forwarded-for: x-forwarded-for
                        x-forwarded-proto: x-forwarded-proto
                      allowedResponseHeaders:
                        remote-email: remote-email
                        remote-groups: remote-groups
                        remote-name: remote-name
                        remote-user: remote-user
                      path: /api/authz/ext-authz/
                    protocol: HTTP
                  type: ExternalAuth
      listenerSets:
        whoami:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: whoami.test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: ref:whoami-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
