# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:
  name:

# Tiny HTTP server that echoes the request (headers, IP, ...). Useful to check the Gateway, the TLS termination and what
# the Authelia forward auth passes to the upstream (remote-user, remote-groups, ...). Protected by Authelia forward auth.

resources:

  fluxHelmReleases:
    whoami:
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          deployments:
            whoami:
              replicas: 1
              selector:
                matchLabels:
                  app.kubernetes.io/name: whoami
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: whoami
                spec:
                  containers:
                    whoami:
                      name: whoami
                      image: traefik/whoami:v1.12.0 # renovate: versioning=loose
                      args:
                        - --port=8080
                        - --verbose
                      ports:
                        http:
                          containerPort: 8080
                      startupProbe:
                        httpGet:
                          path: /health
                          port: 8080
                        periodSeconds: 5
                        failureThreshold: 12
                      readinessProbe:
                        httpGet:
                          path: /health
                          port: 8080
                        periodSeconds: 15
                        timeoutSeconds: 3
                      livenessProbe:
                        httpGet:
                          path: /health
                          port: 8080
                        periodSeconds: 15
                        timeoutSeconds: 3
                      resources:
                        requests:
                          cpu: 10m
                          memory: 16Mi
                        limits:
                          memory: 64Mi
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        runAsNonRoot: true
                        runAsUser: 1000
                        runAsGroup: 1000
                        capabilities:
                          drop:
                            all: ALL
                        seccompProfile:
                          type: RuntimeDefault

          services:
            whoami:
              selector:
                app.kubernetes.io/name: whoami
              ports:
                http:
                  port: 8080

    # the public exposure, applied once whoami is deployed and not waited for
    whoami-integration:
      install:
        disableWait: true
      upgrade:
        disableWait: true
      dependsOn:
        whoami:
          name: whoami
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        gateway-api:
          name: app-gateway-api
          namespace: gateway-api
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          certManagerCertificates:
            # certificate of the web UI, terminated by the Gateway
            whoami-gateway:
              secretName: tls-whoami-gateway
              dnsNames:
                whoami: whoami.{{ .Values.global.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

          # Exposed by the Cilium Gateway `shared` (kube-system), TLS terminated by the Gateway and protected by Authelia forward auth.
          # The ReferenceGrant to the authelia service is in app-authelia.
          listenerSets:
            whoami:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: shared
                namespace: kube-system
              listeners:
                https:
                  name: https
                  hostname: whoami.{{ .Values.global.domain }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-whoami-gateway
                  allowedRoutes:
                    namespaces:
                      from: Same

          httpRoutes:
            whoami:
              parentRefs:
                whoami:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: whoami
              hostnames:
                whoami: whoami.{{ .Values.global.domain }}
              rules:
                root:
                  filters:
                    authelia:
                      type: ExternalAuth
                      externalAuth:
                        protocol: HTTP
                        backendRef:
                          name: authelia
                          namespace: authelia
                          port: 80
                        http:
                          path: /api/authz/ext-authz/
                          allowedResponseHeaders: # only the identity headers, not the authz content-type/content-length (a GET with a content-length makes upstreams answer 400)
                            remote-user: remote-user
                            remote-groups: remote-groups
                            remote-name: remote-name
                            remote-email: remote-email
                          allowedHeaders: # what authelia needs to find the session and to redirect to the login page
                            cookie: cookie
                            accept: accept
                            proxy-authorization: proxy-authorization
                            x-forwarded-proto: x-forwarded-proto
                            x-forwarded-for: x-forwarded-for
                  backendRefs:
                    whoami:
                      name: whoami
                      port: 8080
