# yaml-language-server: $schema=../app/schema/values.schema.json

resources:

  ciliumNetworkPolicies:
    landing:
      endpointSelector: ref:landing
      ingress:
        gateway:
          fromEntities: [ingress, host, remote-node]
          toPorts: [8080]

  fluxHelmReleases:
    landing:
      values:
        resources:
          # The static page served on the apex of the domain, replace `index.html` to change it.
          configMaps:
            landing-html:
              data:
                index.html: |
                  <!DOCTYPE html>
                  <html lang="en">
                  <head>
                    <meta charset="utf-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1">
                    <title>{{ .Values.app.domain }}</title>
                    <style>
                      html, body { height: 100%; margin: 0; }
                      body {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        background: #111827;
                        color: #e5e7eb;
                        font-family: system-ui, sans-serif;
                      }
                      main { text-align: center; }
                      h1 { font-size: 2.5rem; font-weight: 600; margin: 0 0 .5rem; }
                      p { color: #9ca3af; margin: 0; }
                    </style>
                  </head>
                  <body>
                    <main>
                      <h1>{{ .Values.app.domain }}</h1>
                      <p>Nothing to see here.</p>
                    </main>
                  </body>
                  </html>

          deployments:
            landing:
              replicas: "{{ .Values.app.scaling.replicas }}"
              template:
                spec:
                  securityContext:
                    runAsUser: 101
                    runAsGroup: 101
                  containers:
                    nginx:
                      name: nginx
                      image: nginxinc/nginx-unprivileged:1.29.3-alpine # renovate: versioning=loose
                      ports:
                        http:
                          containerPort: 8080
                      probe:
                        httpGet:
                          path: /
                      securityContext:
                        capabilities:
                          drop:
                            all: ALL
                      volumeMounts:
                        html:
                          name: html
                          mountPath: /usr/share/nginx/html
                          readOnly: true
                  volumes:
                    html:
                      name: html
                      configMap:
                        name: ref:landing-html

          services:
            landing:
              ports:
                http:
                  port: 80
                  targetPort: 8080

expose:
  landing:
    hostname: "{{ .Values.app.domain }}"
    port: 80
