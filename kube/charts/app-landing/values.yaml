# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:

resources:

  # on top of the default deny of app-cilium. The selectors are in the namespace of the release.
  ciliumNetworkPolicies:
    landing:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: landing}
      ingress:
        gateway:
          fromEntities: {ingress: ingress, host: host, remote-node: remote-node}
          toPorts:
            http: {ports: {p8080: {port: "8080", protocol: TCP}}}

  fluxHelmReleases:
    landing:
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          # The static page served on the apex of the domain, replace `index.html` to change it.
          configMaps:
            landing-html:
              data:
                index.html: |
                  <!DOCTYPE html>
                  <html lang="en">
                  <head>
                    <meta charset="utf-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1">
                    <title>{{ .Values.global.domain }}</title>
                    <style>
                      html, body { height: 100%; margin: 0; }
                      body {
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        background: #111827;
                        color: #e5e7eb;
                        font-family: system-ui, sans-serif;
                      }
                      main { text-align: center; }
                      h1 { font-size: 2.5rem; font-weight: 600; margin: 0 0 .5rem; }
                      p { color: #9ca3af; margin: 0; }
                    </style>
                  </head>
                  <body>
                    <main>
                      <h1>{{ .Values.global.domain }}</h1>
                      <p>Nothing to see here.</p>
                    </main>
                  </body>
                  </html>

          deployments:
            landing:
              replicas: 2
              selector:
                matchLabels:
                  app.kubernetes.io/name: landing
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: landing
                spec:
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 101
                    runAsGroup: 101
                  containers:
                    nginx:
                      name: nginx
                      image: nginxinc/nginx-unprivileged:1.29.3-alpine # renovate: versioning=loose
                      ports:
                        http:
                          containerPort: 8080
                      readinessProbe:
                        httpGet:
                          path: /
                          port: 8080
                      livenessProbe:
                        httpGet:
                          path: /
                          port: 8080
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop:
                            all: ALL
                      volumeMounts:
                        html:
                          name: html
                          mountPath: /usr/share/nginx/html
                          readOnly: true
                        tmp:
                          name: tmp
                          mountPath: /tmp
                  volumes:
                    html:
                      name: html
                      configMap:
                        name: landing-html
                    tmp:
                      name: tmp
                      emptyDir: {}

          services:
            landing:
              selector:
                app.kubernetes.io/name: landing
              ports:
                http:
                  port: 80
                  targetPort: 8080

    # the public exposure, applied once landing is deployed and not waited for
    landing-integration:
      install:
        disableWait: true
      upgrade:
        disableWait: true
      dependsOn:
        landing:
          name: landing
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        gateway-api:
          name: app-gateway-api
          namespace: gateway-api
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:

          # Exposed on the apex of the domain by the Cilium Gateway `shared` (kube-system).
          certManagerCertificates:
            landing:
              secretName: tls-landing
              dnsNames:
                apex: "{{ .Values.global.domain }}"
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

          listenerSets:
            landing:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: shared
                namespace: kube-system
              listeners:
                https:
                  name: https
                  hostname: "{{ .Values.global.domain }}"
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-landing
                  allowedRoutes:
                    namespaces:
                      from: Same

          httpRoutes:
            landing:
              parentRefs:
                landing:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: landing
              hostnames:
                apex: "{{ .Values.global.domain }}"
              rules:
                root:
                  backendRefs:
                    landing:
                      name: landing
                      port: 80
