---
# Source: app-landing/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: landing
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: landing
      app.kubernetes.io/instance: landing
  ingress:
  - fromEntities:
    - ingress
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
---
# Source: app-landing/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: landing
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      landing:
        configMaps:
          landing-html:
            name: landing-html
            namespace: default
        deployments:
          landing:
            labels:
              app.kubernetes.io/component: landing
              app.kubernetes.io/instance: landing
            name: landing
            namespace: default
        services:
          landing:
            name: landing
            namespace: default
      landing-integration:
        certManagerCertificates:
          landing:
            name: landing
            namespace: default
            secretName: tls-landing
        httpRoutes:
          landing:
            name: landing
            namespace: default
        listenerSets:
          landing:
            name: landing
            namespace: default
    resources:
      configMaps:
        landing-html:
          data:
            index.html: |-
              <!DOCTYPE html>
              <html lang="en">
              <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width, initial-scale=1">
                <title>test.com</title>
                <style>
                  html, body { height: 100%; margin: 0; }
                  body {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: #111827;
                    color: #e5e7eb;
                    font-family: system-ui, sans-serif;
                  }
                  main { text-align: center; }
                  h1 { font-size: 2.5rem; font-weight: 600; margin: 0 0 .5rem; }
                  p { color: #9ca3af; margin: 0; }
                </style>
              </head>
              <body>
                <main>
                  <h1>test.com</h1>
                  <p>Nothing to see here.</p>
                </main>
              </body>
              </html>
      deployments:
        landing:
          replicas: 2
          template:
            spec:
              containers:
                nginx:
                  image: nginxinc/nginx-unprivileged:1.29.3-alpine
                  livenessProbe:
                    httpGet:
                      path: /
                      port: 8080
                  name: nginx
                  ports:
                    http:
                      containerPort: 8080
                  readinessProbe:
                    httpGet:
                      path: /
                      port: 8080
                  securityContext:
                    capabilities:
                      drop:
                        all: ALL
                  volumeMounts:
                    html:
                      mountPath: /usr/share/nginx/html
                      name: html
                      readOnly: true
              securityContext:
                runAsGroup: 101
                runAsUser: 101
              volumes:
                html:
                  configMap:
                    name: ref:landing-html
                  name: html
      services:
        landing:
          ports:
            http:
              port: 80
              targetPort: 8080
---
# Source: app-landing/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: landing-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: landing
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      landing:
        configMaps:
          landing-html:
            name: landing-html
            namespace: default
        deployments:
          landing:
            labels:
              app.kubernetes.io/component: landing
              app.kubernetes.io/instance: landing
            name: landing
            namespace: default
        services:
          landing:
            name: landing
            namespace: default
      landing-integration:
        certManagerCertificates:
          landing:
            name: landing
            namespace: default
            secretName: tls-landing
        httpRoutes:
          landing:
            name: landing
            namespace: default
        listenerSets:
          landing:
            name: landing
            namespace: default
    resources:
      certManagerCertificates:
        landing:
          dnsNames:
            apex: test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-landing
      httpRoutes:
        landing:
          hostnames:
            apex: test.com
          parentRefs:
            landing: ref:landing
          rules:
            root:
              backendRefs:
                landing:
                  name: ref:landing
                  port: 80
      listenerSets:
        landing:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: ref:landing
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
