# Source: app-landing/templates/loader.yaml
apiVersion: v1
kind: Service
metadata:
  name: landing
  namespace: landing
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
  selector:
    app.kubernetes.io/name: landing
---
# Source: app-landing/templates/loader.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: landing
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: landing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: landing
    spec:
      containers:
      - image: nginxinc/nginx-unprivileged:1.29.3-alpine
        livenessProbe:
          httpGet:
            path: /
            port: 8080
        name: nginx
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: html
          readOnly: true
        - mountPath: /tmp
          name: tmp
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
      volumes:
      - configMap:
          name: landing-html
        name: html
      - emptyDir: {}
        name: tmp
---
# Source: app-landing/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: landing-config
  namespace: landing
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    resources:
      certManagerCertificates:
        landing:
          dnsNames:
            apex: test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-landing
      httpRoutes:
        landing:
          hostnames:
            apex: test.com
          parentRefs:
            landing:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: landing
          rules:
            root:
              backendRefs:
                landing:
                  name: landing
                  port: 80
      listenerSets:
        landing:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-landing
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
