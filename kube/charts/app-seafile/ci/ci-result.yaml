                    tcpSocket:
                      port: 3306
                  securityContext:
                    capabilities:
                      drop:
                        all: ALL
                    runAsGroup: 999
                    runAsUser: 999
                  startupProbe:
                    failureThreshold: 60
                    periodSeconds: 5
                    tcpSocket:
                      port: 3306
                  volumeMounts:
                    data:
                      mountPath: /var/lib/mysql
                      name: data
                      subPath: data
              securityContext:
                fsGroup: 999
              volumes:
                data:
                  name: data
                  persistentVolumeClaim:
                    claimName: seafile-mariadb
      persistentVolumeClaims:
        seafile-mariadb:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: longhorn-db
      services:
        seafile-mariadb:
          ports:
            mysql:
              port: 3306
