# Source: app-seafile/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seafile
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: seafile-mariadb
  - name: seafile-pre
  - name: seafile-valkey
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 15m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      configMaps:
        seafile-config:
          data:
            local_settings.py: |-
              import os

              issuer = os.environ['OAUTH_ISSUER_URL'].rstrip('/')
              service = '%s://%s' % (os.environ['SEAFILE_SERVER_PROTOCOL'], os.environ['SEAFILE_SERVER_HOSTNAME'])

              ENABLE_OAUTH = True
              OAUTH_CLIENT_ID = os.environ['OAUTH_CLIENT_ID']
              OAUTH_CLIENT_SECRET = os.environ['OAUTH_CLIENT_SECRET']
              OAUTH_REDIRECT_URL = service + '/oauth/callback/'
              OAUTH_PROVIDER = 'authelia'
              OAUTH_AUTHORIZATION_URL = issuer + '/api/oidc/authorization'
              OAUTH_TOKEN_URL = issuer + '/api/oidc/token'
              OAUTH_USER_INFO_URL = issuer + '/api/oidc/userinfo'
              OAUTH_SCOPE = ['openid', 'profile', 'email']
              OAUTH_ATTRIBUTE_MAP = {
                  'preferred_username': (True, 'uid'),
                  'name': (False, 'name'),
                  'email': (False, 'contact_email'),
              }
              OAUTH_CREATE_UNKNOWN_USER = True
              OAUTH_ACTIVATE_USER_AFTER_CREATION = True
              # the users created by SSO cannot use the local password login
              DISABLE_SSO_USER_LOCAL_PWD_LOGIN = True
            login.html: |-
              {% extends "registration/login.html" %}
              {% block extra_style %}{{ `{{ block.super }}` }}
              <style id="sso-only">
              #login-form, .login-panel-hd, #login-bottom .bottom-item { display: none; }
              </style>
              {% endblock %}
              {% block extra_script %}
              <script type="text/javascript">
              if (new URLSearchParams(window.location.search).has('local')) {
                  $('#sso-only').remove();
              }
              </script>
              {{ `{{ block.super }}` }}
              {% endblock %}
      deployments:
        seafile:
          replicas: 1
          strategy:
            type: Recreate
          template:
            spec:
              containers:
                seafile:
                  command:
                  - sh
                  - -c
                  - |-
                    ln -sf /config/local_settings.py /opt/seafile/seafile-server-$SEAFILE_VERSION/seahub/seahub/local_settings.py
                    exec /sbin/my_init -- /scripts/enterpoint.sh
                  env:
                    CACHE_PROVIDER: redis
                    INIT_SEAFILE_ADMIN_EMAIL: admin@test.com
                    INIT_SEAFILE_ADMIN_PASSWORD:
                      secretKeyRef:
                        key: admin-password
                        name: seafile-generated
                    INIT_SEAFILE_MYSQL_ROOT_PASSWORD:
                      secretKeyRef:
                        key: db-root-password
                        name: seafile-generated
                    JWT_PRIVATE_KEY:
                      secretKeyRef:
                        key: jwt-private-key
                        name: seafile-generated
                    OAUTH_CLIENT_ID:
                      secretKeyRef:
                        key: client-id
                        name: seafile-oidc
                    OAUTH_CLIENT_SECRET:
                      secretKeyRef:
                        key: secret
                        name: seafile-oidc
                    OAUTH_ISSUER_URL: https://authelia.test.com
                    REDIS_HOST: seafile-valkey
                    REDIS_PASSWORD:
                      secretKeyRef:
                        key: default
                        name: seafile-valkey
                    REDIS_PORT: "6379"
                    SEAFILE_LOG_TO_STDOUT: "true"
                    SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
                    SEAFILE_MYSQL_DB_HOST: seafile-mariadb
                    SEAFILE_MYSQL_DB_PASSWORD:
                      secretKeyRef:
                        key: db-password
                        name: seafile-generated
                    SEAFILE_MYSQL_DB_PORT: "3306"
                    SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
                    SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
                    SEAFILE_MYSQL_DB_USER: seafile
                    SEAFILE_SERVER_HOSTNAME: seafile.test.com
                    SEAFILE_SERVER_PROTOCOL: https
                    TIME_ZONE: Europe/Paris
                  image: docker.io/seafileltd/seafile-mc:13.0.28
                  livenessProbe:
                    failureThreshold: 6
                    httpGet:
                      path: /api2/ping/
                      port: 80
                    periodSeconds: 30
                    timeoutSeconds: 10
                  name: seafile
                  ports:
                    http:
                      containerPort: 80
                  readinessProbe:
                    httpGet:
                      path: /api2/ping/
                      port: 80
                    timeoutSeconds: 5
                  securityContext:
                    capabilities:
                      add:
                      - CHOWN
                      - DAC_OVERRIDE
                      - FOWNER
                      - SETGID
                      - SETUID
                      - KILL
                      - NET_BIND_SERVICE
                      drop:
                        all: ALL
                  startupProbe:
                    failureThreshold: 120
                    httpGet:
                      path: /api2/ping/
                      port: 80
                    periodSeconds: 5
                  volumeMounts:
                    config:
                      mountPath: /config
                      name: config
                      readOnly: true
                    data:
                      mountPath: /shared
                      name: data
                    login:
                      mountPath: /shared/seafile/seahub-data/custom/templates/registration/login.html
                      name: config
                      readOnly: true
                      subPath: login.html
              volumes:
                config:
                  configMap:
                    name: seafile-config
                  name: config
                data:
                  name: data
                  persistentVolumeClaim:
                    claimName: seafile-data
      persistentVolumeClaims:
        seafile-data:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
          storageClassName: longhorn-files
      services:
        seafile:
          ports:
            http:
              port: 80
