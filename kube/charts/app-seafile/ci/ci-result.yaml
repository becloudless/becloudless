      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: seafile-pre
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
