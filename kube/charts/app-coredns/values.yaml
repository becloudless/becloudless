# yaml-language-server: $schema=../app/schema/values.schema.json

resources:
  fluxHelmRepositories:
    coredns:
      url: https://coredns.github.io/helm

  # on top of the default deny of app-cilium, which waits for this release: without these rules nothing could resolve a name.
  # Cluster wide because the clients are in every namespace.
  ciliumClusterwideNetworkPolicies:
    kube-dns:
      endpointSelector:
        matchLabels: {"k8s:io.kubernetes.pod.namespace": kube-system, "k8s:k8s-app": kube-dns}
      ingress:
        from-pods:
          fromEndpoints:
            any-namespace:
              matchExpressions:
                any-namespace: {key: "k8s:io.kubernetes.pod.namespace", operator: Exists}
          toPorts:
            dns:
              ports:
                udp: {port: "53", protocol: UDP}
                tcp: {port: "53", protocol: TCP}
      egress:
        upstream-resolvers: # the resolvers of the nodes / the LAN
          toEntities: {world: world, host: host, remote-node: remote-node}
          toPorts:
            dns:
              ports:
                udp: {port: "53", protocol: UDP}
                tcp: {port: "53", protocol: TCP}
        kube-apiserver:
          toEntities: {apiserver: kube-apiserver}

  fluxHelmReleases:
    coredns:
      interval: 10m
      chart:
        spec:
          chart: coredns
          version: 1.48.2
          sourceRef:
            kind: HelmRepository
            name: coredns
      values:
        livenessProbe:
          initialDelaySeconds: 0
        readinessProbe:
          initialDelaySeconds: 0

        fullnameOverride: coredns
        image:
          repository: mirror.gcr.io/coredns/coredns
          tag: 1.14.7
        replicaCount: 2
        k8sAppLabelOverride: kube-dns
        serviceAccount:
          create: true
        service:
          name: kube-dns
          clusterIP: 172.16.42.10
        servers:
          - zones:
              - zone: .
                scheme: dns://
                use_tcp: true
            port: 53
            plugins:
              - name: errors
              - name: health
                configBlock: |-
                  lameduck 5s
              - name: ready
              - name: kubernetes
                parameters: cluster.local in-addr.arpa ip6.arpa
                configBlock: |-
                  pods verified
                  fallthrough in-addr.arpa ip6.arpa
              # no `autopath`: it answers the first search domain query (`name.namespace.svc.cluster.local`) with the final address, so
              # Cilium learns the addresses under that name and the `toFQDNs` rules (matching `name`) never match.
              - name: forward
                parameters: . /etc/resolv.conf
                configBlock: |-
                  max_concurrent 1000
              - name: cache
                configBlock: |-
                  prefetch 30
    #              serve_stale
              - name: loop
              - name: reload
              - name: loadbalance
              - name: prometheus
                parameters: 0.0.0.0:9153
              - name: log
                configBlock: |-
                  class error
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
