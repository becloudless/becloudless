---
# Source: app-coredns/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: default
spec:
  chart:
    spec:
      chart: coredns
      sourceRef:
        kind: HelmRepository
        name: coredns
      version: 1.48.2
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
      tag: 1.14.7
    k8sAppLabelOverride: kube-dns
    livenessProbe:
      initialDelaySeconds: 0
    readinessProbe:
      initialDelaySeconds: 0
    replicaCount: 2
    servers:
    - plugins:
      - name: errors
      - configBlock: lameduck 5s
        name: health
      - name: ready
      - configBlock: |-
          pods verified
          fallthrough in-addr.arpa ip6.arpa
        name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
      - name: autopath
        parameters: '@kubernetes'
      - configBlock: max_concurrent 1000
        name: forward
        parameters: . /etc/resolv.conf
      - configBlock: prefetch 30
        name: cache
      - name: loop
      - name: reload
      - name: loadbalance
      - name: prometheus
        parameters: 0.0.0.0:9153
      - configBlock: class error
        name: log
      port: 53
      zones:
      - scheme: dns://
        use_tcp: true
        zone: .
    service:
      clusterIP: 172.16.42.10
      name: kube-dns
    serviceAccount:
      create: true
    tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
---
# Source: app-coredns/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: coredns
  namespace: default
spec:
  interval: 10m
  url: https://coredns.github.io/helm
