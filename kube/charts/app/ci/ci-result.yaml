apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: apex-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: apex
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      apex-integration:
        certManagerCertificates:
          apex-gateway:
            name: apex-gateway
            namespace: default
            secretName: tls-apex-gateway
        httpRoutes:
          apex:
            name: apex
            namespace: default
        listenerSets:
          apex:
            name: apex
            namespace: default
      grouped-integration:
        certManagerCertificates:
          grouped-a-gateway:
            name: grouped-a-gateway
            namespace: default
            secretName: tls-grouped-a-gateway
          grouped-b-gateway:
            name: grouped-b-gateway
            namespace: default
            secretName: tls-grouped-b-gateway
        httpRoutes:
          grouped-a:
            name: grouped-a
            namespace: default
          grouped-b:
            name: grouped-b
            namespace: default
        listenerSets:
          grouped:
            name: grouped
            namespace: default
      merged-integration:
        certManagerCertificates:
          merged-gateway:
            name: merged-gateway
            namespace: default
            secretName: tls-merged-gateway
        httpRoutes:
          merged:
            name: merged
            namespace: default
        listenerSets:
          merged:
            name: merged
            namespace: default
        referenceGrants:
          extra:
            name: extra
            namespace: default
      other-pre:
        externalSecrets:
          other-secret:
            name: other-secret
            namespace: default
        secretStores:
          authelia:
            name: authelia
            namespace: default
        serviceAccounts:
          authelia-reader:
            name: authelia-reader
            namespace: default
      own-pre:
        secretStores:
          authelia:
            name: authelia
            namespace: default
        serviceAccounts:
          authelia-reader:
            name: authelia-reader
            namespace: default
      protected-integration:
        certManagerCertificates:
          protected-gateway:
            name: protected-gateway
            namespace: default
            secretName: tls-protected-gateway
        httpRoutes:
          protected:
            name: protected
            namespace: default
        listenerSets:
          protected:
            name: protected
            namespace: default
      simple-integration:
        certManagerCertificates:
          simple-gateway:
            name: simple-gateway
            namespace: default
            secretName: tls-simple-gateway
        httpRoutes:
          simple:
            name: simple
            namespace: default
        listenerSets:
          simple:
            name: simple
            namespace: default
      simple-pre:
        externalSecrets:
          client-oidc:
            name: client-oidc
            namespace: default
        secretStores:
          authelia:
            name: authelia
            namespace: default
        serviceAccounts:
          authelia-reader:
            name: authelia-reader
            namespace: default
    resources:
      certManagerCertificates:
        apex-gateway:
          dnsNames:
            apex: test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-apex-gateway
      httpRoutes:
        apex:
          hostnames:
            apex: test.com
          parentRefs:
            apex:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: apex
              sectionName: apex
          rules:
            root:
              backendRefs:
                backend:
                  name: apex-service
                  port: 8080
              timeouts:
                request: 0s
      listenerSets:
        apex:
          listeners:
            apex:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: test.com
              name: apex
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: ref:apex-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
