# Source: app-forgejo/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: forgejo
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      forgejo-integration:
        certManagerCertificates:
          forgejo-gateway:
            name: forgejo-gateway
            namespace: default
            secretName: tls-forgejo-gateway
        httpRoutes:
          forgejo:
            name: forgejo
            namespace: default
        listenerSets:
          forgejo:
            name: forgejo
            namespace: default
      forgejo-pre:
        externalSecrets:
          forgejo-oidc:
            name: forgejo-oidc
            namespace: default
        secretStores:
          authelia:
            name: authelia
            namespace: default
        serviceAccounts:
          authelia-reader:
            name: authelia-reader
            namespace: default
    resources:
      certManagerCertificates:
        forgejo-gateway:
          dnsNames:
            forgejo: forgejo.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-forgejo-gateway
      httpRoutes:
        forgejo:
          hostnames:
            forgejo: forgejo.test.com
          parentRefs:
            forgejo:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: forgejo
              sectionName: forgejo
          rules:
            root:
              backendRefs:
                backend:
                  name: forgejo-http
                  port: 3000
              timeouts:
                request: 0s
      listenerSets:
        forgejo:
          listeners:
            forgejo:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: forgejo.test.com
              name: forgejo
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: ref:forgejo-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
