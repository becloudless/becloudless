apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-pre
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-external-secrets
    namespace: external-secrets
  - name: authelia-pre
    namespace: authelia
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      forgejo-integration:
        certManagerCertificates:
          forgejo-gateway:
            name: forgejo-gateway
            namespace: default
            secretName: tls-forgejo-gateway
        httpRoutes:
          forgejo:
            name: forgejo
            namespace: default
        listenerSets:
          forgejo:
            name: forgejo
            namespace: default
      forgejo-pre:
        externalSecrets:
          forgejo-oidc:
            name: forgejo-oidc
            namespace: default
        secretStores:
          authelia:
            name: authelia
            namespace: default
        serviceAccounts:
          authelia-reader:
            name: authelia-reader
            namespace: default
    resources:
      externalSecrets:
        forgejo-oidc:
          data:
            key:
              remoteRef:
                key: authelia-oidc-forgejo
                property: client-id
              secretKey: key
            secret:
              remoteRef:
                key: authelia-oidc-forgejo
                property: secret
              secretKey: secret
          refreshInterval: 1h
          secretStoreRef: ref:authelia
      secretStores:
        authelia:
          provider:
            kubernetes:
              auth:
                serviceAccount:
                  name: ref:authelia-reader
              remoteNamespace: authelia
              server:
                caProvider:
                  key: ca.crt
                  name: kube-root-ca.crt
                  type: ConfigMap
      serviceAccounts:
        authelia-reader:
          automountServiceAccountToken: false
