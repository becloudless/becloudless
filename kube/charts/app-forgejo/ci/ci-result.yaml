---
# Source: app-forgejo/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  chart:
    spec:
      chart: forgejo
      sourceRef:
        kind: HelmRepository
        name: forgejo
      version: 17.3.1
  dependsOn:
  - name: forgejo-postgresql
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 10m
  upgrade:
    remediation:
      retries: 3
  values:
    gitea:
      additionalConfigFromEnvs:
      - name: FORGEJO__database__PASSWD
        valueFrom:
          secretKeyRef:
            key: password
            name: forgejo-postgresql-app
      admin:
        email: forgejo@test.com
        passwordMode: initialOnlyNoReset
        username: forgejo_admin
      config:
        APP_NAME: test forgejo
        actions:
          ENABLED: true
        attachment:
          MAX_SIZE: 2000
        cache:
          ADAPTER: memory
        database:
          DB_TYPE: postgres
          HOST: forgejo-postgresql-rw:5432
          NAME: app
          SSL_MODE: require
          USER: app
        queue:
          TYPE: level
        server:
          DOMAIN: forgejo.test.com
          ROOT_URL: https://forgejo.test.com
          SSH_DOMAIN: forgejo.test.com
          SSH_LISTEN_PORT: 2222
          SSH_PORT: 22
        service:
          DEFAULT_KEEP_EMAIL_PRIVATE: true
          DEFAULT_USER_VISIBILITY: private
          DISABLE_REGISTRATION: true
        session:
          PROVIDER: db
        ui:
          DEFAULT_THEME: forgejo-dark
          ISSUE_PAGING_NUM: 100
        webhook:
          ALLOWED_HOST_LIST: '*'
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false
    ingress:
      enabled: false
    persistence:
      claimName: forgejo-shared-storage
      enabled: true
      size: 10Gi
      storageClass: longhorn
    replicaCount: 1
    test:
      enabled: false
---
# Source: app-forgejo/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-config
  namespace: forgejo
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    prefixNamesWithRelease: false
    resources:
      certManagerCertificates:
        forgejo-gateway:
          dnsNames:
            forgejo: forgejo.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-forgejo-gateway
      httpRoutes:
        forgejo:
          hostnames:
            forgejo: forgejo.test.com
          parentRefs:
            forgejo:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: forgejo
          rules:
            root:
              backendRefs:
                forgejo:
                  name: forgejo-http
                  port: 3000
              timeouts:
                request: 0s
      listenerSets:
        forgejo:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: forgejo.test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-forgejo-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
---
# Source: app-forgejo/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-postgresql
  namespace: forgejo
spec:
  chart:
    spec:
      chart: ./kube/charts/postgresql-cluster
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-cnpg
    namespace: cnpg-system
  - name: app-longhorn
    namespace: longhorn-system
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
