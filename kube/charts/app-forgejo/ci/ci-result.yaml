---
# Source: app-forgejo/templates/loader.yaml
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo
  namespace: default
spec:
  egress:
  - toEntities:
    - ingress
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toFQDNs:
    - matchPattern: '*'
    toPorts:
    - ports:
      - port: "22"
        protocol: TCP
      - port: "443"
        protocol: TCP
      - port: "80"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        cnpg.io/cluster: forgejo-postgresql
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  ingress:
  - fromEntities:
    - ingress
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        k8s:app: source-controller
        k8s:io.kubernetes.pod.namespace: flux-system
    - matchLabels:
        k8s:app.kubernetes.io/component: ssh-tls
        k8s:app.kubernetes.io/instance: forgejo-integration
        k8s:io.kubernetes.pod.namespace: forgejo
    toPorts:
    - ports:
      - port: "2222"
        protocol: TCP
---
# Source: app-forgejo/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: default
spec:
  chart:
    spec:
      chart: forgejo
      sourceRef:
        kind: HelmRepository
        name: forgejo
      version: 17.3.2
  dependsOn:
  - name: forgejo-postgresql
  - name: forgejo-pre
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    gitea:
      additionalConfigFromEnvs:
      - name: FORGEJO__database__PASSWD
        valueFrom:
          secretKeyRef:
            key: password
            name: forgejo-postgresql-app
      admin:
        email: forgejo@test.com
        passwordMode: initialOnlyNoReset
        username: forgejo_admin
      config:
        APP_NAME: test forgejo
        actions:
          ENABLED: true
        attachment:
          MAX_SIZE: 2000
        cache:
          ADAPTER: memory
        database:
          DB_TYPE: postgres
          HOST: forgejo-postgresql-rw:5432
          NAME: app
          SSL_MODE: require
          USER: app
        oauth2_client:
          ENABLE_AUTO_REGISTRATION: true
          USERNAME: preferred_username
        queue:
          TYPE: level
        server:
          DOMAIN: forgejo.test.com
          ROOT_URL: https://forgejo.test.com
          SSH_DOMAIN: ssh-forgejo.test.com
          SSH_LISTEN_PORT: 2222
          SSH_PORT: 443
        service:
          ALLOW_ONLY_EXTERNAL_REGISTRATION: true
          DEFAULT_KEEP_EMAIL_PRIVATE: true
          DEFAULT_USER_VISIBILITY: private
          DISABLE_REGISTRATION: true
        session:
          PROVIDER: db
        ui:
          DEFAULT_THEME: forgejo-dark
          ISSUE_PAGING_NUM: 100
        webhook:
          ALLOWED_HOST_LIST: '*'
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false
      oauth:
      - autoDiscoverUrl: https://authelia.test.com/.well-known/openid-configuration
        existingSecret: forgejo-oidc
        name: authelia
        provider: openidConnect
        scopes: openid email profile
    ingress:
      enabled: false
    persistence:
      claimName: forgejo-shared-storage
      enabled: true
      size: 10Gi
      storageClass: longhorn-files
    replicaCount: 1
    test:
      enabled: false
