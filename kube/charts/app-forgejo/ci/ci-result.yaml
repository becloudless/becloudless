---
# Source: app-forgejo/templates/loader.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
  namespace: forgejo
spec: {}
---
# Source: app-forgejo/templates/loader.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: forgejo-gateway
  namespace: forgejo
spec:
  dnsNames:
  - forgejo.test.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: tls-forgejo-gateway
---
# Source: app-forgejo/templates/loader.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
spec:
  hostnames:
  - forgejo.test.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: forgejo
  rules:
  - backendRefs:
    - name: forgejo-http
      port: 3000
    timeouts:
      request: 0s
---
# Source: app-forgejo/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  chart:
    spec:
      chart: forgejo
      sourceRef:
        kind: HelmRepository
        name: forgejo
      version: 17.3.1
  dependsOn:
  - name: forgejo-postgresql
  install:
    crds: CreateReplace
    remediation:
      retries: 0
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 10m
  upgrade:
    remediation:
      retries: 3
  values:
    gitea:
      additionalConfigFromEnvs:
      - name: FORGEJO__database__PASSWD
        valueFrom:
          secretKeyRef:
            key: password
            name: forgejo-postgresql-app
      admin:
        email: forgejo@test.com
        passwordMode: initialOnlyNoReset
        username: forgejo_admin
      config:
        APP_NAME: test forgejo
        actions:
          ENABLED: true
        attachment:
          MAX_SIZE: 2000
        cache:
          ADAPTER: memory
        database:
          DB_TYPE: postgres
          HOST: forgejo-postgresql-rw:5432
          NAME: app
          SSL_MODE: require
          USER: app
        queue:
          TYPE: level
        server:
          DOMAIN: forgejo.test.com
          ROOT_URL: https://forgejo.test.com
          SSH_DOMAIN: forgejo.test.com
          SSH_LISTEN_PORT: 2222
          SSH_PORT: 22
        service:
          DEFAULT_KEEP_EMAIL_PRIVATE: true
          DEFAULT_USER_VISIBILITY: private
          DISABLE_REGISTRATION: true
        session:
          PROVIDER: db
        ui:
          DEFAULT_THEME: forgejo-dark
          ISSUE_PAGING_NUM: 100
        webhook:
          ALLOWED_HOST_LIST: '*'
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false
    ingress:
      enabled: false
    persistence:
      claimName: forgejo-shared-storage
      enabled: true
      size: 20Gi
      storageClass: longhorn
    replicaCount: 1
    test:
      enabled: false
---
# Source: app-forgejo/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-postgresql
  namespace: forgejo
spec:
  chart:
    spec:
      chart: ./kube/charts/postgresql-cluster
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: default
  install:
    crds: CreateReplace
    remediation:
      retries: 0
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
---
# Source: app-forgejo/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 10m
  type: oci
  url: oci://code.forgejo.org/forgejo-helm
---
# Source: app-forgejo/templates/loader.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: forgejo
  namespace: forgejo
spec:
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    hostname: forgejo.test.com
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - name: tls-forgejo-gateway
      mode: Terminate
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shared
    namespace: kube-system
