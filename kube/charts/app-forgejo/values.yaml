# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:
  name:

# Nothing has to be created by hand:
#  - the database is a CloudNativePG cluster, the password of its `app` user is created by CNPG (`forgejo-postgresql-app`)
#  - the admin user `forgejo_admin` gets a password generated by the forgejo chart in the `forgejo-admin` secret:
#      kubectl -n forgejo get secret forgejo-admin -o jsonpath='{.data.password}' | base64 -d
# Git over ssh is only available in the cluster (service `forgejo-ssh`), use https from outside.
# Not configured: SSO (authelia OIDC is disabled), mails.

resources:

  fluxHelmRepositories:
    forgejo:
      type: oci
      url: oci://code.forgejo.org/forgejo-helm

  fluxHelmReleases:
    # the database is prepared by the postgresql-cluster chart (certificates, issuer, cluster and backups)
    # the cluster is named after the release, which is the name of this HelmRelease
    forgejo-postgresql:
      dependsOn: # the certificates, the cluster and the volume snapshots
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        cnpg:
          name: app-cnpg
          namespace: cnpg-system
        longhorn:
          name: app-longhorn
          namespace: longhorn-system
      chart:
        spec:
          chart: ./kube/charts/postgresql-cluster
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps

    forgejo:
      timeout: 10m # the pod waits for the database
      dependsOn:
        forgejo-postgresql:
          name: forgejo-postgresql
      chart:
        spec:
          chart: forgejo
          version: 17.3.1
          sourceRef:
            kind: HelmRepository
            name: forgejo
      values:
        # https://code.forgejo.org/forgejo-helm/forgejo-helm/src/branch/main/values.yaml
        # exposed by the Cilium Gateway, see the `listenerSets` and `httpRoutes` resources
        ingress:
          enabled: false

        replicaCount: 1 # forgejo is not HA ready

        persistence:
          enabled: true
          size: 10Gi
          storageClass: longhorn
          claimName: forgejo-shared-storage

        test:
          enabled: false

        gitea:
          admin:
            username: forgejo_admin # `admin` is reserved
            email: forgejo@{{ .Values.global.domain }}
            passwordMode: initialOnlyNoReset # the password can be changed in the UI

          # the password of the database is added to the app.ini by the init container
          additionalConfigFromEnvs:
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgresql-app
                  key: password

          config:
            APP_NAME: "{{ .Values.global.name }} forgejo"
            server:
              DOMAIN: forgejo.{{ .Values.global.domain }}
              ROOT_URL: https://forgejo.{{ .Values.global.domain }}
              SSH_DOMAIN: forgejo.{{ .Values.global.domain }}
              SSH_PORT: 22
              SSH_LISTEN_PORT: 2222
            database:
              DB_TYPE: postgres
              HOST: forgejo-postgresql-rw:5432
              NAME: app
              USER: app
              SSL_MODE: require
            actions:
              ENABLED: true
            service:
              DISABLE_REGISTRATION: true
              DEFAULT_KEEP_EMAIL_PRIVATE: true
              DEFAULT_USER_VISIBILITY: private
            ui:
              DEFAULT_THEME: forgejo-dark
              ISSUE_PAGING_NUM: 100
            attachment:
              MAX_SIZE: 2000
            webhook:
              ALLOWED_HOST_LIST: '*'
            session:
              PROVIDER: db
            cache:
              ADAPTER: memory
            queue:
              TYPE: level

          metrics:
            enabled: true
            serviceMonitor:
              enabled: false # the prometheus CRDs are not installed by the bcl apps

    # the public exposure, applied once forgejo is deployed and not waited for
    forgejo-integration:
      install:
        disableWait: true
      upgrade:
        disableWait: true
      dependsOn:
        forgejo:
          name: forgejo
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        gateway-api:
          name: app-gateway-api
          namespace: gateway-api
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          certManagerCertificates:
            # certificate of the web UI, terminated by the Gateway
            forgejo-gateway:
              secretName: tls-forgejo-gateway
              dnsNames:
                forgejo: forgejo.{{ .Values.global.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

          # Exposed by the Cilium Gateway `shared` (kube-system), TLS terminated by the Gateway.
          # It is not protected by forward auth: git clients cannot follow the login redirect of authelia.
          listenerSets:
            forgejo:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: shared
                namespace: kube-system
              listeners:
                https:
                  name: https
                  hostname: forgejo.{{ .Values.global.domain }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-forgejo-gateway
                  allowedRoutes:
                    namespaces:
                      from: Same

          httpRoutes:
            forgejo:
              parentRefs:
                forgejo:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: forgejo
              hostnames:
                forgejo: forgejo.{{ .Values.global.domain }}
              rules:
                root:
                  backendRefs:
                    forgejo:
                      name: forgejo-http
                      port: 3000
                  timeouts:
                    request: 0s # pushes and lfs uploads can be long
