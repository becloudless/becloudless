# yaml-language-server: $schema=../app/schema/values.schema.json

# The admin user `forgejo_admin` gets a password generated by the forgejo chart in the `forgejo-admin` secret:
#   kubectl -n forgejo get secret forgejo-admin -o jsonpath='{.data.password}' | base64 -d
# Git over ssh is only available in the cluster (service `forgejo-ssh`), use https from outside.
# SSO: the `authelia` login source, the users are created at their first login. Not configured: mails.

resources:

  fluxHelmRepositories:
    forgejo:
      type: oci
      url: oci://code.forgejo.org/forgejo-helm

  ciliumNetworkPolicies:
    forgejo:
      endpointSelector:
        matchLabels: {app.kubernetes.io/name: forgejo}
      ingress:
        gateway:
          fromEntities: [ingress, host, remote-node]
          toPorts: [3000]
      egress:
        postgresql:
          toEndpoints:
            postgresql:
              matchLabels: {cnpg.io/cluster: forgejo-postgresql}
          toPorts: [5432]
        gateway: # the OIDC discovery of authelia goes through the public address of the gateway
          toEntities: [ingress]
          toPorts: [443]
        internet: # TODO mirrors, webhooks, git over ssh: any name, the destinations are chosen by the users
          toFQDNs:
            any: {matchPattern: "*"}
          toPorts: [22, 80, 443]

  fluxHelmReleases:
    forgejo-postgresql:
      values:
        instances: "{{ .Values.app.scaling.dbReplicas }}"
        clients:
          forgejo:
            matchLabels: {app.kubernetes.io/name: forgejo}
      dependsOn:
        - name: app-cert-manager
          namespace: cert-manager
        - name: app-cnpg
          namespace: cnpg-system
        - name: app-longhorn
          namespace: longhorn-system
      chart:
        spec:
          chart: ./kube/charts/postgresql

    forgejo:
      dependsOn:
        - ref:forgejo-postgresql
        - ref:forgejo-pre
      chart:
        spec:
          chart: forgejo
          version: 17.3.1
          sourceRef:
            kind: HelmRepository
            name: forgejo
      values:
        # https://code.forgejo.org/forgejo-helm/forgejo-helm/src/branch/main/values.yaml
        ingress:
          enabled: false

        replicaCount: 1 # forgejo is not HA ready

        persistence:
          enabled: true
          size: 10Gi
          storageClass: longhorn-files
          claimName: forgejo-shared-storage

        test:
          enabled: false

        gitea:
          admin:
            username: forgejo_admin # `admin` is reserved
            email: forgejo@{{ .Values.app.domain }}
            passwordMode: initialOnlyNoReset # the password can be changed in the UI

          # the password of the database is added to the app.ini by the init container
          additionalConfigFromEnvs:
            - name: FORGEJO__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: forgejo-postgresql-app
                  key: password

          # login source with authelia (the redirect uri of the client is /user/oauth2/authelia/callback)
          oauth:
            - name: authelia
              provider: openidConnect
              existingSecret: forgejo-oidc
              autoDiscoverUrl: https://authelia.{{ .Values.app.domain }}/.well-known/openid-configuration
              scopes: openid email profile

          config:
            APP_NAME: "{{ .Values.app.name }} forgejo"
            server:
              DOMAIN: forgejo.{{ .Values.app.domain }}
              ROOT_URL: https://forgejo.{{ .Values.app.domain }}
              SSH_DOMAIN: forgejo.{{ .Values.app.domain }}
              SSH_PORT: 22
              SSH_LISTEN_PORT: 2222
            database:
              DB_TYPE: postgres
              HOST: forgejo-postgresql-rw:5432
              NAME: app
              USER: app
              SSL_MODE: require
            actions:
              ENABLED: true
            service:
              DISABLE_REGISTRATION: true
              ALLOW_ONLY_EXTERNAL_REGISTRATION: true # the accounts are created by the first login with authelia
              DEFAULT_KEEP_EMAIL_PRIVATE: true
              DEFAULT_USER_VISIBILITY: private
            ui:
              DEFAULT_THEME: forgejo-dark
              ISSUE_PAGING_NUM: 100
            attachment:
              MAX_SIZE: 2000
            webhook:
              ALLOWED_HOST_LIST: '*'
            oauth2_client:
              ENABLE_AUTO_REGISTRATION: true
              USERNAME: preferred_username
            session:
              PROVIDER: db
            cache:
              ADAPTER: memory
            queue:
              TYPE: level

          metrics:
            enabled: true
            serviceMonitor:
              enabled: false # the prometheus CRDs are not installed by the bcl apps

expose:
  forgejo: # no forward auth: the git clients can not follow the login redirect
    service: forgejo-http
    port: 3000
    timeouts:
      request: 0s # pushes and lfs uploads can be long

oidc:
  forgejo:
    clientIdKey: key # the keys (`key`, `secret`) the forgejo chart reads
