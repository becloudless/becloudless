# yaml-language-server: $schema=../app/schema/values.schema.json

# Syncthing (https://syncthing.net): continuous file synchronization.
#
#  - one instance for each user of lldap member of the group `app_syncthing` (`syncthing-<user>`, from the `syncthing` chart): its web UI is
#    `https://<user>.syncthing.<domain>`, behind the Gateway with the forward auth of authelia, which only lets this user in (see its
#    access control, `domain_regex`). The data of the instance is a volume backed up daily by longhorn. The instances are not exposed
#    for the synchronization: their devices are reached through the relay below, the instances configure themselves for it;
#  - a relay (`syncthing-relay`, https://docs.syncthing.net/users/strelaysrv.html), public on the TCP port 22067 of the Gateway (a
#    TCPRoute, the relay does its own TLS and its clients send no SNI). It is private: it does not join the public pools, and it only
#    serves the clients that give its token. A device that cannot be reached directly is reached through it.
#
# The relay (the default deny of app-cilium blocks the instances from the rest, so the global discovery, the public relays and the NAT
# detection only log errors):
#  - its certificate is made by cert-manager (`syncthing-relay-keys`, valid 100 years and never rotated: the relay ID is the device ID of
#    its certificate, a renewal would change it) and its token is generated (`syncthing-relay`, key `token`), by `syncthing-pre`;
#  - the instances set their sync protocol listen address to `relay://syncthing-relay:22067/?id=<relay id>&token=<token>` themselves,
#    the relay ID being computed from its certificate (see the `syncthing` chart);
#  - the devices that connect to an instance add it with the address `relay://<public name of the Gateway>:22067/?id=<relay id>&token=<token>`
#    (DNS record of the name to the IP of the Gateway, e.g. `sync.syncthing.<domain>`: nothing in the cluster knows it). The relay ID is in
#    the log of the relay (`kubectl -n syncthing logs deploy/syncthing-relay`, `URI: relay://...?id=<relay id>`) and the token is read with
#    `kubectl -n syncthing get secret syncthing-relay -o jsonpath='{.data.token}' | base64 -d`.

resources:

  # on top of the default deny of app-cilium. The selectors are in the namespace of the release.
  ciliumNetworkPolicies:
    syncthing-relay:
      endpointSelector:
        matchLabels: {app.kubernetes.io/instance: syncthing-relay, app.kubernetes.io/component: syncthing-relay}
      ingress:
        relay: # served by the Gateway service without Envoy: the source is the client itself (public, or in the cluster)
          fromEntities: {world: world, cluster: cluster}
          toPorts:
            relay: {ports: {p22067: {port: "22067", protocol: TCP}}}

  fluxHelmReleases:

    # the secrets of the relay, created before it and the instances start
    syncthing-pre:
      dependsOn:
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        secret-generator:
          name: app-secret-generator
          namespace: secret-generator
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          stringSecrets:
            syncthing-relay:
              fields:
                token:
                  fieldName: token

          # key pair of the relay, mounted as `cert.pem` and `key.pem`. The ID of the relay is the device ID of the certificate, so it must
          # never be renewed (a duration of 100 years) nor get a new key.
          certManagerCertificates:
            syncthing-relay-keys:
              secretName: syncthing-relay-keys
              commonName: syncthing-relay
              duration: 876000h
              privateKey:
                algorithm: ECDSA
                size: 256
                rotationPolicy: Never
              issuerRef:
                name: self-signed
                kind: ClusterIssuer

    syncthing-relay:
      dependsOn:
        syncthing-pre: # the token and the certificate
          name: syncthing-pre
        gateway-api: # the listener set and the route
          name: app-gateway-api
          namespace: gateway-api
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          deployments:
            syncthing-relay:
              replicas: 1
              template:
                spec:
                  securityContext:
                    fsGroup: 1000 # the group of the files of the key pair
                  containers:
                    relay:
                      name: relay
                      image: docker.io/syncthing/relaysrv:2.1.7 # renovate: versioning=loose
                      command: [ /bin/strelaysrv ] # not the entrypoint of the image, it needs root to change the user
                      args:
                        - -keys=/var/strelaysrv
                        - -pools= # private relay, it does not join the public pools
                        - -status-srv= # the statistics are for the pools
                        - -token=$(RELAY_TOKEN) # expanded by Kubernetes: the token is not in the spec
                      env:
                        RELAY_TOKEN:
                          secretKeyRef:
                            name: syncthing-relay
                            key: token
                      ports:
                        relay:
                          containerPort: 22067
                      startupProbe:
                        tcpSocket:
                          port: 22067
                        periodSeconds: 5
                        failureThreshold: 30
                      readinessProbe:
                        tcpSocket:
                          port: 22067
                      livenessProbe:
                        tcpSocket:
                          port: 22067
                        periodSeconds: 30
                      securityContext:
                        runAsUser: 1000
                        runAsGroup: 1000
                        capabilities:
                          drop:
                            all: ALL
                      volumeMounts:
                        keys:
                          name: keys
                          mountPath: /var/strelaysrv
                          readOnly: true
                  volumes:
                    keys:
                      name: keys
                      secret:
                        secretName: syncthing-relay-keys
                        defaultMode: 0440
                        items:
                          cert:
                            key: tls.crt
                            path: cert.pem
                          key:
                            key: tls.key
                            path: key.pem

          services:
            syncthing-relay:
              ports:
                relay:
                  port: 22067

          # Public on the Cilium Gateway `shared` (kube-system): a plain TCP listener, served by Cilium on the LoadBalancer service of the
          # Gateway without Envoy, so the relay sees the address of the client.
          listenerSets:
            syncthing-relay:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: shared
                namespace: kube-system
              listeners:
                relay:
                  name: relay
                  port: 22067
                  protocol: TCP
                  allowedRoutes:
                    namespaces:
                      from: Same

          tcpRoutes:
            syncthing-relay:
              parentRefs:
                syncthing-relay:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: syncthing-relay
                  sectionName: relay
              rules:
                relay:
                  backendRefs:
                    syncthing-relay:
                      name: syncthing-relay
                      port: 22067
