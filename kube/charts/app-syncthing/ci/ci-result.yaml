# Source: app-syncthing/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing-relay
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-gateway-api
    namespace: gateway-api
  - name: syncthing-pre
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    resources:
      deployments:
        syncthing-relay:
          replicas: 1
          template:
            spec:
              containers:
                relay:
                  args:
                  - -keys=/var/strelaysrv
                  - -pools=
                  - -status-srv=
                  - -token=$(RELAY_TOKEN)
                  command:
                  - /bin/strelaysrv
                  env:
                    RELAY_TOKEN:
                      secretKeyRef:
                        key: token
                        name: syncthing-relay
                  image: docker.io/syncthing/relaysrv:2.1.7
                  livenessProbe:
                    periodSeconds: 30
                    tcpSocket:
                      port: 22067
                  name: relay
                  ports:
                    relay:
                      containerPort: 22067
                  readinessProbe:
                    tcpSocket:
                      port: 22067
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        all: ALL
                    readOnlyRootFilesystem: true
                    runAsGroup: 1000
                    runAsNonRoot: true
                    runAsUser: 1000
                    seccompProfile:
                      type: RuntimeDefault
                  startupProbe:
                    failureThreshold: 30
                    periodSeconds: 5
                    tcpSocket:
                      port: 22067
                  volumeMounts:
                    keys:
                      mountPath: /var/strelaysrv
                      name: keys
                      readOnly: true
              enableServiceLinks: false
              securityContext:
                fsGroup: 1000
              volumes:
                keys:
                  name: keys
                  secret:
                    defaultMode: 288
                    items:
                      cert:
                        key: tls.crt
                        path: cert.pem
                      key:
                        key: tls.key
                        path: key.pem
                    secretName: syncthing-relay-keys
      listenerSets:
        syncthing-relay:
          listeners:
            relay:
              allowedRoutes:
                namespaces:
                  from: Same
              name: relay
              port: 22067
              protocol: TCP
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
      services:
        syncthing-relay:
          ports:
            relay:
              port: 22067
      tcpRoutes:
        syncthing-relay:
          parentRefs:
            syncthing-relay:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: syncthing-relay
              sectionName: relay
          rules:
            relay:
              backendRefs:
                syncthing-relay:
                  name: syncthing-relay
                  port: 22067
