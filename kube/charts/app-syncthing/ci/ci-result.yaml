apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: syncthing-relay
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: syncthing-relay
      app.kubernetes.io/instance: syncthing-relay
  ingress:
  - fromEntities:
    - cluster
    - world
    toPorts:
    - ports:
      - port: "22067"
        protocol: TCP
