# yaml-language-server: $schema=../base/schema/values.schema.json
global:
  domain:

# Nothing has to be created by hand:
#  - the database is a CloudNativePG cluster (with the vectorchord extension), the password of its `app` user is created by CNPG (`immich-postgresql-app`)
#  - the valkey users are generated in the `immich-valkey` secret
#  - the first user to register in the web UI becomes the admin of immich
# SSO: the OAuth login with authelia (OIDC client `immich`, see its access control in authelia), the users are created at their first
# login. The configuration file of immich holds only the OAuth settings, so these settings are read only in the web UI: the secret
# of the client is generated in the authelia namespace and copied by external-secrets (see `immich-pre`).
# Not configured: mails, the other settings of the immich configuration file (everything else can be set in the UI).

resources:

  # the photos and videos, shared by the pods of the server
  persistentVolumeClaims:
    immich-data:
      accessModes:
        - ReadWriteMany
      storageClassName: longhorn
      resources:
        requests:
          storage: 10Gi

  fluxHelmRepositories:
    immich:
      url: https://immich-app.github.io/immich-charts
    immich-valkey:
      url: https://valkey.io/valkey-helm/

  fluxHelmReleases:
    # the database is prepared by the postgresql-cluster chart (certificates, issuer, cluster and backups)
    # the cluster is named after the release, which is the name of this HelmRelease
    immich-postgresql:
      chart:
        spec:
          chart: ./kube/charts/postgresql-cluster
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      dependsOn: # the certificates, the cluster and the volume snapshots
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        cnpg:
          name: app-cnpg
          namespace: cnpg-system
        longhorn:
          name: app-longhorn
          namespace: longhorn-system
      values:
        storageSize: 5Gi
        postgresql:
          shared_preload_libraries:
            - vchord.so
          parameters:
            max_connections: "400"
            shared_buffers: 256MB
        resources:
          cnpgClusters:
            main:
              # https://github.com/tensorchord/cloudnative-vectorchord/pkgs/container/cloudnative-vectorchord/versions?filters%5Bversion_type%5D=tagged
              imageName: tensorchord/cloudnative-vectorchord:18.3-1.1.1
              bootstrap:
                initdb:
                  postInitApplicationSQL:
                    - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
                    - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;

    # the secrets of the services, created before they start
    immich-pre:
      dependsOn:
        secret-generator:
          name: app-secret-generator
          namespace: secret-generator
        external-secrets:
          name: app-external-secrets
          namespace: external-secrets
        authelia-pre: # the generated secret of the client and the right to read it
          name: authelia-pre
          namespace: authelia
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          stringSecrets:
            # users of valkey, the key is the name of the user
            immich-valkey:
              fields:
                default:
                  fieldName: default
                app:
                  fieldName: app

          serviceAccounts:
            authelia-reader:
              automountServiceAccountToken: false # only used by external-secrets to get a token

          secretStores:
            authelia:
              provider:
                kubernetes:
                  remoteNamespace: authelia
                  server:
                    caProvider:
                      type: ConfigMap
                      name: kube-root-ca.crt
                      key: ca.crt
                  auth:
                    serviceAccount:
                      name: authelia-reader

          # The configuration file of immich with the OAuth settings, the secret of the client is the only value read from authelia.
          # The template of external-secrets is escaped twice: the values are rendered by the app chart, then by the base chart.
          externalSecrets:
            immich-config:
              refreshInterval: 1h
              secretStoreRef:
                kind: SecretStore
                name: authelia
              target:
                template:
                  data:
                    immich-config.yaml: |
                      oauth:
                        enabled: true
                        issuerUrl: https://authelia.{{ .Values.global.domain }}
                        clientId: immich
                        clientSecret: {{ "{{ \"{{ .secret }}\" }}" }}
                        scope: openid profile email immich_scope
                        buttonText: Login with Authelia
                        tokenEndpointAuthMethod: client_secret_post
                        signingAlgorithm: RS256
                        profileSigningAlgorithm: RS256
                        storageLabelClaim: preferred_username
                        storageQuotaClaim: immich_quota
                        roleClaim: immich_role
                        autoRegister: true
                        autoLaunch: false
              data:
                secret:
                  secretKey: secret
                  remoteRef:
                    key: authelia-oidc-immich
                    property: secret

    immich-valkey:
      dependsOn: # the generated secret
        immich-pre:
          name: immich-pre
      chart:
        spec:
          chart: valkey
          version: 0.12.0
          sourceRef:
            kind: HelmRepository
            name: immich-valkey
      values:
        replicaCount: 1
        dataStorage:
          enabled: true
          requestedSize: 1Gi

        auth:
          enabled: true
          aclUsers:
            default:
              permissions: "~* -@all"
            app:
              permissions: "~* &* +@all"
          usersExistingSecret: immich-valkey

    immich:
      timeout: 10m # the pods wait for the database
      dependsOn:
        immich-pre:
          name: immich-pre
        immich-postgresql:
          name: immich-postgresql
        immich-valkey:
          name: immich-valkey
      chart:
        spec:
          chart: immich
          version: 0.12.0
          sourceRef:
            kind: HelmRepository
            name: immich
      values:
        # https://github.com/immich-app/immich-charts/blob/main/charts/immich/values.yaml
        # exposed by the Cilium Gateway, see the `listenerSets` and `httpRoutes` resources
        immich:
          configurationKind: Secret
          existingConfiguration: immich-config # the OAuth settings, see `immich-pre`
          persistence:
            library:
              existingClaim: immich-data

        controllers:
          main:
            containers:
              main:
                image:
                  tag: v2.5.6
                env:
                  TZ: Europe/Paris
                  PGUSER: app
                  PGDATABASE: app
                  PGHOST: immich-postgresql-rw
                  PGPASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: immich-postgresql-app
                        key: password
                  # immich does not do the client certificate authentication of libpq, only the password is used
                  DB_URL: postgresql://?uselibpqcompat=true

                  REDIS_HOSTNAME: immich-valkey
                  REDIS_USERNAME: app
                  REDIS_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: immich-valkey
                        key: app

        machine-learning:
          persistence:
            cache:
              type: persistentVolumeClaim
              accessMode: ReadWriteMany
              storageClass: longhorn

    # the public exposure, applied once immich is deployed and not waited for
    immich-integration:
      install:
        disableWait: true
      upgrade:
        disableWait: true
      dependsOn:
        immich:
          name: immich
        cert-manager:
          name: app-cert-manager
          namespace: cert-manager
        gateway-api:
          name: app-gateway-api
          namespace: gateway-api
      chart:
        spec:
          chart: ./kube/charts/base-loader
          reconcileStrategy: Revision
          sourceRef:
            kind: GitRepository
            name: bcl
            namespace: apps
      values:
        resources:
          certManagerCertificates:
            # certificate of the web UI, terminated by the Gateway
            immich-gateway:
              secretName: tls-immich-gateway
              dnsNames:
                immich: immich.{{ .Values.global.domain }}
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer

          # Exposed by the Cilium Gateway `shared` (kube-system), TLS terminated by the Gateway.
          # It is not protected by forward auth: the mobile apps cannot follow the login redirect of authelia, immich has its own login.
          listenerSets:
            immich:
              parentRef:
                group: gateway.networking.k8s.io
                kind: Gateway
                name: shared
                namespace: kube-system
              listeners:
                https:
                  name: https
                  hostname: immich.{{ .Values.global.domain }}
                  port: 443
                  protocol: HTTPS
                  tls:
                    mode: Terminate
                    certificateRefs:
                      tls:
                        name: tls-immich-gateway
                  allowedRoutes:
                    namespaces:
                      from: Same

          httpRoutes:
            immich:
              parentRefs:
                immich:
                  group: gateway.networking.k8s.io
                  kind: ListenerSet
                  name: immich
              hostnames:
                immich: immich.{{ .Values.global.domain }}
              rules:
                root:
                  backendRefs:
                    immich:
                      name: immich-server
                      port: 2283
                  timeouts:
                    request: 0s # uploads and downloads of videos can be long
