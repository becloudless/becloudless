apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-postgresql
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/postgresql
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-cnpg
    namespace: cnpg-system
  - name: app-longhorn
    namespace: longhorn-system
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    clients:
      server:
        matchLabels:
          app.kubernetes.io/instance: immich
          app.kubernetes.io/name: server
    instances: 2
    postgresql:
      parameters:
        max_connections: "400"
        shared_buffers: 256MB
      shared_preload_libraries:
      - vchord.so
    refs:
      immich-integration:
        certManagerCertificates:
          immich-gateway:
            name: immich-gateway
            namespace: default
            secretName: tls-immich-gateway
        httpRoutes:
          immich:
            name: immich
            namespace: default
        listenerSets:
          immich:
            name: immich
            namespace: default
      immich-post:
        jobs:
          immich-bootstrap:
            labels:
              app.kubernetes.io/component: immich-bootstrap
              app.kubernetes.io/instance: immich-post
            name: ""
            namespace: default
      immich-postgresql:
        cnpgClusters:
          main:
            name: immich-postgresql
            namespace: default
      immich-pre:
        externalSecrets:
          immich-config:
            name: immich-config
            namespace: default
        secretStores:
          authelia:
            name: authelia
            namespace: default
        serviceAccounts:
          authelia-reader:
            name: authelia-reader
            namespace: default
        stringSecrets:
          immich-admin:
            name: immich-admin
            namespace: default
    resources:
      cnpgClusters:
        main:
          bootstrap:
            initdb:
              postInitApplicationSQL:
              - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
              - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
          imageName: tensorchord/cloudnative-vectorchord:18.3-1.1.1
    storageSize: 5Gi
