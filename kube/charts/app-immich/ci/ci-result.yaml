---
# Source: app-immich/templates/loader.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-data
  namespace: default
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
# Source: app-immich/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: default
spec:
  chart:
    spec:
      chart: immich
      sourceRef:
        kind: HelmRepository
        name: immich
      version: 0.12.0
  dependsOn:
  - name: immich-postgresql
  - name: immich-pre
  - name: immich-valkey
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 10m
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            env:
              DB_URL: postgresql://?uselibpqcompat=true
              PGDATABASE: app
              PGHOST: immich-postgresql-rw
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: immich-postgresql-app
              PGUSER: app
              REDIS_HOSTNAME: immich-valkey
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: app
                    name: immich-valkey
              REDIS_USERNAME: app
              TZ: Europe/Paris
            image:
              tag: v2.5.6
    immich:
      persistence:
        library:
          existingClaim: immich-data
    machine-learning:
      persistence:
        cache:
          accessMode: ReadWriteMany
          storageClass: longhorn
          type: persistentVolumeClaim
---
# Source: app-immich/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  - name: immich
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    disableWait: true
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    disableWait: true
    remediation:
      retries: 3
  values:
    resources:
      certManagerCertificates:
        immich-gateway:
          dnsNames:
            immich: immich.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-immich-gateway
      httpRoutes:
        immich:
          hostnames:
            immich: immich.test.com
          parentRefs:
            immich:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: immich
          rules:
            root:
              backendRefs:
                immich:
                  name: immich-server
                  port: 2283
              timeouts:
                request: 0s
      listenerSets:
        immich:
          listeners:
            https:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: immich.test.com
              name: https
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: tls-immich-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
---
# Source: app-immich/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-postgresql
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/postgresql-cluster
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-cnpg
    namespace: cnpg-system
  - name: app-longhorn
    namespace: longhorn-system
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    postgresql:
      parameters:
        max_connections: "400"
        shared_buffers: 256MB
      shared_preload_libraries:
      - vchord.so
    resources:
      cnpgClusters:
        main:
          bootstrap:
            initdb:
              postInitApplicationSQL:
              - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
              - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
          imageName: tensorchord/cloudnative-vectorchord:18.3-1.1.1
    storageSize: 5Gi
---
# Source: app-immich/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-pre
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: app-secret-generator
    namespace: secret-generator
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    resources:
      stringSecrets:
        immich-valkey:
          fields:
            app:
              fieldName: app
            default:
              fieldName: default
---
# Source: app-immich/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-valkey
  namespace: default
spec:
  chart:
    spec:
      chart: valkey
      sourceRef:
        kind: HelmRepository
        name: immich-valkey
      version: 0.12.0
  dependsOn:
  - name: immich-pre
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    auth:
      aclUsers:
        app:
          permissions: ~* &* +@all
        default:
          permissions: ~* -@all
      enabled: true
      usersExistingSecret: immich-valkey
    dataStorage:
      enabled: true
      requestedSize: 1Gi
    replicaCount: 1
