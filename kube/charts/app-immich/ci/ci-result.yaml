apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-integration
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: immich-post
  - name: app-cert-manager
    namespace: cert-manager
  - name: app-gateway-api
    namespace: gateway-api
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      immich-integration:
        certManagerCertificates:
          immich-gateway:
            name: immich-gateway
            namespace: default
            secretName: tls-immich-gateway
        httpRoutes:
          immich:
            name: immich
            namespace: default
        listenerSets:
          immich:
            name: immich
            namespace: default
      immich-post:
        jobs:
          immich-bootstrap:
            labels:
              app.kubernetes.io/component: immich-bootstrap
              app.kubernetes.io/instance: immich-post
            name: ""
            namespace: default
      immich-postgresql:
        cnpgClusters:
          main:
            name: immich-postgresql
            namespace: default
      immich-pre:
        externalSecrets:
          immich-config:
            name: immich-config
            namespace: default
        secretStores:
          authelia:
            name: authelia
            namespace: default
        serviceAccounts:
          authelia-reader:
            name: authelia-reader
            namespace: default
        stringSecrets:
          immich-admin:
            name: immich-admin
            namespace: default
    resources:
      certManagerCertificates:
        immich-gateway:
          dnsNames:
            immich: immich.test.com
          issuerRef:
            kind: ClusterIssuer
            name: letsencrypt-prod
          secretName: tls-immich-gateway
      httpRoutes:
        immich:
          hostnames:
            immich: immich.test.com
          parentRefs:
            immich:
              group: gateway.networking.k8s.io
              kind: ListenerSet
              name: immich
              sectionName: immich
          rules:
            root:
              backendRefs:
                backend:
                  name: immich-server
                  port: 2283
              timeouts:
                request: 0s
      listenerSets:
        immich:
          listeners:
            immich:
              allowedRoutes:
                namespaces:
                  from: Same
              hostname: immich.test.com
              name: immich
              port: 443
              protocol: HTTPS
              tls:
                certificateRefs:
                  tls:
                    name: ref:immich-gateway
                mode: Terminate
          parentRef:
            group: gateway.networking.k8s.io
            kind: Gateway
            name: shared
            namespace: kube-system
