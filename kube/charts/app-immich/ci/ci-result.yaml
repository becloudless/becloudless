---
# Source: app-immich/templates/loader.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-data
  namespace: immich
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
# Source: app-immich/templates/loader.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: immich-gateway
  namespace: immich
spec:
  dnsNames:
  - immich.test.com
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: tls-immich-gateway
---
# Source: app-immich/templates/loader.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  hostnames:
  - immich.test.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: immich
  rules:
  - backendRefs:
    - name: immich-server
      port: 2283
    timeouts:
      request: 0s
---
# Source: app-immich/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  chart:
    spec:
      chart: immich
      sourceRef:
        kind: HelmRepository
        name: immich
      version: 0.12.0
  dependsOn:
  - name: immich-postgresql
  - name: immich-valkey
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 10m
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      main:
        containers:
          main:
            env:
              DB_URL: postgresql://?uselibpqcompat=true
              PGDATABASE: app
              PGHOST: immich-postgresql-rw
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: immich-postgresql-app
              PGUSER: app
              REDIS_HOSTNAME: immich-valkey
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: app
                    name: immich-valkey
              REDIS_USERNAME: app
              TZ: Europe/Paris
            image:
              tag: v2.5.6
    immich:
      persistence:
        library:
          existingClaim: immich-data
    machine-learning:
      persistence:
        cache:
          accessMode: ReadWriteMany
          storageClass: longhorn
          type: persistentVolumeClaim
---
# Source: app-immich/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-postgresql
  namespace: immich
spec:
  chart:
    spec:
      chart: ./kube/charts/postgresql-cluster
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: bcl
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    postgresql:
      parameters:
        max_connections: "400"
        shared_buffers: 256MB
      shared_preload_libraries:
      - vchord.so
    resources:
      cnpgClusters:
        main:
          bootstrap:
            initdb:
              postInitApplicationSQL:
              - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
              - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
          imageName: tensorchord/cloudnative-vectorchord:18.3-1.1.1
    storageSize: 5Gi
---
# Source: app-immich/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-valkey
  namespace: immich
spec:
  chart:
    spec:
      chart: valkey
      sourceRef:
        kind: HelmRepository
        name: immich-valkey
      version: 0.12.0
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
  values:
    auth:
      aclUsers:
        app:
          permissions: ~* &* +@all
        default:
          permissions: ~* -@all
      enabled: true
      usersExistingSecret: immich-valkey
    dataStorage:
      enabled: true
      requestedSize: 1Gi
    replicaCount: 1
---
# Source: app-immich/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: immich
  namespace: immich
spec:
  interval: 10m
  url: https://immich-app.github.io/immich-charts
---
# Source: app-immich/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: immich-valkey
  namespace: immich
spec:
  interval: 10m
  url: https://valkey.io/valkey-helm/
---
# Source: app-immich/templates/loader.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: immich
  namespace: immich
spec:
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    hostname: immich.test.com
    name: https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - name: tls-immich-gateway
      mode: Terminate
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shared
    namespace: kube-system
---
# Source: app-immich/templates/loader.yaml
apiVersion: secretgenerator.mittwald.de/v1alpha1
kind: StringSecret
metadata:
  name: immich-valkey
  namespace: immich
spec:
  fields:
  - fieldName: app
  - fieldName: default
