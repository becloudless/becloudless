# Source: app-immich/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: default
spec:
  chart:
    spec:
      chart: immich
      sourceRef:
        kind: HelmRepository
        name: immich
      version: 0.12.0
  dependsOn:
  - name: immich-pre
  - name: immich-postgresql
  - name: immich-valkey
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    controllers:
      main:
        containers:
          main:
            env:
              DB_URL: postgresql://?uselibpqcompat=true
              PGDATABASE: app
              PGHOST: immich-postgresql-rw
              PGPASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: immich-postgresql-app
              PGUSER: app
              REDIS_HOSTNAME: immich-valkey
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: app
                    name: immich-valkey
              REDIS_USERNAME: app
              TZ: Europe/Paris
            image:
              tag: v2.5.6
    immich:
      configurationKind: Secret
      existingConfiguration: immich-config
      persistence:
        library:
          existingClaim: immich-data
    machine-learning:
      persistence:
        cache:
          accessMode: ReadWriteMany
          storageClass: longhorn-files
          type: persistentVolumeClaim
