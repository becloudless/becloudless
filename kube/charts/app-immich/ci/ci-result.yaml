  dependsOn:
  - name: app-secret-generator
    namespace: secret-generator
  - name: app-external-secrets
    namespace: external-secrets
  - name: authelia-pre
    namespace: authelia
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      immich-integration:
        certManagerCertificates:
          immich-gateway:
            name: immich-gateway
            namespace: default
            secretName: tls-immich-gateway
        httpRoutes:
          immich:
            name: immich
            namespace: default
        listenerSets:
          immich:
            name: immich
            namespace: default
      immich-post:
        jobs:
          immich-bootstrap:
            labels:
              app.kubernetes.io/component: immich-bootstrap
              app.kubernetes.io/instance: immich-post
            name: ""
            namespace: default
      immich-postgresql:
        cnpgClusters:
          main:
            name: immich-postgresql
            namespace: default
      immich-pre:
        externalSecrets:
          immich-config:
            name: immich-config
            namespace: default
        secretStores:
          authelia:
            name: authelia
            namespace: default
        serviceAccounts:
          authelia-reader:
            name: authelia-reader
            namespace: default
        stringSecrets:
          immich-admin:
            name: immich-admin
            namespace: default
    resources:
      externalSecrets:
        immich-config:
          data:
            clientId:
              remoteRef:
                key: authelia-oidc-immich
                property: client-id
              secretKey: clientId
            secret:
              remoteRef:
                key: authelia-oidc-immich
                property: secret
              secretKey: secret
          refreshInterval: 1h
          secretStoreRef: ref:authelia
          target:
            template:
              data:
                immich-config.yaml: |-
                  oauth:
                    enabled: true
                    issuerUrl: https://authelia.test.com
                    clientId: {{ "{{ .clientId }}" }}
                    clientSecret: {{ "{{ .secret }}" }}
                    scope: openid profile email immich_scope
                    buttonText: Login with Authelia
                    tokenEndpointAuthMethod: client_secret_post
                    signingAlgorithm: RS256
                    profileSigningAlgorithm: RS256
                    storageLabelClaim: preferred_username
                    storageQuotaClaim: immich_quota
                    roleClaim: immich_role
                    autoRegister: true
                    autoLaunch: true # `/auth/login?autoLaunch=0` shows the login page
                  passwordLogin:
                    enabled: false # the users and admins come from lldap, see `immich-post`
      secretStores:
        authelia:
          provider:
            kubernetes:
              auth:
                serviceAccount:
                  name: ref:authelia-reader
              remoteNamespace: authelia
              server:
                caProvider:
                  key: ca.crt
                  name: kube-root-ca.crt
                  type: ConfigMap
      serviceAccounts:
        authelia-reader:
          automountServiceAccountToken: false
      stringSecrets:
        immich-admin:
          fields:
            password: {}
