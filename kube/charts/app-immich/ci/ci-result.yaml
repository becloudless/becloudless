kind: HelmRelease
metadata:
  name: immich-post
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: immich
  - name: immich-pre
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      immich-integration:
        certManagerCertificates:
          immich-gateway:
            name: immich-gateway
            namespace: default
            secretName: tls-immich-gateway
        httpRoutes:
          immich:
            name: immich
            namespace: default
        listenerSets:
          immich:
            name: immich
            namespace: default
      immich-post:
        jobs:
          immich-bootstrap:
            labels:
              app.kubernetes.io/component: immich-bootstrap
              app.kubernetes.io/instance: immich-post
            name: ""
            namespace: default
      immich-postgresql:
        cnpgClusters:
          main:
            name: immich-postgresql
            namespace: default
      immich-pre:
        externalSecrets:
          immich-config:
            name: immich-config
            namespace: default
        secretStores:
          authelia:
            name: authelia
            namespace: default
        serviceAccounts:
          authelia-reader:
            name: authelia-reader
            namespace: default
        stringSecrets:
          immich-admin:
            name: immich-admin
            namespace: default
    resources:
      jobs:
        immich-bootstrap:
          activeDeadlineSeconds: 900
          backoffLimit: 0
          fullNameOverride: immich-bootstrap-97bd647638
          template:
            spec:
              containers:
                bootstrap:
                  args:
                  - |-
                    until curl -fsS http://immich-server:2283/api/server/config > /tmp/config; do sleep 5; done
                    if grep -q '"isInitialized":true' /tmp/config; then echo 'an admin already exists'; exit 0; fi
                    password=$(printf '%s' "$ADMIN_PASSWORD" | sed 's/\\/\\\\/g; s/"/\\"/g')
                    curl -fsS -X POST http://immich-server:2283/api/auth/admin-sign-up -H 'Content-Type: application/json' \
                      -d "{\"email\":\"$ADMIN_EMAIL\",\"name\":\"immich admin\",\"password\":\"$password\"}"
                  command:
                  - sh
                  - -ec
                  env:
                    ADMIN_EMAIL: immich-admin@test.com
                    ADMIN_PASSWORD:
                      secretKeyRef:
                        key: password
                        name: ref:immich-admin
                  image: curlimages/curl:8.19.0
                  name: bootstrap
              restartPolicy: Never
              securityContext:
                runAsGroup: 1000
                runAsUser: 1000
