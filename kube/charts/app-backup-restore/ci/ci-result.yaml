        configMaps:
          sftp-gateway-config:
            name: sftp-gateway-config
            namespace: default
          sftp-gateway-files:
            name: sftp-gateway-files
            namespace: default
        deployments:
          sftp-gateway:
            labels:
              app.kubernetes.io/component: sftp-gateway
              app.kubernetes.io/instance: sftp-gateway
            name: sftp-gateway
            namespace: default
        services:
          sftp-gateway:
            name: sftp-gateway
            namespace: default
    resources:
      roleBindings:
        s3-secrets-reader:
          roleRef: ref:s3-secrets-reader
          subjects:
            s3-reader:
              kind: ServiceAccount
              name: s3-reader
              namespace: longhorn-system
      roles:
        s3-secrets-reader:
          rules:
            secrets:
              apiGroups:
              - ""
              resourceNames:
              - s3-secrets
              resources:
              - secrets
              verbs:
              - get
      stringSecrets:
        s3-secrets:
          data:
            AWS_ENDPOINTS: http://sftp-gateway.backup-restore.svc.cluster.local:9000
          fields:
            access-key-id:
              encoding: hex
              fieldName: AWS_ACCESS_KEY_ID
              length: "32"
            secret-access-key:
              encoding: hex
              fieldName: AWS_SECRET_ACCESS_KEY
              length: "64"
