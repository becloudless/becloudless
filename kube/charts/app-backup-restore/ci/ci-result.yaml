# Source: app-backup-restore/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sftp-gateway
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: backup-restore-pre
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      backup-restore-pre:
        roleBindings:
          s3-secrets-reader:
            name: s3-secrets-reader
            namespace: default
        roles:
          s3-secrets-reader:
            name: s3-secrets-reader
            namespace: default
        stringSecrets:
          s3-secrets:
            name: s3-secrets
            namespace: default
      longhorn-backup:
        externalSecrets:
          s3-backup:
            name: s3-backup
            namespace: longhorn-system
        longhornBackupTargets:
          default:
            name: default
            namespace: longhorn-system
        secretStores:
          backup-restore:
            name: backup-restore
            namespace: longhorn-system
        serviceAccounts:
          s3-reader:
            name: s3-reader
            namespace: longhorn-system
      sftp-gateway:
        configMaps:
          sftp-gateway-config:
            name: sftp-gateway-config
            namespace: default
          sftp-gateway-files:
            name: sftp-gateway-files
            namespace: default
        deployments:
          sftp-gateway:
            labels:
              app.kubernetes.io/component: sftp-gateway
              app.kubernetes.io/instance: sftp-gateway
            name: sftp-gateway
            namespace: default
        services:
          sftp-gateway:
            name: sftp-gateway
            namespace: default
    resources:
      configMaps:
        sftp-gateway-config:
          data:
            BUCKET: longhorn-backups
            SFTP_HOST: backup.test.com
            SFTP_PATH: /backup/test
            SFTP_PORT: "2222"
            SFTP_TLS: "true"
            SFTP_USER: test
        sftp-gateway-files:
          data:
            gateway.sh: |-
              set -eu

              # the tunnel (the container `sftp-tunnel`) listens on the loopback, the transport to the server is its business: the host
              # keys are the ones of the server, given for the loopback address
              sed -n 's/^[^# ][^ ]* /[127.0.0.1]:2222 /p' /etc/gateway/known_hosts > /tmp/known_hosts

              export RCLONE_CONFIG_UPSTREAM_TYPE=sftp
              export RCLONE_CONFIG_UPSTREAM_HOST=127.0.0.1
              export RCLONE_CONFIG_UPSTREAM_PORT=2222
              export RCLONE_CONFIG_UPSTREAM_USER="$SFTP_USER"
              export RCLONE_CONFIG_UPSTREAM_KEY_FILE=/secrets/id_ed25519
              export RCLONE_CONFIG_UPSTREAM_KNOWN_HOSTS_FILE=/tmp/known_hosts
              export RCLONE_CONFIG_UPSTREAM_SHELL_TYPE=none # internal-sftp: no shell
              export RCLONE_CONFIG_UPSTREAM_CONCURRENCY=8

              export RCLONE_CONFIG_CRYPT_TYPE=crypt
              export RCLONE_CONFIG_CRYPT_REMOTE="UPSTREAM:$SFTP_PATH"
              export RCLONE_CONFIG_CRYPT_FILENAME_ENCRYPTION=standard
              export RCLONE_CONFIG_CRYPT_DIRECTORY_NAME_ENCRYPTION=true
              # rclone wants the passwords obscured in its config
              RCLONE_CONFIG_CRYPT_PASSWORD="$(rclone obscure "$(cat /secrets/crypt-password)")"
              RCLONE_CONFIG_CRYPT_PASSWORD2="$(rclone obscure "$(cat /secrets/crypt-salt)")"
              export RCLONE_CONFIG_CRYPT_PASSWORD RCLONE_CONFIG_CRYPT_PASSWORD2

              # the pair has to be quoted, rclone splits the variable on the commas
              export RCLONE_AUTH_KEY="\"$AWS_ACCESS_KEY_ID,$AWS_SECRET_ACCESS_KEY\""

              rclone mkdir "CRYPT:$BUCKET"
              exec rclone serve s3 CRYPT: --addr :9000
            known_hosts: |-
              backup.test.com ssh-ed25519 AAAAtest
              backup.test.com ssh-rsa AAAAtest2
            tunnel.sh: |-
              set -eu

              # With TLS the SNI is the name of the server (the TLS SSH gateway routes on it). The certificate is not checked: the SSH host
              # key, checked by the gateway of S3 inside the tunnel, is the authentication.
              if [ "$SFTP_TLS" = true ]; then
                upstream="OPENSSL:$SFTP_HOST:$SFTP_PORT,snihost=$SFTP_HOST,verify=0"
              else
                upstream="TCP:$SFTP_HOST:$SFTP_PORT"
              fi
              exec socat TCP-LISTEN:2222,bind=127.0.0.1,fork,reuseaddr "$upstream"
      deployments:
        sftp-gateway:
          replicas: 1
          template:
            spec:
              containers:
                sftp-gateway:
                  command:
                  - sh
                  - /etc/gateway/gateway.sh
                  env:
                    AWS_ACCESS_KEY_ID:
                      secretKeyRef:
                        key: AWS_ACCESS_KEY_ID
                        name: s3-secrets
                    AWS_SECRET_ACCESS_KEY:
                      secretKeyRef:
                        key: AWS_SECRET_ACCESS_KEY
                        name: s3-secrets
                    HOME: /tmp
                  envFrom:
                    config:
                      configMapRef:
                        name: sftp-gateway-config
                  image: docker.io/rclone/rclone:1.76.0
                  name: sftp-gateway
                  ports:
                    s3:
                      containerPort: 9000
                  probe:
                    tcpSocket:
                      port: s3
                  securityContext:
                    capabilities:
                      drop:
                        all: ALL
                  volumeMounts:
                    config:
                      mountPath: /etc/gateway
                      name: config
                      readOnly: true
                    secrets:
                      mountPath: /secrets
                      name: secrets
                      readOnly: true
                    tmp:
                      mountPath: /tmp
                      name: tmp
                sftp-tunnel:
                  command:
                  - sh
                  - /etc/gateway/tunnel.sh
                  envFrom:
                    config:
                      configMapRef:
                        name: sftp-gateway-config
                  image: docker.io/alpine/socat:1.8.1.3
                  name: sftp-tunnel
                  securityContext:
                    capabilities:
                      drop:
                        all: ALL
                  volumeMounts:
                    config:
                      mountPath: /etc/gateway
                      name: config
                      readOnly: true
              securityContext:
                fsGroup: 65534
                runAsGroup: 65534
                runAsUser: 65534
              volumes:
                config:
                  configMap:
                    name: ref:sftp-gateway-files
                  name: config
                secrets:
                  name: secrets
                  secret:
                    secretName: sftp-gateway
                tmp:
                  emptyDir: {}
                  name: tmp
      services:
        sftp-gateway:
          ports:
            s3:
              port: 9000
