# Source: app-backup-restore/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-backup
  namespace: default
spec:
  chart:
    spec:
      chart: ./kube/charts/base-loader
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: bcl
        namespace: apps
  dependsOn:
  - name: sftp-gateway
  - name: app-longhorn
    namespace: longhorn-system
  - name: app-external-secrets
    namespace: external-secrets
  driftDetection:
    mode: enabled
  healthCheckExprs:
  - apiVersion: postgresql.cnpg.io/v1
    current: has(status.readyInstances) && status.readyInstances >= 1 && has(status.currentPrimary)
      && status.currentPrimary != ''
    kind: Cluster
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 10m
  releaseName: longhorn-backup
  targetNamespace: longhorn-system
  timeout: 10m
  upgrade:
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    refs:
      backup-restore-pre:
        roleBindings:
          s3-secrets-reader:
            name: s3-secrets-reader
            namespace: default
        roles:
          s3-secrets-reader:
            name: s3-secrets-reader
            namespace: default
        stringSecrets:
          s3-secrets:
            name: s3-secrets
            namespace: default
      longhorn-backup:
        externalSecrets:
          s3-backup:
            name: s3-backup
            namespace: longhorn-system
        longhornBackupTargets:
          default:
            name: default
            namespace: longhorn-system
        secretStores:
          backup-restore:
            name: backup-restore
            namespace: longhorn-system
        serviceAccounts:
          s3-reader:
            name: s3-reader
            namespace: longhorn-system
      sftp-gateway:
        configMaps:
          sftp-gateway-config:
            name: sftp-gateway-config
            namespace: default
          sftp-gateway-files:
            name: sftp-gateway-files
            namespace: default
        deployments:
          sftp-gateway:
            labels:
              app.kubernetes.io/component: sftp-gateway
              app.kubernetes.io/instance: sftp-gateway
            name: sftp-gateway
            namespace: default
        services:
          sftp-gateway:
            name: sftp-gateway
            namespace: default
    resources:
      externalSecrets:
        s3-backup:
          dataFrom:
            all:
              extract:
                key: s3-secrets
          refreshInterval: 1h
          secretStoreRef: ref:backup-restore
      longhornBackupTargets:
        default:
          annotations:
            helm.sh/resource-policy: keep
          backupTargetURL: s3://longhorn-backups@us-east-1/
          credentialSecret: s3-backup
          fullNameOverride: default
          pollInterval: 3m0s
      secretStores:
        backup-restore:
          provider:
            kubernetes:
              auth:
                serviceAccount:
                  name: ref:s3-reader
              remoteNamespace: backup-restore
              server:
                caProvider:
                  key: ca.crt
                  name: kube-root-ca.crt
                  type: ConfigMap
      serviceAccounts:
        s3-reader:
          automountServiceAccountToken: false
