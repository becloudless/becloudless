---
# Source: app-descheduler/templates/loader.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  chart:
    spec:
      chart: descheduler
      sourceRef:
        kind: HelmRepository
        name: descheduler
      version: 0.36.0
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  interval: 10m
  rollback:
    cleanupOnFail: true
  timeout: 2m
  upgrade:
    remediation:
      retries: 3
---
# Source: app-descheduler/templates/loader.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 10m
  url: https://kubernetes-sigs.github.io/descheduler
