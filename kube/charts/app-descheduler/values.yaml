# yaml-language-server: $schema=../base/schema/values.schema.json

# resources are named by their id, without the release name prefix
prefixNamesWithRelease: false

defaults:
  metadata:
    namespace: kube-system

resources:
  fluxHelmRepositories:
    descheduler:
      url: https://kubernetes-sigs.github.io/descheduler

  fluxHelmReleases:
    descheduler:
      chart:
        spec:
          chart: descheduler
          version: 0.36.0
          sourceRef:
            kind: HelmRepository
            name: descheduler
