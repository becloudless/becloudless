# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Changes

on:
  workflow_call:
    inputs:
      paths:
        description: |
          Newline-separated list of path prefixes to check for changes against origin/main.
          Example:
            docker/
            .github/workflows/docker.yaml
        required: true
        type: string
    outputs:
      changed:
        description: "true if any file under the given paths changed on this branch compared to origin/main"
        value: ${{ jobs.changes.outputs.changed }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download bcl
        run: |
          VERSION="$(grep -E '^\s+version = ' nixos/packages/bcl/default.nix | sed 's/.*"\(.*\)".*/\1/')"
          mkdir -p cli/dist
          curl -fsSL "https://github.com/becloudless/becloudless/releases/download/v${VERSION}/bcl-linux-amd64.tar.gz" \
            | tar -xz -C cli/dist
          chmod +x cli/dist/bcl-linux-amd64/bcl

      - name: Check for changes
        id: changes
        env:
          PATHS: ${{ inputs.paths }}
        run: cli/dist/bcl-linux-amd64/bcl ci changes "$PATHS"

      - name: Report changes
        run: echo "changed=${{ steps.changes.outputs.changed }}"

