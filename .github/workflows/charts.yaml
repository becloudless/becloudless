# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Charts

on:
  push:

jobs:
  changes:
    uses: ./.github/workflows/changes.yaml
    with:
      paths: |
        kube/charts/
        .github/workflows/charts.yaml

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bcl
        run: |
          VERSION="$(grep -E '^\s+version = ' nixos/packages/bcl/default.nix | sed 's/.*"\(.*\)".*/\1/')"
          mkdir -p cli/dist
          curl -fsSL "https://github.com/becloudless/becloudless/releases/download/v${VERSION}/bcl-linux-amd64.tar.gz" \
            | tar -xz -C cli/dist
          chmod +x cli/dist/bcl-linux-amd64/bcl

      - name: Build/Push charts
        run: cli/dist/bcl-linux-amd64/bcl ci chart -L trace

      # The build regenerates the ci-result of every changed chart (and of the charts depending on it). A difference means the
      # branch was pushed without running `bcl kube chart build` (or, for renovate, that its postUpgradeTasks did not cover the update).
      - name: Find the stale ci-results
        id: stale
        run: |
          files="$(git status --porcelain -- 'kube/charts/*/ci/ci-result.yaml' | cut -c4-)"
          if [ -z "$files" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$files"
          {
            echo "changed=true"
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The commit is made with the App of the bot, like the renovate commits: renovate does not see a branch as modified by someone else.
      # Pushing with the App token triggers this workflow again on the new commit, where there is nothing left to commit.
      - name: Create GitHub App Token
        if: steps.stale.outputs.changed == 'true' && github.ref_name != github.event.repository.default_branch
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: github-app-token
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Commit the ci-results
        if: steps.stale.outputs.changed == 'true' && github.ref_name != github.event.repository.default_branch
        uses: iarekylew00t/verified-bot-commit@3a1e72c2443cce5574f76a9b2bb36e355d667743 # v2.3.7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.github-app-token.outputs.token }}
          message: "chore: regenerate the charts ci-results"
          files: ${{ steps.stale.outputs.files }}

      # Nothing is committed on the default branch: the ci-results have to be right before the merge
      - name: Fail on the default branch if the ci-results are stale
        if: steps.stale.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::ci-result.yaml is out of date on the default branch, run 'bcl kube chart build' in the chart and commit the result"
          exit 1
