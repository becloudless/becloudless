# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Renovate
on:
  push:

jobs:
  changes:
    uses: ./.github/workflows/changes.yaml
    with:
      paths: |
        renovate/
        .github/workflows/renovate.yaml

  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: github-app-token
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.github-app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
#          cache: yarn
#          cache-dependency-path: renovate/yarn.lock

      - name: Install
        working-directory: renovate
#        run: yarn --frozen-lockfile --perfer-offline --link-duplicates
        run: npm install yarn && node_modules/yarn/bin/yarn

      - name: Lint Fix
        working-directory: renovate
        run: node_modules/yarn/bin/yarn prettier --write .

      - uses: iarekylew00t/verified-bot-commit@42a042b0407248f3c0acac00c389e729e3476e86 # v2.3.5
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.github-app-token.outputs.token }}
          message: "chore: auto-fix prettier formatting"
          files: |
            renovate/

      - name: Lint
        working-directory: renovate
#        run: yarn lint
        run: node_modules/yarn/bin/yarn lint

      - name: Test
        working-directory: renovate
#        run: yarn test
        run: node_modules/yarn/bin/yarn test
