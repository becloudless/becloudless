# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Renovate Cron

on:
  push:
    branches:
      - main
    paths:
      - renovate.json5
      - renovate/**.json5
      - .github/workflows/renovate.yaml
  schedule:
    - cron: 0 * * * *
  workflow_dispatch:
    inputs:
      dryRun:
        description: Dry Run
        type: boolean
        default: false
        required: true
      logLevel:
        description: Log Level
        type: choice
        default: debug
        options:
          - debug
          - info
        required: true
      version:
        description: Renovate Version
        default: latest
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Pin extends to current branch
        if: github.ref_name != github.event.repository.default_branch
        run: |
          BRANCH="${{ github.ref_name }}"
          sed -i "s|becloudless/becloudless//renovate/config/global.json5\"|becloudless/becloudless//renovate/config/global.json5#${BRANCH}\"|" renovate.json5

      - name: Download bcl for the postUpgradeTasks
        # /tmp is mounted in the renovate container. The tasks regenerate the ci-result of the charts (see renovate/config/global.json5)
        run: |
          VERSION="$(grep -E '^\s+version = ' nixos/packages/bcl/default.nix | sed 's/.*"\(.*\)".*/\1/')"
          mkdir -p /tmp/bcl
          curl -fsSL "https://github.com/becloudless/becloudless/releases/download/v${VERSION}/bcl-linux-amd64.tar.gz" \
            | tar -xz -C /tmp/bcl --strip-components=1
          chmod -R a+rX /tmp/bcl
          /tmp/bcl/bcl version || true

      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
          RENOVATE_ALLOWED_COMMANDS: '["^/tmp/bcl/bcl kube chart build$"]'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_BASE_BRANCHES: ${{ github.ref_name }}
          RENOVATE_REQUIRE_CONFIG: ignored
          RENOVATE_DRY_RUN: ${{ inputs.dryRun }}
          RENOVATE_INTERNAL_CHECKS_FILTER: strict
          RENOVATE_PLATFORM: github
          RENOVATE_PLATFORM_COMMIT: true
        with:
          configurationFile: renovate.json5
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ inputs.version || 'latest' }}
