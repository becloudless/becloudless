# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Nixos bcl hash update
on:
  push:
    branches-ignore:
      - main
    paths:
      - "nixos/packages/bcl/default.nix"

jobs:
  update-bcl-hashes:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: github-app-token
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.github-app-token.outputs.token }}

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-25.05

      - name: Update hashes
        run: |
          set -euo pipefail
          FILE="nixos/packages/bcl/default.nix"
          VERSION="$(grep -E '^\s+version = ' "$FILE" | sed 's/.*"\(.*\)".*/\1/')"
          echo "version=$VERSION"

          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            url="https://github.com/becloudless/becloudless/releases/download/v${VERSION}/bcl-${platform}.tar.gz"
            hash="$(nix store prefetch-file --hash-type sha256 --json "$url" | jq -r .hash)"
            echo "platform=$platform hash=$hash"
            sed -i "s|\"${platform}\"  *=.*|\"${platform}\" = \"${hash}\";|" "$FILE"
          done

      - uses: iarekylew00t/verified-bot-commit@1ee4374942e5c5f814e9b3121d766cbe45cea360 # v2.3.6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.github-app-token.outputs.token }}
          message: "Auto Update BCL Hashes"
          files: |
            nixos/packages/bcl/default.nix

